<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改教材软著积分管理')" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-jiaocairuanzhuCfg-edit" th:object="${sciJiaocairuanzhuScoreCfg}">
        <input name="id" th:field="*{id}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">分类：</label>
            <div class="col-sm-8">
                <select name="fenLei" class="form-control m-b" th:with="type=${@dict.getType('sys_jiaocairuanzhu_fenlei')}" required>
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{fenLei}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">个人排名：</label>
            <div class="col-sm-8">
                <select name="paiMing" class="form-control m-b" th:with="type=${@dict.getType('sys_jiaocairuanzhu_fzr')}" required>
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{paiMing}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">总分：</label>
            <div class="col-sm-8">
                <input name="totalScore" th:field="*{totalScore}" class="form-control" type="text" required>
            </div>
        </div>

    </form>
</div>
<th:block th:include="include :: footer" />
<script th:inline="javascript">
    var prefix = ctx + "system/jiaocairuanzhuCfg";
    $("#form-jiaocairuanzhuCfg-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/edit", $('#form-jiaocairuanzhuCfg-edit').serialize());
        }
    }
</script>
</body>
</html>
