                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">获批时间：</label>
            <div class="col-sm-8">
                <div class="input-group date">
                    <input name="huopishijain" th:value="${#dates.format(sciZhuanliruanzhu.huopishijain, 'yyyy-MM-dd')}" class="form-control" placeholder="yyyy-MM-dd" type="text" required disabled="true">
                    <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">是否应用：</label>
            <div class="col-sm-8" th:with="type=${@dict.getType('sys_yes_no')}">
                <label th:each="dict : ${type}" class="check-box">
                    <input name="shifouyingyon" type="checkbox" th:value="${dict.dictValue}" th:text="${dict.dictLabel}" th:attr="checked=${sciZhuanliruanzhu.shifouyingyon.contains(dict.dictValue)?true:false}" disabled="true">
                </label>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">是否行业联合：</label>
            <div class="col-sm-8" th:with="type=${@dict.getType('sys_yes_no')}">
                <label th:each="dict : ${type}" class="check-box">
                    <input name="hangyelianhe" type="checkbox" th:value="${dict.dictValue}" th:text="${dict.dictLabel}" th:attr="checked=${sciZhuanliruanzhu.hangyelianhe.contains(dict.dictValue)?true:false}" disabled="true">
                </label>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">分类：</label>
            <div class="col-sm-8">
                <select name="fenlei" class="form-control m-b" th:with="type=${@dict.getType('sys_zhuanli_fenlei')}" required disabled="true">
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{fenlei}"></option>
                </select>
            </div>
        </div>

    $(".file-upload").each(function (i) {
        var val = $("input[name='" + this.id + "']").val()
        $(this).fileinput({
            'uploadUrl': ctx + 'common/upload',
            initialPreviewAsData: true,
            initialPreview: [val],
            maxFileCount: 1,
            autoReplace: true
        }).on('fileuploaded', function (event, data, previewId, index) {
            $("input[name='" + event.currentTarget.id + "']").val(data.response.url)
        }).on('fileremoved', function (event, id, index) {
            $("input[name='" + event.currentTarget.id + "']").val('')
        })
        $(this).fileinput('_initFileActions');
    });
