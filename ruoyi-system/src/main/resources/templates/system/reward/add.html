<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('新增奖励')" />
    <th:block th:include="include :: datetimepicker-css" />
    <th:block th:include="include :: bootstrap-fileinput-css"/>
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-reward-add">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">申请人：</label>
                <div class="col-sm-8">
                    <input name="userId" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">荣誉名称：</label>
                <div class="col-sm-8">
                    <input name="rewardName" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">颁发单位：</label>
                <div class="col-sm-8">
                    <input name="rewardDanwei" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">奖励类型：</label>
                <div class="col-sm-8">
                    <input name="rewardLeixing" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">证书文件：</label>
                <div class="col-sm-8">
                    <input type="hidden" name="rewardWenjian">
                    <div class="file-loading">
                        <input class="form-control file-upload" id="rewardWenjian" name="file" type="file">
                    </div>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">颁发时间：</label>
                <div class="col-sm-8">
                    <div class="input-group date">
                        <input name="rewardTime" class="form-control" placeholder="yyyy-MM-dd" type="text" required>
                        <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">分类：</label>
                <div class="col-sm-8">
                    <textarea name="rewardFenlei" class="form-control" required></textarea>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">排名：</label>
                <div class="col-sm-8">
                    <input name="rewardPaiming" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required" for="rewardJibie">级别：</label>
                <div class="col-sm-8">
                    <select id="rewardJibie" name="rewardJibie" class="form-control" required>
                        <option value="校级">校级</option>
                        <option value="省级">省级</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
               <label class="col-sm-3 control-label is-required">等级：</label>
                <div class="col-sm-8">
                    <select id="rewarDengji"  name="rewardDengji" class="form-control" type="text" required>
                        <option>一等奖</option>
                        <option>二等奖</option>
                        <option>三等奖</option>
                        <option>四等奖</option>
                    </select>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: datetimepicker-js" />
    <th:block th:include="include :: bootstrap-fileinput-js"/>
    <script th:inline="javascript">
        var prefix = ctx + "system/reward"
        $("#form-reward-add").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/add", $('#form-reward-add').serialize());
            }
        }

        $("input[name='rewardTime']").datetimepicker({
            format: "yyyy-mm-dd",
            minView: "month",
            autoclose: true
        });

        $(".file-upload").fileinput({
            uploadUrl: ctx + 'common/upload',
            maxFileCount: 1,
            autoReplace: true
        }).on('fileuploaded', function (event, data, previewId, index) {
            $("input[name='" + event.currentTarget.id + "']").val(data.response.url)
        }).on('fileremoved', function (event, id, index) {
            $("input[name='" + event.currentTarget.id + "']").val('')
        })
    </script>
</body>
</html>
