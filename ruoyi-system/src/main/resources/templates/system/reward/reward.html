<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('奖励列表')" />
</head>
<body class="gray-bg">
     <div class="container-div">

            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>

<!--                                <input type="text" name="rewardWenjian"/>-->

                            <li>
                                <label>颁发时间：</label>
                                <input type="text" class="time-input" placeholder="请选择颁发时间" name="rewardTime"/>
                            </li>
                            <li>
                                <label>分类：</label>
                                <input type="text" name="rewardFenlei"/>
                            </li>
                            <li>
                                <label>等级：</label>

                            </li>
<!--                            <li>-->
<!--                                <label>排名：</label>-->
<!--                                <input type="text" name="rewardPaiming"/>-->
<!--                            </li>-->
                            <li>
                                <label>级别：</label>
                                <input type="text" name="rewardJibie"/>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="system:reward:add">
                    <i class="fa fa-plus"></i> 添加
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="system:reward:edit">
                    <i class="fa fa-edit"></i> 修改
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="system:reward:remove">
                    <i class="fa fa-remove"></i> 删除
                </a>
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="system:reward:export">
                    <i class="fa fa-download"></i> 导出
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('system:reward:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:reward:remove')}]];
        var prefix = ctx + "system/reward";

        $(function() {
            var options = {

                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "奖励",
                columns: [{
                    checkbox: true
                },
                {

                {
                    field: 'rewardLeixing',
                    title: '奖励类型'
                },
                {
                    field: 'rewardWenjian',
                    title: '证书文件'
                },
                {
                    field: 'rewardTime',
                    title: '颁发时间'
                },
                {
                    field: 'rewardFenlei',
                    title: '分类'
                },
                {
                    field: 'rewardDengji',
                    title: '等级'
                },
                {
                    field: 'rewardPaiming',
                    title: '排名'
                },
                {
                    field: 'rewardJibie',
                    title: '级别'
                }
                // {
                //     title: '操作',
                //     align: 'center',
                //     formatter: function(value, row, index) {
                //         var actions = [];
                //         actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                //         actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>删除</a>');
                //         return actions.join('');
                //     }
                // }
                ]
            };
            $.table.init(options);
        });
    </script>
</body>
</html>
