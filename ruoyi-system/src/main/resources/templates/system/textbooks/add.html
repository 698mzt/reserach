<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('新增教材软著')" />
    <th:block th:include="include :: datetimepicker-css" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-jiaocaizhuanzhu-add">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">姓名：</label>
            <div class="col-sm-8">
                <select name="user_id" class="form-control m-b">
                    <option th:each="user : ${sysUsers}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${user.flag}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">名称：</label>
            <div class="col-sm-8">
                <input name="mingcheng" class="form-control" type="text" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">类型：</label>
            <div class="col-sm-8">
                <select name="leixing" class="form-control m-b" th:with="type=${@dict.getType('sys_jiaocairuanzhu_leibie')}" required>
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">ISBN：</label>
            <div class="col-sm-8">
                <input name="isbn" class="form-control" type="text">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">出版时间：</label>
            <div class="col-sm-8">
                <div class="input-group date">
                    <input name="chubanshijian" class="form-control" placeholder="yyyy-MM-dd" type="text" required>
                    <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">出版社：</label>
            <div class="col-sm-8">
                <input name="chubanshe" class="form-control" type="text">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">排名（全书作者排名）：</label>
            <div class="col-sm-8">
                <input name="paiming" class="form-control" type="text">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">科研分：</label>
            <div class="col-sm-8">
                <input name="keyanfen" class="form-control" type="number" step="0.01">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">是否本校使用：</label>
            <div class="col-sm-8" th:with="type=${@dict.getType('sys_yes_no')}">
                <label th:each="dict : ${type}" class="check-box">
                    <input name="benxiaoshifoyongshu" type="checkbox" th:value="${dict.dictValue}" th:text="${dict.dictLabel}">
                </label>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">状态：</label>
            <div class="col-sm-8">
                <select name="state" class="form-control m-b">
                    <option value="1" selected>启用</option>
                    <option value="0">禁用</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">文件：</label>
            <div class="col-sm-8">
                <input name="wenjian" class="form-control" type="file">
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-3 col-sm-8">
                <button type="submit" class="btn btn-primary" onclick="submitHandler()">保存</button>
                <button type="button" class="btn btn-default" onclick="window.history.back()">返回</button>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer" />
<th:block th:include="include :: datetimepicker-js" />
<script th:inline="javascript">
    var prefix = ctx + "system/jiaocaizhuanzhu";
    $("#form-jiaocaizhuanzhu-add").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($("#form-jiaocaizhuanzhu-add").valid()) {
            $.operate.save(prefix + "/add", new FormData($('#form-jiaocaizhuanzhu-add')[0]));
        }
    }

    $("input[name='chubanshijian']").datetimepicker({
        format: "yyyy-mm-dd",
        minView: "month",
        autoclose: true
    });
</script>
</body>
</html>
