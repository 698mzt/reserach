<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>

    <!-- 确保CSS正确放置 -->
<style>

.table-bordered tr:has(td[colspan]) {
    background-color: #f8f9fa;
}
.table-bordered td[colspan] {
    font-weight: 600;
    text-align: center !important;
}
</style>

</head>
<body class="gray-bg">
<div class="container-div">
    <div class="btn-group-sm" id="toolbar" role="group">

    <div class="row">
        <div class="col-sm-12 select-table table-bordered">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>
<div th:include="include :: footer"></div>
<script>
    var total = 0
    var prefix = ctx + 'rewardxuexiao'
    $(function() {
        var options = {
            url: prefix + "/list",
            modalName: '学院业绩成果数',
            height: 600,
            sidePagination: "server",
            pagination: true,
            showSearch: false,
            virtualScroll: true,
            columns:[
                [
                    {
                        checkbox: true
                    },
                    {
                        field: '学院',
                        title: '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;学院&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;',
                        align: 'center'
                    },
                    {
                        field: '专业',
                        title: '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;专业&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;',
                        align: 'center'
                    },
                    {
                        title: '纵向科研项目-校级以上',
                        align: 'center',
                        field: '纵向科研项目-校级以上'
                    },
                    {
                        title: '纵向科研项目-校级',
                        align: 'center',
                        field: '纵向科研项目-校级'
                    },
                    {
                        title: '横向课题科研项目',
                        align: 'center',
                        field: '横向课题科研项目'
                    },
                    {
                        title: '成果转化',
                        align: 'center',
                        field: '成果转化'
                    },
                    {
                        title: '学术论文',
                        align: 'center',
                        field: '学术论文'
                    },
                    {
                        title: '教材著作',
                        align: 'center',
                        field: '教材著作'
                    },
                    {
                        title: '专利',
                        align: 'center',
                        field: '专利'
                    },
                    {
                        title: '软著',
                        align: 'center',
                        field: '软著'
                    },
                    {
                        title: '奖励',
                        align: 'center',
                        field: '奖励'
                    },
                    {
                        title: '学术报告(讲座类)',
                        align: 'center',
                        field: '学术报告(讲座类)'
                    }
                ],

            ]
        };
        $.table.init(options);


// 事件监听调整到初始化之前
$('#bootstrap-table').on('load-success.bs.table', function (e, data) {
  const $table = $(this);
  const rows = data.rows; // 直接使用回调数据

  // 延迟确保 DOM 渲染完成
  setTimeout(() => {
    $table.find('tbody tr').each(function(index) {
      const rowData = rows[index];
      const $cells = $(this).find('td');

      if (rowData && rowData.isCollegeTotal) {
        $cells.eq(1)
          .attr('colspan', 2)
          .html('学院合计')
          .css('font-weight', 'bold');
        $cells.eq(2).remove();
      }

      if (rowData && rowData.isGrandTotal) {
        $cells.eq(0)
          .attr('colspan', 3)
          .html('合计')
          .css({'font-weight': 'bold', 'background-color': '#f5f5f5'});
        $cells.slice(1, 3).remove();
      }
    });
  }, 0);
});

// 初始化表格
$.table.init(options);



    });

</script>

</body>
</html>
