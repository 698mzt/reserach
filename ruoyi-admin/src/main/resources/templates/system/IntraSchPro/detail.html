<script type="text/javascript">
    console.log("role:", $("#role").val());

    function displayFileName(inputId, fileNameId) {
        const input = document.getElementById(inputId);
        const fileNameSpan = document.getElementById(fileNameId);
        if (input.value) {
            const fileName = input.value.split('/').pop(); // 获取文件名
            const parts = fileName.split('_'); // 按下划线分割
            const firstPart = parts[0]; // 下划线前的部分

            fileNameSpan.textContent = `${firstPart}`; // 组合并显示
        } else {
            fileNameSpan.textContent = '';
        }
    }

    function chakan() {
        var relativePath = $("#filing").val();
        if (!relativePath) {
            alert("没有可预览的文件！");
            return;
        }

        // 检查是否为MinIO文件（路径以/minio/开头）
        if (relativePath.startsWith('/minio/')) {
            // 对于MinIO文件，使用新的预览接口
            var contextPath = '/' + window.location.pathname.split('/')[1];
            var previewUrl = window.location.origin + contextPath + '/common/preview?fileName=' + encodeURIComponent(relativePath);
            window.open(previewUrl, '_blank');
        } else {
            // 对于本地文件，按原方式处理
            var contextPath = '/' + window.location.pathname.split('/')[1];
            var fullPath = window.location.origin + contextPath + relativePath;
            window.open(fullPath, '_blank');
        }
    }

    function beian() {
        var relativePath = $("#contract").val();
        if (!relativePath) {
            alert("没有可预览的文件！");
            return;
        }

        // 检查是否为MinIO文件（路径以/minio/开头）
        if (relativePath.startsWith('/minio/')) {
            // 对于MinIO文件，使用新的预览接口
            var contextPath = '/' + window.location.pathname.split('/')[1];
            var previewUrl = window.location.origin + contextPath + '/common/preview?fileName=' + encodeURIComponent(relativePath);
            window.open(previewUrl, '_blank');
        } else {
            // 对于本地文件，按原方式处理
            var contextPath = '/' + window.location.pathname.split('/')[1];
            var fullPath = window.location.origin + contextPath + relativePath;
            window.open(fullPath, '_blank');
        }
    }

    function downloadFile(type) {
        var relativePath = $("#" + type).val();
        if (!relativePath) {
            alert("没有可下载的文件！");
            return;
        }

        var downloadUrl;
        // 检查是否为MinIO文件（路径以/minio/开头）
        if (relativePath.startsWith('/minio/')) {
            // 对于MinIO文件，使用通用下载接口
            var contextPath = '/' + window.location.pathname.split('/')[1];
            downloadUrl = window.location.origin + contextPath + '/common/download?fileName=' + encodeURIComponent(relativePath);
        } else {
            // 对于本地文件，按原方式处理
            var contextPath = '/' + window.location.pathname.split('/')[1];
            downloadUrl = window.location.origin + contextPath + relativePath;
        }

        if(downloadUrl){
            var a = document.createElement("a");
            a.href=downloadUrl;
            a.download="";
            a.style.display = "none";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }else{
            alert("网址无效");
        }
    }

        });
        <!-- laydate示例 -->
        layui.use('laydate', function () {
            var laydate = layui.laydate;
            laydate.render({
                elem: '#laydate-demo-4',
                range: true
            });
            var startDate = laydate.render({
                elem: '#laydate-startTime',
                max: $('#laydate-endTime').val(),
                theme: 'molv',
                trigger: 'click',
                done: function (value, date) {
                    // 结束时间大于开始时间
                    if (value !== '') {
                        endDate.config.min.year = date.year;
                        endDate.config.min.month = date.month - 1;
                        endDate.config.min.date = date.date;
                    } else {
                        endDate.config.min.year = '';

                        endDate.config.min.date = '';
                    }

            var endDate = laydate.render({

<script th:inline="javascript">
    var prefix = ctx + "IntraSchPro";
    $("#form-apply-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        //获取 URLflag
        var a = $("#urlFlag").val();

        //if ($.validate.form()) {
        $.operate.saveTab(prefix + "/sch_hxPass", {"id": $("#ktid").val(), "urlFlag": a});
        // }
    }

    function submitHandlerBH() {
        var remarkVal = $('#remark').val();
        console.log('remarkVal=',remarkVal)
        if (!remarkVal || !remarkVal.trim()) {
            $.modal.confirm("批注不能为空");
            return false;
        }
        var a = $("#urlFlag").val();
        if ($.validate.form()) {
            $.operate.saveTab(prefix + "/sch_hxBh", $('#form-apply-edit').serialize());
        }
    }

    //撤回
    function retract() {

        if ($.validate.form()) {
            $.operate.saveTab(prefix + "/retract", $('#form-apply-edit').serialize());
        }
    }

    $(".file-upload").each(function (i) {
        var val = $("input[name='" + this.id + "']").val()
        $(this).fileinput({
            'uploadUrl': ctx + 'common/upload/cgzh',
            initialPreviewAsData: true,
            initialPreview: [val],
            maxFileCount: 1,
            maxFileSize: 51200,
            autoReplace: true
        }).on('fileuploaded', function (event, data, previewId, index) {
            $("input[name='" + event.currentTarget.id + "']").val(data.response.url)
        }).on('fileremoved', function (event, id, index) {
            $("input[name='" + event.currentTarget.id + "']").val('')
        })
        $(this).fileinput('_initFileActions');
    });
    // 页面加载时显示文 件名
    window.onload = function () {
        displayFileName('contract', 'contractFileName');
        displayFileName('filing', 'filingFileName');
        loadScores();
    };

    function loadScores() {
        var amount = $("input[name='amount']").val();
        if (!amount || isNaN(amount)) {
            $('#firstPersonScore').val('');
            $('#firstPersonScore').attr('placeholder', '选择课题类型和填写金额后自动计算');
            $('#secondPersonScore').val('');
            $('#secondPersonScore').attr('placeholder', '选择课题类型和填写金额后自动计算');
            $('#thirdPersonScore').val('');
            $('#thirdPersonScore').attr('placeholder', '选择课题类型和填写金额后自动计算');
            $('#fourthPersonScore').val('');
            $('#fourthPersonScore').attr('placeholder', '选择课题类型和填写金额后自动计算');
            return;
        }
        $.ajax({
            url: prefix + '/calculateScore',
            method: 'POST',
            data: { amount: parseFloat(amount) },
            success: function(response) {
                if (response.code === 0 && response.data) {
                    var scores = response.data;
                    $('#firstPersonScore').val((scores['1'] || 0) + '分');
                    $('#secondPersonScore').val((scores['2'] || 0) + '分');
                    $('#thirdPersonScore').val((scores['3'] || 0) + '分');
                    $('#fourthPersonScore').val((scores['4'] || 0) + '分');
                }
            }
        });
    }
</script>
