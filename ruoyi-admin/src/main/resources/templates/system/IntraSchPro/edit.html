<script type="text/javascript">
    $(function () {
        <!-- laydate示例 -->
        layui.use('laydate', function () {
            var laydate = layui.laydate;
            laydate.render({
                elem: '#laydate-demo-4',
                range: true
            });
            var startDate = laydate.render({
                elem: '#laydate-startTime',
                max: $('#laydate-endTime').val(),
                theme: 'molv',
                trigger: 'click',
                done: function (value, date) {
                    // 结束时间大于开始时间
                    if (value !== '') {
                        endDate.config.min.year = date.year;
                        endDate.config.min.month = date.month - 1;
                        endDate.config.min.date = date.date;
                    } else {
                        endDate.config.min.year = '';
                        endDate.config.min.month = '';
                        endDate.config.min.date = '';
                    }
                }
            });
            var endDate = laydate.render({
                elem: '#laydate-endTime',
                min: $('#laydate-startTime').val(),
                theme: 'molv',
                trigger: 'click',
                done: function (value, date) {
                    // 开始时间小于结束时间
                    if (value !== '') {
                        startDate.config.max.year = date.year;
                        startDate.config.max.month = date.month - 1;
                        startDate.config.max.date = date.date;
                    } else {
                        startDate.config.max.year = '';
                        startDate.config.max.month = '';
                        startDate.config.max.date = '';
                    }
                }
            });
        });

        var kid = $("#ktid").val();
        var options = {
            url: prefix + "/bhyy/" + kid,
            showSearch: false,
            showRefresh: false,
            showToggle: false,
            showColumns: false,
            pagination: false,

            columns: [

                {
                    field: 'createTime',
                    title: '批阅时间',
                    width: 200

                },
                {
                    field: 'uname',
                    title: '批阅人',
                    width: 100
                },
                {
                    field: 'concate',
                    title: '内容',
                    width: 500
                },
                {
                    field: 'state',
                    title: '审核状态',
                    width: 100
                }
                //
                // {
                    field: 'status',
                    title: '批阅状态',
                    align: 'center',
                    formatter: function(value, row, index) {
                        return $.table.selectDictLabel(datas, value);
                    }
                //}
            ]
        };
        $.table.init(options);
        
        // 页面加载完成后更新分数显示
        updateScoreDisplay();
    });
    
    // 根据项目金额计算科研分
    function updateScoreDisplay() {
        var amountStr = $("input[name='amount']").val().trim();
        if (!amountStr) {
            $("#score-info").text("项目金额未填写，科研分待计算");
            return;
        }
        
        var amount = parseFloat(amountStr);
        if (isNaN(amount) || amount < 0) {
            $("#score-info").text("项目金额格式错误");
            return;
        }
        
        // 根据金额范围计算科研分
        var firstScore, secondScore, thirdScore, fourthScore;
        
        if (amount >= 20 && amount <= 50) {
            // 经费到款20-50万元：第一排名：1540分，第二排名：700分，第三排名：280分，第四排名：140分
            firstScore = 1540;
            secondScore = 700;
            thirdScore = 280;
            fourthScore = 140;
        } else if (amount >= 5 && amount < 10) {
            // 经费到款5-10万元：第一排名：440分，第二排名：200分，第三排名：80分，第四排名：40分
            firstScore = 440;
            secondScore = 200;
            thirdScore = 80;
            fourthScore = 40;
        } else if (amount >= 10 && amount < 20) {
            // 对于10-20万之间的经费，按比例计算积分
            var ratio = (20 - amount) / 10; // 金额越大，系数越小
            firstScore = Math.round(440 + (1540 - 440) * (1 - ratio)); // 在440-1540之间插值
            secondScore = Math.round(200 + (700 - 200) * (1 - ratio)); // 在200-700之间插值
            thirdScore = Math.round(80 + (280 - 80) * (1 - ratio)); // 在80-280之间插值
            fourthScore = Math.round(40 + (140 - 40) * (1 - ratio)); // 在40-140之间插值
        } else if (amount > 50) {
            // 对于超过50万的情况，使用最高积分
            firstScore = 1540;
            secondScore = 700;
            thirdScore = 280;
            fourthScore = 140;
        } else if (amount >= 0.5 && amount < 5) {
            // 对于0.5-5万之间的经费，按比例计算积分
            firstScore = Math.round(440 * (amount / 5)); // 在0-440之间按比例计算
            secondScore = Math.round(200 * (amount / 5)); // 在0-200之间按比例计算
            thirdScore = Math.round(80 * (amount / 5)); // 在0-80之间按比例计算
            fourthScore = Math.round(40 * (amount / 5)); // 在0-40之间按比例计算
        } else {
            // 低于0.5万或无效金额，返回0分
            firstScore = 0;
            secondScore = 0;
            thirdScore = 0;
            fourthScore = 0;
        }
        
        $("#score-info").html(
            "预计科研分分配：<br>" +
            "第一负责人：" + firstScore + " 分，" +
            "第二负责人：" + secondScore + " 分，" +
            "第三负责人：" + thirdScore + " 分，" +
            "第四负责人：" + fourthScore + " 分<br>" +
            "<strong>注意：</strong>仅前四个负责人可获得科研分，后续添加成员不参与科研分分配。"
        );
    }
</script>
<script th:inline="javascript">
    var prefix = ctx + "IntraSchPro";
    $("#form-apply-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {

        if ($.validate.form()) {
            // 编辑验证逻辑
            // 1. 负责人不能相同
            var first = $("select[name='firstPersonId']").val();
            var second = $("select[name='secondPersonId']").val();
            var third = $("select[name='thirdPersonId']").val();
            var fourth = $("select[name='fourthPersonId']").val();

            var fzrArray = [first, second, third, fourth].filter(item => item !== "");
            var uniquefzr = [...new Set(fzrArray)];
            if (uniquefzr.length < fzrArray.length) {
                $.modal.alertWarning("负责人不能重复");
                return;
            }

            // 2. 金额不能为负数
            var amountStr = $("input[name='amount']").val().trim();
            var amount = parseFloat($("input[name='amount']").val());
            if (isNaN(amount) || amount < 0) {
                $.modal.alertWarning("项目金额必须为非负数");
                return;
            }
            // 检查小数点前后位数
            if (amountStr.includes('.')) {
                var parts = amountStr.split('.');
                // 检查小数点前后的位数
                if (parts[0].length > 4 || parts[1].length > 4 || parts[0].length <=0 || parts[1].length <=0) {
                    $.modal.alertWarning("金额格式出错");
                    return;
                }
            } else {
                // 没有小数点的情况
                if (amountStr.length > 4) {
                    $.modal.alertWarning("金额格式出错");
                    return;
                }
            }

            // 3. 甲方乙方不能相同
            var pa = $("input[name='pa']").val().trim();
            var pb = $("input[name='pb']").val().trim();
            if (pa === pb) {
                $.modal.alertWarning("甲方和乙方不能相同");
                return;
            }

            // 4. 文件上传验证
            if ($("input[name='contract']").val() == "") {
                $.modal.alertWarning("请上传转化合同");
                return;
            } else if ($("input[name='filing']").val() == "") {
                $.modal.alertWarning("请上传成果登记表");
                return;
            } else if ($("input[name='overContract']").val() == "") {
                $.modal.alertWarning("请上传成果扫描件");
                return;
            }

            $.operate.saveTab(prefix + "/sc_edit", $('#form-apply-edit').serialize());
        }


    }

    $("input[name='signingData']").datetimepicker({
        format: "yyyy-mm-dd",
        minView: "month",
        autoclose: true
    });


    $(".file-upload1").fileinput({
        //prefix+"/upload",
        uploadUrl: ctx + 'common/upload/cgzh',
        initialPreviewAsData: true,
        maxFileCount: 1,
        maxFileSize: 51200,
        autoReplace: true,
        allowedFileExtensions: ["pdf"],  //指定上传文件类型
        slugCallback: function (filename) {
            if ($("input[name='topName']").val() === "") {
                $(".file-upload1").fileinput('clear');
                $.modal.alertError("请先输入成果名称");
                return false;
            }
            // 自定义文件名生成规则
            fileExtension = filename.split('.').pop();
            const year = new Date().getFullYear();
            const newName = year + "-" + $("input[name='topName']").val() + "-" + "合同" + "." + fileExtension;
            return newName;
        },
    }).on('fileuploaded', function (event, data, previewId, index) {
        $("input[name='" + event.currentTarget.id + "']").val(data.response.url)
    }).on('fileremoved', function (event, id, index) {
        $("input[name='" + event.currentTarget.id + "']").val('')
    }).on('filebatchselected', function(event) {
        // 批量选择文件后立即上传
        $(this).fileinput('upload');
    }).on('fileselected', function(event) {
        // 单个文件选择后立即上传
        $(this).fileinput('upload');
    })

    $(".file-upload2").fileinput({
        //prefix+"/upload",
        uploadUrl: ctx + 'common/upload/cgzh',
        initialPreviewAsData: true,
        maxFileCount: 1,
        maxFileSize: 51200,
        autoReplace: true,
        allowedFileExtensions: ["pdf"],  //指定上传文件类型
        slugCallback: function (filename) {
            if ($("input[name='topName']").val() === "") {
                $(".file-uploadb").fileinput('clear');
                $.modal.alertError("请先输入成果名称");
                return false;
            }
            // 自定义文件名生成规则
            fileExtension = filename.split('.').pop();
            const year = new Date().getFullYear();
            const newName = year + "-" + $("input[name='topName']").val() + "-" + "成果登记表" + "." + fileExtension;
            return newName;
        },
    }).on('fileuploaded', function (event, data, previewId, index) {
        $("input[name='" + event.currentTarget.id + "']").val(data.response.url)
    }).on('fileremoved', function (event, id, index) {
        $("input[name='" + event.currentTarget.id + "']").val('')
    }).on('filebatchselected', function(event) {
        // 批量选择文件后立即上传
        $(this).fileinput('upload');
    }).on('fileselected', function(event) {
        // 单个文件选择后立即上传
        $(this).fileinput('upload');
    })
    
    $(".file-upload3").fileinput({
        //prefix+"/upload",
        uploadUrl: ctx + 'common/upload/cgzh',
        initialPreviewAsData: true,
        maxFileCount: 1,
        maxFileSize: 51200,
        autoReplace: true,
        allowedFileExtensions: ["pdf"],  //指定上传文件类型
        slugCallback: function (filename) {
            if ($("input[name='topName']").val() === "") {
                $(".file-upload3").fileinput('clear');
                $.modal.alertError("请先输入成果名称");
                return false;
            }
            // 自定义文件名生成规则
            fileExtension = filename.split('.').pop();
            const year = new Date().getFullYear();
            const newName = year + "-" + $("input[name='topName']").val() + "-" + "成果扫描件" + "." + fileExtension;
            return newName;
        },
    }).on('fileuploaded', function (event, data, previewId, index) {
        $("input[name='" + event.currentTarget.id + "']").val(data.response.url)
    }).on('fileremoved', function (event, id, index) {
        $("input[name='" + event.currentTarget.id + "']").val('')
    }).on('filebatchselected', function(event) {
        // 批量选择文件后立即上传
        $(this).fileinput('upload');
    }).on('fileselected', function(event) {
        // 单个文件选择后立即上传

    })
</script>
