<script type="text/javascript">
    $(function () {
        <!-- laydate示例 -->
        layui.use('laydate', function () {
            var laydate = layui.laydate;
            laydate.render({
                elem: '#laydate-demo-4',
                range: true
            });
            var startDate = laydate.render({
                elem: '#laydate-startTime',
                max: $('#laydate-endTime').val(),
                theme: 'molv',
                trigger: 'click',
                done: function (value, date) {
                    // 结束时间大于开始时间
                    if (value !== '') {
                        endDate.config.min.year = date.year;
                        endDate.config.min.month = date.month - 1;
                        endDate.config.min.date = date.date;
                    } else {
                        endDate.config.min.year = '';
                        endDate.config.min.month = '';
                        endDate.config.min.date = '';
                    }
                }
            });
            var endDate = laydate.render({
                elem: '#laydate-endTime',
                min: $('#laydate-startTime').val(),
                theme: 'molv',
                trigger: 'click',
                done: function (value, date) {
                    // 开始时间小于结束时间
                    if (value !== '') {
                        startDate.config.max.year = date.year;
                        startDate.config.max.month = date.month - 1;
                        startDate.config.max.date = date.date;
                    } else {
                        startDate.config.max.year = '';
                        startDate.config.max.month = '';
                        startDate.config.max.date = '';
                    }
                }
            });
        });

        var kid = $("#ktid").val();
        var options = {
            url: prefix + "/bhyy/" + kid,
            showSearch: false,
            showRefresh: false,
            showToggle: false,
            showColumns: false,
            pagination: false,
            sortName: 'createTime',
            sortOrder: 'desc',

            columns: [

                {
                    field: 'createTime',
                    title: '批阅时间',
                    width: 200

                },
                {
                    field: 'uname',
                    title: '批阅人',
                    width: 100
                },
                {
                    field: 'concate',
                    title: '内容',
                    width: 500
                },
                {
                    field: 'state',
                    title: '审核状态',
                    width: 100
                }
                //
                // {
                //     field: 'status',
                //     title: '批阅状态',
                //     align: 'center',
                //     formatter: function(value, row, index) {
                //         return $.table.selectDictLabel(datas, value);
                //     }
                // }
            ]
        };
        $.table.init(options);
    });
</script>
<script th:inline="javascript">
    var prefix = ctx + "IntraSchPro";
    $("#form-apply-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {

        if ($.validate.form()) {
            $.operate.saveTab(prefix + "/sc_edit", $('#form-apply-edit').serialize());
        }


    }

    $("input[name='signingData']").datetimepicker({
        format: "yyyy-mm-dd",
        minView: "month",
        autoclose: true
    });


    var contractUrl = $("input[name='contract']").val();
    var filingUrl = $("input[name='filing']").val();

    $(".file-upload1").fileinput({
        //prefix+"/upload",
        uploadUrl: ctx + 'common/upload/cgzh',
        initialPreviewAsData: true,
        initialPreview: contractUrl ? [contractUrl] : [],
        initialPreviewConfig: contractUrl ? [{caption: contractUrl.substring(contractUrl.lastIndexOf('/') + 1), key: 1}] : [],
        maxFileCount: 1,
        maxFileSize: 51200,
        autoReplace: true,
        allowedFileExtensions: ["pdf"],  //指定上传文件类型
        slugCallback: function (filename) {
            if ($("input[name='topName']").val() === "") {
                $(".file-upload1").fileinput('clear');
                $.modal.alertError("请先输入课题名称");
                return false;
            }
            // 自定义文件名生成规则
            fileExtension = filename.split('.').pop();
            const year = new Date().getFullYear();
            const newName = year + "-" + $("input[name='topName']").val() + "-" + "合同" + "." + fileExtension;
            return newName;
        },
    }).on('fileuploaded', function (event, data, previewId, index) {
        $("input[name='" + event.currentTarget.id + "']").val(data.response.url)
    }).on('fileremoved', function (event, id, index) {
        $("input[name='" + event.currentTarget.id + "']").val('')
    }).on('filebatchselected', function(event) {
        // 批量选择文件后立即上传
        $(this).fileinput('upload');
    }).on('fileselected', function(event) {
        // 单个文件选择后立即上传
        $(this).fileinput('upload');
    })

    $(".file-upload2").fileinput({
        //prefix+"/upload",
        uploadUrl: ctx + 'common/upload/cgzh',
        initialPreviewAsData: true,
        initialPreview: filingUrl ? [filingUrl] : [],
        initialPreviewConfig: filingUrl ? [{caption: filingUrl.substring(filingUrl.lastIndexOf('/') + 1), key: 1}] : [],
        maxFileCount: 1,
        maxFileSize: 51200,
        autoReplace: true,
        allowedFileExtensions: ["pdf"],  //指定上传文件类型
        slugCallback: function (filename) {
            if ($("input[name='topName']").val() === "") {
                $(".file-uploadb").fileinput('clear');
                $.modal.alertError("请先输入课题名称");
                return false;
            }
            // 自定义文件名生成规则
            fileExtension = filename.split('.').pop();
            const year = new Date().getFullYear();
            const newName = year + "-" + $("input[name='topName']").val() + "-" + "备案表" + "." + fileExtension;
            return newName;
        },
    }).on('fileuploaded', function (event, data, previewId, index) {
        $("input[name='" + event.currentTarget.id + "']").val(data.response.url)
    }).on('fileremoved', function (event, id, index) {
        $("input[name='" + event.currentTarget.id + "']").val('')
    }).on('filebatchselected', function(event) {
        // 批量选择文件后立即上传
        $(this).fileinput('upload');
    }).on('fileselected', function(event) {
        // 单个文件选择 立即上传
        $(this).fileinput('upload');
    })

    // 缓存所有用户选项用于下拉互斥过滤
    window._cachedUserOptions = [];

    function rebuildPersonDropdowns() {
        if (!window._cachedUserOptions.length) return;

        var dropdownIds = ['secondPersonId', 'thirdPersonId', 'fourthPersonId'];

        // 收集所有已选值（包括第一负责人）
        var selectedValues = {};
        var firstVal = $('select[name="firstPersonId"]').val();
        if (firstVal && firstVal !== '' && firstVal !== '-1') {
            selectedValues['firstPersonId'] = firstVal;
        }
        dropdownIds.forEach(function(id) {
            var val = $('select[name="' + id + '"]').val();
            if (val && val !== '' && val !== '-1') {
                selectedValues[id] = val;
            }
        });

        // 重建每个下拉框
        dropdownIds.forEach(function(currentId) {
            var $select = $('select[name="' + currentId + '"]');
            var currentVal = $select.val();

            // 移除所有非占位option
            $select.find('option[value!=""]').remove();

            // 从缓存重新添加：排除在其他下拉中被选中的选项（但保留自己的选中值）
            window._cachedUserOptions.forEach(function(opt) {
                var isSelectedElsewhere = false;
                Object.keys(selectedValues).forEach(function(otherId) {
                    if (otherId !== currentId && selectedValues[otherId] === String(opt.userId)) {
                        isSelectedElsewhere = true;
                    }
                });
                if (!isSelectedElsewhere || String(opt.userId) === currentVal) {
                    $select.append($('<option>', {
                        value: opt.userId,
                        text: opt.text,
                        'data-user-id': opt.userId
                    }));
                }
            });

            // 恢复选中值
            if (currentVal) {
                $select.val(currentVal);
            }

            // 刷新select2
            if ($select.data('select2')) {
                $select.trigger('change.select2');
            }
        });
    }

    // 绑定互斥逻辑
    $(document).on('change', 'select[name="firstPersonId"],select[name="secondPersonId"],select[name="thirdPersonId"],select[name="fourthPersonId"]', function () {
        rebuildPersonDropdowns();
    });

    // 页面加载时计算积分，金额变化时刷新
    $(document).ready(function() {
        // 缓存所有用户选项
        $('select[name="secondPersonId"] option').each(function() {
            var val = $(this).val();
            if (val) {
                window._cachedUserOptions.push({
                    userId: $(this).data('user-id') || val,
                    text: $(this).text(),
                    val: val
                });
            }
        });

        // 初始化Select2
        $('select[name="secondPersonId"], select[name="thirdPersonId"], select[name="fourthPersonId"]').select2({
            placeholder: '其他',
            allowClear: true,
            width: '100%'
        });

        // 首次同步
        rebuildPersonDropdowns();
        loadScores();
    });
    $('input[name="amount"]').on('change blur', function() {
        loadScores();
    });

    function loadScores() {
        var amount = $("input[name='amount']").val();
        if (!amount || isNaN(amount) || parseFloat(amount) <= 0) {
            $('#firstPersonScore').val('');
            $('#secondPersonScore').val('');
            $('#thirdPersonScore').val('');
            $('#fourthPersonScore').val('');
            return;
        }
        $.ajax({
            url: prefix + '/calculateScore',
            method: 'POST',
            data: { amount: parseFloat(amount) },
            success: function(response) {
                if (response.code === 0 && response.data) {
                    var scores = response.data;
                    $('#firstPersonScore').val((scores['1'] || 0) + '分');
                    $('#secondPersonScore').val((scores['2'] || 0) + '分');
                    $('#thirdPersonScore').val((scores['3'] || 0) + '分');
                    $('#fourthPersonScore').val((scores['4'] || 0) + '分');
                }
            }
        });
    }

    bindOtherScoreDisplays([
        ["select[name='secondPersonId']", "#secondPersonScore"],
        ["select[name='thirdPersonId']", "#thirdPersonScore"],
        ["select[name='fourthPersonId']", "#fourthPersonScore"]
    ]);

</script>
