    // 根据项目金额计算科研分
    function updateScoreDisplay() {
        var amountStr = $("input[name='amount']").val().trim();
        if (!amountStr) {
            $("#score-info").text("项目金额未填写，科研分待计算");
            return;
        }
        
        var amount = parseFloat(amountStr);
        if (isNaN(amount) || amount < 0) {
            $("#score-info").text("项目金额格式错误");
            return;
        }
        
        // 根据金额范围计算科研分
        var firstScore, secondScore, thirdScore, fourthScore;
        
        if (amount >= 20 && amount <= 50) {
            // 经费到款20-50万元：第一排名：1540分，第二排名：700分，第三排名：280分，第四排名：140分
            firstScore = 1540;
            secondScore = 700;
            thirdScore = 280;
            fourthScore = 140;
        } else if (amount >= 5 && amount < 10) {
            // 经费到款5-10万元：第一排名：440分，第二排名：200分，第三排名：80分，第四排名：40分
            firstScore = 440;
            secondScore = 200;
            thirdScore = 80;
            fourthScore = 40;
        } else if (amount >= 10 && amount < 20) {
            // 对于10-20万之间的经费，按比例计算积分
            var ratio = (20 - amount) / 10; // 金额越大，系数越小
            firstScore = Math.round(440 + (1540 - 440) * (1 - ratio)); // 在440-1540之间插值
            secondScore = Math.round(200 + (700 - 200) * (1 - ratio)); // 在200-700之间插值
            thirdScore = Math.round(80 + (280 - 80) * (1 - ratio)); // 在80-280之间插值
            fourthScore = Math.round(40 + (140 - 40) * (1 - ratio)); // 在40-140之间插值
        } else if (amount > 50) {
            // 对于超过50万的情况，使用最高积分
            firstScore = 1540;
            secondScore = 700;
            thirdScore = 280;
            fourthScore = 140;
        } else if (amount >= 0.5 && amount < 5) {
            // 对于0.5-5万之间的经费，按比例计算积分
            firstScore = Math.round(440 * (amount / 5)); // 在0-440之间按比例计算
            secondScore = Math.round(200 * (amount / 5)); // 在0-200之间按比例计算
            thirdScore = Math.round(80 * (amount / 5)); // 在0-80之间按比例计算
            fourthScore = Math.round(40 * (amount / 5)); // 在0-40之间按比例计算
        } else {
            // 低于0.5万或无效金额，返回0分
            firstScore = 0;
            secondScore = 0;
            thirdScore = 0;
            fourthScore = 0;
        }
        
        $("#score-info").html(
            "预计科研分分配：<br>" +
            "第一负责人：" + firstScore + " 分，" +
            "第二负责人：" + secondScore + " 分，" +
            "第三负责人：" + thirdScore + " 分，" +
            "第四负责人：" + fourthScore + " 分<br>" +
            "<strong>注意：</strong>仅前四个负责人可获得科研分，后续添加成员不参与科研分分配。"
        );
    }

    // 监听金额输入变化
    $("input[name='amount']").on('input', function() {
        updateScoreDisplay();
    });

    function submitHandler() {
        if ($.validate.form()) {
            // 新增验证逻辑
            // 1. 负责人不能相同
            var first = $("#firstPersonId").val();
            var second = $("#secondPersonId").val();
            var third = $("#thirdPersonId").val();
            var fourth = $("#fourthPersonId").val();

            var fzrArray = [first, second, third, fourth].filter(item => item !== "");
            
            // 收集动态添加的负责人
            $('.member-select').each(function(){
                var val = $(this).val();
                if (val) fzrArray.push(val);
            });

            var uniquefzr = [...new Set(fzrArray)];
            //console.log('uniquefzr',uniquefzr);
            //console.log('fzrArray',fzrArray);
            if (uniquefzr.length < fzrArray.length) {
                $.modal.alertWarning("负责人不能重复");
                return;
            }

            // 2. 金额不能为负数
            var amountStr = $("input[name='amount']").val().trim();
            var amount = parseFloat($("input[name='amount']").val());
            if (isNaN(amount) || amount < 0) {
                $.modal.alertWarning("项目金额必须为非负数");
                return;
            }
            // 检查小数点前后位数
            if (amountStr.includes('.')) {
                var parts = amountStr.split('.');
                // 检查小数点前后的位数
                if (parts[0].length > 4 || parts[1].length > 4 || parts[0].length <=0 || parts[1].length <=0) {
                    $.modal.alertWarning("金额格式出错");
                    return;
                }
            } else {
                // 没有小数点的情况
                if (amountStr.length > 4) {
                    $.modal.alertWarning("金额格式出错");
                    return;
                }
            }

            // 3. 甲方乙方不能相同
            var pa = $("input[name='pa']").val().trim();
            var pb = $("input[name='pb']").val().trim();
            if (pa === pb) {
                $.modal.alertWarning("甲方和乙方不能相同");
                return;
            }

            // 4. 转化日期验证
            var transDate = new Date($("input[name='signingData']").val());

            // 原有文件上传验证
            if ($("input[name='contract']").val() == "") {
                $.modal.alertWarning("请上传转化合同");
                return;
            } else if ($("input[name='filing']").val() == "") {
                $.modal.alertWarning("请上传成果登记表");
                return;
            } else if ($("input[name='overContract']").val() == "") {
                $.modal.alertWarning("请上传成果扫描件");
                return;
            }

            $.operate.saveTab(prefix + "/add", $('#form-apply-add').serialize());
        }
    }

    });

    function updateMemberLists() {
        // 获取所有已选中的成员ID（使用Set自动去重）
        var selectedIds = new Set();

        // 获取四个固定负责人下拉框的值
        var secondValue = $('#secondPersonId').val();
        var thirdValue = $('#thirdPersonId').val();
        var fourthValue = $('#fourthPersonId').val();

        // 将非空值添加到Set中
        if (secondValue) selectedIds.add(secondValue);
        if (thirdValue) selectedIds.add(thirdValue);
        if (fourthValue) selectedIds.add(fourthValue);

        // 添加动态成员的选中值
        $('.member-select').each(function() {
            var value = $(this).val();
            if (value) {
                selectedIds.add(value);
            }
        });

        // 为每个固定下拉框更新选项
        updateSelectOptions('#secondPersonId', secondValue, selectedIds);
        updateSelectOptions('#thirdPersonId', thirdValue, selectedIds);
        updateSelectOptions('#fourthPersonId', fourthValue, selectedIds);

        // 为每个动态下拉框更新选项
        $('.member-select').each(function() {
            updateDynamicSelectOptions($(this), $(this).val(), selectedIds);
        });
    }

    // 更新单个下拉框的选项
    function updateSelectOptions(selectId, currentValue, selectedIds) {
        var selectElement = $(selectId);
        var originalOptions = selectElement.data('original-options');
        var isCurrentlySelected = selectElement.val(); // 保存当前选中的值

        // 清空当前选项（保留第一个提示选项）
        selectElement.find('option:not(:first)').remove();

        // 解析原始选项
        var tempDiv = $('<div>' + originalOptions + '</div>');
        var hasBlankOption = false; // 标记是否已添加空选项
        tempDiv.find('option').each(function() {
            var option = $(this);
            var value = option.val();
            // 只有当选项值为空（请选择）或未被其他下拉框选中时才添加
            // currentValue（当前下拉框已选中的值）总是会被保留，如果它不在其他下拉框中
            if (value === "" && !hasBlankOption) {
                // 只添加一次空选项
                selectElement.append(option.clone());
                hasBlankOption = true;
            } else if (value !== "" && (!selectedIds.has(value) || value === currentValue || value === "-1")) {
                // 添加非空选项，如果它未被其他下拉框选中，或者是当前下拉框已选中的值，或者userId为-1（其他）
                selectElement.append(option.clone());
            }
        });

        // 重新设置选中状态，确保选中的值仍然被选中
        if (isCurrentlySelected) {
            selectElement.val(isCurrentlySelected);
        }
    }

    // 更新动态添加的成员下拉框
    function updateDynamicMemberList(element) {
        var selectElement = $(element);
        var currentValue = selectElement.val();
        var allSelectedIds = getSelectedIds();

        // 为动态成员下拉框更新选项
        updateDynamicSelectOptions(selectElement, currentValue, allSelectedIds);
    }

    // 获取所有已选中的ID（包括固定成员和动态成员）
    function getSelectedIds() {
        var selectedIds = new Set();

        // 添加固定成员的选中值
        var secondValue = $('#secondPersonId').val();
        var thirdValue = $('#thirdPersonId').val();
        var fourthValue = $('#fourthPersonId').val();

        if (secondValue) selectedIds.add(secondValue);
        if (thirdValue) selectedIds.add(thirdValue);
        if (fourthValue) selectedIds.add(fourthValue);

        // 添加动态成员的选中值
        $('.member-select').each(function() {
            var value = $(this).val();
            if (value) {
                selectedIds.add(value);
            }
        });
        return selectedIds;
    }

    // 更新动态下拉框的选项
    function updateDynamicSelectOptions(selectElement, currentValue, selectedIds) {
        var originalOptions = $('#secondPersonId').data('original-options');
        var isCurrentlySelected = selectElement.val(); // 保存当前选中的值

        // 清空当前选项（保留第一个提示选项）
        selectElement.find('option:not(:first)').remove();
        
        // 解析原始选项
        var tempDiv = $('<div>' + originalOptions + '</div>');
        var hasBlankOption = false; // 标记是否已添加空选项
        tempDiv.find('option').each(function() {
            var option = $(this);
            var value = option.val();
            // 只有当选项值为空（请选择）或未被其他下拉框选中时才添加
            // currentValue（当前下拉框已选中的值）总是会被保留，如果它不在其他下拉框中
            if (value === "" && !hasBlankOption) {
                // 只添加一次空选项
                selectElement.append(option.clone());
                hasBlankOption = true;
            } else if (value !== "" && (!selectedIds.has(value) || value === currentValue || value === "-1")) {
                // 添加非空选项，如果它未被其他下拉框选中，或者是当前下拉框已选中的值，或者userId为-1（其他）
                selectElement.append(option.clone());
            }
        });

        // 重新设置选中状态，确保选中的值仍然被选中
        if (isCurrentlySelected) {
            selectElement.val(isCurrentSelected);
        }
    }

    // 成员下拉框联动功能
    // 页面加载完成后保存原始选项并初始化联动
    $(document).ready(function() {
        // 保存原始选项数据
        $('#secondPersonId, #thirdPersonId, #fourthPersonId').each(function() {
            var originalOptions = $(this).html();
            $(this).data('original-options', originalOptions);
        });

        // 初始化联动效果
        updateMemberLists();

        // 初始化Select2组件以支持搜索功能
        $('#secondPersonId, #thirdPersonId, #fourthPersonId').select2({
            placeholder: '其他',
            allowClear: true,
            width: '100%'
        });
    });

</script>
