<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
  <th:block th:include="include :: header('修改成果转化')" />
  <th:block th:include="include :: datetimepicker-css" />
  <th:block th:include="include :: bootstrap-fileinput-css"/>
  <th:block th:include="include :: select2-css" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
  <form class="form-horizontal m" id="form-apply-edit" th:object="${sciIntraSchoolPro}">

    <input name="id" id="ktid" th:field="*{id}" type="hidden">

    <h4 class="form-header h4">基本信息</h4>
    <div class="row">
      <div class="col-xs-6">
        <div class="form-group">
          <label class="col-sm-4 control-label is-required">申请人：</label>
          <div class="col-sm-8">
            <!--                        <input name="userId" th:field="*{userId}" class="form-control" type="text" required>-->
            <select name="userId" class="form-control m-b" >
              <option th:each="user : ${sysUsers1}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${ user.userId == sciIntraSchoolPro.userId}"></option>
            </select>
          </div>
        </div>
      </div>

      <div class="col-xs-6">
        <div class="form-group">
          <label class="col-sm-4 control-label is-required">课题类型：</label>
          <div class="col-sm-8">
            <select name="topType" class="form-control" th:with="type=${@dict.getType('sci_top_type')}" required>
              <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{topType}"></option>
            </select>
          </div>
        </div>
      </div>
      <div class="col-xs-6">
        <div class="form-group">
          <label class="col-sm-4 control-label is-required">课题名称：</label>
          <div class="col-sm-8">
            <input name="topName" th:field="*{topName}" class="form-control" type="text" required>
          </div>
        </div>
      </div>
      <div class="col-xs-6">
        <div class="form-group">
          <label class="col-sm-4 control-label is-required">项目金额：</label>
          <div class="col-sm-8">
            <input name="amount" th:field="*{amount}" class="form-control" type="text" required>
          </div>
        </div>
      </div>





      <div class="col-xs-6">
        <div class="form-group">
          <label class="col-sm-4 control-label is-required">申请日期：</label>
          <div class="col-sm-8">
            <div class="input-group date">
              <input name="signingData" autocomplete="off" th:field="*{signingData}" th:value="${#dates.format(signingData, 'yyyy-MM-dd')}" class="form-control" placeholder="yyyy-MM-dd" type="text" required>
              <span class="input-group-addon" style="background-color: #f5f5f5; border-color: #ddd;"><i class="fa fa-calendar"></i></span>
            </div>
          </div>
        </div>
      </div>
      <div class="col-xs-6">
        <div class="form-group">
          <label class="col-sm-4 control-label is-required">结束日期：</label>
          <div class="col-sm-8">
            <div class="input-group date">
              <input  autocomplete="off" name="validityDate" th:field="*{validityDate}" th:value="${#dates.format(validityDate, 'yyyy-MM-dd - yyyy-MM-dd')}" class="form-control" id="laydate-demo-4" placeholder="yyyy-MM-dd - yyyy-MM-dd" type="text" required>
              <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
            </div>
          </div>
        </div>
      </div>
      <div class="col-xs-6">
        <div class="form-group">
          <label class="col-sm-4 control-label is-required">第一负责人：</label>
          <div class="col-sm-8">
            <!--                        <input name="firstPersonId" th:field="*{firstPersonId}" class="form-control" type="text" required>-->
            <select name="firstPersonId" class="form-control m-b" >
              <option th:each="user : ${sysUsers1}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${ #strings.toString(user.userId) == sciIntraSchoolPro.firstPersonId}"></option>
            </select>
          </div>
        </div>
      </div>

      <div class="col-xs-6">
        <div class="form-group">
          <label class="col-sm-4 control-label is-required">第二负责人：</label>
          <div class="col-sm-8">
            <!--                        <input name="secondPersonTask" th:field="*{secondPersonTask}" class="form-control" type="text" required>-->
            <select name="secondPersonId" class="form-control m-b" >
              <option th:each="user : ${sysUsers1}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${ #strings.toString(user.userId) == sciIntraSchoolPro.secondPersonId}" ></option>
            </select>
          </div>
        </div>
      </div>

      <div class="col-xs-6">
        <div class="form-group">
          <label class="col-sm-4 control-label is-required">第三负责人：</label>
          <div class="col-sm-8">
            <!--                        <input name="thirdPersonId" th:field="*{thirdPersonId}" class="form-control" type="text" required>-->
            <select name="thirdPersonId" class="form-control m-b" >
              <option th:each="user : ${sysUsers1}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${ #strings.toString(user.userId) == sciIntraSchoolPro.thirdPersonId}"  ></option>
            </select>
          </div>
        </div>
      </div>

      <div class="col-xs-6">
        <div class="form-group">
          <label class="col-sm-4 control-label is-required">第四负责人：</label>
          <div class="col-sm-8">
            <!--                        <input name="fourthPersonId" th:field="*{fourthPersonId}" class="form-control" type="text" required>-->
            <select name="fourthPersonId" class="form-control m-b" >
              <option th:each="user : ${sysUsers1}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${ #strings.toString(user.userId) == sciIntraSchoolPro.fourthPersonId}"  ></option>
            </select>
          </div>
        </div>
      </div>


      <div class="col-xs-6">
        <div class="form-group">
          <label class="col-sm-4 control-label is-required">转化合同：</label>
          <div class="col-sm-8">
            <input type="hidden" name="contract" th:field="*{contract}">
            <div class="file-loading">
              <input class="form-control file-upload1" id="contract" name="file" type="file">
            </div>
          </div>
        </div>
      </div>
      <div class="col-xs-6">
        <div class="form-group">
          <label class="col-sm-4 control-label is-required">成果登记表：</label>
          <div class="col-sm-8">
            <input type="hidden" name="filing" th:field="*{filing}">
            <div class="file-loading">
              <input class="form-control file-upload2" id="filing" name="file" type="file">
            </div>
          </div>
        </div>
      </div>

      <div class="col-xs-6">
        <div class="form-group">
          <label class="col-sm-4 control-label is-required">成果扫描件：</label>
          <div class="col-sm-8">
            <input type="hidden" name="overContract" th:field="*{overContract}">
            <div class="file-loading">
              <input class="form-control file-upload3" id="overContract" name="file" type="file">
            </div>
          </div>
        </div>
      </div>
    </div>

    <h4 class="form-header h4">批阅记录</h4>
    <div class="row">
      <div class="col-sm-12">
        <div class="form-group">
          <table id="bootstrap-table"></table>
        </div>
      </div>
    </div>
  </form>
</div>
<div class="row">
  <div class="col-sm-offset-5 col-sm-10">&nbsp;
    <button type="button" class="btn btn-sm btn-danger" onclick="closeItem()"> 关 闭 </button>
  </div>
</div>
<th:block th:include="include :: footer" />
<th:block th:include="include :: datetimepicker-js" />
<th:block th:include="include :: bootstrap-fileinput-js"/>
<th:block th:include="include :: select2-js" />
<script type="text/javascript">
  $(function(){
    <!-- laydate示例 -->
    layui.use('laydate', function(){
      var laydate = layui.laydate;
      laydate.render({
        elem: '#laydate-demo-4',
        range: true
      });
      var startDate = laydate.render({
        elem: '#laydate-startTime',
        max: $('#laydate-endTime').val(),
        theme: 'molv',
        trigger: 'click',
        done: function(value, date) {
          // 结束时间大于开始时间
          if (value !== '') {
            endDate.config.min.year = date.year;
            endDate.config.min.month = date.month - 1;
            endDate.config.min.date = date.date;
          } else {
            endDate.config.min.year = '';
            endDate.config.min.month = '';
            endDate.config.min.date = '';
          }
        }
      });
      var endDate = laydate.render({
        elem: '#laydate-endTime',
        min: $('#laydate-startTime').val(),
        theme: 'molv',
        trigger: 'click',
        done: function(value, date) {
          // 开始时间小于结束时间
          if (value !== '') {
            startDate.config.max.year = date.year;
            startDate.config.max.month = date.month - 1;
            startDate.config.max.date = date.date;
          } else {
            startDate.config.max.year = '';
            startDate.config.max.month = '';
            startDate.config.max.date = '';
          }
        }
      });
    });

    var kid = $("#ktid").val();
    var options = {
      url: prefix + "/bhyy/"+kid,
      showSearch: false,
      showRefresh: false,
      showToggle: false,
      showColumns: false,
      pagination:false,

      columns: [

        {
          field : 'createTime',
          title : '批阅时间',
          width: 200

        } ,
        {
          field : 'uname',
          title : '批阅人',
          width: 100
        },
        {
          field : 'concate',
          title : '内容',
          width: 500
        },
        {
          field : 'state',
          title : '审核状态',
          width: 100
        }
        //
        // {
        //     field: 'status',
        //     title: '批阅状态',
        //     align: 'center',
        //     formatter: function(value, row, index) {
        //         return $.table.selectDictLabel(datas, value);
        //     }
        // }
      ]
    };
    $.table.init(options);
  });
</script>
<script th:inline="javascript">
  var prefix = ctx + "system/apply";
  $("#form-apply-edit").validate({
    focusCleanup: true
  });



  $("input[name='signingData']").datetimepicker({
    format: "yyyy-mm-dd",
    minView: "month",
    autoclose: true
  });



  // 第一个文件上传控件 - 转化合同
  $(".file-upload1").each(function (i) {
    var val = $("input[name='" + this.id + "']").val()
    $(this).fileinput({
      'uploadUrl': ctx + 'common/upload/cgzh',
      initialPreviewAsData: true,
      initialPreview: [val],
      maxFileCount: 1,
      maxFileSize: 51200,
      autoReplace: true,
      showUpload: false,  // 隐藏上传按钮
      allowedFileExtensions: ["pdf"],  //指定上传文件类型
      slugCallback: function (filename) {
        if ($("input[name='topName']").val() === "") {
          $(this).fileinput('clear');
          $.modal.alertError("请先输入课题名称");
          return false;
        }
        // 自定义文件名生成规则
        fileExtension = filename.split('.').pop();
        const year = new Date().getFullYear();
        const newName = year + "-" + $("input[name='topName']").val() + "-" + "合同" + "." + fileExtension;
        return newName;
      },
    }).on('fileuploaded', function (event, data, previewId, index) {
      $("input[name='" + event.currentTarget.id + "']").val(data.response.url)
    }).on('fileremoved', function (event, id, index) {
      $("input[name='" + event.currentTarget.id + "']").val('')
    }).on('filebatchselected', function(event) {
      // 批量选择文件后立即上传
      $(this).fileinput('upload');
    }).on('fileselected', function(event) {
      // 单个文件选择后立即上传
      $(this).fileinput('upload');
    })
    $(this).fileinput('_initFileActions');
  });

  // 第二个文件上传控件 - 成果登记表

        return newName;
      },
    }).on('fileuploaded', function (event, data, previewId, index) {
      $("input[name='" + event.currentTarget.id + "']").val(data.response.url)
    }).on('fileremoved', function (event, id, index) {
      $("input[name='" + event.currentTarget.id + "']").val('')
    }).on('filebatchselected', function(event) {
      // 批量选择文件后立即上传
      $(this).fileinput('upload');
    }).on('fileselected', function(event) {
      // 单个文件选择后立即上传
      $(this).fileinput('upload');
    })
    $(this).fileinput('_initFileActions');
  });

  // 第三个文件上传控件 - 成果扫描件
  $(".file-upload3").each(function (i) {
    var val = $("input[name='" + this.id + "']").val()
    $(this).fileinput({
      'uploadUrl': ctx + 'common/upload/cgzh',

      initialPreview: [val],

      allowedFileExtensions: ["pdf"],  //指定上传文件类型
      slugCallback: function (filename) {
        if ($("input[name='topName']").val() === "") {
          $(this).fileinput('clear');

          return false;
        }
        // 自定义文件名生成规则
        fileExtension = filename.split('.').pop();
        const year = new Date().getFullYear();
        const newName = year + "-" + $("input[name='topName']").val() + "-" + "成果扫描件" + "." + fileExtension;
        return newName;
      },
    }).on('fileuploaded', function (event, data, previewId, index) {
      $("input[name='" + event.currentTarget.id + "']").val(data.response.url)
    }).on('fileremoved', function (event, id, index) {

    }).on('filebatchselected', function(event) {

    }).on('fileselected', function(event) {
      // 单个文件选择后立即上传

    })
    $(this).fileinput('_initFileActions');
  });
</script>
</body>
</html>
