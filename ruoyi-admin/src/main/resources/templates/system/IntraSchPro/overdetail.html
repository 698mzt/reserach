    function displayFileName(inputId, fileNameId) {
        const input = document.getElementById(inputId);
        const fileNameSpan = document.getElementById(fileNameId);
        if (input && input.value) {
            let fileName = input.value;
            // 如果是MinIO路径，需要特殊处理
            if (fileName.startsWith('/minio/')) {
                // 从路径中提取文件名部分
                fileName = fileName.substring(fileName.lastIndexOf('/') + 1);
            } else {
                fileName = fileName.split('/').pop(); // 获取文件名
            }
            
            // 处理文件名中的下划线部分（如 _4）
            const parts = fileName.split('_'); 
            if (parts.length > 1) {
                // 检查最后一部分是否是数字（如序列号）
                const lastPart = parts[parts.length - 1];
                const extIndex = lastPart.lastIndexOf('.');
                let nameWithoutExt = lastPart;
                let extension = '';
                if (extIndex !== -1) {
                    nameWithoutExt = lastPart.substring(0, extIndex);
                    extension = lastPart.substring(extIndex);
                }
                
                // 如果下划线后的部分是数字，则认为是序列号，移除它
                if (/^\d+$/.test(nameWithoutExt)) {
                    // 移除最后的数字部分
                    fileName = parts.slice(0, -1).join('_') + extension;
                } else {
                    // 保留原始文件名
                    fileName = parts.join('_');
                }
            }
            
            // 最终确保扩展名保留
            if (!fileName.includes('.') && input.value.includes('.')) {
                const originalExt = input.value.substring(input.value.lastIndexOf('.'));
                fileName += originalExt;
            }
            
            fileNameSpan.textContent = fileName;
            console.log(`Displaying file name for ${inputId}: ${fileName}`);
        } else {
            fileNameSpan.textContent = '（无文件）';
            console.log(`No file for ${inputId}`);
        }
    }

    function chakan() {
        var relativePath = $("#contract").val();
        if (!relativePath) {
            alert("没有可预览的文件！");
            return;
        }
        
        // 检查是否为MinIO文件（路径以/minio/开头）
        if (relativePath.startsWith('/minio/')) {
            // 对于MinIO文件，使用新的预览接口
            var contextPath = '/' + window.location.pathname.split('/')[1];
            var previewUrl = window.location.origin + contextPath + '/common/preview?fileName=' + encodeURIComponent(relativePath);
            window.open(previewUrl, '_blank');
        } else {
            // 对于本地文件，按原方式处理
            var contextPath = '/' + window.location.pathname.split('/')[1];
            var fullPath = window.location.origin + contextPath + relativePath;
            window.open(fullPath, '_blank');
        }
    }

    function filing_view() {
        var relativePath = $("#filing").val();

        // 检查是否为MinIO文件（路径以/minio/开头）
        if (relativePath.startsWith('/minio/')) {

            var contextPath = '/' + window.location.pathname.split('/')[1];
            var previewUrl = window.location.origin + contextPath + '/common/preview?fileName=' + encodeURIComponent(relativePath);
            window.open(previewUrl, '_blank');
        } else {

            var contextPath = '/' + window.location.pathname.split('/')[1];

    }
    
    function previewFile(type) {
        var relativePath = $("#" + type).val();
        console.log("Preview file type: " + type + ", path: " + relativePath);
        if (!relativePath) {
            alert("没有可预览的文件！");
            return;
        }
        
        // 检查是否为MinIO文件（路径以/minio/开头）
        if (relativePath.startsWith('/minio/')) {
            // 对于MinIO文件，使用新的预览接口
            var contextPath = '/' + window.location.pathname.split('/')[1];
            var previewUrl = window.location.origin + contextPath + '/common/preview?fileName=' + encodeURIComponent(relativePath);
            console.log("Preview URL: " + previewUrl);
            window.open(previewUrl, '_blank');
        } else {
            // 对于本地文件，按原方式处理
            var contextPath = '/' + window.location.pathname.split('/')[1];
            var fullPath = window.location.origin + contextPath + relativePath;
            console.log("Local file path: " + fullPath);
            window.open(fullPath, '_blank');
        }
    }

    function downloadFile(type){
        var relativePath = $("#" + type).val();
        console.log("Download file type: " + type + ", path: " + relativePath);
        if (!relativePath) {
            alert("没有可下载的文件！");
            return;
        }
        
        var downloadUrl;
        // 检查是否为MinIO文件（路径以/minio/开头）
        if (relativePath.startsWith('/minio/')) {
            // 对于MinIO文件，使用通用下载接口
            var contextPath = '/' + window.location.pathname.split('/')[1];
            downloadUrl = window.location.origin + contextPath + '/common/download?fileName=' + encodeURIComponent(relativePath);
        } else {
            // 对于本地文件，按原方式处理
            var contextPath = '/' + window.location.pathname.split('/')[1];
            downloadUrl = window.location.origin + contextPath + relativePath;
        }
        
        console.log("Download URL: " + downloadUrl);
        if(downloadUrl){
            var a = document.createElement("a");
            a.href=downloadUrl;
            a.download="";
            a.style.display = "none";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }else{
            alert("网址无效");
        }
    }

        console.log('Filing value:', $('#filing').val());
        console.log('OverContract value:', $('#overContract').val());
        console.log('OverContract hidden value:', $('#overContractHidden').val());
        
        // 初始加载
        refreshFileDisplay();
        
        // 再次尝试加载，确保数据已填充
        setTimeout(refreshFileDisplay, 300);
        setTimeout(refreshFileDisplay, 600);
        
        // 更长时间后再次尝试，确保数据完全加载
        setTimeout(refreshFileDisplay, 1000);
    });
    
    // 额外确保文件名显示
    $(window).on('load', function() {
        console.log('Window load, refreshing file display...');
        setTimeout(refreshFileDisplay, 100);
    });
    
    // 确保Thymeleaf数据已加载后再执行
    setTimeout(function() {
        console.log('Final attempt to refresh file display...');
        refreshFileDisplay();
    }, 1500);
</script>
</body>
</html>
