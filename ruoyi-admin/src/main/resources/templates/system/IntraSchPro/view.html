<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org"
      xmlns:shiro="https://github.com/theborakompanioni/thymeleaf-extras-shiro">
<head>
    <th:block th:include="include :: header('成果转化列表')"/>
</head>
<style>
    .track-rcol {
        width: 100%;
        max-width: 500px;
        margin: 20px auto;
        max-height: 400px;
        overflow-y: auto;
    }

    .btn-group-sm > .btn, .btn-sm {
        padding: 9px 10px;
        font-size: 12px;
        line-height: 1.5;
        border-radius: 3px;
    }

    .link-button {
        background: none;
        border: none;
        color: #2c99ff;
        cursor: pointer;
        font-size: inherit;
    }

    .del-link-button {
        background: none;
        border: none;
        color: #ff0000;
        cursor: pointer;
        font-size: inherit;
    }

    .action-item {
        display: inline-block;
        margin-right: 10px;
        margin-bottom: 4px;
    }

    .modal-right {
        position: fixed;
        right: 0;
        margin: 0;
        height: 100%;
        display: flex;
        align-items: stretch;
    }

    .modal-right .modal-content {
        height: 100%;
        width: 70%;
        margin-left: auto;
    }

    .modal-right .but {
        position: absolute;
        right: 2%;
        bottom: 1.3%;
        background: red;
        color: white;
        border: none;
        border-radius: 4px;
    }

    .progress_inner {
        height: 80px;
        width: 100%;
        position: relative;
    }

    .progress_inner__step {
        width: 33.33%;
        font-size: 12px;
        padding: 0 5px;
        transition: all 0.4s;
        float: left;
        text-align: center;
        position: relative;
    }

    .progress_inner__step label {
        padding-top: 30px;
        display: block;
        position: relative;
        cursor: pointer;
    }

    .progress_inner__step:before {
        content: "1";
        width: 24px;
        height: 24px;
        color: #2196F3;
        background: white;
        line-height: 22px;
        border: 2px solid #2196F3;
        font-size: 12px;
        top: 0;
        border-radius: 50%;
        transition: all 0.4s;
        position: absolute;
        left: 0;
        right: 0;
        margin: auto;
        font-weight: bold;
        z-index: 11;
    }

    .progress_inner__step:nth-of-type(2):before {
        content: "2";
        color: #9E9E9E;
        border-color: #9E9E9E;
    }

    .progress_inner__step:nth-of-type(3):before {
        content: "3";
        color: #9E9E9E;
        border-color: #9E9E9E;
    }

    .progress_inner__step.completed:before {
        content: "✓";
        color: #4CAF50;
        border-color: #4CAF50;
        line-height: 22px;
        font-size: 14px;
    }

    .progress_inner__step.active:before {
        color: #2196F3;
        border-color: #2196F3;
        background: white;
    }

    .progress_inner__step.pending:before {
        color: #9E9E9E;
        border-color: #9E9E9E;
        background: white;
    }

    .progress_inner__bar {
        height: 3px;
        left: 16.665%;
        right: 16.665%;
        background: #E0E0E0;
        position: absolute;
        top: 12px;
        z-index: -1;
        border-radius: 3px;
        overflow: hidden;
    }

    .progress_inner__bar--progress {
        height: 100%;
        background: #4CAF50;
        width: 0;
        transition: width 0.6s ease;
    }

    .status-text {
        color: #9E9E9E;
        font-weight: normal;
        transition: all 0.4s;
        font-size: 12px;
    }

    .status-text.active {
        color: #2196F3;
        font-weight: bold;
    }

    .status-text.completed {
        color: #4CAF50;
        font-weight: bold;
    }

    button {
        background: #2196F3;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 3px;
        margin: 0 8px;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.3s;
        font-size: 12px;
    }

    button:hover {
        background: #1976D2;
    }

    button:last-child {
        background: #9E9E9E;
    }

    button:last-child:hover {
        background: #757575;
    }

    .timeline-title {
        font-weight: bold;
        font-size: 14px;
        color: #333;
        text-align: left;
        margin: 0 0 25px 20px;
        max-width: 500px;
        margin-left: auto;
        margin-right: auto;
        position: relative;
        padding-bottom: 15px;
    }

    .timeline-title::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 0.5px;
        background: linear-gradient(to right,
        rgba(224, 224, 224, 0.8),
        rgba(224, 224, 224, 0.8),
        rgba(224, 224, 224, 0.8));
        box-shadow: 0 0.5px 1px rgba(0, 0, 0, 0.07);
    }

    .track-list {
        margin: 20px;
        max-width: 380px;
        min-height: 150px;
        padding: 18px 26px;
        background: #fff;
        border: 1px solid #e5e6e7;
        border-radius: 4px;
        padding-left: 26px;
        position: relative;
    }

    .track-list ul {
        padding-left: 0;
    }

    .track-list li {
        position: relative;
        padding: 5px 0 10px 25px;
        line-height: 1.4;
        border-left: 2px solid #d9d9d9;
        color: #666;
        list-style: none;
        transition: all 0.4s ease;
    }

    .track-list li.first {
        color: #666;
        padding-top: 0;
    }

    .track-list li .node-icon {
        position: absolute;
        left: -6px;
        top: 18px;
        width: 8px;
        height: 8px;
        background: #C0C0C0;
        border-radius: 50%;
        transition: all 0.4s ease;
        border: 2px solid #E0E0E0;
        box-sizing: content-box;
    }

    .track-list li.first .node-icon {
        background: #C0C0C0;
        width: 8px;
        height: 8px;
        left: -8px;
    }

    .track-list li .time {
        display: block;
        margin-bottom: 3px;
        font-size: 11px;
        color: #888;
        transition: all 0.4s ease;
    }

    .track-list li .txt {
        display: block;
        font-size: 12px;
        transition: all 0.4s ease;
    }

    .track-list li:hover {
        color: #333;
    }

    .track-list li:hover .node-icon {
        transform: scale(1.3);
        background: #ed8088;
    }

    .track-list li:hover .time {
        color: #666;
    }
</style>
<body class="gray-bg">

        <div class="container-div">
            <div class="row">
                <div class="col-sm-12 search-collapse">

                                <li th:if="${@permission.isAnyRoles('sci_tesearch,dept_teacher,admin')}">
                                    <label>专业：</label>
                                    <input type="text" name="dname" placeholder="请输入专业名称"/>

                                <li th:if="${@permission.isAnyRoles('sci_tesearch,dept_teacher,research,admin')}">
                                    <label>主持人：</label>
                                    <input type="text" name="userName" placeholder="请输入主持人姓名"/>

                                    <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset('formId', 'bootstrap-table')">

                    </div>
                </div>
                <div class="col-sm-12 select-table table-striped">
                    <table id="bootstrap-table"></table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="wrapper wrapper-content fadeInRight" style="position: absolute; left: -9999px;">
    <div class="row">

<th:block th:include="include :: footer"/>
<script th:src="@{/ruoyi/js/page-render.js}"></script>
<script th:inline="javascript">
    var datas = [[${@dict.getType('sys_intraschpro_tasks')}]];
    var prefix = ctx + "IntraSchPro";
    var currentRole = [[${roleStr}]];

    function getUrl() {
        var year = localStorage.getItem("year");
        return prefix + "/list?year=" + year;
    }

    function normalizeState(state) {
        return state == null ? "" : String(state);
    }

    function normalizeTecTraStatusCode(state) {
        var normalizedState = normalizeState(state);
        switch (normalizedState) {
            case "15":
                return "TEC_TRA_DRAFT";
            case "1":
            case "11":
                return "TEC_TRA_JYS_AUDIT";
            case "2":
                return "TEC_TRA_KYC_AUDIT";
            case "4":
            case "6":
                return "TEC_TRA_PASSED";
            case "3":
            case "5":
            case "12":
                return "TEC_TRA_REJECTED";
            default:
                return normalizedState;
        }
    }

    function getStageKey(state) {
        var normalizedState = normalizeState(state);
        if (["4", "6", "TEC_TRA_PASSED"].includes(normalizedState)) {
            return "completed";
        }
        if (["1", "2", "3", "4", "5", "11", "12", "15", "TEC_TRA_DRAFT", "TEC_TRA_JYS_AUDIT", "TEC_TRA_KYC_AUDIT", "TEC_TRA_REJECTED"].includes(normalizedState)) {
            return "approval";
        }
        if (["7", "8", "9", "10", "13", "14", "16"].includes(normalizedState)) {
            return "closure";
        }
        return "";
    }

    function getStageLabel(state) {
        var stage = getStageKey(state);
        if (stage === "completed") {
            return "已完结";
        }
        if (stage === "approval") {
            return "成果转化审批";
        }
        if (stage === "closure") {
            return "结项申请";
        }
        return "";
    }

    function getStateLabel(value) {
        var label = $.table.selectDictLabel(datas, value);
        return label || value || "";
    }

    function isDeptMatched(row) {
        return String(row.deptNamekey) === "1";
    }

    function getResponsibilityTier(row) {
        if (row.firstPersonId == row.uid) {
            return "第一负责人";
        }
        if (row.secondPersonId == row.uid) {
            return "第二负责人";
        }
        if (row.thirdPersonId == row.uid) {
            return "第三负责人";
        }
        if (row.fourthPersonId == row.uid) {
            return "第四负责人";
        }
        return "不是负责人";
    }

    function getScore(row) {
        if (row.firstPersonId == row.uid) {
            return row.firstPoints || 0;
        }
        if (row.secondPersonId == row.uid) {
            return row.secondPoints || 0;
        }
        if (row.thirdPersonId == row.uid) {
            return row.thirdPoints || 0;
        }
        if (row.fourthPersonId == row.uid) {
            return row.forthPoints || 0;
        }
        return 0;
    }

    function openStagePage(id, state, urlFlag, title) {
        $.modal.openTab(title || "查看成果转化", prefix + "/detail/" + id + "/" + urlFlag);
    }

    function actionButton(text, colorType, onclick, extraAttr) {
        var attr = extraAttr ? " " + extraAttr : "";
        return '<a href="javascript:void(0)" class="btn btn-xs btn-' + colorType + '"' + attr + ' onclick="' + onclick + '">' + text + '</a>';
    }

    function rejectedEditButton(id) {
        return actionButton("编辑", "success", "$.operate.editTab('" + id + "')",
            'style="background-color:#1ab394!important;border-color:#1ab394!important;color:#fff!important;"');
    }

    function reviewButton(row, state, urlFlag, title) {
        return actionButton("批阅", "primary", "openStagePage(" + row.id + ", '" + state + "', '" + urlFlag + "', '" + (title || "详细成果转化") + "')");
    }

    function canShowRecallButton(row, state) {
        var role = currentRole || row.role || "";
        if (role === "admin") {
            return true;
        }
        if (role === "sci_tesearch") {
            return ["4", "6", "TEC_TRA_PASSED"].includes(state);
        }
        return false;
    }

    function getStateColorType(state) {
        var normalizedState = normalizeState(state);
        if (["6", "4", "TEC_TRA_PASSED"].includes(normalizedState)) {
            return "success";
        }
        if (["1", "2", "11", "7", "8", "13", "TEC_TRA_JYS_AUDIT", "TEC_TRA_KYC_AUDIT"].includes(normalizedState)) {
            return "info";
        }
        if (["3", "5", "12", "9", "10", "14", "TEC_TRA_REJECTED"].includes(normalizedState)) {
            return "warning";
        }
        if (["15", "16", "TEC_TRA_DRAFT"].includes(normalizedState)) {
            return "warning";
        }
        return "default";
    }

    function getTecTraStateLabel(state) {
        var normalizedState = normalizeState(state);
        switch (normalizedState) {
            case "15":
            case "TEC_TRA_DRAFT":
                return "成果转化-草稿";
            case "1":
            case "11":
            case "TEC_TRA_JYS_AUDIT":
                return "成果转化-教研室审批";
            case "2":
            case "TEC_TRA_KYC_AUDIT":
                return "成果转化-科研处审批";
            case "4":
            case "6":
            case "TEC_TRA_PASSED":
                return "成果转化-通过";
            case "3":
            case "5":
            case "12":
            case "TEC_TRA_REJECTED":
                return "成果转化-驳回";
            default:
                return "";
        }
    }

    function renderApprovalStage(row) {
        var stageText = getTecTraStateLabel(row.approvalStage)
            || getTecTraStateLabel(row.stateDes)
            || getTecTraStateLabel(row.state)
            || row.approvalStage
            || row.stateDes
            || getStateLabel(row.state);
        return PageRender.renderStatusToString({
            statusCode: normalizeTecTraStatusCode(row.state),
            statusText: stageText,
            colorType: getStateColorType(row.state)
        });
    }

    function buildApprovalActions(row, actions) {
        var state = normalizeState(row.state);

        if (["15", "TEC_TRA_DRAFT"].includes(state)) {
            actions.push(actionButton("提交", "primary", "subDraft('" + row.id + "')"));
            actions.push(actionButton("编辑", "success", "$.operate.editTab('" + row.id + "')"));
            actions.push(actionButton("删除", "danger", "$.operate.remove('" + row.id + "')"));
        }

        if (row.role === "research") {
            if (["1", "TEC_TRA_JYS_AUDIT"].includes(state)) {
                actions.push(reviewButton(row, state, "pro"));
            } else if (row.userId == row.uid && ["3", "12", "5", "TEC_TRA_REJECTED"].includes(state)) {
                actions.push(rejectedEditButton(row.id));
            }
        } else if (row.role === "dept_teacher") {
            if (["11", "TEC_TRA_KYC_AUDIT"].includes(state) && false && isDeptMatched(row)) {
                actions.push(reviewButton(row, state, "dept_teacher"));
            } else if (row.userId == row.uid && ["9", "10", "14"].includes(state)) {
                actions.push(actionButton("编辑", "success", "$.operate.editTab('" + row.id + "')"));
            }
        } else if (row.role === "sci_tesearch") {
            if (["2", "TEC_TRA_KYC_AUDIT"].includes(state)) {
                actions.push(reviewButton(row, state, "hecha"));
            } else if (row.userId == row.uid && ["3", "12", "5", "TEC_TRA_REJECTED"].includes(state)) {
                actions.push(rejectedEditButton(row.id));
            }
        } else if (row.role === "teacher") {
            if (row.userId == row.uid) {
                if (["3", "12", "5", "TEC_TRA_REJECTED"].includes(state)) {
                    actions.push(rejectedEditButton(row.id));
                }
            }
        }
    }

    function buildClosureActions(row, actions) {
        var state = normalizeState(row.state);

        if (row.role === "research") {
            if (isDeptMatched(row)) {
                if (state === "7") {
                    actions.push(reviewButton(row, state, "JYSOVER"));
                }
            }
            if (row.userId == row.uid) {
                if (["9", "10", "14"].includes(state)) {
                    actions.push(actionButton("编辑", "success", "$.operate.editTab('" + row.id + "')"));
                } else if (state === "16") {
                    actions.push(actionButton("提交", "primary", "subDraft('" + row.id + "')"));
                    actions.push(actionButton("编辑", "success", "$.operate.editTab('" + row.id + "')"));
                }
            }
        } else if (row.role === "dept_teacher") {
            if (isDeptMatched(row)) {
                if (state === "13") {
                    actions.push(reviewButton(row, state, "dept_teacher"));
                } else if (row.userId == row.uid && ["9", "10", "14"].includes(state)) {
                    actions.push(actionButton("编辑", "success", "$.operate.editTab('" + row.id + "')"));
                }
            }
        } else if (row.role === "sci_tesearch") {
            if (state === "8") {
                actions.push(reviewButton(row, state, "KYCOVER"));
            } else if (row.userId == row.uid && ["9", "10", "14"].includes(state)) {
                actions.push(actionButton("编辑", "success", "$.operate.editTab('" + row.id + "')"));
            }
        } else if (row.role === "teacher") {
            if (row.userId == row.uid) {
                if (state === "16") {
                    actions.push(actionButton("提交", "primary", "subDraft('" + row.id + "')"));
                    actions.push(actionButton("编辑", "success", "$.operate.editTab('" + row.id + "')"));
                } else if (["9", "10", "14"].includes(state)) {
                    actions.push(actionButton("编辑", "success", "$.operate.editTab('" + row.id + "')"));
                }
            }
        }
    }

    function arrangeButtons(actions) {
        var result = '';
        for (var i = 0; i < actions.length; i++) {
            if (i > 0 && i % 3 === 0) {
                result += '<br>';
            }
            result += '<span class="action-item">' + actions[i] + '</span>';
        }
        return result;
    }

    function arrangeOperationButtons(actions, viewActions) {
        var result = arrangeButtons(actions);
        if (viewActions.length > 0) {
            if (result) {
                result += '<br>';
            }
            result += arrangeButtons(viewActions);
        }
        return result;
    }

    function getOperationButtons(row) {
        var actions = [];
        var viewActions = [];
        var stage = getStageKey(row.state);
        var state = normalizeState(row.state);
        var role = currentRole || row.role || "";

        if (role === "dept_teacher") {
            viewActions.push(actionButton("查看", "info", "openStagePage(" + row.id + ", '" + state + "', 'chakan', '查看成果转化')"));
            viewActions.push(actionButton("查看流程", "info", "openReviewModal(" + row.id + ", '" + state + "')"));
            return arrangeOperationButtons(actions, viewActions);
        }

        if (stage === "approval") {
            buildApprovalActions(row, actions);
        } else if (stage === "closure") {
            buildClosureActions(row, actions);
        }

        if (["3", "5", "12", "TEC_TRA_REJECTED"].includes(state)
            && row.userId == row.uid
            && actions.join("").indexOf("$.operate.editTab") === -1) {
            actions.unshift(rejectedEditButton(row.id));
        }

        if (canShowRecallButton(row, state)) {
            actions.push(actionButton("撤回", "warning", "recallTecTra('" + row.id + "', '" + state + "')"));
        }
        viewActions.push(actionButton("查看", "info", "openStagePage(" + row.id + ", '" + state + "', 'chakan', '查看成果转化')"));
        viewActions.push(actionButton("查看流程", "info", "openReviewModal(" + row.id + ", '" + state + "')"));

        return arrangeOperationButtons(actions, viewActions);
    }

    function rowStyle0(row, index) {
        var state = normalizeState(row.state);
        if (["6", "4", "TEC_TRA_PASSED"].includes(state)) {
            return {css: {"color": "#67c23a"}};
        }
        if (["15", "16", "TEC_TRA_DRAFT"].includes(state)) {
            return {css: {"color": "#c78045"}};
        }
        if (["1", "2", "11", "7", "8", "13", "TEC_TRA_JYS_AUDIT", "TEC_TRA_KYC_AUDIT"].includes(state)) {
            return {css: {"color": "#2c99ff"}};
        }
        if (["3", "5", "12", "9", "10", "14", "TEC_TRA_REJECTED"].includes(state)) {
            return {css: {"color": "#c78045"}};
        }
        return {};
    }

    function openReviewModal(id, state) {
        loadReviewRecords(id, state);
        $("#myModal").modal("show");
    }

    function loadReviewRecords(id, state) {
        updateProgress(state);
        $.ajax({
            url: prefix + "/bhyy/" + id,
            method: "POST",
            data: {kid: id},
            success: function (response) {
                var eventList = document.getElementById("event-list");
                eventList.innerHTML = "";
                var rows = response && response.rows ? response.rows : [];
                if (rows.length === 0) {
                    var emptyLi = document.createElement("li");
                    emptyLi.className = "first";
                    emptyLi.innerHTML = '<i class="node-icon"></i>' +
                        '<span class="time">暂无记录</span>' +
                        '<span class="txt">暂无流程记录</span>';
                    eventList.appendChild(emptyLi);
                    return;
                }
                rows.forEach(function (row, index) {
                    var li = document.createElement("li");
                    if (index === 0) {
                        li.className = "first";
                    }
                    li.innerHTML = '<i class="node-icon"></i>' +
                        '<span class="time">' + (row.createTime || "") + '</span>' +
                        '<span class="txt">' + formatReviewText(row) + '</span>';
                    eventList.appendChild(li);
                });
            },
            error: function () {
                var eventList = document.getElementById("event-list");
                eventList.innerHTML = '<li class="first"><i class="node-icon"></i>' +
                    '<span class="time">加载失败</span>' +
                    '<span class="txt">无法获取流程记录</span></li>';
            }
        });
    }

    function formatReviewText(row) {
        var action = formatReviewAction(row.state);
        var userName = row.uname || row.userName || row.createBy || "";
        return userName ? "[" + action + "] - " + userName : "[" + action + "]";
    }

    function formatReviewAction(state) {
        var text = state ? String(state) : "记录";
        if (text.indexOf("提交") > -1) {
            return "提交";
        }
        if (text.indexOf("新增") > -1) {
            return "新增";
        }
        if (text.indexOf("通过") > -1) {
            return "通过";
        }
        if (text.indexOf("驳回") > -1) {
            return "驳回";
        }
        if (text.indexOf("撤回") > -1) {
            return "撤回";
        }
        if (text.indexOf("修改") > -1) {
            return "修改";
        }
        return text.replace(/^成果转化-/, "");
    }

    function updateProgress(state) {
        var normalizedState = normalizeState(state);
        var steps = document.querySelectorAll(".progress_inner__step");
        var progressBar = document.querySelector(".progress_inner__bar--progress");
        steps.forEach(function (step) {
            step.classList.remove("active", "completed", "pending");
            step.querySelector(".status-text").classList.remove("active", "completed");
        });
        progressBar.style.width = "0";

        if (["15", "9", "16", "TEC_TRA_DRAFT", "TEC_TRA_REJECTED"].includes(normalizedState)) {
            document.getElementById("step-1").classList.add("active");
            document.getElementById("step-1").querySelector(".status-text").classList.add("active");
        } else if (["6", "4", "TEC_TRA_PASSED"].includes(normalizedState)) {
            document.getElementById("step-1").classList.add("completed");
            document.getElementById("step-1").querySelector(".status-text").classList.add("completed");
            document.getElementById("step-2").classList.add("completed");
            document.getElementById("step-2").querySelector(".status-text").classList.add("completed");
            document.getElementById("step-3").classList.add("completed");
            document.getElementById("step-3").querySelector(".status-text").classList.add("completed");
            progressBar.style.width = "100%";
        } else if (["1", "2", "7", "8", "11", "13", "TEC_TRA_JYS_AUDIT", "TEC_TRA_KYC_AUDIT"].includes(normalizedState)) {
            document.getElementById("step-1").classList.add("completed");
            document.getElementById("step-1").querySelector(".status-text").classList.add("completed");
            document.getElementById("step-2").classList.add("completed");
            document.getElementById("step-2").querySelector(".status-text").classList.add("completed");
            progressBar.style.width = "50%";
        } else {
            steps.forEach(function (step) {
                step.classList.add("pending");
            });
        }
    }

    function getRecallUrlFlag(state) {
        var normalizedState = normalizeTecTraStatusCode(state);
        if (normalizedState === "TEC_TRA_KYC_AUDIT") {
            return "pro";
        }
        if (normalizedState === "TEC_TRA_PASSED") {
            return "hecha";
        }
        return "";
    }

    var batchDownloadInProgress = false;

    function parseDownloadFileName(contentDisposition) {
        if (!contentDisposition) {
            return "";
        }

        var utf8Match = contentDisposition.match(/filename\*=UTF-8''([^;]+)/i);
        if (utf8Match && utf8Match[1]) {
            return decodeURIComponent(utf8Match[1]).replace(/["]/g, "");
        }

        var fileNameMatch = contentDisposition.match(/filename="?([^";]+)"?/i);
        return fileNameMatch && fileNameMatch[1] ? decodeURIComponent(fileNameMatch[1]) : "";
    }

    function readBlobAsText(blob, callback) {
        if (!blob) {
            callback("");
            return;
        }

        var reader = new FileReader();
        reader.onload = function () {
            callback(reader.result || "");
        };
        reader.onerror = function () {
            callback("");
        };
        reader.readAsText(blob, "utf-8");
    }

    function extractDownloadErrorMessage(text) {
        if (!text) {
            return "批量下载失败，请稍后重试";
        }

        try {
            var result = JSON.parse(text);
            if (result && result.msg) {
                return result.msg;
            }
        } catch (e) {
        }

        return text.replace(/<[^>]+>/g, "").trim() || "批量下载失败，请稍后重试";
    }

    function triggerBlobDownload(blob, fileName) {
        var resolvedFileName = fileName || "成果转化_批量下载.zip";
        if (window.navigator.msSaveOrOpenBlob) {
            window.navigator.msSaveOrOpenBlob(blob, resolvedFileName);
            return;
        }

        var downloadUrl = window.URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.style.display = "none";
        link.href = downloadUrl;
        link.download = resolvedFileName;
        document.body.appendChild(link);
        link.click();
        setTimeout(function () {
            document.body.removeChild(link);
            window.URL.revokeObjectURL(downloadUrl);
        }, 100);
    }

    function finishBatchDownload() {
        batchDownloadInProgress = false;
        $.modal.closeLoading();
    }

    function batchDownload(module) {
        var ids = $.table.selectColumns("id", false);
        if (!ids || ids.length === 0) {
            $.modal.alertWarning("未选择数据");
            return;
        }
        if (batchDownloadInProgress) {
            $.modal.alertWarning("批量下载正在处理中，请稍候...");
            return;
        }

        batchDownloadInProgress = true;
        $.modal.loading("正在打包下载，请稍候...");

        var xhr = new XMLHttpRequest();
        xhr.open("GET", ctx + "common/batchDownload?ids=" + encodeURIComponent(ids.join(",")) + "&module=" + encodeURIComponent(module), true);
        xhr.responseType = "blob";
        xhr.timeout = 10 * 60 * 1000;

        xhr.onload = function () {
            var blob = xhr.response;
            var contentDisposition = xhr.getResponseHeader("Content-Disposition") || "";
            var contentType = xhr.getResponseHeader("Content-Type") || "";
            var isDownloadResponse = contentDisposition.indexOf("attachment") !== -1
                || contentType.indexOf("application/zip") !== -1
                || contentType.indexOf("application/octet-stream") !== -1;

            if (xhr.status >= 200 && xhr.status < 300 && isDownloadResponse) {
                triggerBlobDownload(blob, parseDownloadFileName(contentDisposition));
                finishBatchDownload();
                return;
            }

            readBlobAsText(blob, function (text) {
                $.modal.alertError(extractDownloadErrorMessage(text));
                finishBatchDownload();
            });
        };

        xhr.onerror = function () {
            $.modal.alertError("批量下载失败，请检查网络或稍后重试");
            finishBatchDownload();
        };

        xhr.ontimeout = function () {
            $.modal.alertError("批量下载超时，请稍后重试");
            finishBatchDownload();
        };

        xhr.send();
    }
