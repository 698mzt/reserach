<style>
    .modal-right {
        position: fixed;
        right: 0;
        margin: 0;
        height: 100%;
        display: flex;
        align-items: stretch;

    }

    .modal-right .modal-content {
        height: 100%;
        width: 5500px;
    }

    .link-button {
        background: none;
        border: none;
        color: #2c99ff;
        cursor: pointer;
        font-size: inherit;
    }

    .progress-container {
        display: flex;
        justify-content: space-around;
        align-items: center;
        margin-top: 20px;
    }

    .progress-step {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

    .progress-step .step-icon {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 5px;
    }

    .completed .step-icon {
        background-color: green;
        color: white;
    }

    .progress-step .step-text {
        font-size: 14px;
    }


</style>

    //显示模态框上面的进度
    function updateProgress(state) {
        let step = 0;
        if ([6].includes(state)) {
            // 完结
            step = "3";
        } else if ([15, 4, 3, 5, 12, 9, 10, 14].includes(state)) {
            // 草稿 被驳回
            step = "1";
        } else if ([1, 2, 11, 7, 8, 13].includes(state)) {
            // 审核中
            step = "2";
        }
        console.log("step=", step)
        const progressSteps = document.querySelectorAll('.progress-step');
        progressSteps.forEach((stepElement, index) => {
            if (index < step) {
                stepElement.classList.add('completed');
            } else if (index === step) {
                stepElement.classList.add('active');
            } else {
                stepElement.classList.remove('completed', 'active');
            }
        });
    }

     * @param responsibilityTier 1，2，3，4代表第几负责人,0代表不是负责人
     */
    function getscore_evidence(id, responsibilityTier) {
        if (responsibilityTier === 0) {
            resolve("未参与");
        } else {
            $.ajax({
                type: "POST",
                url: prefix + "/getscore_byId",
                contentType: "application/json",
                data: JSON.stringify({'id': id}),
                async: true,
                error: function (request) {
                    reject("系统错误");
                },
                success: function (data) {
                    resolve(data.score);
                }
            });
        }
    }
