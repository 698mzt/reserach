<!--校内横向课题管理的页面，包含已完结，立项申请，结项申请的三个tab页面-->
<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org  "
      xmlns:shiro="https://github.com/theborakompanioni/thymeleaf-extras-shiro  "
      xmlns:padding="http://www.w3.org/1999/xhtml  ">

<head>
    <th:block th:include="include :: header('成果转化列表')"/>
</head>
<style>
    .track-rcol {
        width: 100%;
        max-width: 500px;
        margin: 20px auto;
        max-height: 400px;
        overflow-y: auto;
    }

    .btn-group-sm > .btn, .btn-sm {
        padding: 9px 10px;
        font-size: 12px;
        line-height: 1.5;
        border-radius: 3px;
    }

    .link-button {
        background: none;
        border: none;
        color: #2c99ff;
        cursor: pointer;
        font-size: inherit;
    }

    .del-link-button {
        background: none;
        border: none;
        color: #ff0000;
        cursor: pointer;
        font-size: inherit;
    }

    .modal-right {
        position: fixed;
        right: 0;
        margin: 0;
        height: 100%;
        display: flex;
        align-items: stretch;
    }

    .modal-right .modal-content {
        height: 100%;
        width: 70%;
        margin-left: auto;
    }

    .modal-right .but {
        position: absolute;
        right: 2%;
        bottom: 1.3%;
        background: red;
        color: white;
        border: none;
        border-radius: 4px;
    }

    .progress_inner {
        height: 80px;
        width: 100%;
        position: relative;
    }

    .progress_inner__step {
        width: 33.33%;
        font-size: 12px;
        padding: 0 5px;
        transition: all 0.4s;
        float: left;
        text-align: center;
        position: relative;
    }

    .progress_inner__step label {
        padding-top: 30px;
        display: block;
        position: relative;
        cursor: pointer;
    }

    .progress_inner__step:before {
        content: "1";
        width: 24px;
        height: 24px;
        color: #2196F3;
        background: white;
        line-height: 22px;
        border: 2px solid #2196F3;
        font-size: 12px;
        top: 0;
        border-radius: 50%;
        transition: all 0.4s;
        position: absolute;
        left: 0;
        right: 0;
        margin: auto;
        font-weight: bold;
        z-index: 11;
    }

    .progress_inner__step:nth-of-type(2):before {
        content: "2";
        color: #9E9E9E;
        border-color: #9E9E9E;
    }

    .progress_inner__step:nth-of-type(3):before {
        content: "3";
        color: #9E9E9E;
        border-color: #9E9E9E;
    }

    .progress_inner__step.completed:before {
        content: "✓";
        color: #4CAF50;
        border-color: #4CAF50;
        line-height: 22px;
        font-size: 14px;
    }

    .progress_inner__step.active:before {
        color: #2196F3;
        border-color: #2196F3;
        background: white;
    }

    .progress_inner__step.pending:before {
        color: #9E9E9E;
        border-color: #9E9E9E;
        background: white;
    }

    .progress_inner__bar {
        height: 3px;
        left: 16.665%;
        right: 16.665%;
        background: #E0E0E0;
        position: absolute;
        top: 12px;
        z-index: -1;
        border-radius: 3px;
        overflow: hidden;
    }

    .progress_inner__bar--progress {
        height: 100%;
        background: #4CAF50;
        width: 0;
        transition: width 0.6s ease;
    }

    .status-text {
        color: #9E9E9E;
        font-weight: normal;
        transition: all 0.4s;
        font-size: 12px;
    }

    .status-text.active {
        color: #2196F3;
        font-weight: bold;
    }

    .status-text.completed {
        color: #4CAF50;
        font-weight: bold;
    }

    .buttons {
        margin-top: 20px;
        text-align: center;
    }

    button {
        background: #2196F3;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 3px;
        margin: 0 8px;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.3s;
        font-size: 12px;
    }

    button:hover {
        background: #1976D2;
    }

    button:last-child {
        background: #9E9E9E;
    }

    button:last-child:hover {
        background: #757575;
    }

    /* 新增的流程记录样式 */
    .timeline-title {
        font-weight: bold;
        font-size: 14px;
        color: #333;
        text-align: left;
        margin: 0 0 25px 20px;
        max-width: 500px;
        margin-left: auto;
        margin-right: auto;
        position: relative;
        padding-bottom: 15px;
    }

    .timeline-title::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 0.5px;
        background: linear-gradient(to right,
        rgba(224, 224, 224, 0.8),
        rgba(224, 224, 224, 0.8),
        rgba(224, 224, 224, 0.8));
        box-shadow: 0 0.5px 1px rgba(0, 0, 0, 0.07);
    }

    .track-list {
        margin: 20px;
        padding-left: 5px;
        position: relative;
    }

    .track-list ul {
        padding-left: 0;
    }

    .track-list li {
        position: relative;
        padding: 5px 0 10px 25px;
        line-height: 1.4;
        border-left: 2px solid #d9d9d9;
        color: #666;
        list-style: none;
        transition: all 0.4s ease;
    }

    .track-list li.first {
        color: #666;
        padding-top: 0;
    }

    .track-list li .node-icon {
        position: absolute;
        left: -6px;
        top: 18px;
        width: 8px;
        height: 8px;
        background: #C0C0C0;
        border-radius: 50%;
        transition: all 0.4s ease;
        border: 2px solid #E0E0E0;
        box-sizing: content-box;
    }

    .track-list li.first .node-icon {
        background: #C0C0C0;
        width: 8px;
        height: 8px;
        left: -8px;
    }

    .track-list li .time {
        display: block;
        margin-bottom: 3px;
        font-size: 11px;
        color: #888;
        transition: all 0.4s ease;
    }

    .track-list li .txt {
        display: block;
        font-size: 12px;
        transition: all 0.4s ease;
    }

    /* 悬停效果 */
    .track-list li:hover {
        color: #333;
    }

    .track-list li:hover .node-icon {
        transform: scale(1.3);
        background: #ed8088;
    }

    .track-list li:hover .time {
        color: #666;
    }

    /* 新增审核状态样式 */
    .approve-status {
        margin-top: 10px;
        text-align: center;
    }

    .approve-status label {
        margin: 0 10px;
        cursor: pointer;
    }

    .approve-status input {
        margin-right: 5px;
    }
</style>

                <!-- 结项申请 Tab -->

<div class="wrapper wrapper-content fadeInRight" style="position: absolute; left: -9999px;">
    <div class="row">
        <div class="col-sm-4">
            <div class="ibox ">
                <div class="ibox-content">
                    <div class="modal inmodal" id="myModal" tabindex="-1" role="dialog" aria-hidden="true">
                        <div class="modal-dialog modal-right">

                                        <div class='progress_inner'>

</div>

<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    var JYPY = [[${@permission.hasPermi('system:intraSch:JYPY')}]];
    var XYPY = [[${@permission.hasPermi('system:intraSch:XYPY')}]];
    var KYPY = [[${@permission.hasPermi('system:intraSch:KYPY')}]];

    var JYCH = [[${@permission.hasPermi('system:intraSch:JYCH')}]];
    var XYCH = [[${@permission.hasPermi('system:intraSch:XYCH')}]];
    var KYCH = [[${@permission.hasPermi('system:intraSch:KYCH')}]];
    var select = [[${@permission.hasPermi('system:intraSch:select')}]];

    var datas = [[${@dict.getType('sys_intraschpro_tasks')}]];
    var prefix = ctx + "IntraSchPro";

    // 动态生成URL
    function getUrl(tableId) {
        var year = localStorage.getItem("year");
        return prefix + "/list/" + tableId + "?year=" + year;
    }

    $(function () {
        function initTable(options) {
            var tableId = options.id;
            options.url = getUrl(tableId);
            $.table.init(options);
        }

        // tab-0 已完结
        var options0 = {
            id: "bootstrap-table0",
            toolbar: "toolbar0",
            url: getUrl($('table').attr('id')),
            createUrl: prefix + "/add",
            detailUrl: prefix + "/overdetail/{id}",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            exportUrl: prefix + "/export",
            rowStyle: rowStyle0,
            modalName: "成果转化",
            sortOrder: "asc",
            columns: [{
                checkbox: true,
                align: 'center'
            },
                {
                    field: 'number',
                    title: '序号',
                    width: 5,
                    align: 'center',
                    switchable: false,
                    formatter: function (value, row, index) {
                        return $.table.serialNumber(index);
                    }
                },
                {
                    field: 'id',
                    title: 'id',
                    visible: false
                },
                {
                    field: 'yname',
                    align: 'center',
                    title: '学院'
                },
                {
                    field: 'dname',
                    align: 'center',
                    title: '专业'
                },
                {
                    field: 'userName',
                    align: 'center',
                    title: '申请人'
                },
                {
                    field: 'topName',
                    align: 'center',
                    title: '课题名称'
                },
                {
                    field: 'signingData',
                    align: 'center',
                    title: '签订日期'
                },
                {
                    field: 'amount',
                    align: 'center',
                    title: '项目金额'
                },
                {
                    field: 'responsibilityTier',
                    title: '个人排名',
                    align: 'center',
                    formatter: function (value, row, index) {
                        return row.firstPersonId == row.uid ? '第一负责人' : row.secondPersonId == row.uid ? '第二负责人' : row.thirdPersonId == row.uid ? "第三负责人" : row.fourthPersonId == row.uid ? "第四负责人" : "不是负责人";
                    }
                },
                {
                    field: 'responsibilityTier',
                    title: '积分',
                    align: 'center',
                    formatter: function (value, row, index) {
                        if (row.state == 6) {
                            return row.firstPersonId == row.uid ? row.firstPoints : row.secondPersonId == row.uid ? row.secondPoints : row.thirdPersonId == row.uid ? row.thirdPoints : row.fourthPersonId == row.uid ? row.forthPoints : 0;
                        } else {
                            return 0;
                        }
                    }
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function (value, row, index) {
                        var actions = [];
                        if (row.state == 6) {
                            actions.push('<a  class="link-button ' + '" href="javascript:void(0)" onclick="$.operate.overdetailTab(\'' + row.id + '/chakan' + '\')">查看</a> ');
                        }
                        return actions.join('');
                    }
                }]
        };
        initTable(options0);

        // tab-1 立项申请
        var options1 = {
            id: "bootstrap-table1",
            toolbar: "toolbar1",
            url: getUrl($('table').attr('id')),
            createUrl: prefix + "/add",
            overUrl: prefix + "/overadd?id={id}",
            detailUrl: prefix + "/detail/{id}",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            exportUrl: prefix + "/export",
            subDraftUrl: prefix + "/subDraft/",
            rowStyle: rowStyle0,
            modalName: "成果转化",
            sortOrder: "asc",
            columns: [{
                checkbox: true,
                align: 'center'
            },
                {
                    field: 'number',
                    title: '序号',
                    width: 5,
                    align: 'center',
                    switchable: false,
                    formatter: function (value, row, index) {
                        return $.table.serialNumber(index);
                    }
                },
                {
                    field: 'id',
                    title: 'id',
                    visible: false
                },
                {
                    field: 'yname',
                    align: 'center',
                    title: '学院'
                },
                {
                    field: 'dname',
                    align: 'center',
                    title: '专业'
                },
                {
                    field: 'userName',
                    align: 'center',
                    title: '申请人'
                },
                {
                    field: 'topName',
                    align: 'center',
                    title: '课题名称'
                },
                {
                    field: 'signingData',
                    align: 'center',
                    title: '签订日期'
                },
                {
                    field: 'amount',
                    align: 'center',
                    title: '项目金额'
                },
                {
                    field: 'responsibilityTier',
                    title: '个人排名',
                    align: 'center',
                    formatter: function (value, row, index) {
                        return row.firstPersonId == row.uid ? '第一负责人' : row.secondPersonId == row.uid ? '第二负责人' : row.thirdPersonId == row.uid ? "第三负责人" : row.fourthPersonId == row.uid ? "第四负责人" : "不是负责人";
                    }
                },
                {
                    field: 'responsibilityTier',
                    title: '积分',
                    align: 'center',
                    formatter: function (value, row, index) {
                        if (row.state == 4) {
                            return row.firstPersonId == row.uid ? row.firstPoints : row.secondPersonId == row.uid ? row.secondPoints : row.thirdPersonId == row.uid ? row.thirdPoints : row.fourthPersonId == row.uid ? row.forthPoints : 0;
                        } else {
                            return 0;
                        }
                    }
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function (value, row, index) {
                        var actions = [];
                        actions.push('<a  class="link-button" data-toggle="modal" data-target="#myModal" onclick="loadReviewRecords(' + row.id + ', ' + row.state + ')">流程记录</a><br> ');
                        actions.push('<a  class="link-button ' + '" href="javascript:void(0)" onclick="$.operate.overdetailTab(\'' + row.id + '/chakan' + '\')"> 查看</a> &nbsp;&nbsp;&nbsp;');

                        if (row.state == '15') {
                            actions.push('<a   class="link-button' + '" href="javascript:void(0)" onclick="$.operate.editTab(\'' + row.id + '\')">编辑</a>');
                            actions.push('<a   class="link-button' + '" href="javascript:void(0)" onclick="subDraft(\'' + row.id + '\')">提交</a> &nbsp;');
                            actions.push('<a class="del-link-button' + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"> </i>删除</a>');
                        }

                        // 教研角色逻辑
                        if (row.role === 'research') {
                            if (row.deptNamekey === '1' && row.userId != row.uid) {
                                if (row.state == '1') {
                                    actions.push('<a  class="link-button ' + '" href="javascript:void(0)" onclick="$.operate.detailTab(\'' + row.id + '/pro' + '\')"> 批阅</a> ');
                                } else if (row.state == '11') {
                                    actions.push('<a  class="del-link-button ' + '" href="javascript:void(0)" onclick="$.operate.detailTab(\'' + row.id + '/pro' + '\')"> 撤回</a> ');
                                }
                                if (row.userId == row.uid) {
                                    actions.push('<a   class="link-button ' + '" href="javascript:void(0)" onclick="$.operate.editTab(\'' + row.id + '\')"> 编辑</a> <br>');
                                    actions.push('<a class="del-link-button ' + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"> </i>删除</a>');
                                }
                            } else if (row.userId == row.uid) {
                                if (row.state == '1') {
                                    actions.push('<a  class="link-button ' + '" href="javascript:void(0)" onclick="$.operate.detailTab(\'' + row.id + '/pro' + '\')"> 批阅</a> ');
                                } else if (row.state == '11') {
                                    actions.push('<a  class="del-link-button ' + '" href="javascript:void(0)" onclick="$.operate.detailTab(\'' + row.id + '/pro' + '\')"> 撤回</a> ');
                                } else if (row.state == '4') {
                                    actions.push('<a  class="link-button ' + '" href="javascript:void(0)" onclick="$.operate.overTab(\'' + row.id + '\')"> 申请结项</a> ');
                                } else if (row.state == '3' || row.state == '12' || row.state == '5') {
                                    actions.push('<a   class="link-button ' + '" href="javascript:void(0)" onclick="$.operate.editTab(\'' + row.id + '\')"> 编辑</a> ');
                                }
                            }
                        }
                        // 学院角色逻辑
                        else if (row.role === 'dept_teacher') {
                            if (row.state == '11' && row.deptNamekey === '1') {
                                actions.push('<a  class="link-button ' + XYPY + '" href="javascript:void(0)" onclick="$.operate.detailTab(\'' + row.id + '/dept_teacher' + '\')"> 批阅</a> ');
                            } else if (row.state == '2' && row.deptNamekey === '1') {
                                actions.push('<a  class="del-link-button' + XYPY + '" href="javascript:void(0)" onclick="$.operate.detailTab(\'' + row.id + '/dept_teacher' + '\')"> 撤回</a> ');
                            } else {
                                if (row.userId == row.uid) {
                                    if (row.state == '9' || row.state == '10' || row.state == '14') {
                                        actions.push('<a   class="link-button ' + '" href="javascript:void(0)" onclick="$.operate.editTab(\'' + row.id + '\')"> 编辑</a> ');
                                    }
                                }
                            }
                        }
                        // 科研角色逻辑

    /**
     * 批量下载
     */
    function batchDownload(module) {
        var activeTab = $('.nav-tabs .active a').attr('href');
        var tableId = '';

        if (activeTab === '#tab-0') {
            tableId = 'bootstrap-table0';
        } else if (activeTab === '#tab-1') {
            tableId = 'bootstrap-table1';
        } else if (activeTab === '#tab-2') {
            tableId = 'bootstrap-table2';
        }

        var selectedRows = $('#' + tableId).bootstrapTable('getSelections');
        if (selectedRows.length === 0) {
            $.modal.alertWarning("未选择数据");
            return;
        }

        var ids = selectedRows.map(function(row) {
            return row.id;
        }).join(',');

        // 构建下载链接
        var downloadUrl = ctx + 'common/batchDownload?ids=' + ids + '&module=' + module;
        window.location.href = downloadUrl;
    }

    function arrangeButtons(actions) {
        let result = '';
        for (let i = 0; i < actions.length; i++) {
            if (i > 0 && i % 3 === 0) {
                result += '<br>';
            }
            result += actions[i];
        }
        return result;
    }

    function submitto(id, state) {

        $.operate.save(prefix + "/change_sc_edit", data);

    function rowStyle0(row, index) {
        if (["6", "4"].includes(row.state)) {
            return { css: {"color": '#67c23a'} };
        } else if (["15", "4", "16"].includes(row.state)) {
            return { css: {"color": '#c78045'} };
        } else if (["1", "2", "11", "7", "8", "13"].includes(row.state)) {
            return { css: {"color": '#2c99ff'} };
        } else if (["3", "5", "12", "9", "10", "14"].includes(row.state)) {
            return { css: {"color": '#c78045'} };
        }
        return {};
    }

    function loadReviewRecords(Id, state) {
        updateProgress(state);
        $.ajax({
            url: prefix + "/bhyy/" + Id,
            method: 'POST',
            data: {kid: Id},
            success: function (response) {
                const eventList = document.getElementById('event-list');
                eventList.innerHTML = '';
                response.rows.forEach(function (row) {
                    const li = document.createElement('li');
                    li.innerHTML = '<i class="node-icon"></i>' +
                        '<span class="time">' + row.createTime + '</span>' +
                        '<span class="txt">' + row.state + '</span>';
                    eventList.insertBefore(li, eventList.firstChild);
                });
            },
            error: function () {
                alert('无法获取批阅记录');
            }
        });
    }

    function updateProgress(state) {
        const steps = document.querySelectorAll('.progress_inner__step');
        const progressBar = document.querySelector('.progress_inner__bar--progress');
        steps.forEach(step => {
            step.classList.remove('active', 'completed', 'pending');
            step.querySelector('.status-text').classList.remove('active', 'completed');
        });
        progressBar.style.width = '0';

        if ([15, 9].includes(state)) {
            document.getElementById('step-1').classList.add('active');
            document.getElementById('step-1').querySelector('.status-text').classList.add('active');
            progressBar.style.width = '0';
        } else if (state === 6 || state === 4) {
            document.getElementById('step-1').classList.add('completed');
            document.getElementById('step-1').querySelector('.status-text').classList.add('completed');
            document.getElementById('step-2').classList.add('completed');
            document.getElementById('step-2').querySelector('.status-text').classList.add('completed');
            document.getElementById('step-3').classList.add('completed');
            document.getElementById('step-3').querySelector('.status-text').classList.add('completed');
            progressBar.style.width = '100%';
        } else if ([1, 2, 7, 8, 11, 13].includes(state)) {
            document.getElementById('step-1').classList.add('completed');
            document.getElementById('step-1').querySelector('.status-text').classList.add('completed');
            document.getElementById('step-2').classList.add('completed');
            document.getElementById('step-2').querySelector('.status-text').classList.add('completed');
            progressBar.style.width = '50%';
        } else {
            steps.forEach(step => {
                step.classList.add('pending');
                step.querySelector('.status-text').classList.add('pending');
            });
        }
    }

    function subDraft(id) {
        $.modal.confirm("确定提交吗？", function () {
            var url = table.options.subDraftUrl + id;
            $.operate.submit(url, "post", "json", "");
        });
    }

    function getscore_evidence(id, responsibilityTier) {
        if (responsibilityTier === 0) {
            resolve("未参与");
        } else {
            $.ajax({
                type: "POST",
                url: prefix + "/getscore_byId",
                contentType: "application/json",
                data: JSON.stringify({'id': id}),
                async: true,
                // 请求失败
                error: function (request) {
                    reject("系统错误");
                },
                success: function (data) {
                    resolve(data.score);
                }
            });
        }
    }
