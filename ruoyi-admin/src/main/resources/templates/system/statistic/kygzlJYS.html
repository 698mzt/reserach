<!DOCTYPE html>

<!--教研室科研工作量-->

<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('表格虚拟滚动')" />
    <style>
        /* 统计行样式 */
        .statistics-row {
            background-color: #e7f3ff !important;
            font-weight: bold;
        }
        
        .statistics-row td {
            border-top: 2px solid #007bff !important;
            border-bottom: 2px solid #007bff !important;
        }
        
        /* 统计行合并列的样式 */
        .statistics-merged-cell {
            position: relative;
            text-align: center !important;
            background-color: #d4e6ff !important;
            font-weight: bold !important;
        }
        
        /* 隐藏统计行的多选框 */
        .statistics-row .bs-checkbox {
            visibility: hidden;
        }
    </style>
</head>
<body>
<div class="container-div">
    <div class="btn-group-sm" id="toolbar" role="group">
        &nbsp;&nbsp;<span id="total" class="badge badge-success"></span>
    </div>
    <div class="row">
        <div class="col-sm-12 select-table table-bordered">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>
<div th:include="include :: footer"></div>
<script>
    var prefix = "jysky";
    $(function () {
        var options = {
            url: prefix + "/list",
            modalName: '教研室科研工作量',
            method: "post",
            sidePagination: "server",
            pagination: true,
            showSearch: false,
            virtualScroll: true,
            columns: [
                {
                    checkbox: true, // 添加多选框列
                    align: 'center'
                },
                { field: 'parentName', title: '学院', align: 'center' },
                { field: 'deptName', title: '教研室', align: 'center' },
                { field: 'userName', title: '&nbsp;&nbsp;&nbsp;教师&nbsp;&nbsp;&nbsp;', align: 'center' },
                { field: 'zxktxjys', title: '纵向课题科研项目-校级以上', align: 'center' },
                { field: 'zxktxj', title: '纵向课题科研项目-校级', align: 'center' },
                { field: 'hxkt', title: '横向课题科研项目', align: 'center' },
                { field: 'cgzh', title: '成果转化', align: 'center' },
                { field: 'xslw', title: '学术论文', align: 'center' },
                { field: 'jczz', title: '教材著作', align: 'center' },
                { field: 'zl', title: '专利', align: 'center' },
                { field: 'rz', title: '软著', align: 'center' },
                { field: 'jl', title: '&nbsp;&nbsp;&nbsp;奖励&nbsp;&nbsp;&nbsp;', align: 'center' },
                { field: 'jzbg', title: '学术报告(讲座类)', align: 'center' }
            ]
        };
        $.table.init(options);

        // 添加表格加载完成后的回调函数
        $('#bootstrap-table').on('load-success.bs.table', function () {
            const $table = $(this);
            const $tbody = $table.find('tbody');
            
            // 使用延时确保DOM完全渲染
            setTimeout(function() {
                // 查找总计行和教研室统计行
                $tbody.find('tr').each(function() {
                    const $row = $(this);
                    const $cells = $row.find('td');
                    
                    // 检查第三列（教师列）是否为"总计"或"小计"
                    if ($cells.length > 2) {
                        const userNameText = $cells.eq(2).text().trim();
                        if (userNameText === '总计') {
                            processTotalRow($row, $cells);
                        } else if (userNameText === '小计') {
                            processDepartmentStatsRow($row, $cells);
                        }
                    }
                });
            }, 200);
        });

        // 处理总计行的函数
        function processTotalRow($row, $cells) {
            // 1. 为整行添加总计样式
            $row.addClass('total-row');
            
            // 2. 处理第二、三列的合并（教研室和教师列）
            const $deptCell = $cells.eq(1);    // 教研室列
            const $teacherCell = $cells.eq(2); // 教师列
            
            // 3. 设置合并后的样式和内容
            $deptCell.addClass('total-merged-cell')
                     .attr('colspan', '2')
                     .text('总计');
            
            // 4. 隐藏第三列
            $teacherCell.hide();
            
            // 5. 确保多选框被隐藏
            $cells.eq(0).addClass('bs-checkbox');
        }
        
        // 处理教研室统计行的函数
        function processDepartmentStatsRow($row, $cells) {
            // 1. 为整行添加教研室统计行样式
            $row.addClass('statistics-row');
            
            // 2. 处理第二、三列的合并（教研室和教师列）
            const $deptCell = $cells.eq(1);    // 教研室列
            const $teacherCell = $cells.eq(2); // 教师列
            
            // 3. 设置合并后的样式和内容
            $deptCell.addClass('statistics-merged-cell')
                     .attr('colspan', '2')
                     .text($deptCell.text() + ' 小计');
            
            // 4. 隐藏第三列
            $teacherCell.hide();
            
            // 5. 确保多选框被隐藏
            $cells.eq(0).addClass('bs-checkbox');
        }
    });
</script>
</body>
</html>
