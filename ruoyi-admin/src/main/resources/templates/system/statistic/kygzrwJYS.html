	function countFormatter(varcharField) {
		if (!varcharField || varcharField === '') return '0个';
		return varcharField;
	}

	function zcFormatter(val) {
		if (!val || val === '') return '0个';
		var countMatch = String(val).match(/(\d+)个/);
		var count = countMatch ? parseInt(countMatch[1], 10) : 0;
		return count + '个';
	}

	function hxFormatter(val) {
		if (!val || val === '') return '0个（0.00万）';
		var countMatch = String(val).match(/(\d+)个/);
		var amountMatch = String(val).match(/（([\d.]+)万/);
		var count = countMatch ? parseInt(countMatch[1], 10) : 0;
		var amount = amountMatch ? parseFloat(amountMatch[1]) : 0;
		return count + '个（' + amount.toFixed(2) + '万）';
	}

	function cntScoreFormatter(scoreField, varcharValue, row) {
		var score = row[scoreField] || varcharValue || '0';
		return Number(score).toFixed(2);
	}

			// 添加总计行
			function addTotalRow($table) {
				const $tbody = $table.find('tbody');
				const allRows = $table.bootstrapTable('getData');
				if (!allRows || allRows.length === 0) return;

				$tbody.find('.total-row').remove();

				const moneyFields = {
					ewyyx: true, edwwy: true, wdswy: true, sdeswy: true, esdsswwy: true, wswwydwswy: true, wsdqswwy: true, qswdybwy: true,
					eyxxx: true, edwxx: true, wdsxx: true, sdesxx: true, esdsswxx: true, sswdwsxx: true
				};

				function parseMoney(val) {
					if (!val) return { count: 0, amount: 0 };
					var countMatch = String(val).match(/(\d+)个/);
					var amountMatch = String(val).match(/（([\d.]+)万/);
					return {
						count: countMatch ? parseInt(countMatch[1], 10) : 0,
						amount: amountMatch ? parseFloat(amountMatch[1]) : 0
					};
				}

				const totals = {};
				const countFields = [
					'zcgjjjkyxm', 'zcsbjjjkyxm', 'zcsbjjgxm', 'zcsbjzxkyxm', 'zctjjxhjkyxm', 'zcxjjxglxmywyys', 'zcxjjxglxmywyyx',

					'eyxxx', 'edwxx', 'wdsxx', 'sdesxx', 'esdsswxx', 'sswdwsxx',
				'SCI', 'EI', 'hx', 'sw', 'pt', 'xb',
					'cbzz1', 'cbzz2', 'cbyz1', 'cbyz2', 'cbjc1', 'cbjc2', 'zbjc',
					'sqfmzl', 'syxxzl', 'wxsjzl', 'jsjrjzzq',
					'sjjxcgj', 'sjkxjsj', 'stjjzrkxlpj', 'stjjsklpj', 'xjjxcgj', 'yyxkyxjcgj', 'xhjjxcgj', 'xhjkycgj',
					'jbgj', 'jbgn', 'cjgj', 'cjgn', 'xjxs'
				];

				for (const field of countFields) {
					totals[field] = moneyFields[field] ? { count: 0, amount: 0 } : 0;
				}

				for (const row of allRows) {
					for (const field of countFields) {
						const val = row[field];
						if (val) {
							if (moneyFields[field]) {
								var parsed = parseMoney(val);
								totals[field].count += parsed.count;
								totals[field].amount += parsed.amount;
							} else {
								const match = String(val).match(/(\d+)/);
								if (match) {
									totals[field] += parseInt(match[1], 10);
								}
							}
						}
					}
				}

				let totalHtml = '<tr class="total-row"><td class="bs-checkbox"></td><td class="total-merged-cell" colspan="2">总计</td>';
				for (const field of countFields) {
					if (moneyFields[field]) {
						totalHtml += '<td>' + totals[field].count + '个（' + totals[field].amount.toFixed(2) + '万）</td>';
					} else {
						totalHtml += '<td>' + totals[field] + '个</td>';
					}
				}
				totalHtml += '</tr>';

				$tbody.append(totalHtml);
			}
		});

</script>

</body>
