	function toggleDisplay(event) {
        if (event) event.preventDefault();
		displayMode = (displayMode === 'detail' ? 'summary' : 'detail');
		localStorage.setItem('displayMode', displayMode);
		$('#modeLabel').text(displayMode === 'detail' ? '当前：按金额分组' : '当前：汇总总计');
		var $table = $('#bootstrap-table');
		var data = $table.bootstrapTable('getData');
		var opts = $table.bootstrapTable('getOptions');
		$table.bootstrapTable('refreshOptions', {
			data: data,
			pageNumber: opts.pageNumber,
			totalRows: opts.totalRows
		});
        return false;
	}

	function gewanFormatter(varcharField, cntField, sumField, row) {
		if (displayMode === 'summary') {
			var hasSummary = row && row[cntField] != null && row[sumField] != null;
			if (hasSummary) {
				var cnt = row[cntField] || 0;
				var sum = row[sumField] || 0;
				if (cnt === 0) return '0个 (0万)';
				return cnt + '个（' + sum.toFixed(2) + '万）';
			}
		}
		if (!varcharField || varcharField === '') return '0个 (0万)';
		return varcharField;
	}

	function countFormatter(varcharField) {
		if (!varcharField || varcharField === '') return '0个';
		return varcharField;
	}

	function cntScoreFormatter(scoreField, varcharValue, row) {
		var score = row[scoreField] || varcharValue || '0';
		return Number(score).toFixed(2);
	}

            // 添加表格加载完成后的回调函数
            $('#bootstrap-table').on('load-success.bs.table', function () {
				const $table = $(this);
				const $tbody = $table.find('tbody');

				// 使用延时确保DOM完全渲染
				setTimeout(function() {
					// 查找总计行（userName为"总计"的行）
					$tbody.find('tr').each(function() {
						const $row = $(this);
						const $cells = $row.find('td');

						// 检查第三列（教师列）是否为"总计"
						if ($cells.length > 2 && $cells.eq(2).text().trim() === '总计') {
							processTotalRow($row, $cells);
						}
					});
					renderPlanTeacherRadar($table);
					renderPlanTeacherBar($table);
				}, 200);
            });

			$('#bootstrap-table').on('check.bs.table uncheck.bs.table check-all.bs.table uncheck-all.bs.table', function () {

					renderPlanTeacherBar($table);
				}, 80);

			// 处理总计行的函数

				// 1. 为整行添加总计样式

				// 2. 处理第二、三列的合并
				const $deptCell = $cells.eq(1);  // 专业列
				const $teacherCell = $cells.eq(2); // 教师列

				// 3. 设置合并后的样式和内容
				$deptCell.addClass('total-merged-cell')
						 .attr('colspan', '2')
						 .text('总计');

				// 4. 隐藏第三列
				$teacherCell.hide();

				// 5. 确保多选框被隐藏
