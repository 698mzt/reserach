<!DOCTYPE html>

<!--学校业绩成果数-->

<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('学校业绩成果数')" />
    <link rel="stylesheet" th:href="@{/css/statistic/statistic-common.css}">
    <style>
        .total-row { background-color: #f8f9fa !important; font-weight: bold; }
        .total-row td { border-top: 2px solid #dee2e6 !important; }
        .total-merged-cell { position: relative; text-align: center !important; background-color: #e9ecef !important; font-weight: bold !important; }
        .total-row .bs-checkbox { visibility: hidden; }
    </style>
</head>
<body class="gray-bg">
<div class="container-div compact-layout">
    <div class="row chart-row">
        <div class="col-sm-12">
            <div id="achievementChart" style="width:100%;"></div>
        </div>
    </div>
    <div class="row table-row-compact">
        <div class="col-sm-12">
            <div class="btn-group-sm" id="toolbar" role="group" style="display:flex;align-items:center;flex-wrap:nowrap;gap:4px;margin-bottom:2px;">
            <form id="formId1" class="form-inline" style="display:inline-block;" th:if="${searchMode != 'none'}">
                <div class="form-group">
                    <label>学院名称：</label>
                    <input type="text" class="form-control input-sm" name="userName" placeholder="请输入学院名称" style="width: 120px;"/>
                </div>
                <a class="btn btn-primary btn-sm" onclick="$.table.search('formId1','bootstrap-table')"><i class="fa fa-search"></i>&nbsp;搜索</a>
                <a class="btn btn-warning btn-sm" onclick="$.form.reset('formId1')"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                <a class="btn btn-success btn-sm" onclick="$.table.exportExcel('formId1')"><i class="fa fa-download"></i>&nbsp;导出</a>
            </form>
            &nbsp;&nbsp;<span id="total" class="badge badge-success"></span>
        </div>
        </div>
        <div class="col-sm-12 select-table table-bordered">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>
<div th:include="include :: footer"></div>
<th:block th:include="include :: bootstrap-table-export-js" />
<script th:src="@{/js/statistic/statistic-common.js}"></script>
<script th:src="@{https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js}"></script>
<script th:src="@{/js/statistic/statistic-chart.js}"></script>
<script>
    var total = 0
    var prefix = ctx + 'rewardxuexiao'
    $(function() {
        var options = {
            url: prefix + "/list",
            modalName: '[[${modalName}]]',
            height: 500,
            sidePagination: "client",
            pagination: false,
            showSearch: false,
            virtualScroll: false,
            showRefresh: false,
            showColumns: false,
            showToggle: false,
            exportUrl: prefix + "/export",
            columns:[
                {
                    checkbox: true
                },
                {
                    field: 'parentName',
                    title: '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;学院&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;',
                    align: 'center'
                },
                {
                    field: 'deptName',
                    title: '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;专业&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;',
                    align: 'center'
                },
                {
                    title: '纵向科研项目-校级以上',
                    align: 'center',
                    field: '纵向科研项目-校级以上'
                },
                {
                    title: '纵向科研项目-校级',
                    align: 'center',
                    field: '纵向科研项目-校级'
                },
                {
                    title: '横向课题科研项目',
                    align: 'center',
                    field: '横向课题科研项目'
                },
                {
                    title: '成果转化',
                    align: 'center',
                    field: '成果转化'
                },
                {
                    title: '学术论文',
                    align: 'center',
                    field: '学术论文'
                },
                {
                    title: '教材著作',
                    align: 'center',
                    field: '教材著作'
                },
                {
                    title: '专利',
                    align: 'center',
                    field: '专利'
                },
                {
                    title: '软著',
                    align: 'center',
                    field: '软著'
                },
                {
                    title: '奖励',
                    align: 'center',
                    field: '奖励'
                },
                {
                    title: '学术报告(讲座类)',
                    align: 'center',
                    field: '学术报告(讲座类)'
                }
            ]
        };
        $.table.init(options);
        initCrossPageSelection($('#bootstrap-table'), { scope: 'yjcg-xx' });
        initSelectionUi($('#bootstrap-table'));

        $('#bootstrap-table').on('load-success.bs.table', function () {
            var $table = $(this);
            var $tbody = $table.find('tbody');
            setTimeout(function() {
                $tbody.find('tr').each(function() {
                    var $row = $(this);
                    var $cells = $row.find('td');
                    if ($cells.length > 2 && $cells.eq(1).text().trim() === '总计') {
                        $row.addClass('total-row');
                        $cells.eq(0).addClass('bs-checkbox');
                        $cells.eq(1).addClass('total-merged-cell').attr('colspan', '2').text('总计');
                        $cells.eq(2).hide();
                    }
                });
                renderAchievementRose($table);
            }, 200);
        });

        $('#bootstrap-table').on('check.bs.table uncheck.bs.table check-all.bs.table uncheck-all.bs.table', function () {
            var $table = $(this);
            setTimeout(function() { renderAchievementRose($table); }, 80);
        });
    });

</script>

</body>
</html>
