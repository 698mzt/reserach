			}, 80);
		});

		function addTotalRow($table) {
			var $tbody = $table.find('tbody');
			var allRows = $table.bootstrapTable('getData');
			if (!allRows || allRows.length === 0) return;

			var totals = {};
			var countFields = [
				'zcgjjjkyxm', 'zcsbjjjkyxm', 'zcsbjjgxm', 'zcsbjzxkyxm', 'zctjjxhjkyxm', 'zcxjjxglxmywyys', 'zcxjjxglxmywyyx',

				'eyxxx', 'edwxx', 'wdsxx', 'sdesxx', 'esdsswxx', 'sswdwsxx', 'dywsxx',
				'SCI', 'EI', 'hx', 'sw', 'pt', 'xb',
				'cbzz1', 'cbzz2', 'cbyz1', 'cbyz2', 'cbjc1', 'cbjc2', 'zbjc',
				'sqfmzl', 'syxxzl', 'wxsjzl', 'jsjrjzzq',
				'sjjxcgj', 'sjkxjsj', 'stjjzrkxlpj', 'stjjsklpj', 'xjjxcgj', 'yyxkyxjcgj', 'xhjjxcgj', 'xhjkycgj',
				'jbgj', 'jbgn', 'cjgj', 'cjgn', 'xjxs'
			];

			for (var i = 0; i < countFields.length; i++) {
				totals[countFields[i]] = 0;
			}

			for (var i = 0; i < allRows.length; i++) {
				var row = allRows[i];
				for (var j = 0; j < countFields.length; j++) {
					var field = countFields[j];
					var val = row[field];
					if (val) {
						var match = String(val).match(/(\d+)/);
						if (match) {
							totals[field] += parseInt(match[1], 10);
						}
					}
				}
			}

			var totalHtml = '<tr class="total-row"><td class="bs-checkbox"></td><td class="total-merged-cell" colspan="2">总计</td>';
			for (var i = 0; i < countFields.length; i++) {
				totalHtml += '<td>' + totals[countFields[i]] + '个</td>';
			}
			totalHtml += '</tr>';

			$tbody.append(totalHtml);
		}
