<!DOCTYPE html>

<!--科研处业绩成果数-->

<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('科研处业绩成果数')" />
    <link rel="stylesheet" th:href="@{/css/statistic/statistic-common.css}">
    <style>
        .total-row { background-color: #f8f9fa !important; font-weight: bold; }
        .total-row td { border-top: 2px solid #dee2e6 !important; }
        .total-merged-cell { position: relative; text-align: center !important; background-color: #e9ecef !important; font-weight: bold !important; }
        .total-row .bs-checkbox { visibility: hidden; }
    </style>
</head>
<body class="gray-bg">
<div class="container-div compact-layout">
    <div class="row chart-row">
        <div class="col-sm-6">
            <div id="achievementChart" style="width:100%;"></div>
        </div>
        <div class="col-sm-6">
            <div id="achievementBar" style="width:100%;"></div>
        </div>
    </div>
    <div class="btn-group-sm" id="toolbar" role="group" style="display:flex;align-items:center;flex-wrap:nowrap;gap:4px;margin-bottom:2px;">
        <form id="formId1" class="form-inline" style="display:inline-block;" th:if="${searchMode != 'none'}">
            <div class="form-group">
                <label>学院：</label>
                <input type="text" class="form-control input-sm" name="pname" placeholder="请输入学院" style="width: 120px;"/>
            </div>
            <div class="form-group">
                <label>专业：</label>
                <input type="text" class="form-control input-sm" name="dname" placeholder="请输入专业" style="width: 120px;"/>
            </div>
            <a class="btn btn-primary btn-sm" onclick="$.table.search('formId1','bootstrap-table')"><i class="fa fa-search"></i>&nbsp;搜索</a>
            <a class="btn btn-warning btn-sm" onclick="$.form.reset('formId1')"><i class="fa fa-refresh"></i>&nbsp;重置</a>
            <a class="btn btn-success btn-sm" onclick="$.table.exportExcel('formId1')"><i class="fa fa-download"></i>&nbsp;导出</a>
        </form>
        <button type="button" class="btn btn-primary btn-sm" onclick="toggleDisplay(event)" style="margin-left:8px;">切换显示模式</button>
        <span id="modeLabel" style="margin-left:6px;font-size:12px;color:#666;">当前：大类汇总</span>
    </div>
    <div class="row table-row-compact">
        <div class="col-sm-12 select-table table-bordered">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>
<div th:include="include :: footer"></div>
<th:block th:include="include :: bootstrap-table-export-js" />
<script th:src="@{/js/statistic/statistic-common.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script th:src="@{/js/statistic/statistic-chart.js}"></script>
<script th:inline="none">
    var total = 0;
    var prefix = ctx + 'rewardkeyanchu';
    var displayMode = 'summary';

    $(function() {
        var options = {
            url: prefix + "/list",
            modalName: '科研处业绩成果数',
            height: 500,
            stickyHeader: true,
            sidePagination: "client",
            showRefresh: false,
            showColumns: false,
            showToggle: false,
            exportUrl: prefix + "/export",
            pagination: true,
            pageSize: 10,
            virtualScroll: false,
            showSearch: false,
            columns:[
                {
                    checkbox: true
                },
                {
                    field: 'parentName',
                    title: '&nbsp;&nbsp;&nbsp;学院&nbsp;&nbsp;&nbsp;',
                    align: 'center'
                },
                {
                    field: 'deptName',
                    title: '&nbsp;&nbsp;专业&nbsp;&nbsp;',
                    align: 'center'
                },
                {
                    title: '纵向科研项目-校级以上',
                    align: 'center',
                    field: '纵向科研项目-校级以上'
                },
                {
                    title: '纵向科研项目-校级',
                    align: 'center',
                    field: '纵向科研项目-校级'
                },
                {
                    title: '横向课题科研项目',
                    align: 'center',
                    field: '横向课题科研项目'
                },
                {
                    title: '成果转化',
                    align: 'center',
                    field: '成果转化'
                },
                {
                    title: '学术论文',
                    align: 'center',
                    field: '学术论文'
                },
                {
                    title: '教材著作',
                    align: 'center',
                    field: '教材著作'
                },
                {
                    title: '专利',
                    align: 'center',
                    field: '专利'
                },
                {
                    title: '软著',
                    align: 'center',
                    field: '软著'
                },
                {
                    title: '奖励',
                    align: 'center',
                    field: '奖励'
                },
                {
                    title: '学术报告(讲座类)',
                    align: 'center',
                    field: '学术报告(讲座类)'
                }
            ],
            responseHandler: function(res) {
                if (res.rows) {
                    var currentMode = displayMode;
                    var isDetail = (currentMode === 'detail');
                    var filteredRows = [];
                    for (var i = 0; i < res.rows.length; i++) {
                        var row = res.rows[i];
                        if (row.parentName === '总计') {
                            continue;
                        }
                        row['横向课题科研项目'] = isDetail
                            ? (row['横向课题科研项目_明细'] || row['横向课题科研项目_汇总'] || row['横向课题科研项目'])
                            : (row['横向课题科研项目_汇总'] || row['横向课题科研项目']);
                        row['成果转化'] = isDetail
                            ? (row['成果转化_明细'] || row['成果转化_汇总'] || row['成果转化'])
                            : (row['成果转化_汇总'] || row['成果转化']);
                        filteredRows.push(row);
                    }
                    res.rows = filteredRows;
                }
                return res;
            }
        };
        $.table.init(options);
        initCrossPageSelection($('#bootstrap-table'), { scope: 'yjcg-kyc-v2' });
        initSelectionUi($('#bootstrap-table'));

        function appendTotalRowToTable($table) {
            var $tbody = $table.find('tbody');
            $tbody.find('tr.total-row').remove();

            var $dataRows = $tbody.find('tr').not('.total-row');
            if ($dataRows.length === 0) return;

            // 列索引：0=checkbox, 1=学院, 2=专业, 3=纵向校级以上, 4=纵向校级, 5=横向, 6=成果转化, 7=学术论文, 8=教材著作, 9=专利, 10=软著, 11=奖励, 12=学术报告
            var countCols = [3, 4, 7, 8, 9, 10, 11, 12];  // 纯个数列
            var amountCols = [5, 6];  // 横向和成果转化：X个（Y万）

            var totals = {};
            for (var idx = 0; idx < countCols.length; idx++) {
                totals['c' + countCols[idx]] = 0;
            }
            for (var idx = 0; idx < amountCols.length; idx++) {
                totals['a' + amountCols[idx] + '_cnt'] = 0;
                totals['a' + amountCols[idx] + '_amt'] = 0;
            }

            $dataRows.each(function() {
                var $cells = $(this).find('td');
                // 纯个数列
                for (var idx = 0; idx < countCols.length; idx++) {
                    var ci = countCols[idx];
                    var text = $cells.eq(ci).text().trim();
                    if (text) {
                        var match = text.match(/(\d+)\s*个/);
                        if (match) {
                            totals['c' + ci] += parseInt(match[1], 10);
                        }
                    }
                }
                // 金额列：X个（Y万）
                for (var idx = 0; idx < amountCols.length; idx++) {
                    var ci = amountCols[idx];
                    var text = $cells.eq(ci).text().trim();
                    if (text) {
                        var match = text.match(/(\d+)\s*个\s*[（(]\s*([\d.]+)\s*万\s*[)）]/);
                        if (match) {
                            totals['a' + ci + '_cnt'] += parseInt(match[1], 10);
                            totals['a' + ci + '_amt'] += parseFloat(match[2]);
                        }
                    }
                }
            });

            var totalHtml = '<tr class="total-row"><td class="bs-checkbox"></td><td class="total-merged-cell" colspan="2">总计</td>';
            // 纵向校级以上 (3)
            totalHtml += '<td>' + totals['c3'] + '个</td>';
            // 纵向校级 (4)
            totalHtml += '<td>' + totals['c4'] + '个</td>';
            // 横向 (5)：X个（Y万）
            totalHtml += '<td>' + totals['a5_cnt'] + '个（' + totals['a5_amt'].toFixed(2) + '万）</td>';
            // 成果转化 (6)：X个（Y万）
            totalHtml += '<td>' + totals['a6_cnt'] + '个（' + totals['a6_amt'].toFixed(2) + '万）</td>';
            // 学术论文 (7)
            totalHtml += '<td>' + totals['c7'] + '个</td>';
            // 教材著作 (8)
            totalHtml += '<td>' + totals['c8'] + '个</td>';
            // 专利 (9)
            totalHtml += '<td>' + totals['c9'] + '个</td>';
            // 软著 (10)
            totalHtml += '<td>' + totals['c10'] + '个</td>';
            // 奖励 (11)
            totalHtml += '<td>' + totals['c11'] + '个</td>';
            // 学术报告 (12)
            totalHtml += '<td>' + totals['c12'] + '个</td>';
            totalHtml += '</tr>';

            $tbody.append(totalHtml);
        }

        $('#bootstrap-table').on('load-success.bs.table', function () {
            var $table = $(this);
            setTimeout(function() {
                appendTotalRowToTable($table);
                renderAchievementRose($table);
                renderAchievementBar($table);
            }, 200);
        });

        $('#bootstrap-table').on('post-body.bs.table', function () {
            var $table = $(this);
            appendTotalRowToTable($table);
        });

        $('#bootstrap-table').on('check.bs.table uncheck.bs.table check-all.bs.table uncheck-all.bs.table', function () {
            var $table = $(this);
            setTimeout(function() {
                renderAchievementRose($table);
                renderAchievementBar($table);
            }, 80);
        });
    });

    function toggleDisplay(event) {
        if (event) event.preventDefault();
        displayMode = (displayMode === 'summary' ? 'detail' : 'summary');
        localStorage.setItem('yjcgDisplayMode', displayMode);
        $('#modeLabel').text(displayMode === 'summary' ? '当前：大类汇总' : '当前：小类明细');
        var toggleBtn = $('button[onclick*="toggleDisplay"]');
        toggleBtn.html(displayMode === 'summary'
            ? '切换显示模式'
            : '切换显示模式');
        $('#bootstrap-table').bootstrapTable('refresh');
        return false;
    }
</script>

</body>
</html>
