<!DOCTYPE html>

<!--学院业绩成果数-->

<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('学院业绩成果数')" />
	<link rel="stylesheet" th:href="@{/css/statistic/statistic-common.css}">
	<style>
		/* 总计行样式 */
		.total-row {
			background-color: #f8f9fa !important;
			font-weight: bold;
		}

		.total-row td {
			border-top: 2px solid #dee2e6 !important;
		}

		/* 总计行合并列的样式 */
		.total-merged-cell {
			position: relative;
			text-align: center !important;
			background-color: #e9ecef !important;
			font-weight: bold !important;
		}

		/* 隐藏总计行的多选框 */
		.total-row .bs-checkbox {
			visibility: hidden;
		}
    </style>
</head>
<body class="gray-bg">
     <div class="container-div compact-layout">
        <div class="row chart-row">
            <div class="col-sm-6">
                <div id="achievementChart" style="width:100%;"></div>
            </div>
            <div class="col-sm-6">
                <div id="achievementBar" style="width:100%;"></div>
            </div>
        </div>
        <div class="row table-row-compact">
            <div class="col-sm-12">
                <div class="btn-group-sm" id="toolbar" role="group" style="display:flex;align-items:center;flex-wrap:nowrap;gap:4px;margin-bottom:2px;">
            <form id="formId1" class="form-inline" style="display:inline-block;" th:if="${searchMode != 'none'}">
                <div class="form-group">
                    <label>专业名称：</label>
                    <input type="text" class="form-control input-sm" name="dname" placeholder="请输入专业名称" style="width: 120px;"/>
                </div>
                <a class="btn btn-primary btn-sm" onclick="$.table.search('formId1','bootstrap-table')"><i class="fa fa-search"></i>&nbsp;搜索</a>
                <a class="btn btn-warning btn-sm" onclick="$.form.reset('formId1')"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                <a class="btn btn-success btn-sm" onclick="$.table.exportExcel('formId1')"><i class="fa fa-download"></i>&nbsp;导出</a>
            </form>
            <button type="button" class="btn btn-primary btn-sm" onclick="toggleDisplay(event)" style="margin-left:10px;">切换显示模式</button>
            <span id="modeLabel" style="margin-left:6px;font-size:12px;color:#666;">当前：大类汇总</span>
            &nbsp;&nbsp;<span id="total" class="badge badge-success"></span>
        </div>
            </div>
            <div class="col-sm-12 select-table table-bordered">
				<table id="bootstrap-table"></table>
			</div>
		</div>
	</div>
    <div th:include="include :: footer"></div>
    <script th:src="@{/js/statistic/statistic-common.js}"></script>
    <script th:src="@{https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js}"></script>
    <script th:src="@{/js/statistic/statistic-chart.js}"></script>
    <script>
        var total = 0
		var prefix = ctx + 'rewardxueyuan'
		var displayMode = localStorage.getItem('yjcgDisplayMode') || 'summary';

		function toggleDisplay(event) {
			if (event) event.preventDefault();
			displayMode = (displayMode === 'summary' ? 'detail' : 'summary');
			localStorage.setItem('yjcgDisplayMode', displayMode);
			$('#modeLabel').text(displayMode === 'summary' ? '当前：大类汇总' : '当前：小类明细');
			$('#bootstrap-table').bootstrapTable('refresh');
			return false;
		}

        $(function() {
		    var options = {
				url: prefix + "/list",
				modalName: '[[${modalName}]]',
				height: 500,
				sidePagination: "server",
				pagination: true,
				showSearch: false,
				virtualScroll: false,
				showRefresh: false,
				showColumns: false,
				showToggle: false,
				exportUrl: prefix + "/export",
				responseHandler: function(res) {
					if (res.rows) {
						var currentMode = displayMode;
						var isDetail = (currentMode === 'detail');
						for (var i = 0; i < res.rows.length; i++) {
							var row = res.rows[i];
							row['横向课题科研项目'] = isDetail
								? (row['横向课题科研项目_明细'] || row['横向课题科研项目_汇总'] || row['横向课题科研项目'])
								: (row['横向课题科研项目_汇总'] || row['横向课题科研项目']);
							row['成果转化'] = isDetail
								? (row['成果转化_明细'] || row['成果转化_汇总'] || row['成果转化'])
								: (row['成果转化_汇总'] || row['成果转化']);
						}
					}
					return res;
				},
				columns:[
				{
					checkbox: true
				},
				{
					field: 'parentName',
					title: '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;学院&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;',
					align: 'center'
				},
				{
					field: 'deptName',
					title: '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;专业&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;',
					align: 'center'
				},
				{
					title: '纵向科研项目-校级以上',
					align: 'center',
					field: '纵向科研项目-校级以上'
				},
				{
					title: '纵向科研项目-校级',
					align: 'center',
					field: '纵向科研项目-校级'
				},
				{
					title: '横向课题科研项目',
					align: 'center',
					field: '横向课题科研项目',
					formatter: function(value) {
						if (!value) return '';
						if (value.length > 60) {
							return '<span title="' + value.replace(/"/g, '&quot;') + '">' + value.substring(0, 60) + '...</span>';
						}
						return value;
					}
				},
				{
					title: '成果转化',
					align: 'center',
					field: '成果转化',
					formatter: function(value) {
						if (!value) return '';
						if (value.length > 60) {
							return '<span title="' + value.replace(/"/g, '&quot;') + '">' + value.substring(0, 60) + '...</span>';
						}
						return value;
					}
				},
				{
					title: '学术论文',
					align: 'center',
					field: '学术论文'
				},
				{
					title: '教材著作',
					align: 'center',
					field: '教材著作'
				},
				{
					title: '专利',
					align: 'center',
					field: '专利'
				},
				{
					title: '软著',
					align: 'center',
					field: '软著'
				},
				{
					title: '奖励',
					align: 'center',
					field: '奖励'
				},
				{
					title: '学术报告(讲座类)',
					align: 'center',
					field: '学术报告(讲座类)'
				}
			]
		    };
		    $.table.init(options);
		    initCrossPageSelection($('#bootstrap-table'), { scope: 'yjcg-xy' });
		    initSelectionUi($('#bootstrap-table'));

			// 添加表格加载完成后的回调函数
			$('#bootstrap-table').on('load-success.bs.table', function () {
				const $table = $(this);
				const $tbody = $table.find('tbody');

				setTimeout(function() {
					$tbody.find('tr').each(function() {
						const $row = $(this);
						const $cells = $row.find('td');

						if ($cells.length > 2 && $cells.eq(2).text().trim() === '总计') {
							processTotalRow($row, $cells);
						}
					});
					renderAchievementRose($table);
					renderAchievementBar($table);
				}, 200);
			});

			$('#bootstrap-table').on('check.bs.table uncheck.bs.table check-all.bs.table uncheck-all.bs.table', function () {
				const $table = $(this);
				setTimeout(function() {
					renderAchievementRose($table);
					renderAchievementBar($table);
				}, 80);
			});

			// 处理总计行的函数
			function processTotalRow($row, $cells) {
				// 1. 为整行添加总计样式
				$row.addClass('total-row');

				// 2. 处理第二、三列的合并（教研室和教师列）
				const $deptCell = $cells.eq(1);    // 教研室列
				const $teacherCell = $cells.eq(2); // 教师列

				// 3. 设置合并后的样式和内容
				$deptCell.addClass('total-merged-cell')
						.attr('colspan', '2')
						.text('总计');

				// 4. 隐藏第三列
				$teacherCell.hide();

				// 5. 确保多选框被隐藏
				$cells.eq(0).addClass('bs-checkbox');
			}
		});

</script>

</body>
</html>
