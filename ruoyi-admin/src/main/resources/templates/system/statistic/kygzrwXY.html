<!DOCTYPE html>

<!--学院科研任务计划-->

<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:include="include :: header('学院科研任务计划')" />
	<link rel="stylesheet" th:href="@{/css/statistic/statistic-common.css}">
	<style>
		.total-row { background-color: #f8f9fa !important; font-weight: bold; }
		.total-row td { border-top: 2px solid #dee2e6 !important; }
		.total-merged-cell { position: relative; text-align: center !important; background-color: #e9ecef !important; font-weight: bold !important; }
		.total-row .bs-checkbox { visibility: hidden; }
	</style>
</head>
<body class="gray-bg">
	<div class="container-div compact-layout">
		<div class="row chart-row">
			<div class="col-sm-6">
				<div id="planRadar" style="width:100%;"></div>
			</div>
			<div class="col-sm-6">
				<div id="planBar" style="width:100%;"></div>
			</div>
		</div>
		<div class="btn-group-sm" id="toolbar" role="group" style="display:flex;align-items:center;flex-wrap:nowrap;gap:4px;margin-bottom:2px;">
			<form id="formId1" class="form-inline" style="display:inline-block;" th:if="${searchMode != 'none'}">
				<div class="form-group">
					<label>教研室名称：</label>
					<input type="text" class="form-control input-sm" name="dname" placeholder="请输入教研室名称" style="width: 120px;"/>
				</div>
				<a class="btn btn-primary btn-sm" onclick="$.table.search('formId1','bootstrap-table')"><i class="fa fa-search"></i>&nbsp;搜索</a>
				<a class="btn btn-warning btn-sm" onclick="$.form.reset('formId1')"><i class="fa fa-refresh"></i>&nbsp;重置</a>
				<a class="btn btn-success btn-sm" onclick="$.table.exportExcel('formId1')"><i class="fa fa-download"></i>&nbsp;导出</a>
			</form>

		</div>
		<div class="row table-row-compact">
			<div class="col-sm-12 select-table table-bordered">
				<table id="bootstrap-table"></table>
			</div>
		</div>
	</div>
	 <th:block th:include="include :: footer"/>
	 <th:block th:include="include :: bootstrap-table-export-js" />
	 <script th:src="@{/js/statistic/statistic-common.js}"></script>
	 <script th:src="@{https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js}"></script>
	 <script th:src="@{/js/statistic/statistic-chart.js}"></script>
    <script th:inline="javascript">
		const total = 0;
	const prefix = ctx + 'collegeplan';

	function countFormatter(varcharField) {
		if (!varcharField || varcharField === '') return '0个';
		return varcharField;
	}

	function getNumberValue(val) {
		if (!val || val === '') return 0;
		var match = String(val).match(/(\d+)/);
		return match ? parseInt(match[1], 10) : 0;
	}

	function calculateZxktTotal(row) {
		var total = getNumberValue(row.zcgjjjkyxm) + getNumberValue(row.zcsbjjjkyxm) + 
					getNumberValue(row.zcsbjjgxm) + getNumberValue(row.zcsbjzxkyxm) + 
					getNumberValue(row.zctjjxhjkyxm) + getNumberValue(row.zcxjjxglxmywyys) + 
					getNumberValue(row.zcxjjxglxmywyyx);
		return total + '个';
	}

	function calculateHxktTotal(row) {
		var total = getNumberValue(row.ewyyx) + getNumberValue(row.edwwy) + 
					getNumberValue(row.wdswy) + getNumberValue(row.sdeswy) + 
					getNumberValue(row.esdsswwy) + getNumberValue(row.wswwydwswy) + 
					getNumberValue(row.wsdqswwy) + getNumberValue(row.qswdybwy);
		return total + '个';
	}

	function calculateCgzhTotal(row) {
		var total = getNumberValue(row.eyxxx) + getNumberValue(row.edwxx) + 
					getNumberValue(row.wdsxx) + getNumberValue(row.sdesxx) + 
					getNumberValue(row.esdsswxx) + getNumberValue(row.sswdwsxx) + 
					getNumberValue(row.dywsxx);
		return total + '个';
	}

	function calculateXslwTotal(row) {
		var total = getNumberValue(row.SCI) + getNumberValue(row.EI) + 
					getNumberValue(row.hx) + getNumberValue(row.sw) + 
					getNumberValue(row.pt) + getNumberValue(row.xb);
		return total + '个';
	}

	function calculateJczzTotal(row) {
		var total = getNumberValue(row.cbzz1) + getNumberValue(row.cbzz2) + 
					getNumberValue(row.cbyz1) + getNumberValue(row.cbyz2) + 
					getNumberValue(row.cbjc1) + getNumberValue(row.cbjc2) + 
					getNumberValue(row.zbjc);
		return total + '个';
	}

	function calculateZlrzTotal(row) {
		var total = getNumberValue(row.sqfmzl) + getNumberValue(row.syxxzl) + 
					getNumberValue(row.wxsjzl) + getNumberValue(row.jsjrjzzq);
		return total + '个';
	}

	function calculateJlTotal(row) {
		var total = getNumberValue(row.sjjxcgj) + getNumberValue(row.sjkxjsj) + 
					getNumberValue(row.stjjzrkxlpj) + getNumberValue(row.stjjsklpj) + 
					getNumberValue(row.xjjxcgj) + getNumberValue(row.yyxkyxjcgj) + 
					getNumberValue(row.xhjjxcgj) + getNumberValue(row.xhjkycgj);
		return total + '个';
	}

	function calculateJzbgTotal(row) {
		var total = getNumberValue(row.jbgj) + getNumberValue(row.jbgn) + 
					getNumberValue(row.cjgj) + getNumberValue(row.cjgn) + 
					getNumberValue(row.xjxs);
		return total + '个';
	}

	$(function() {
			const options = {
				url: prefix + "/list",
				modalName: '[[${modalName}]]',
				sidePagination: "server",
				pagination: true,
				showSearch: false,
				showRefresh: false,
				showColumns: false,
				showToggle: false,
				virtualScroll: false,
				height: 500,
				stickyHeader: true,
				exportUrl: prefix + "/export",
				columns: [
					[
						{
							field: 'parentName',
							title: '学院',
							align: 'center'
						},
						{
							field: 'deptName',
							title: '教研室',
							align: 'center'
						},
						{
							field: 'zxktTotal',
							title: '纵向科研项目',
							align: 'center',
							formatter: function(v, row) { return calculateZxktTotal(row); }
						},
						{
							field: 'hxktTotal',
							title: '横向课题科研项目-校外',
							align: 'center',
							formatter: function(v, row) { return calculateHxktTotal(row); }
						},
						{
							field: 'cgzhTotal',
							title: '成果转化',
							align: 'center',
							formatter: function(v, row) { return calculateCgzhTotal(row); }
						},
						{
							field: 'xslwTotal',
							title: '学术论文',
							align: 'center',
							formatter: function(v, row) { return calculateXslwTotal(row); }
						},
						{
							field: 'jczzTotal',
							title: '教材著作',
							align: 'center',
							formatter: function(v, row) { return calculateJczzTotal(row); }
						},
						{
							field: 'zlrzTotal',
							title: '专利、软著',
							align: 'center',
							formatter: function(v, row) { return calculateZlrzTotal(row); }
						},
						{
							field: 'jlTotal',
							title: '奖励',
							align: 'center',
							formatter: function(v, row) { return calculateJlTotal(row); }
						},
						{
							field: 'jzbgTotal',
							title: '学术报告(讲座类)',
							align: 'center',
							formatter: function(v, row) { return calculateJzbgTotal(row); }
						}
					]
				]
		};
		$.table.init(options);
		initCrossPageSelection($('#bootstrap-table'), { scope: 'kygzrw-xy' });
		initSelectionUi($('#bootstrap-table'));
		
		$('#bootstrap-table').on('load-success.bs.table', function () {
			var $table = $(this);
			setTimeout(function() {
				addTotalRow($table);
				renderPlanCollegeRadar($table);
				renderPlanCollegeBar($table);
			}, 200);
		});

		$('#bootstrap-table').on('check.bs.table uncheck.bs.table check-all.bs.table uncheck-all.bs.table', function () {
			var $table = $(this);
			setTimeout(function() {
				renderPlanCollegeRadar($table);
				renderPlanCollegeBar($table);
			}, 80);
		});

		function addTotalRow($table) {
			var $tbody = $table.find('tbody');
			var allRows = $table.bootstrapTable('getData');
			if (!allRows || allRows.length === 0) return;

			var totals = {
				zxkt: 0, hxkt: 0, cgzh: 0, xslw: 0, jczz: 0, zlrz: 0, jl: 0, jzbg: 0
			};

			for (var i = 0; i < allRows.length; i++) {
				var row = allRows[i];
				totals.zxkt += calculateZxktValue(row);
				totals.hxkt += calculateHxktValue(row);
				totals.cgzh += calculateCgzhValue(row);
				totals.xslw += calculateXslwValue(row);
				totals.jczz += calculateJczzValue(row);
				totals.zlrz += calculateZlrzValue(row);
				totals.jl += calculateJlValue(row);
				totals.jzbg += calculateJzbgValue(row);
			}

			function calculateZxktValue(row) {
				return getNumberValue(row.zcgjjjkyxm) + getNumberValue(row.zcsbjjjkyxm) + 
					   getNumberValue(row.zcsbjjgxm) + getNumberValue(row.zcsbjzxkyxm) + 
					   getNumberValue(row.zctjjxhjkyxm) + getNumberValue(row.zcxjjxglxmywyys) + 
					   getNumberValue(row.zcxjjxglxmywyyx);
			}

			function calculateHxktValue(row) {
				return getNumberValue(row.ewyyx) + getNumberValue(row.edwwy) + 
					   getNumberValue(row.wdswy) + getNumberValue(row.sdeswy) + 
					   getNumberValue(row.esdsswwy) + getNumberValue(row.wswwydwswy) + 
					   getNumberValue(row.wsdqswwy) + getNumberValue(row.qswdybwy);
			}

			function calculateCgzhValue(row) {
				return getNumberValue(row.eyxxx) + getNumberValue(row.edwxx) + 
					   getNumberValue(row.wdsxx) + getNumberValue(row.sdesxx) + 
					   getNumberValue(row.esdsswxx) + getNumberValue(row.sswdwsxx) + 
					   getNumberValue(row.dywsxx);
			}

			function calculateXslwValue(row) {
				return getNumberValue(row.SCI) + getNumberValue(row.EI) + 
					   getNumberValue(row.hx) + getNumberValue(row.sw) + 
					   getNumberValue(row.pt) + getNumberValue(row.xb);
			}

			function calculateJczzValue(row) {
				return getNumberValue(row.cbzz1) + getNumberValue(row.cbzz2) + 
					   getNumberValue(row.cbyz1) + getNumberValue(row.cbyz2) + 
					   getNumberValue(row.cbjc1) + getNumberValue(row.cbjc2) + 
					   getNumberValue(row.zbjc);
			}

			function calculateZlrzValue(row) {
				return getNumberValue(row.sqfmzl) + getNumberValue(row.syxxzl) + 
					   getNumberValue(row.wxsjzl) + getNumberValue(row.jsjrjzzq);
			}

			function calculateJlValue(row) {
				return getNumberValue(row.sjjxcgj) + getNumberValue(row.sjkxjsj) + 
					   getNumberValue(row.stjjzrkxlpj) + getNumberValue(row.stjjsklpj) + 
					   getNumberValue(row.xjjxcgj) + getNumberValue(row.yyxkyxjcgj) + 
					   getNumberValue(row.xhjjxcgj) + getNumberValue(row.xhjkycgj);
			}

			function calculateJzbgValue(row) {
				return getNumberValue(row.jbgj) + getNumberValue(row.jbgn) + 
					   getNumberValue(row.cjgj) + getNumberValue(row.cjgn) + 
					   getNumberValue(row.xjxs);
			}

			var totalHtml = '<tr class="total-row"><td class="total-merged-cell">总计</td><td></td>';
			totalHtml += '<td>' + totals.zxkt + '个</td>';
			totalHtml += '<td>' + totals.hxkt + '个</td>';
			totalHtml += '<td>' + totals.cgzh + '个</td>';
			totalHtml += '<td>' + totals.xslw + '个</td>';
			totalHtml += '<td>' + totals.jczz + '个</td>';
			totalHtml += '<td>' + totals.zlrz + '个</td>';
			totalHtml += '<td>' + totals.jl + '个</td>';
			totalHtml += '<td>' + totals.jzbg + '个</td>';
			totalHtml += '</tr>';

			$tbody.append(totalHtml);
		}
	});
</script>
</body>
</html>
