<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('新增论文')" />
    <th:block th:include="include :: datetimepicker-css" />
    <th:block th:include="include :: bootstrap-fileinput-css"/>
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-paper-add">
            <!--<div class="form-group">
                <label class="col-sm-3 control-label">学院：</label>
                <div class="col-sm-8">
                    <input name="college" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">教研室：</label>
                <div class="col-sm-8">
                    <input name="researchRoom" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">

                <div class="col-sm-8">
                    <input name="employeeId" class="form-control" type="text">
                </div>
            </div>-->
            <div class="form-group">
                <label class="col-sm-3 control-label">教师姓名：</label>
                <div class="col-sm-8">
                    <input name="teacherName"  class="form-control"  type="text" >
                </div>
            </div>
           <!-- th:value="${user.userName}"
           <div class="form-group">
                <label class="col-sm-3 control-label">行政职务：</label>
                <div class="col-sm-8">
                    <input name="administrativePosition" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">社会职称：</label>
                <div class="col-sm-8">
                    <input name="socialTitle" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">校内职称：</label>
                <div class="col-sm-8">
                    <input name="onCampusTitle" class="form-control" type="text">
                </div>
            </div>-->
            <div class="form-group">
                <label class="col-sm-3 control-label">论文名称：</label>
                <div class="col-sm-8">
                    <input name="paperTitle" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">论文类别：</label>
                <div class="col-sm-8">
                    <select  name="topType" class="form-control" th:with="type=${@dict.getType('sci_paper_k')}" required>
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">发表期刊：</label>
                <div class="col-sm-8">
                    <input name="publishedJournal" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">发表时间：</label>
                <div class="input-group date">
                    <input  id="publicationTime" name="publicationTime" class="form-control" placeholder="yyyy-MM-dd" type="text">
                    <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                </div>
            </div>
            <div class="col-md-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">是否与行业联合发表：</label>
                    <div class="col-sm-9">
                        <label class="radio-box">
                            <input name="isIndustryCollaborative" class="form-control" type="radio" value="是">是</label>
                        <label class="radio-box">
                            <input name="isIndustryCollaborative" class="form-control" type="radio" value="否">否</label>
                    </div>
                </div>
            </div>



            <div class="col-md-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">是否与地方联合发表：</label>
                    <div class="col-sm-9">
                        <label class="radio-box">
                            <input name="isLocalCollaborative" class="form-control" type="radio" value="是">是</label>
                        <label class="radio-box">
                            <input name="isLocalCollaborative" class="form-control" type="radio" value="否">否</label>
                    </div>
                </div>
            </div>

            <div class="col-md-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">是否与国际联合发表：</label>
                    <div class="col-sm-9">
                        <label class="radio-box">
                            <input name="isInternationalCollaborative" class="form-control" type="radio" value="是">是</label>
                        <label class="radio-box">
                            <input name="isInternationalCollaborative" class="form-control" type="radio" value="否">否</label>
                    </div>
                </div>
            </div>

            <div class="col-md-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">是否是跨学科论文：</label>
                    <div class="col-sm-9">
                        <label class="radio-box">
                            <input name="isCrossDiscipline" class="form-control" type="radio" value="是">是</label>
                        <label class="radio-box">
                            <input name="isCrossDiscipline" class="form-control" type="radio" value="否">否</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label">排名：</label>
                <div class="col-sm-8">
                    <input name="paperRanking" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">科研分：</label>
                <div class="col-sm-8">
                    <input name="researchScore" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">备注：</label>
                <div class="col-sm-8">
                    <input name="remarks" class="form-control" type="text">
                    <input type="hidden" class="form-control" name="remarks">
                    <div class="summernote" id="remarks"></div>
                </div>
            </div>
        </form>
    </div>
    <div class="row">
        <div class="col-sm-offset-5 col-sm-10">
            <button type="button" class="btn btn-sm btn-primary" onclick="submitHandler()"><i class="fa fa-check"></i>保 存</button>&nbsp;
            <button type="button" class="btn btn-sm btn-danger" onclick="closeItem()"><i class="fa fa-reply-all"></i>关 闭 </button>
        </div>
    </div>


    <th:block th:include="include :: footer" />
    <th:block th:include="include :: bootstrap-fileinput-js"/>
    <th:block th:include="include :: datetimepicker-js" />

    <script th:inline="javascript">
        var prefix = ctx + "system/paper"
        $("#form-paper-add").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                console.log($('#form-paper-add'));
                $.operate.saveTab(prefix + "/add", $('#form-paper-add').serialize());
            }
        }

        $(document).ready(function() {
            $('#publicationTime').datepicker({
                format: 'yyyy-mm-dd',
                minView: "month",
                autoclose: true
            });
        });
    </script>
</body>
</html>
