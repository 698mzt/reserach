<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro"
      xmlns="http://www.w3.org/1999/html">
<head>
    <th:block th:include="include :: header('论文列表')" />
</head>
<style>
        .track-list {
            margin: 20px;
            padding-left: 5px;
            position: relative;
        }

        .track-list ul {
            padding-left: 0;
            list-style: none;
            max-height: 700px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background-color: #f9f9f9;
            padding: 10px;
        }

        .track-list li {
            position: relative;
            padding: 5px 0 10px 25px;
            line-height: 1.4;
            border-left: 2px solid #d9d9d9;
            color: #666;
            transition: all 0.4s ease;
        }

        .modal-right {
            position: fixed;
            right: 0;
            margin: 0;
            height: 100%;
            display: flex;
            align-items: stretch;
        }

        .modal-right .modal-content {
            height: 100%;
            width: 70%;
            margin-left: auto;
        }
        .modal-right .but{
            position: absolute;
            right: 2%;
            bottom: 1.3%;
            background: red;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .progress_inner {
            height: 80px;
            width: 100%;
            position: relative;
        }

        .progress_inner__step {
            width: 33.33%;
            font-size: 12px;
            padding: 0 5px;
            transition: all 0.4s;
            float: left;
            text-align: center;
            position: relative;
        }

        .progress_inner__step label {
            padding-top: 30px;
            display: block;
            position: relative;
            cursor: pointer;
        }

        .progress_inner__step:before {
            content: "1";
            width: 24px;
            height: 24px;
            color: #2196F3;
            background: white;
            line-height: 22px;
            border: 2px solid #2196F3;
            font-size: 12px;
            top: 0;
            border-radius: 50%;
            transition: all 0.4s;
            position: absolute;
            left: 0;
            right: 0;
            margin: auto;
            font-weight: bold;
            z-index: 11;
        }

        .progress_inner__step:nth-of-type(2):before {
            content: "2";
            color: #9E9E9E;
            border-color: #9E9E9E;
        }

        .progress_inner__step:nth-of-type(3):before {
            content: "3";
            color: #9E9E9E;
            border-color: #9E9E9E;
        }

        .progress_inner__step.completed:before {
            content: "✓";
            color: #4CAF50;
            border-color: #4CAF50;
            line-height: 22px;
            font-size: 14px;
        }

        .progress_inner__step.active:before {
            color: #2196F3;
            border-color: #2196F3;
            background: white;
        }

        .progress_inner__step.pending:before {
            color: #9E9E9E;
            border-color: #9E9E9E;
            background: white;
        }

        .progress_inner__bar {
            height: 3px;
            left: 16.665%;
            right: 16.665%;
            background: #E0E0E0;
            position: absolute;
            top: 12px;
            z-index: -1;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress_inner__bar--progress {
            height: 100%;
            background: #4CAF50;
            width: 0;
            transition: width 0.6s ease;
        }

        .status-text {
            color: #9E9E9E;
            font-weight: normal;
            transition: all 0.4s;
            font-size: 12px;
        }

        .status-text.active {
            color: #2196F3;
            font-weight: bold;
        }

        .status-text.completed {
            color: #4CAF50;
            font-weight: bold;
        }

        .buttons {
            margin-top: 20px;
            text-align: center;
        }

        button {
            background: #2196F3;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 3px;
            margin: 0 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 12px;
        }

        button:hover {
            background: #1976D2;
        }

        button:last-child {
            background: #9E9E9E;
        }

        button:last-child:hover {
            background: #757575;
        }

        /* 新增的流程记录样式 */
        .timeline-title {
            font-weight: bold;
            font-size: 14px;
            color: #333;
            text-align: left;
            margin: 0 0 25px 20px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            padding-bottom: 15px;
        }

        .timeline-title::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 0.5px;
            /*background: linear-gradient(to right, #e0e0e0, #a0a0a0, #e0e0e0);*/
            background: linear-gradient(to right,
            rgba(224,224,224,0.8),
            rgba(224,224,224,0.8),
            rgba(224,224,224,0.8)); /* 添加透明度使线条更柔和 */
            box-shadow: 0 0.5px 1px rgba(0,0,0,0.07);
        }

        .track-rcol {
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            /*width: 450px;*/
            /*!*border: 1px solid #eee;*!*/
            /*margin: 20px auto;*/
            /*background: transparent;*/
        }
        .track-list {
            margin: 20px;
            padding-left: 5px;
            position: relative;
        }
        .track-list ul {
            padding-left: 0;
        }
        .track-list li {
            position: relative;
            padding: 5px 0 10px 25px;
            line-height: 1.4;
            border-left: 2px solid #d9d9d9;
            color: #666;
            list-style: none;
            /*text-align: left;*/
            transition: all 0.4s ease; /* 添加过渡效果 */
        }
        .track-list li.first {
            color: #666;
            padding-top: 0;
            /*border-left-color: #fff;*/
        }
        .track-list li .node-icon {
            position: absolute;
            left: -7px;
            top: 18px;
            width: 8px; /* 调圆点*/
            height: 8px;
            background: #C0C0C0;
            border-radius: 50%;
            transition: all 0.4s ease; /* 添加过渡效果 */
            border: 2px solid #E0E0E0;
            box-sizing: content-box;
        }
        .track-list li.first .node-icon {
            background: #C0C0C0; /* 天蓝色 */
            width: 8px;
            height: 8px;
            left: -8px;
        }
        .track-list li .time {
            display: block;
            margin-bottom: 3px;
            font-size: 11px;
            color: #888;
            transition: all 0.4s ease; /* 添加过渡效果 */
        }
        .track-list li .txt {
            display: block;
            font-size: 12px;
            transition: all 0.4s ease; /* 添加过渡效果 */
        }

        /* 悬停效果 */
        .track-list li:hover {
            color: #333;
        }
        .track-list li:hover .node-icon {
            transform: scale(1.3);
            background: #ed8088;
        }
        .track-list li:hover .time {
            color: #666;
        }

        /* 新增审核状态样式 */
        .approve-status {
            margin-top: 10px;
            text-align: center;
        }
        .approve-status label {
            margin: 0 10px;
            cursor: pointer;
        }
        .approve-status input {
            margin-right: 5px;
        }
    </style>
<div class="wrapper wrapper-content fadeInRight" style="position: absolute; left: -9999px;">
    <div class="row">
        <div class="col-sm-4">
            <div class="ibox ">
                <div class="ibox-content">
                    <div class="modal inmodal" id="lcjl_Moda" tabindex="-1" role="dialog" aria-hidden="true">

                                    </div>
                                </div>
                                <div class="modal-body">
                                    <!-- 流程记录标题 - 放在左上角 -->


                                    <!-- 流程记录内容 - 放在流程图下方 -->
                                    <div class="track-rcol">
                                        <div class="track-list">
                                            <ul id="event-list">
                                                <li class="first">
                                                    <i class="node-icon"></i>
                                                    <span class="time" id="current-time">等待操作...</span>
                                                    <span class="txt">[新增] - 哈尔滨信息工程学院</span>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-white but" data-dismiss="modal">关闭</button>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/ruoyi/js/page-render.js}"></script>
<script th:inline="javascript">
    var editFlag = /*[[${@permission.hasPermi('system:paper:edit')}]]*/ 'hidden';
    var removeFlag = /*[[${@permission.hasPermi('system:paper:remove')}]]*/ 'hidden';
    var editInfo = /*[[${@permission.hasPermi('system:paper:info')}]]*/ 'hidden';
    var revokeInfo = /*[[${@permission.hasPermi('system:paper:revoke')}]]*/ 'hidden';
    var XYPYFlag = /*[[${@permission.hasPermi('system:paper:xypy')}]]*/ 'hidden';
    var KYPYFlag = /*[[${@permission.hasPermi('system:paper:kypy')}]]*/ 'hidden';

    var proFlag = /*[[${@permission.hasPermi('system:paper:process')}]]*/ 'hidden';
    var Revoke = /*[[${@permission.hasPermi('system:paper:revoke')}]]*/ 'hidden';
    var KyRevoke = /*[[${@permission.hasPermi('system:paper:kyrevoke')}]]*/ 'hidden';
    var QWERDates = /*[[${@dict.getType('sci_paper_qwer')}]]*/ 'hidden';

    var PaperDates = /*[[${@dict.getType('sci_paper_ar')}]]*/ 'hidden';
    var KDates = /*[[${@dict.getType('sci_paper_k')}]]*/ 'hidden';

    var prefix = ctx + "system/paper";


    var rowSelected=$("#bootstrap-table").bootstrapTable('getSelections');
    // console.log(rowSelected);
    var ListRowId = [];
    function getUrl() {
        var year = localStorage.getItem("year");
        return prefix+"/list/?year="+year;
    }
  function initTable(options) {
        options.url = getUrl();
        $.table.init(options);
  }

    // 获取当前用户角色信息
    var userRole = '';
    var userRoles = [[${user.roles}]];

    if (userRoles) {
        for (var i = 0; i < userRoles.length; i++) {
            var roleKey = userRoles[i].roleKey;
            if (roleKey === 'admin') {
                userRole = 'admin';
                break;
            }
        }
    }

    if (!userRole && userRoles) {
        for (var i = 0; i < userRoles.length; i++) {
            var roleKey = userRoles[i].roleKey;
            if (roleKey === 'sci_tesearch') {
                userRole = 'sci_tesearch';
                break;
            } else if (roleKey === 'research') {
                userRole = 'research';
                break;
            } else if (['dept_teacher', 'discuss_college', 'dzgc_college', 'yssj_college',
                       'student_college', 'marxism_college', 'general'].indexOf(roleKey) !== -1) {
                userRole = 'dept_teacher';
                break;
            }
        }
    }

    if (!userRole) {
        userRole = 'teacher';
    }

    $(function() {
        // 根据角色动态渲染搜索区域
        function initSearchFields() {
            if (userRole === 'teacher') {
                $('.host-name-field').hide();
                $('.major-field').hide();
                $('.college-field').hide();
            } else if (userRole === 'research') {
                $('.host-name-field').show();
                $('.major-field').hide();
                $('.college-field').hide();
            } else if (userRole === 'dept_teacher') {
                $('.host-name-field').show();
                $('.major-field').show();
                $('.college-field').hide();
            } else if (userRole === 'sci_tesearch') {
                $('.host-name-field').show();
                $('.major-field').show();
                $('.college-field').show();
            } else if (userRole === 'admin') {
                $('.host-name-field').show();
                $('.major-field').show();
                $('.college-field').show();
            } else {
                $('.host-name-field').hide();
                $('.major-field').hide();
                $('.college-field').hide();
            }
        }
        initSearchFields();

        // 注册PageRender动作处理器
        PageRender.registerHandlers({
            'view': function(actionKey, data) {
                $.operate.detailTab(data.id + '/chakan');
            },
            'viewProcess': function(actionKey, data) {
                viewProcess(data.id + ',' + data.state);
            },
            'edit': function(actionKey, data) {
                $.operate.editTab(data.id);
            },
            'remove': function(actionKey, data) {
                $.operate.remove(data.id);
            },
            'submit': function(actionKey, data) {
                pushTh(data.id);
            },
            'review': function(actionKey, data) {
                $.operate.detailTab(data.id + '/pro');
            },
            'kyReview': function(actionKey, data) {
                $.operate.detailTab(data.id + '/kyc_approve');
            },
            'approve': function(actionKey, data) {
                var urlFlag = data.state === 'PAPER_JYS_AUDIT' ? 'pro' : 'kyc_approve';
                $.operate.detailTab(data.id + '/' + urlFlag);
            },
            'reject': function(actionKey, data) {
                var urlFlag = data.state === 'PAPER_JYS_AUDIT' ? 'pro' : 'kyc_approve';
                $.operate.detailTab(data.id + '/' + urlFlag);
            },
            'recall': function(actionKey, data) {
                $.ajax({
                    url: prefix + "/approve/" + data.id,
                    type: "post",
                    data: { operationType: "recall" },
                    success: function (result) {
                        if (result.code === 0) {
                            $.modal.msgSuccess("撤回成功");
                            $("#bootstrap-table").bootstrapTable('refresh');
                        } else {
                            $.modal.alertError(result.msg);
                        }
                    },
                    error: function () {
                        $.modal.alertError("撤回失败，请稍后重试");
                    }
                });
            }
        });

        // 绑定PageRender按钮点击事件
        $(document).off('click.prAction').on('click.prAction', 'button[data-action-key], a[data-action-key]', function(e) {
            e.preventDefault();
            var $btn = $(this);
            var actionKey = $btn.data('action-key');
            var confirmMsg = $btn.data('confirm');
            // 从最近的tr中获取行数据
            var $tr = $btn.closest('tr');
            var row = $('#bootstrap-table').bootstrapTable('getData')[$tr.data('index')];

            if (confirmMsg) {
                $.modal.confirm(confirmMsg, function() {
                    PageRender.dispatchAction(actionKey, row);
                });
            } else {
                PageRender.dispatchAction(actionKey, row);
            }
        });

        var options = {
        // url:getUrl($('table').attr('id')),
        createUrl: prefix + "/add",
        detailUrl: prefix + "/detail/{id}",
        updateUrl: prefix + "/edit/{id}",
        removeUrl: prefix + "/remove",
        exportUrl: prefix + "/export",
        modalName: "论文",
        clickToSelect: true,
        rowStyle: rowStyle0,
        pagination:true,
        pageSize: 10,
            onCheck: function(row) {
                ListRowId.push(row.id);
                // console.log(ListRowId);
            },
            onUncheck:function (row){
                var index = ListRowId.indexOf(row.id);
                if (index > -1) {
                    ListRowId.splice(index, 1);
                }
                // console.log(ListRowId);
            },
            columns: [
                {
                    checkbox: true,
                },
                {
                    field: 'number',
                    title: '序号',
                    width:5 ,
                    align:'center',
                    switchable:false,
                    formatter:function(value,row,index){
                        //return index+1; //序号正序排序从1开始

                        //通过表的#id 可以得到每页多少条
                        var pageSize=$('#bootstrap-table').bootstrapTable('getOptions').pageSize;
                        //通过表的#id 可以得到当前第几页
                        var pageNumber=$('#bootstrap-table').bootstrapTable('getOptions').pageNumber;
                        //返回每条的序号： 每页条数 * （当前页 - 1 ）+ 序号
                        return pageSize * (pageNumber - 1) + index + 1;
                    }
                },
                {
                    field: 'id',
                    title: 'id',
                    visible: false
                },
                {
                    field: 'college',
                    title: '学院',
                },
                {
                    field: 'researchRoom',
                    title: '专业',
                    visible: false
                },
                {
                    field: 'teacherName',
                    title: '教师姓名',
                    align: 'center',
                },

                {
                    field: 'paperTitle',
                    title: '论文名称',
                    align: 'center',
                },
                {
                    field: 'paperCategory',
                    title: '论文类别',
                    align: 'center',
                    formatter: function(value, row, index) {
                        return $.table.selectDictLabel(KDates, value);
                    }
                },
                {
                    field: 'publishedJournal',
                    title: '发表期刊',
                    align: 'center',
                },
                {
                    field: 'inclusionStatus',
                    title: '收录情况',
                    align: 'center',
                    visible: false,
                },
                {
                    field: 'search_web',
                    title: '收录网站',
                    align: 'center',
                    visible: false,
                },
                {
                    field: 'publicationTime',
                    title: '发表时间',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var date = new Date(value);
                        var year = date.getFullYear();
                        var month = (date.getMonth() + 1).toString().padStart(2, '0'); // 月份从0开始，所以要加1
                        var day = date.getDate().toString().padStart(2, '0');
                        return year + '-' + month + '-' + day;
                    }
                },
                {
                    field: 'isIndustryCollaborative',
                    title: '是否与行业联合发表',
                    align: 'center',
                    visible: false,
                },
                {
                    field: 'isLocalCollaborative',
                    title: '是否与地方联合发表',
                    align: 'center',
                    visible: false,
                },
                {
                    field: 'isInternationalCollaborative',
                    title: '是否与国际联合发表',
                    align: 'center',
                    visible: false,
                },
                {
                    field: 'isCrossDiscipline',
                    title: '是否是跨学科论文',
                    align: 'center',
                    visible: false,
                },
                {
                    field: 'estimatedScore',
                    title: '预计积分',
                    formatter: function(value, row, index) {
                        return row.firstPersonId == row.uid ? row.firstAuthorScore : row.secondPersonId == row.uid ? row.secondAuthorScore : row.thirdPersonId == row.uid ? row.thirdAuthorScore : row.fourthPersonId == row.uid ? row.fourthAuthorScore : row.communicationAuthorId == row.uid ? row.correspondingAuthorScore : 0;
                    }
                },
                {
                    field: 'paperRanking',
                    title: '个人排名',
                    formatter: function(value, row, index) {
                        return row.firstPersonId == row.uid ? '1' : row.secondPersonId == row.uid ? '2' : row.thirdPersonId == row.uid ? "3" : row.fourthPersonId == row.uid ? "4" : "不是作者";

                    }
                },
                {
                    field: 'approvalStage',
                    title: '审批阶段',
                    formatter: function (value, row, index) {
                        if (row.statusMeta) {
                            return PageRender.renderStatusToString(row.statusMeta);
                        }
                        return '<span class="label label-default">未知</span>';
                    }
                },
                {
                    field: 'researchScore',
                    title: '已获积分',
                    formatter: function (value, row, index) {
                        // 只有审批流程通过（状态为PAPER_PASSED）才显示分数，否则为0
                        if (row.state != 'PAPER_PASSED') {
                            return 0;
                        }
                        // 将非作者改为0
                        return row.firstPersonId == row.uid ? row.firstAuthorScore : row.secondPersonId == row.uid ? row.secondAuthorScore : row.thirdPersonId == row.uid ? row.thirdAuthorScore : row.fourthPersonId == row.uid ? row.fourthAuthorScore : row.communicationAuthorId == row.uid ? row.correspondingAuthorScore : 0;
                    }
                },
                {
                    title: '操作',
                    align: 'center',
                    width: '200px',
                    formatter: function(value, row, index) {
                        if (row.actions && row.actions.length > 0) {
                            // 将查看和查看流程放在第二行，其余按钮放在第一行
                            var firstLineActions = [];
                            var secondLineActions = [];
                            
                            row.actions.forEach(function(a) {
                                if (a.actionKey === 'view' || a.actionKey === 'viewProcess') {
                                    secondLineActions.push(a);
                                } else if (a.actionKey !== 'approve' && a.actionKey !== 'reject') {
                                    firstLineActions.push(a);
                                }
                            });
                            
                            var firstLineHtml = firstLineActions.length > 0 ? PageRender.renderActionsToString(firstLineActions, {style: 'table'}) : '';
                            var secondLineHtml = secondLineActions.length > 0 ? PageRender.renderActionsToString(secondLineActions, {style: 'table'}) : '';
                            
                            if (firstLineHtml && secondLineHtml) {
                                return '<div style="margin-bottom: 5px;">' + firstLineHtml + '</div>' + secondLineHtml;
                            } else if (firstLineHtml) {
                                return firstLineHtml;
                            } else {
                                return secondLineHtml;
                            }
                        }
                        // 兜底：后端未返回actions时显示基本操作
                        var firstLineActions = [];
                        var secondLineActions = [];
                        
                        if (editInfo !== 'hidden') {
                            firstLineActions.push('<a href="javascript:void(0)" class="btn btn-xs btn-info" onclick="$.operate.detailTab(\'' + row.id + '/chakan\')">查看</a>');
                            secondLineActions.push('<a href="javascript:void(0)" class="btn btn-xs btn-info" onclick="viewProcess(\'' + row.id + ',' + row.state + '\')">查看流程</a>');
                        }
                        
                        var html = '';
                        if (firstLineActions.length > 0) {
                            html += '<div style="margin-bottom: 5px;">' + firstLineActions.join(' ') + '</div>';
                        }
                        if (secondLineActions.length > 0) {
                            html += secondLineActions.join(' ');
                        }
                        return html;
                    }
                }]
        };
        initTable(options);

        window.addEventListener("storage",function (event) {
            if (event.key === "year") {
                $('#bootstrap-table').bootstrapTable("destroy")
                initTable(options);
            }
        })
    });


</script>
<script>
    function pushTh(id) {
        var url = prefix + "/tj/" + id;
        $.ajax({
            url: url,
            type: "post",
            success: function (data) {
                $("#bootstrap-table").bootstrapTable('refresh');
            }
        })
    }
    function  exportExcel(formId,ListRowId) {
        // console.log('typeof formId:', typeof formId);
        table.set();
        $.modal.confirm("确定导出" + table.options.modalName + "吗？", function() {
            var currentId = $.common.isEmpty(formId) ? $('form').attr('id') : formId;
            var params = $("#" + table.options.id).bootstrapTable('getOptions');
            var dataParam = $("#" + currentId).serializeArray();
            dataParam.push({ "name": "orderByColumn", "value": params.sortName });
            dataParam.push({ "name": "isAsc", "value": params.sortOrder });
            // console.log("dataParam:1:",dataParam);
            // 添加选中行的ID到参数中
            if (ListRowId.length > 0) {
                dataParam.push({ "name": "ListRowId", "value": ListRowId.join(',') });
            }
            $.modal.loading("正在导出数据，请稍候...");
            $.post(table.options.exportUrl, dataParam, function(result) {
                if (result.code == web_status.SUCCESS) {
                    window.location.href = ctx + "common/download?fileName=" + encodeURI(result.msg) + "&delete=" + true;
                } else if (result.code == web_status.WARNING) {
                    $.modal.alertWarning(result.msg)
                } else {
                    $.modal.alertError(result.msg);
                }
                $.modal.closeLoading();
            });
        });
    }
    function viewProcess(kidd) {
        const kid = kidd.split(",")[0];   //id
        const state = kidd.split(",")[1]; //状态
        showhistory(kid, state);
    }

    function showhistory(id,state) {
        updateProgressStepColor(state)
        //查询批阅记录
        $.ajax({
            url: prefix + '/bhxs/' + id,
            type: 'POST',
            data: {
                kid: id
            },
            success: function (response) {
                const eventList = document.getElementById('event-list');
                eventList.innerHTML = '';
                response.rows.sort((a, b) => new Date(b.create_time) - new Date(a.create_time));
                response.rows.forEach(function (row) {
                    const li = document.createElement('li');
                    li.innerHTML = `

                        <div class="event-item">
                            <div class="event-content">
                                <i class="node-icon"></i>
                                <span class="time" id="current-time">${row.create_time}</span>
                                <span class="txt">[${row.state}] - ${row.uname}</span>
                            </div>
                        </div>
                    `;
                    eventList.appendChild(li);
                });
                // 打开模态框
                $('#lcjl_Moda').modal('show');
            },
            error: function () {
                alert('Failed to fetch event history.');
            }
        });
    }

    function updateProgressStepColor(state) {
        // 获取所有步骤元素
        const steps = document.querySelectorAll('.progress_inner__step');
        const progressBar = document.querySelector('.progress_inner__bar--progress');

        // 遍历所有步骤，重置样式
        steps.forEach(step => {
            step.classList.remove('active', 'completed', 'pending');
            step.querySelector('.status-text').classList.remove('active', 'completed');
        });

        // 重置进度条
        progressBar.style.width = '0';

        // 根据 state 设置相应的步骤颜色
        if (state === 'PAPER_DRAFT') { // 待提交状态
            document.getElementById('step-1').classList.add('active');
            document.getElementById('step-1').querySelector('.status-text').classList.add('active');
            progressBar.style.width = '0';
        } else if (state === 'PAPER_PASSED') { // 已完成状态
            document.getElementById('step-1').classList.add('completed');
            document.getElementById('step-1').querySelector('.status-text').classList.add('completed');
            document.getElementById('step-2').classList.add('completed');
            document.getElementById('step-2').querySelector('.status-text').classList.add('completed');
            document.getElementById('step-3').classList.add('completed');
            document.getElementById('step-3').querySelector('.status-text').classList.add('completed');
            progressBar.style.width = '100%';
        } else if (['PAPER_JYS_AUDIT', 'PAPER_KYC_AUDIT', 'PAPER_REJECTED'].includes(state)) { // 审核中状态
            // 待提交步骤高亮为 completed
            document.getElementById('step-1').classList.add('completed');
            document.getElementById('step-1').querySelector('.status-text').classList.add('completed');

            // 审核中步骤高亮为 active
            document.getElementById('step-2').classList.add('active');
            document.getElementById('step-2').querySelector('.status-text').classList.add('active');

            // 进度条宽度设置为 45%
            progressBar.style.width = '45%';
        } else { // 默认情况下，所有步骤为灰色
            steps.forEach(step => {
                step.classList.add('pending');
                step.querySelector('.status-text').classList.add('pending');
            });
        }
    }


    // 定义getCurrentTime函数
    function getCurrentTime() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
    }

    document.addEventListener('DOMContentLoaded', function () {
        // 初始化显示当前时间
        const currentTimeElement = document.getElementById('current-time');
        if (currentTimeElement) {
            currentTimeElement.textContent = getCurrentTime();
        }
    });


    function rowStyle0(row, index) {
        // 定义状态值与颜色的映射关系
        const stateColorMap = {
            'PAPER_PASSED': '#67c23a', // 完结 绿色
            'PAPER_REJECTED': '#e6a344', 'PAPER_DRAFT': '#e6a344', // 被驳回，草稿 黄色
            'PAPER_JYS_AUDIT': '#2c99ff', 'PAPER_KYC_AUDIT': '#2c99ff' // 审核中 蓝色
        };

        // 统一将 row.state 转换为字符串进行查找
        const state = String(row.state);

        // 根据状态值查找对应的颜色
        if (state in stateColorMap) {
            return {
                css: { color: stateColorMap[state] }
            };
        }

        // 默认样式（可自定义）
        return {
            css: { color: '#000000' } // 默认黑色
        };
    }

    // 批量下载状态变量
    var batchDownloadInProgress = false;

    /**
     * 批量下载功能
     * @param {string} module - 模块类型，如：'paper' 等
     */
    function batchDownload(module) {
        // 1. 获取选中的数据ID列表
        var ids = $.table.selectColumns("id", false);
        
        // 2. 校验：未选择数据时提示
        if (!ids || ids.length === 0) {
            $.modal.alertWarning("未选择数据");
            return;
        }
        
        // 3. 防止重复提交
        if (batchDownloadInProgress) {
            $.modal.alertWarning("批量下载正在处理中，请稍候...");
            return;
        }
        
        batchDownloadInProgress = true;
        $.modal.loading("正在打包下载，请稍候...");
        
        // 4. 创建 XMLHttpRequest 发送请求
        var xhr = new XMLHttpRequest();
        xhr.open("GET", ctx + "common/batchDownload?ids="
            + encodeURIComponent(ids.join(","))
            + "&module=" + encodeURIComponent(module), true);
        
        // 5. 设置响应类型为 blob（二进制流）
        xhr.responseType = "blob";
        xhr.timeout = 10 * 60 * 1000; // 10分钟超时
        
        // 6. 请求成功回调
        xhr.onload = function () {
            var blob = xhr.response;
            var contentDisposition = xhr.getResponseHeader("Content-Disposition") || "";
            var contentType = xhr.getResponseHeader("Content-Type") || "";
            
            // 判断是否为文件下载响应
            var isDownloadResponse = contentDisposition.indexOf("attachment") !== -1
                || contentType.indexOf("application/zip") !== -1;
            
            if (xhr.status >= 200 && xhr.status < 300 && isDownloadResponse) {
                // 触发文件下载
                triggerBlobDownload(blob, parseDownloadFileName(contentDisposition));
                finishBatchDownload();
            } else {
                // 处理错误响应
                readBlobAsText(blob, function (text) {
                    $.modal.alertError(extractDownloadErrorMessage(text));
                    finishBatchDownload();
                });
            }
        };
        
        // 7. 错误处理
        xhr.onerror = function () {
            $.modal.alertError("批量下载失败，请检查网络或稍后重试");
            finishBatchDownload();
        };
        
        xhr.ontimeout = function () {
            $.modal.alertError("批量下载超时，请稍后重试");
            finishBatchDownload();
        };
        
        // 8. 发送请求
        xhr.send();
    }

    // 辅助函数：触发 Blob 文件下载
    function triggerBlobDownload(blob, fileName) {
        var resolvedFileName = fileName || "批量下载.zip";
        
        // IE浏览器兼容
        if (window.navigator.msSaveOrOpenBlob) {
            window.navigator.msSaveOrOpenBlob(blob, resolvedFileName);
            return;
        }
        
        // 标准浏览器
        var downloadUrl = window.URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.style.display = "none";
        link.href = downloadUrl;
        link.download = resolvedFileName;
        document.body.appendChild(link);
        link.click();
        
        // 清理
        setTimeout(function () {
            document.body.removeChild(link);
            window.URL.revokeObjectURL(downloadUrl);
        }, 100);
    }

    // 辅助函数：从 Content-Disposition 解析文件名
    function parseDownloadFileName(contentDisposition) {
        if (!contentDisposition) return "";
        
        // 尝试 UTF-8 编码的文件名
        var utf8Match = contentDisposition.match(/filename\*=UTF-8''([^;]+)/i);
        if (utf8Match && utf8Match[1]) {
            return decodeURIComponent(utf8Match[1]).replace(/["']/g, "");
        }
        
        // 尝试普通文件名
        var fileNameMatch = contentDisposition.match(/filename="?([^";]+)"?/i);
        return fileNameMatch && fileNameMatch[1]
            ? decodeURIComponent(fileNameMatch[1])
            : "";
    }

    // 辅助函数：重置下载状态
    function finishBatchDownload() {
        batchDownloadInProgress = false;
        $.modal.closeLoading();
    }

    // 辅助函数：读取 Blob 为文本
    function readBlobAsText(blob, callback) {
        if (!blob) {
            callback("");
            return;
        }
        var reader = new FileReader();
        reader.onload = function (e) {
            callback(e.target.result);
        };
        reader.onerror = function () {
            callback("");
        };
        reader.readAsText(blob);
    }

    // 辅助函数：提取错误信息
    function extractDownloadErrorMessage(text) {
        try {
            var obj = JSON.parse(text);
            return obj.msg || "批量下载失败";
        } catch (e) {
            return text || "批量下载失败";
        }
    }
</script>
