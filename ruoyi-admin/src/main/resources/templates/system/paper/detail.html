<style>
    #contractFileName{
        display: none!important
    }
    #wordFileName{
        display: none!important
    }
    
    /* 论文网址链接样式 */
    .url-link {
        display: block !important;
        text-decoration: none !important;
        color: #555 !important;
        cursor: pointer !important;
        padding: 6px 12px !important;
        border: 1px solid #ccc !important;
        border-radius: 4px !important;
        background-color: #fff !important;
        transition: all 0.3s ease !important;
        word-break: break-all !important;
        line-height: 1.4 !important;
    }
    
    .url-link:hover {
        color: #23527c !important;
        text-decoration: underline !important;
        border-color: #66afe9 !important;
        box-shadow: 0 0 8px rgba(102, 175, 233, 0.6) !important;
    }
    
    /* 空网址样式 */
    .url-empty {
        cursor: default !important;
        color: #999 !important;
        text-decoration: none !important;
    }
    
    .url-empty:hover {
        color: #999 !important;
        text-decoration: none !important;
        border-color: #ccc !important;
        box-shadow: none !important;
        background-color: #f8f9fa !important;
    }
    
    /* 确保form-control容器高度合适 */
    .url-link-container {
        line-height: 34px !important;
    }

</style>

<script th:inline="javascript">
    var prefix = ctx + "system/paper";
    var QWERDates = [[${@dict.getType('sci_paper_qwer')}]];

    function displayFileName(inputId, fileNameId) {
        const input = document.getElementById(inputId);
        const fileNameSpan = document.getElementById(fileNameId);
        if (input.value) {
            const fileName = input.value.split('/').pop(); // 获取文件名
            const parts = fileName.split('_'); // 按下划线分割
            const firstPart = parts[0]; // 下划线前的部分
            fileNameSpan.textContent = `${firstPart}`; // 组合并显示
        } else {
            fileNameSpan.textContent = '';
        }
    }
    function chakanpaper(){
        var relativePath = $("#text_paper").val();
        if (!relativePath) {
            alert("没有可预览的文件！");
            return;
        }
        
        // 检查是否为MinIO文件（路径以/minio/开头）
        if (relativePath.startsWith('/minio/')) {
            // 对于MinIO文件，使用新的预览接口
            var contextPath = '/' + window.location.pathname.split('/')[1];
            var previewUrl = window.location.origin + contextPath + '/common/preview?fileName=' + encodeURIComponent(relativePath);
            window.open(previewUrl, '_blank');
        } else {
            // 对于本地文件，按原方式处理
            var contextPath = '/' + window.location.pathname.split('/')[1];
            var fullPath = window.location.origin + contextPath + relativePath;
            window.open(fullPath, '_blank');
        }
    }

    function downloadFile(type){
        var relativePath = $("#" + type).val();
        if (!relativePath) {
            alert("没有可下载的文件！");
            return;
        }

        var downloadUrl;
        // 检查是否为MinIO文件（路径以/minio/开头）
        if (relativePath.startsWith('/minio/')) {
            // 对于MinIO文件，使用通用下载接口
            var contextPath = '/' + window.location.pathname.split('/')[1];
            downloadUrl = window.location.origin + contextPath + '/common/download?fileName=' + encodeURIComponent(relativePath);
        } else {
            // 对于本地文件，按原方式处理
            var contextPath = '/' + window.location.pathname.split('/')[1];
            downloadUrl = window.location.origin + contextPath + relativePath;
        }
        if(downloadUrl){
            var a = document.createElement("a");
            a.href=downloadUrl;
            a.download="";
            a.style.display = "none";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }else{
            alert("网址无效");
        }
    }

    $(function() {
        // 注册PageRender动作处理器
        PageRender.registerHandlers({
            'view': function(actionKey, data) {
                closeItem();
            },
            'viewProcess': function(actionKey, data) {
                viewProcess(data.id);
            },
            'approve': function(actionKey, data) {
                submitHandler();
            },
            'reject': function(actionKey, data) {
                submitHandlerBH();
            },
            'recall': function(actionKey, data) {
                submitHandlerBH();
            }
        });

        // 使用PageRender渲染底部按钮
        var paperActions = /*[[${actionsJson}]]*/ null;
        if (typeof paperActions === 'string') {
            try {
                paperActions = JSON.parse(paperActions);
            } catch (e) {
                paperActions = [];
            }
        }
        if (!paperActions) {
            paperActions = [];
        }
        var urlFlag = $("#urlFlag").val();
        var state = $("#state").val();

        if (paperActions && paperActions.length > 0) {
            // 根据urlFlag过滤按钮
            var filteredActions = paperActions.filter(function(action) {
                if (urlFlag === 'chakan' || urlFlag === 'LW') {
                    // 查看模式不显示任何操作按钮，只保留关闭按钮
                    return false;
                }
                if (urlFlag === 'pro' || urlFlag === 'kyc_approve') {
                    return action.actionKey === 'approve' || action.actionKey === 'reject';
                }
                if (urlFlag === 'jys_recall' || urlFlag === 'kyc_recall' || urlFlag === 'proth') {
                    return action.actionKey === 'recall';
                }
                return true;
            });

            var $container = $('#action-buttons-container');
            if (filteredActions.length > 0) {
                PageRender.renderActions($container, filteredActions, {style: 'page'}, {
                    id: $("#pid").val(),
                    state: state,
                    urlFlag: urlFlag
                });
            }
            // 始终添加关闭按钮
            $container.append('<button type="button" class="btn btn-sm btn-default" onclick="closeItem()"> 关 闭 </button>');
        } else {
            // 后端未返回actions时，使用旧逻辑兜底
            var $container = $('#action-buttons-container');
            if (urlFlag === 'chakan' || urlFlag === 'LW') {
                $container.html('<button type="button" class="btn btn-sm btn-default" onclick="closeItem()"> 关 闭 </button>');

                if (['pro', 'kyc_approve'].includes(urlFlagVal)) {

    function submitHandler() {
        var paperCategory = $("#paperCategory").val();
        var remark = $('#remark').val();
        // 构建完整的URL
        var Url = prefix + "/approve/" + encodeURIComponent($("#pid").val());

        $.operate.saveTab(Url, {"comment": remark,"paperCategory":paperCategory, "operationType": "approve"}, function(response){
            // console.log("Server response:", response);
        });
    }

    function submitHandlerBH() {
        var urlFlag = $("#urlFlag").val();
        var operationType = '';
        
        // 根据urlFlag确定操作类型
        if (['pro', 'kyc_approve', 'xytg', 'kytg'].includes(urlFlag)) {
            operationType = 'reject';
            // 驳回不能不写批注
            if (!$('#remark').val().trim()) {
                $.modal.msgWarning("批注不能为空");
                return false;
            }
        } else if (['proth', 'jys_recall', 'kyc_recall'].includes(urlFlag)) {
            operationType = 'recall';
        }
        
        if ($.validate.form() && operationType) {
            var remark = $('#remark').val();
            var url = prefix + "/approve/" + encodeURIComponent($("#pid").val());

            if (operationType === 'reject') {
                $.modal.confirm("确定 驳回 吗" ,function() {
                    $.operate.saveTab(url, {"operationType": operationType, "comment": remark});
                });
            } else if (operationType === 'recall') {
                $.modal.confirm("确定 撤回 吗" ,function() {
                    $.operate.saveTab(url, {"operationType": operationType, "comment": remark});
                });
            }
        } else {
            // console.error("Form validation failed");
        }
    }


    $("input[name='publicationTime']").datetimepicker({
        format: "yyyy-mm-dd",

    });

    // 自定义tooltip功能
    function showTooltip(element) {
        var fullText = element.getAttribute('title') || element.textContent || element.innerText;
        if (!fullText || fullText.trim() === '') return; // 如果文本为空，不显示tooltip
        
        var tooltip = document.getElementById('custom-tooltip');
        if (!tooltip) {
            tooltip = document.createElement('div');
            tooltip.id = 'custom-tooltip';
            tooltip.style.cssText = `
                position: absolute;
                background: #333;
                color: white;
                padding: 8px 12px;
                border-radius: 4px;
                font-size: 14px;
                max-width: 600px;
                word-wrap: break-word;
                z-index: 9999;
                box-shadow: 0 2px 8px rgba(0,0,0,0.3);
                display: none;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            `;
            document.body.appendChild(tooltip);
        }
        
        // 显示tooltip（只要鼠标悬停就显示）
        tooltip.textContent = fullText;
        tooltip.style.display = 'block';
        
        var rect = element.getBoundingClientRect();
        var tooltipRect = tooltip.getBoundingClientRect();
        
        // 计算tooltip位置，确保不超出屏幕边界
        var left = rect.left;
        var top = rect.bottom + 5;
        
        // 如果右侧超出屏幕，调整到左侧
        if (left + tooltipRect.width > window.innerWidth) {
            left = window.innerWidth - tooltipRect.width - 10;
        }
        
        // 如果下方超出屏幕，调整到上方
        if (top + tooltipRect.height > window.innerHeight) {
            top = rect.top - tooltipRect.height - 5;
        }
        
        // 确保不超出左边界
        if (left < 10) {
            left = 10;
        }
        
        tooltip.style.left = left + 'px';
        tooltip.style.top = top + 'px';
    }
    
    function hideTooltip() {
        var tooltip = document.getElementById('custom-tooltip');
        if (tooltip) {
            tooltip.style.display = 'none';
        }
    }

    function initPublicationTime() {
        var publicationTime = /*[[${sciPaperA.publicationTime}]]*/ '';
        if (publicationTime) {
            var date = new Date(publicationTime);
            var year = date.getFullYear();
            var month = (date.getMonth() + 1).toString().padStart(2, '0');
            var day = date.getDate().toString().padStart(2, '0');
            var formattedDate = year + '-' + month + '-' + day;
            $('#publicationTimeDisplay').val(formattedDate);
        }
    }
    
    // 获取当前作者信息
    function getCurrentAuthors() {
        const authors = {};
        
        // 只有当作者存在时才添加到对象中
        if ($('#firstPersonId').length > 0) {
            authors['1'] = $('#firstPersonId').val();
        }
        if ($('#secondPersonId').length > 0) {
            authors['2'] = $('#secondPersonId').val();
        }
        if ($('#thirdPersonId').length > 0) {
            authors['3'] = $('#thirdPersonId').val();
        }
        if ($('#fourthPersonId').length > 0) {
            authors['4'] = $('#fourthPersonId').val();
        }
        
        return authors;
    }
    
    // 计算并更新分数
        function calculateAndUpdateScores() {
            const paperCategory = $('select[name="paperCategory"]').val();
            const authors = getCurrentAuthors();
            const communicationAuthorId = $('#correspondingAuthorId').val();
            
            // 如果论文类别未选择，不计算分数
            if (!paperCategory) {
                // 只清空存在的输入框
                if ($('#expectedScore1').length > 0) $('#expectedScore1').val('');
                if ($('#expectedScore2').length > 0) $('#expectedScore2').val('');
                if ($('#expectedScore3').length > 0) $('#expectedScore3').val('');
                if ($('#expectedScore4').length > 0) $('#expectedScore4').val('');
                if ($('#expectedScore5').length > 0) $('#expectedScore5').val('');
                return;
            }
            
            // 构造请求数据
            const requestData = {
                paperCategory: paperCategory,
                authors: authors,
                communicationAuthorId: communicationAuthorId || ''
            };
            
            // 调用后端API计算分数
            $.ajax({
                url: prefix + '/calculateScore',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(requestData),
                success: function(response) {
                    if (response.code === 0) {
                        const scores = response.data;
                        // 更新各作者分数显示
                        updateAuthorScores(scores, authors, communicationAuthorId);
                    } else {
                        // 只清空存在的输入框
                        if ($('#expectedScore1').length > 0) $('#expectedScore1').val('');
                        if ($('#expectedScore2').length > 0) $('#expectedScore2').val('');
                        if ($('#expectedScore3').length > 0) $('#expectedScore3').val('');
                        if ($('#expectedScore4').length > 0) $('#expectedScore4').val('');
                        if ($('#expectedScore5').length > 0) $('#expectedScore5').val('');
                    }
                },
                error: function(xhr, status, error) {
                    // 只清空存在的输入框
                    if ($('#expectedScore1').length > 0) $('#expectedScore1').val('');
                    if ($('#expectedScore2').length > 0) $('#expectedScore2').val('');
                    if ($('#expectedScore3').length > 0) $('#expectedScore3').val('');
                    if ($('#expectedScore4').length > 0) $('#expectedScore4').val('');
                    if ($('#expectedScore5').length > 0) $('#expectedScore5').val('');
                }
            });
        }
        
        // 更新作者分数显示
        function updateAuthorScores(scores, authors, communicationAuthorId) {
            // 存储各作者分数
            let firstAuthorScore = 0;
            let secondAuthorScore = 0;
            let thirdAuthorScore = 0;
            let fourthAuthorScore = 0;
            
            // 更新一作分数
            if ($('#expectedScore1').length > 0 && authors['1']) {
                const firstKey = '1_' + authors['1'];
                firstAuthorScore = scores[firstKey] || 0;
                $('#expectedScore1').val(firstAuthorScore > 0 ? firstAuthorScore : '');
            }
            
            // 更新二作分数
            if ($('#expectedScore2').length > 0 && authors['2']) {
                const secondKey = '2_' + authors['2'];
                secondAuthorScore = scores[secondKey] || 0;
                $('#expectedScore2').val(secondAuthorScore > 0 ? secondAuthorScore : '');
            }
            
            // 更新三作分数
            if ($('#expectedScore3').length > 0 && authors['3']) {
                const thirdKey = '3_' + authors['3'];
                thirdAuthorScore = scores[thirdKey] || 0;
                $('#expectedScore3').val(thirdAuthorScore > 0 ? thirdAuthorScore : '');
            }
            
            // 更新四作分数
            if ($('#expectedScore4').length > 0 && authors['4']) {
                const fourthKey = '4_' + authors['4'];
                fourthAuthorScore = scores[fourthKey] || 0;
                $('#expectedScore4').val(fourthAuthorScore > 0 ? fourthAuthorScore : '');
            }
            
            // 更新通讯作者分数
            if ($('#expectedScore5').length > 0) {
                if (communicationAuthorId) {
                    // 检查通讯作者是否是某个作者
                    let communicationScore = 0;
                    if (authors['1'] === communicationAuthorId) {
                        communicationScore = firstAuthorScore;
                    } else if (authors['2'] === communicationAuthorId) {
                        communicationScore = secondAuthorScore;
                    } else if (authors['3'] === communicationAuthorId) {
                        communicationScore = thirdAuthorScore;
                    } else if (authors['4'] === communicationAuthorId) {
                        communicationScore = fourthAuthorScore;
                    } else {
                        // 如果通讯作者不是任何作者，使用专门的通讯作者分数
                        const communicationKey = 'comm_' + communicationAuthorId;
                        communicationScore = scores[communicationKey] || 0;
                    }
                    $('#expectedScore5').val(communicationScore > 0 ? communicationScore : '');
                } else {
                    $('#expectedScore5').val('');
                }
            }
        }
</script>
