<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro"

</head>
<style>
  .track-rcol {
    width: 100%;
    max-width: 500px;
    margin: 0px auto;
    /*width: 450px;*/
    /*!*border: 1px solid #eee;*!*/
    /*margin: 20px auto;*/
    /*background: transparent;*/
    max-height: 400px;
    overflow-y: auto;
  }
  .modal-dialog.modal-right {
    width: 50%; /* 或者根据需要调整宽度 */
    max-width: 600px; /* 确保有足够的宽度 */
  }
  .del-link-button {
    background: none;
    border: none;
    color: #ff0000;
    cursor: pointer;
    font-size: inherit;
  }

  .modal-right {
    position: fixed;
    right: 0;
    margin: 0;
    height: 100%;
    display: flex;
    align-items: stretch;
  }

  .modal-right .modal-content {
    height: 100%;
    width: 100%;
  }
  .modal-right .but{
    position: absolute;
    right: 2%;
    bottom: 1.3%;
    background: red;
    color: white;
    border: none;
    border-radius: 4px;
  }

  .progress_inner {
    height: 80px;
    width: 100%;
    position: relative;
  }

  .progress_inner__step {
    width: 33.33%;
    font-size: 12px;
    padding: 0 5px;
    transition: all 0.4s;
    float: left;
    text-align: center;
    position: relative;
  }

  .progress_inner__step label {
    padding-top: 30px;
    display: block;
    position: relative;
    cursor: pointer;
  }

  .progress_inner__step:before {
    content: "1";
    width: 24px;
    height: 24px;
    color: #2196F3;
    background: white;
    line-height: 22px;
    border: 2px solid #2196F3;
    font-size: 12px;
    top: 0;
    border-radius: 50%;
    transition: all 0.4s;
    position: absolute;
    left: 0;
    right: 0;
    margin: auto;
    font-weight: bold;
    z-index: 11;
  }

  .progress_inner__step:nth-of-type(2):before {
    content: "2";
    color: #9E9E9E;
    border-color: #9E9E9E;
  }

  .progress_inner__step:nth-of-type(3):before {
    content: "3";
    color: #9E9E9E;
    border-color: #9E9E9E;
  }

  .progress_inner__step.completed:before {
    content: "✓";
    color: #4CAF50;
    border-color: #4CAF50;
    line-height: 22px;
    font-size: 14px;
  }

  .progress_inner__step.active:before {
    color: #2196F3;
    border-color: #2196F3;
    background: white;
  }

  .progress_inner__step.pending:before {
    color: #9E9E9E;
    border-color: #9E9E9E;
    background: white;
  }

  .progress_inner__bar {
    height: 3px;
    left: 16.665%;
    right: 16.665%;
    background: #E0E0E0;
    position: absolute;
    top: 12px;
    z-index: -1;
    border-radius: 3px;
    overflow: hidden;
  }

  .progress_inner__bar--progress {
    height: 100%;
    background: #4CAF50;
    width: 0;
    transition: width 0.6s ease;
  }

  /* 分段高亮连接线 */
  .progress_inner__bar .segment {
    position: absolute;
    height: 100%;
    width: 50%;
    background: transparent;
    transition: background 0.4s ease;
  }

  .progress_inner__bar .segment.first {
    left: 0;
  }

  .progress_inner__bar .segment.second {
    right: 0;
  }

  .progress_inner__bar .segment.highlight {
    background: #4CAF50;
    box-shadow: 0 0 8px rgba(10, 225, 19, 0.7);
  }

  .status-text {
    color: #9E9E9E;
    font-weight: normal;
    transition: all 0.4s;
    font-size: 12px;
  }

  .status-text.active {
    color: #2196F3;
    font-weight: bold;
  }

  .status-text.completed {
    color: #4CAF50;
    font-weight: bold;
  }


  button {
    background: #2196F3;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 3px;
    margin: 0 8px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.3s;
    font-size: 12px;
  }

  button:hover {
    background: #1976D2;
  }

  button:last-child {
    background: #9E9E9E;
  }

  button:last-child:hover {
    background: #757575;
  }

  /* 新增的流程记录样式 */
  .timeline-title {
    font-weight: bold;
    font-size: 14px;
    color: #333;
    text-align: left;
    margin: 0 0 25px 20px;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
    position: relative;
    padding-bottom: 15px;
  }

  .timeline-title::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 0.5px;
    background: linear-gradient(to right,
    rgba(224,224,224,0.8),
    rgba(224,224,224,0.8),
    rgba(224,224,224,0.8)); /* 添加透明度使线条更柔和 */
    box-shadow: 0 0.5px 1px rgba(0,0,0,0.07);
  }


  .track-list {
    margin: 20px;
    padding-left: 5px;
    position: relative;
  }
  .track-list ul {
    padding-left: 0;
  }
  .track-list li {
    position: relative;
    padding: 5px 0 10px 25px;
    line-height: 1.4;
    border-left: 2px solid #d9d9d9;
    color: #666;
    list-style: none;
    transition: all 0.4s ease; /* 添加过渡效果 */
  }
  .track-list li.first {
    color: #666;
    padding-top: 0;
  }
  .track-list li .node-icon {
    position: absolute;
    left: -7px;
    top: 18px;
    width: 8px; /* 调圆点*/
    height: 8px;
    background: #C0C0C0;
    border-radius: 50%;
    transition: all 0.4s ease; /* 添加过渡效果 */
    border: 2px solid #E0E0E0;
    box-sizing: content-box;
  }
  .track-list li.first .node-icon {
    background: #C0C0C0; /* 天蓝色 */
    width: 8px;
    height: 8px;
    left: -8px;
  }
  .track-list li .time {
    display: block;
    margin-bottom: 3px;
    font-size: 11px;
    color: #888;
    transition: all 0.4s ease; /* 添加过渡效果 */
  }
  .track-list li .txt {
    display: block;
    font-size: 12px;
    transition: all 0.4s ease; /* 添加过渡效果 */
  }

  /* 悬停效果 */
  .track-list li:hover {
    color: #333;
  }
  .track-list li:hover .node-icon {
    transform: scale(1.3);
    background: #ed8088;
  }
  .track-list li:hover .time {
    color: #666;
  }

  /* 新增审核状态样式 */
  .approve-status {
    margin-top: 10px;
    text-align: center;
  }
  .approve-status label {
    margin: 0 10px;
    cursor: pointer;
  }
  .approve-status input {
    margin-right: 5px;
  }
</style>

          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<script th:inline="javascript">
  var editFlag = [[${@permission.hasPermi('system:paper:edit')}]];

        console.log(ListRowId);
      },

      //   checkbox: false,

        {
          field: 'number',

            //通过表的#id 可以得到每页多少条

            var pageNumber=$('#bootstrap-table').bootstrapTable('getOptions').pageNumber;
            //返回每条的序号： 每页条数 * （当前页 - 1 ）+ 序号
            return pageSize * (pageNumber - 1) + index + 1;
          }

        {

    // 批量下载状态变量
    var batchDownloadInProgress = false;

    /**
     * 批量下载功能
     * @param {string} module - 模块类型，如：'paper' 等
     */
    function batchDownload(module) {
        // 1. 获取选中的数据ID列表
        var ids = $.table.selectColumns("id", false);
        
        // 2. 校验：未选择数据时提示
        if (!ids || ids.length === 0) {
            $.modal.alertWarning("未选择数据");
            return;
        }
        
        // 3. 防止重复提交
        if (batchDownloadInProgress) {
            $.modal.alertWarning("批量下载正在处理中，请稍候...");
            return;
        }
        
        batchDownloadInProgress = true;
        $.modal.loading("正在打包下载，请稍候...");
        
        // 4. 创建 XMLHttpRequest 发送请求
        var xhr = new XMLHttpRequest();
        xhr.open("GET", ctx + "common/batchDownload?ids="
            + encodeURIComponent(ids.join(","))
            + "&module=" + encodeURIComponent(module), true);
        
        // 5. 设置响应类型为 blob（二进制流）
        xhr.responseType = "blob";
        xhr.timeout = 10 * 60 * 1000; // 10分钟超时
        
        // 6. 请求成功回调
        xhr.onload = function () {
            var blob = xhr.response;
            var contentDisposition = xhr.getResponseHeader("Content-Disposition") || "";
            var contentType = xhr.getResponseHeader("Content-Type") || "";
            
            // 判断是否为文件下载响应
            var isDownloadResponse = contentDisposition.indexOf("attachment") !== -1
                || contentType.indexOf("application/zip") !== -1;
            
            if (xhr.status >= 200 && xhr.status < 300 && isDownloadResponse) {
                // 触发文件下载
                triggerBlobDownload(blob, parseDownloadFileName(contentDisposition));
                finishBatchDownload();
            } else {
                // 处理错误响应
                readBlobAsText(blob, function (text) {
                    $.modal.alertError(extractDownloadErrorMessage(text));
                    finishBatchDownload();
                });
            }
        };
        
        // 7. 错误处理
        xhr.onerror = function () {
            $.modal.alertError("批量下载失败，请检查网络或稍后重试");
            finishBatchDownload();
        };
        
        xhr.ontimeout = function () {
            $.modal.alertError("批量下载超时，请稍后重试");
            finishBatchDownload();
        };
        
        // 8. 发送请求
        xhr.send();
    }

    // 辅助函数：触发 Blob 文件下载
    function triggerBlobDownload(blob, fileName) {
        var resolvedFileName = fileName || "批量下载.zip";
        
        // IE浏览器兼容
        if (window.navigator.msSaveOrOpenBlob) {
            window.navigator.msSaveOrOpenBlob(blob, resolvedFileName);
            return;
        }
        
        // 标准浏览器
        var downloadUrl = window.URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.style.display = "none";
        link.href = downloadUrl;
        link.download = resolvedFileName;
        document.body.appendChild(link);
        link.click();
        
        // 清理
        setTimeout(function () {
            document.body.removeChild(link);
            window.URL.revokeObjectURL(downloadUrl);
        }, 100);
    }

    // 辅助函数：从 Content-Disposition 解析文件名
    function parseDownloadFileName(contentDisposition) {
        if (!contentDisposition) return "";
        
        // 尝试 UTF-8 编码的文件名
        var utf8Match = contentDisposition.match(/filename\*=UTF-8''([^;]+)/i);
        if (utf8Match && utf8Match[1]) {
            return decodeURIComponent(utf8Match[1]).replace(/["']/g, "");
        }
        
        // 尝试普通文件名
        var fileNameMatch = contentDisposition.match(/filename="?([^";]+)"?/i);
        return fileNameMatch && fileNameMatch[1]
            ? decodeURIComponent(fileNameMatch[1])
            : "";
    }

    // 辅助函数：重置下载状态
    function finishBatchDownload() {
        batchDownloadInProgress = false;
        $.modal.closeLoading();
    }

    // 辅助函数：读取 Blob 为文本
    function readBlobAsText(blob, callback) {
        if (!blob) {
            callback("");
            return;
        }
        var reader = new FileReader();
        reader.onload = function (e) {
            callback(e.target.result);
        };
        reader.onerror = function () {
            callback("");
        };
        reader.readAsText(blob);
    }

    // 辅助函数：提取错误信息
    function extractDownloadErrorMessage(text) {
        try {
            var obj = JSON.parse(text);
            return obj.msg || "批量下载失败";
        } catch (e) {
            return text || "批量下载失败";
        }
    }

//显示模态框上面的进度
function updateProgress(state) {
  // 获取所有步骤元素
  const steps = document.querySelectorAll('.progress_inner__step');
  const progressBar = document.querySelector('.progress_inner__bar--progress');

  // 遍历所有步骤，重置样式
  steps.forEach(step => {
    step.classList.remove('active', 'completed', 'pending');
    step.querySelector('.status-text').classList.remove('active', 'completed');
  });
  // 重置进度条
  progressBar.style.width = '0';

  // 根据 state 设置相应的步骤颜色
  if ([99].includes(state)) {
    document.getElementById('step-1').classList.add('active');
    document.getElementById('step-1').querySelector('.status-text').classList.add('active');
    progressBar.style.width = '0';
  } else if (state === 8) {
    document.getElementById('step-1').classList.add('completed');
    document.getElementById('step-1').querySelector('.status-text').classList.add('completed');
    document.getElementById('step-2').classList.add('completed');
    document.getElementById('step-2').querySelector('.status-text').classList.add('completed');
    document.getElementById('step-3').classList.add('completed');
    document.getElementById('step-3').querySelector('.status-text').classList.add('completed');
    progressBar.style.width = '100%';
  } else if ([1, 2, 4].includes(state)) {
    document.getElementById('step-1').classList.add('completed');
    document.getElementById('step-1').querySelector('.status-text').classList.add('completed');
    document.getElementById('step-2').classList.add('completed');
    document.getElementById('step-2').querySelector('.status-text').classList.add('completed');
    progressBar.style.width = '50%';
  } else {
    // 默认情况下，所有步骤为灰色
    steps.forEach(step => {
      step.classList.add('pending');
      step.querySelector('.status-text').classList.add('pending');
    });
  }
}
