<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改审批节点')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-node-edit" th:object="${sysApprovalNode}">
            <input name="id" type="hidden" th:field="*{id}">
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">所属流程：</label>
                <div class="col-sm-8">
                    <select class="form-control" name="processId" required>
                        <option value="">请选择流程</option>
                        <option th:each="process : ${processes}" th:value="${process.id}" th:text="${process.processName}" th:selected="${process.id == #object.processId}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">节点顺序：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="number" name="nodeOrder" th:field="*{nodeOrder}" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">节点编码：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" name="nodeCode" th:field="*{nodeCode}" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">节点名称：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" name="nodeNm" th:field="*{nodeNm}" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">关联部门ID：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" name="deptIds" th:field="*{deptIds}">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">关联角色ID：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" name="roleIds" th:field="*{roleIds}">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">关联角色Key：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" name="roleKeys" th:field="*{roleKeys}">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">通过后的状态：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" name="passState" th:field="*{passState}" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">驳回后的状态：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" name="rejectState" th:field="*{rejectState}" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">是否可转办：</label>
                <div class="col-sm-8">
                    <div class="radio-box">
                        <input type="radio" id="canTransferY" name="canTransfer" value="Y" th:checked="*{canTransfer == 'Y' || canTransfer == '1'}">
                        <label for="canTransferY">是</label>
                    </div>
                    <div class="radio-box">
                        <input type="radio" id="canTransferN" name="canTransfer" value="N" th:checked="*{canTransfer == 'N' || canTransfer == '0'}">
                        <label for="canTransferN">否</label>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">是否可撤回：</label>
                <div class="col-sm-8">
                    <div class="radio-box">
                        <input type="radio" id="canBackY" name="canBack" value="Y" th:checked="*{canBack == 'Y' || canBack == '1'}">
                        <label for="canBackY">是</label>
                    </div>
                    <div class="radio-box">
                        <input type="radio" id="canBackN" name="canBack" value="N" th:checked="*{canBack == 'N' || canBack == '0'}">
                        <label for="canBackN">否</label>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">排序：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="number" name="sort" th:field="*{sort}">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">状态：</label>
                <div class="col-sm-8">
                    <div class="radio-box">
                        <input type="radio" id="status0" name="status" value="0" th:checked="*{status == '0'}">
                        <label for="status0">启用</label>
                    </div>
                    <div class="radio-box">
                        <input type="radio" id="status1" name="status" value="1" th:checked="*{status == '1'}">
                        <label for="status1">停用</label>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">备注：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control">[[*{remark}]]</textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script type="text/javascript">
        var prefix = ctx + "approval/node";

        $("#form-node-edit").validate({
            onkeyup: false,
            rules: {
                processId: {
                    required: true
                },
                nodeOrder: {
                    required: true,
                    digits: true
                },
                nodeCode: {
                    required: true
                },
                nodeNm: {
                    required: true
                },
                passState: {
                    required: true
                },
                rejectState: {
                    required: true
                },
                sort: {
                    digits: true
                }
            },
            messages: {
                processId: {
                    required: "请选择所属流程"
                },
                nodeOrder: {
                    required: "请输入节点顺序",
                    digits: "节点顺序必须为数字"
                },
                nodeCode: {
                    required: "请输入节点编码"
                },
                nodeNm: {
                    required: "请输入节点名称"
                },
                passState: {
                    required: "请输入通过后的状态"
                },
                rejectState: {
                    required: "请输入驳回后的状态"
                }
            },
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-node-edit').serialize());
            }
        }
    </script>
</body>
</html>
