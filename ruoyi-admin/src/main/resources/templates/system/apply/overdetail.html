<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('课题结项审批')" />
    <th:block th:include="include :: datetimepicker-css" />
    <th:block th:include="include :: bootstrap-fileinput-css"/>
    <th:block th:include="include :: select2-css" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-apply-edit" th:object="${sciHorizontalApply}">
        <input name="urlFlag" id="urlFlag" th:field="*{urlFlag}"  type="hidden">
        <input name="state" id="state" th:field="*{state}" type="hidden">
        <input name="id" id="ktid" th:field="*{id}" type="hidden">
        <input name="amount" id="amount" th:field="*{amount}" type="hidden">
        <h4 class="form-header h4">基本信息</h4>
        <div class="row">
        <div class="col-xs-6">
            <div class="form-group">
                <label class="col-sm-4 control-label is-required">申请人：</label>
                <div class="col-sm-8">
               <input  readonly th:field="*{userName}" class="form-control" type="text" >
<!--                    <select name="userId" class="form-control m-b" readonly >-->
<!--                        <option th:each="user : ${sysUsers1}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${ user.userId == sciHorizontalApply.userId}"></option>-->
<!--                    </select>-->
                </div>
            </div>
        </div>
        <div class="col-xs-6">
            <div class="form-group">
                <label class="col-sm-4 control-label is-required">课题编号：</label>
                <div class="col-sm-8">
                    <input  readonly th:field="*{topNumber}" class="form-control" type="text">
                </div>
            </div>
        </div>
        <div class="col-xs-6">
            <div class="form-group">
                <label class="col-sm-4 control-label is-required">课题类型：</label>
                <div class="col-sm-8">

                    <select  readonly class="form-control" th:with="type=${@dict.getType('sci_top_type')}" required disabled>
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{topType}"></option>
                    </select>
                </div>
            </div>
        </div>
        <div class="col-xs-6">
            <div class="form-group">
                <label class="col-sm-4 control-label is-required">课题名称：</label>
                <div class="col-sm-8">
                    <input  readonly th:field="*{topName}" class="form-control" type="text" required>
                </div>
            </div>
        </div>
        <div class="col-xs-6">
            <div class="form-group">
                <label class="col-sm-4 control-label is-required">项目金额：</label>
                <div class="col-sm-8">
                    <input readonly th:field="*{amount}" class="form-control" type="text" required>
                </div>
            </div>
        </div>
        <div class="col-xs-6">
            <div class="form-group">
                <label class="col-sm-4 control-label is-required">结项日期：</label>
                <div class="col-sm-8">
                    <div class="input-group date">
                        <input  readonly th:field="*{validityDate}" th:value="${#dates.format(createtime, 'yyyy-MM-dd ')}" class="form-control"  placeholder="yyyy-MM-dd " type="text" required>
                        <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xs-6">
            <div class="form-group">
                <label class="col-sm-4 control-label is-required">主持人：</label>
                <div class="col-sm-8">
                    <select name="firstPersonId" class="form-control m-b" disabled>
                        <option value="">无</option>
                        <option th:each="user : ${sysUsers1}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${ #strings.toString(user.userId) == sciHorizontalApply.firstPersonId}"></option>
                    </select>
                </div>
            </div>
        </div>

        <div class="col-xs-6">
            <div class="form-group">
                <label class="col-sm-4 control-label is-required">成员1：</label>
                <div class="col-sm-8">
                    <select name="secondPersonId" class="form-control m-b" disabled >
                        <option value="">无</option>
                        <option th:each="user : ${sysUsers1}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${ #strings.toString(user.userId) == sciHorizontalApply.secondPersonId}" ></option>
                    </select>
                </div>
            </div>
        </div>

        <div class="col-xs-6">
            <div class="form-group">
                <label class="col-sm-4 control-label is-required">成员2：</label>
                <div class="col-sm-8">
                    <select  class="form-control m-b" disabled>
                        <option value="">无</option>
                        <option th:each="user : ${sysUsers1}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${ #strings.toString(user.userId) == sciHorizontalApply.thirdPersonId}"  ></option>
                    </select>
                </div>
            </div>
        </div>

        <div class="col-xs-6">
            <div class="form-group">
                <label class="col-sm-4 control-label is-required">成员3：</label>
                <div class="col-sm-8">
                    <select  class="form-control m-b" disabled>
                        <option value="">无</option>
                        <option th:each="user : ${sysUsers1}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${ #strings.toString(user.userId) == sciHorizontalApply.fourthPersonId}"  ></option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 其他成员（第5位及以后）：只读展示 -->
        <div class="col-xs-12" th:if="${extraMembers != null}">
            <div class="form-group">
                <label class="col-sm-2 control-label">其他成员：</label>
                <div class="col-sm-10">
                    <div id="memberContainer" class="row">
                        <div class="col-xs-3 m-b-xs" th:each="mid : ${extraMembers}">
                            <select class="form-control m-b" disabled>
                                <option th:each="user : ${sysUsers1}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${ #strings.toString(user.userId) == mid }"></option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <div class="col-xs-6">
            <div class="form-group">
                <label class="col-sm-4 control-label is-required">结题合同：</label>
                <div class="col-sm-8">
                    <input th:field="*{filingurl}" hidden id="filingurl" type="text" >
                    <div style="display: inline-block;">
                        <div id="filingurlFileName" style="display: inline; margin-right: 5px;"></div>
                    </div>
                    <div>
                        <button onclick="chakan()" class="btn btn-sm btn-primary color">预览</button>
                        <button onclick="downloadFile('filingurl')" class="btn btn-sm btn-primary color">下载</button>
                    </div>


                </div>
            </div>
        </div>
        <div class="col-xs-6">
            <div class="form-group">
                <label class="col-sm-4 control-label is-required">结题备案表：</label>
                <div class="col-sm-8">
                    <input th:field="*{agreeurl}" hidden id="agreeurl" type="text" >
                    <div style="display: inline-block;">
                        <div id="agreeurlFileName" style="display: inline; margin-right: 5px;"></div>
                    </div>
                    <div>
                        <button onclick="beian()" class="btn btn-sm btn-primary color">预览</button>
                        <button onclick="downloadFile('agreeurl')" class="btn btn-sm btn-primary color">下载</button>

                    </div>
                </div>
            </div>
        </div>
    </div>




        <h4 class="form-header h4 tdiv1" style="display:none;"> 批阅记录</h4>
        <div class="row tdiv1" style="display:none;">
            <div class="col-sm-12">
                <div class="form-group"  >
                    <label class="col-xs-2 control-label">批注：</label>
                    <div class="col-xs-10">
                        <textarea name="remark" required maxlength="500" class="form-control" rows="3"></textarea>
                    </div>
                </div>

            </div>
        </div>
        <h4 class="form-header h4 tdiv2"  style="display:none;">审批记录</h4>
        <div class="row tdiv2" style="display:none;">
            <div class="col-sm-12">

                <div class="form-group"  >
                    <table id='bootstrap-table'></table>
                </div>
            </div>
        </div>

    </form>
</div>
<div class="row">
    <div class="col-sm-offset-5 col-sm-10">
        <button type="button" id="btn1" style="display:none;" class="btn btn-sm btn-primary" onclick="submitHandler()">  通 过</button>&nbsp;
        <button type="button" id="btn2" style="display:none;" class="btn btn-sm btn-danger" onclick="submitHandlerBH()"> 驳 回</button>
        <button type="button" id="btn3" style="display:none;" class="btn btn-sm btn-warning" onclick="closeItem()"> 关 闭 </button>
    </div>
</div>
<th:block th:include="include :: footer" />
<th:block th:include="include :: datetimepicker-js" />
<th:block th:include="include :: bootstrap-fileinput-js"/>
<th:block th:include="include :: select2-js" />
<script type="text/javascript">
    function displayFileName(inputId, fileNameId) {
        const input = document.getElementById(inputId);
        const fileNameSpan = document.getElementById(fileNameId);
        if (input.value) {
            const fileName = input.value.split('/').pop(); // 获取最后一个'/'后的文件名
            fileNameSpan.textContent = fileName; // 直接显示完整文件名
        } else {
            fileNameSpan.textContent = '无效文件';
        }
    }
    function chakan() {
        var relativePath = $("#filingurl").val();
        if (!relativePath) {
            alert("没有可预览的文件！");
            return;
        }
        
        // 检查是否为MinIO文件（路径以/minio/开头）
        if (relativePath.startsWith('/minio/')) {
            // 对于MinIO文件，使用新的预览接口
            var contextPath = '/' + window.location.pathname.split('/')[1];
            var previewUrl = window.location.origin + contextPath + '/common/preview?fileName=' + encodeURIComponent(relativePath);
            window.open(previewUrl, '_blank');
        } else {
            // 对于本地文件，按原方式处理
            var contextPath = '/' + window.location.pathname.split('/')[1];
            var fullPath = window.location.origin + contextPath + relativePath;
            window.open(fullPath, '_blank');
        }
    }
    function beian(){
        var relativePath = $("#agreeurl").val();
        if (!relativePath) {
            alert("没有可预览的文件！");
            return;
        }
        
        // 检查是否为MinIO文件（路径以/minio/开头）
        if (relativePath.startsWith('/minio/')) {
            // 对于MinIO文件，使用新的预览接口
            var contextPath = '/' + window.location.pathname.split('/')[1];
            var previewUrl = window.location.origin + contextPath + '/common/preview?fileName=' + encodeURIComponent(relativePath);
            window.open(previewUrl, '_blank');
        } else {
            // 对于本地文件，按原方式处理
            var contextPath = '/' + window.location.pathname.split('/')[1];
            var fullPath = window.location.origin + contextPath + relativePath;
            window.open(fullPath, '_blank');
        }
    }

    function downloadFile(type){
        var relativePath = $("#" + type).val();
        if (!relativePath) {
            alert("没有可下载的文件！");
            return;
        }
        
        var downloadUrl;
        // 检查是否为MinIO文件（路径以/minio/开头）
        if (relativePath.startsWith('/minio/')) {
            // 对于MinIO文件，使用通用下载接口
            var contextPath = '/' + window.location.pathname.split('/')[1];
            downloadUrl = window.location.origin + contextPath + '/common/download?fileName=' + encodeURIComponent(relativePath);
        } else {
            // 对于本地文件，按原方式处理
            var contextPath = '/' + window.location.pathname.split('/')[1];
            downloadUrl = window.location.origin + contextPath + relativePath;
        }
        
        if(downloadUrl){
            var a = document.createElement("a");
            a.href=downloadUrl;
            a.download="";
            a.style.display = "none";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }else{
            alert("网址无效");
        }

    }
    $(function(){
        var kid = $("#ktid").val();
        var options = {
            url: prefix + "/bhyy/"+kid,
            showSearch: false,
            showRefresh: false,
            showToggle: false,
            showColumns: false,
            pagination:false,
            columns: [

                {
                    field : 'createTime',
                    title : '批阅时间',
                    width: 200

                } ,
                {
                    field : 'uname',
                    title : '批阅人',
                    width: 100
                },
                {
                    field : 'concate',
                    title : '内容',
                    width: 500
                },
                {
                    field : 'state',
                    title : '审核状态',
                    width: 100
                } ]
        };

        $.table.init(options);

        $('#bootstrap-table').on('load-success.bs.table', function (e, name, args) {
            console.log('Event Name:', name.rows);

            var a =$("#state").val();
            if ($("#urlFlag").val() == 'chakan'){
                $(".tdiv2").show();
                $("#btn3").show();
            }else{
                if(a == 7 ||a == 8 || a == 33){
                    if(name.rows.length > 0){
                        $(".tdiv2").show();
                    }
                    $(".tdiv1").show();
                    $("#btn1").show();
                    $("#btn2").show();
                    $("#btn3").show();
                }
            }


        });




        <!-- laydate示例 -->
        layui.use('laydate', function(){
            var laydate = layui.laydate;
            laydate.render({
                elem: '#laydate-demo-4',
                range: true
            });
            var startDate = laydate.render({
                elem: '#laydate-startTime',
                max: $('#laydate-endTime').val(),
                theme: 'molv',
                trigger: 'click',
                done: function(value, date) {
                    // 结束时间大于开始时间
                    if (value !== '') {
                        endDate.config.min.year = date.year;
                        endDate.config.min.month = date.month - 1;
                        endDate.config.min.date = date.date;
                    } else {
                        endDate.config.min.year = '';
                        endDate.config.min.month = '';
                        endDate.config.min.date = '';
                    }
                }
            });
            var endDate = laydate.render({
                elem: '#laydate-endTime',
                min: $('#laydate-startTime').val(),
                theme: 'molv',
                trigger: 'click',
                done: function(value, date) {
                    // 开始时间小于结束时间
                    if (value !== '') {
                        startDate.config.max.year = date.year;
                        startDate.config.max.month = date.month - 1;
                        startDate.config.max.date = date.date;
                    } else {
                        startDate.config.max.year = '';
                        startDate.config.max.month = '';
                        startDate.config.max.date = '';
                    }
                }
            });
        });
    });
</script>
<script th:inline="javascript">
    var prefix = ctx + "system/apply";
    $("#form-apply-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
          //获取 URLflag
          var a = $("#urlFlag").val();
            $.operate.saveTab(prefix + "/hxover", {"id":$("#ktid").val(),"urlFlag":a,"amount":$("#amount").val()});
    }
    function submitHandlerBH() {
        var a = $("#urlFlag").val();
        if ($.validate.form()) {
            $.operate.saveTab(prefix + "/hxoverBh",   $('#form-apply-edit').serialize());
         }
    }



    $(".file-download").fileinput({
        uploadUrl: ctx + 'common/upload/hxkt',
        maxFileCount: 1,
        maxFileSize: 51200,
        autoReplace: true,
        allowedFileExtensions: ["pdf"]
    }).on('fileuploaded', function (event, data, previewId, index) {
        $("input[name='" + event.currentTarget.id + "']").val(data.response.url)
    }).on('fileremoved', function (event, id, index) {
        $("input[name='" + event.currentTarget.id + "']").val('')
    })
    // 页面加载时显示文件名
    window.onload = function() {
        displayFileName('agreeurl', 'agreeurlFileName');
        displayFileName('filingurl', 'filingurlFileName');
    };
</script>
</body>
</html>
