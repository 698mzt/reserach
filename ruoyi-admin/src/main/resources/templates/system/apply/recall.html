<script type="text/javascript">
    function displayFileName(inputId, fileNameId) {
        const input = document.getElementById(inputId);
        const fileNameSpan = document.getElementById(fileNameId);
        if (input.value) {
            const fileName = input.value.split('/').pop(); // 获取文件名
            const parts = fileName.split('_'); // 按下划线分割
            const firstPart = parts[0]; // 下划线前的部分

            const dotParts = fileName.split('.'); // 按点分割
            const lastPart = dotParts[dotParts.length - 1]; // 点后的部分

            fileNameSpan.textContent = `${firstPart}.${lastPart}`; // 组合并显示
        } else {
            fileNameSpan.textContent = '';
        }
    }
    function chakan(type){
        var c = $("#"+type).val();
        window.open(c ,'_blank');
    }
    function beian(type){
        var c = $("#"+type).val();
        window.open(c ,'_blank' );
    }
    function downloadFile(type){
        var c = $("#"+type).val();
        if(c){
            var a = document.createElement("a");
            a.href=c;
            a.download="";
            a.style.display = "none";
            document.body.appendChild(a);
            a.click();
            document.Element.removeChild(a);
        }else{
            alert("网址无效");
        }

    }
    $(function(){
        var kid = $("#ktid").val();
        var options = {
            url: prefix + "/bhyy/"+kid,
            showSearch: false,
            showRefresh: false,
            showToggle: false,
            showColumns: false,
            pagination:false,
            columns: [

                {
                    field : 'createTime',
                    title : '批阅时间',
                    width: 200

                } ,
                {
                    field : 'uname',
                    title : '批阅人',
                    width: 100
                },
                {
                    field : 'concate',
                    title : '内容',
                    width: 500
                },
                {
                    field : 'state',
                    title : '审核状态',
                    width: 100
                } ]
        };

        $.table.init(options);

        $('#bootstrap-table').on('load-success.bs.table', function (e, name, args) {
            console.log('Event Name:', name.rows);

                $("#btn3").show();
                $(".tdiv2").show()

                $(".tdiv2").show();

                $(".tdiv1").show();
                $("#btn1").show();
                $("#btn2").show();
                $("#btn3").show();




        });




        <!-- laydate示例 -->
        layui.use('laydate', function(){
            var laydate = layui.laydate;
            // laydate.render({
            //     elem: '#laydate-demo-4',
            //     range: true
            // });
            var startDate = laydate.render({
                elem: '#laydate-startTime',
                max: $('#laydate-endTime').val(),
                theme: 'molv',
                trigger: 'click',
                done: function(value, date) {
                    // 结束时间大于开始时间
                    if (value !== '') {
                        endDate.config.min.year = date.year;
                        endDate.config.min.month = date.month - 1;
                        endDate.config.min.date = date.date;
                    } else {
                        endDate.config.min.year = '';
                        endDate.config.min.month = '';
                        endDate.config.min.date = '';
                    }
                }
            });
            var endDate = laydate.render({
                elem: '#laydate-endTime',
                min: $('#laydate-startTime').val(),
                theme: 'molv',
                trigger: 'click',
                done: function(value, date) {
                    // 开始时间小于结束时间
                    if (value !== '') {
                        startDate.config.max.year = date.year;
                        startDate.config.max.month = date.month - 1;
                        startDate.config.max.date = date.date;
                    } else {
                        startDate.config.max.year = '';
                        startDate.config.max.month = '';
                        startDate.config.max.date = '';
                    }
                }
            });
        });
    });
</script>
<script th:inline="javascript">
    var prefix = ctx + "system/apply";
    $("#form-apply-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {

        if ($.validate.form()) {
        $.operate.saveTab(prefix + "/recallsave", $('#form-apply-edit').serialize());
        }
    }
    // function submitHandlerBH() {
    //     var a = $("#urlFlag").val();
    //     if ($.validate.form()) {
    //         $.operate.saveTab(prefix + "/hxBh",   $('#form-apply-edit').serialize());
    //     }
    // }




    $(".file-upload").each(function (i) {
        var val = $("input[name='" + this.id + "']").val()
        $(this).fileinput({
            'uploadUrl': ctx + 'common/upload/hxkt',
            initialPreviewAsData: true,
            initialPreview: [val],
            maxFileCount: 1,
            autoReplace: true
        }).on('fileuploaded', function (event, data, previewId, index) {
            $("input[name='" + event.currentTarget.id + "']").val(data.response.url)
        }).on('fileremoved', function (event, id, index) {
            $("input[name='" + event.currentTarget.id + "']").val('')
        })
        $(this).fileinput('_initFileActions');
    });
    // 页面加载时显示文件名
    window.onload = function() {
        displayFileName('contract', 'contractFileName');
        displayFileName('filing', 'filingFileName');
        displayFileName('agreeurl', 'agreeurlFileName');
        displayFileName('filingurl', 'filingurlFileName');
    };
</script>
