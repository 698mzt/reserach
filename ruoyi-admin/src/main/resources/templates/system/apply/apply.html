<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('横向课题列表')" />
    <style>
        .track-list {
            margin: 20px;
            padding-left: 5px;
            position: relative;
        }

        .track-list ul {
            padding-left: 0;
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background-color: #f9f9f9;
            padding: 10px;
        }

        .track-list li {
            position: relative;
            padding: 5px 0 10px 25px;
            line-height: 1.4;
            border-left: 2px solid #d9d9d9;
            color: #666;
            transition: all 0.4s ease;
        }

        .modal-right {
            position: fixed;
            right: 0;
            margin: 0;
            height: 100%;
            display: flex;
            align-items: stretch;
        }

        .modal-right .modal-content {
            height: 100%;
            width: 70%;
            margin-left: auto;
        }
        .modal-right .but{
            position: absolute;
            right: 2%;
            bottom: 1.3%;
            background: red;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .progress_inner {
            height: 80px;
            width: 100%;
            position: relative;
        }

        .progress_inner__step {
            width: 33.33%;
            font-size: 12px;
            padding: 0 5px;
            transition: all 0.4s;
            float: left;
            text-align: center;
            position: relative;
        }

        .progress_inner__step label {
            padding-top: 30px;
            display: block;
            position: relative;
            cursor: pointer;
        }

        .progress_inner__step:before {
            content: "1";
            width: 24px;
            height: 24px;
            color: #2196F3;
            background: white;
            line-height: 22px;
            border: 2px solid #2196F3;
            font-size: 12px;
            top: 0;
            border-radius: 50%;
            transition: all 0.4s;
            position: absolute;
            left: 0;
            right: 0;
            margin: auto;
            font-weight: bold;
            z-index: 11;
        }

        .progress_inner__step:nth-of-type(2):before {
            content: "2";
            color: #9E9E9E;
            border-color: #9E9E9E;
        }

        .progress_inner__step:nth-of-type(3):before {
            content: "3";
            color: #9E9E9E;
            border-color: #9E9E9E;
        }

        .progress_inner__step.completed:before {
            content: "✓";
            color: #4CAF50;
            border-color: #4CAF50;
            line-height: 22px;
            font-size: 14px;
        }

        .progress_inner__step.active:before {
            color: #2196F3;
            border-color: #2196F3;
            background: white;
        }

        .progress_inner__step.pending:before {
            color: #9E9E9E;
            border-color: #9E9E9E;
            background: white;
        }

        .progress_inner__bar {
            height: 3px;
            left: 16.665%;
            right: 16.665%;
            background: #E0E0E0;
            position: absolute;
            top: 12px;
            z-index: -1;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress_inner__bar--progress {
            height: 100%;
            background: #4CAF50;
            width: 0;
            transition: width 0.6s ease;
        }

        .status-text {
            color: #9E9E9E;
            font-weight: normal;
            transition: all 0.4s;
            font-size: 12px;
        }

        .status-text.active {
            color: #2196F3;
            font-weight: bold;
        }

        .status-text.completed {
            color: #4CAF50;
            font-weight: bold;
        }

        .buttons {
            margin-top: 20px;
            text-align: center;
        }

        button {
            background: #2196F3;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 3px;
            margin: 0 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 12px;
        }

        button:hover {
            background: #1976D2;
        }

        button:last-child {
            background: #9E9E9E;
        }

        button:last-child:hover {
            background: #757575;
        }

        /* 新增的流程记录样式 */
        .timeline-title {
            font-weight: bold;
            font-size: 14px;
            color: #333;
            text-align: left;
            margin: 0 0 25px 20px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            padding-bottom: 15px;
        }

        .timeline-title::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 0.5px;
            /*background: linear-gradient(to right, #e0e0e0, #a0a0a0, #e0e0e0);*/
            background: linear-gradient(to right,
            rgba(224,224,224,0.8),
            rgba(224,224,224,0.8),
            rgba(224,224,224,0.8)); /* 添加透明度使线条更柔和 */
            box-shadow: 0 0.5px 1px rgba(0,0,0,0.07);
        }

        .track-rcol {
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            /*width: 450px;*/
            /*!*border: 1px solid #eee;*!*/
            /*margin: 20px auto;*/
            /*background: transparent;*/
        }
        .track-list {
            margin: 20px;
            padding-left: 5px;
            position: relative;
        }
        .track-list ul {
            padding-left: 0;
            max-height: 300px;
            overflow-y: auto;
        }
        .track-list li {
            position: relative;
            padding: 5px 0 10px 25px;
            line-height: 1.4;
            border-left: 2px solid #d9d9d9;
            color: #666;
            list-style: none;
            /*text-align: left;*/
            transition: all 0.4s ease; /* 添加过渡效果 */
        }
        .track-list li.first {
            color: #666;
            padding-top: 0;
            /*border-left-color: #fff;*/
        }
        .track-list li .node-icon {
            position: absolute;
            left: -7px;
            top: 18px;
            width: 8px; /* 调圆点*/
            height: 8px;
            background: #C0C0C0;
            border-radius: 50%;
            transition: all 0.4s ease; /* 添加过渡效果 */
            border: 2px solid #E0E0E0;
            box-sizing: content-box;
        }
        .track-list li.first .node-icon {
            background: #C0C0C0; /* 天蓝色 */
            width: 8px;
            height: 8px;
            left: -8px;
        }
        .track-list li .time {
            display: block;
            margin-bottom: 3px;
            font-size: 11px;
            color: #888;
            transition: all 0.4s ease; /* 添加过渡效果 */
        }
        .track-list li .txt {
            display: block;
            font-size: 12px;
            transition: all 0.4s ease; /* 添加过渡效果 */
        }

        /* 悬停效果 */
        .track-list li:hover {
            color: #333;
        }
        .track-list li:hover .node-icon {
            transform: scale(1.3);
            background: #ed8088;
        }
        .track-list li:hover .time {
            color: #666;
        }

        /* 新增审核状态样式 */
        .approve-status {
            margin-top: 10px;
            text-align: center;
        }
        .approve-status label {
            margin: 0 10px;
            cursor: pointer;
        }
        .approve-status input {
            margin-right: 5px;
        }
    </style>
</head>

<script th:inline="javascript">
    // 教研室权限
    var proFlag = /*[[${@permission.hasPermi('system:apply:process')}]]*/ 'hidden';
    var editFlag = /*[[${@permission.hasPermi('system:apply:edit')}]]*/ 'hidden';
    var DeptFlag = /*[[${@permission.hasPermi('system:apply:Dept')}]]*/ 'hidden';
    var removeFlag = /*[[${@permission.hasPermi('system:apply:remove')}]]*/ 'hidden';
    var editInfo = /*[[${@permission.hasPermi('system:apply:info')}]]*/ 'hidden';
    var hechaFlag = /*[[${@permission.hasPermi('system:apply:hecha')}]]*/ 'hidden';
    var kyrevokeFlag = /*[[${@permission.hasPermi('system:apply:kyrevoke')}]]*/ 'hidden';
    var createFlag = /*[[${@permission.hasPermi('system:apply:add')}]]*/ 'hidden';
    var downloadFlag = /*[[${@permission.hasPermi('system:apply:download')}]]*/ 'hidden';

    var topTypeDatas = /*[[${@dict.getType('sci_top_type')}]]*/ [];
    var datas = /*[[${@dict.getType('sci_crosswise_tasks')}]]*/ [];

    var prefix = ctx + "system/apply";

    // 获取当前用户角色信息
    var userRole = '';
    var userRoles = /*[[${user.roles}]]*/ [];
    if (userRoles) {
        for (var i = 0; i < userRoles.length; i++) {
            var roleKey = userRoles[i].roleKey;
            if (roleKey === 'sci_tesearch') {
                userRole = 'sci_tesearch';  // 科研处
                break;
            } else if (roleKey === 'research') {
                userRole = 'research';  // 教研室
                break;
            } else if (['dept_teacher', 'discuss_college', 'dzgc_college', 'yssj_college', 
                       'student_college', 'marxism_college', 'general'].indexOf(roleKey) !== -1) {
                userRole = 'dept_teacher';  // 学院
                break;
            }
        }
    }
    // 默认为教师角色
    if (!userRole) {
        userRole = 'teacher';
    }

    function hasPagePermission(flag) {
        return flag !== 'hidden';
    }

    function isAuditState(state) {
        return state && state.indexOf('_AUDIT') !== -1;
    }

    function isPassedState(state) {
        return state && state.indexOf('_PASSED') !== -1;
    }

    function isRejectedState(state) {
        return state && state.indexOf('_REJECTED') !== -1;
    }

    function isDraftState(state) {
        return state && state.indexOf('_DRAFT') !== -1;
    }

    function isOwnerRow(row) {
        if (!row) {
            return false;
        }
        return String(row.userId || '') !== '' && String(row.userId) === String(row.uid || '');
    }

    function filterListActions(actions, row) {
        if (!actions || !actions.length) {
            return [];
        }
        var state = row ? (row.state || '') : '';
        var owner = isOwnerRow(row);
        return actions.filter(function(action) {
            if (!action || !action.actionKey) {
                return false;
            }
            var key = action.actionKey;
            if (key === 'view') {
                return hasPagePermission(editInfo);
            }
            if (key === 'viewProcess') {
                return hasPagePermission(editInfo) && (isAuditState(state) || isPassedState(state));
            }
            if (key === 'edit') {
                return owner && hasPagePermission(editFlag) && (isDraftState(state) || isRejectedState(state));
            }
            if (key === 'remove') {
                return owner && hasPagePermission(removeFlag) && isDraftState(state);
            }
            if (key === 'submit') {
                return owner && hasPagePermission(editFlag) && (isDraftState(state) || isRejectedState(state));
            }
            if (key === 'recall') {
                if (state.indexOf('_JYS_AUDIT') !== -1) {
                    return owner;
                }
                if (state.indexOf('_KYC_AUDIT') !== -1) {
                    return hasPagePermission(proFlag);
                }
                if (isPassedState(state)) {
                    return hasPagePermission(kyrevokeFlag);
                }
                return false;
            }
            if (key === 'review') {
                return state.indexOf('_JYS_AUDIT') !== -1 && hasPagePermission(proFlag) && !owner;
            }
            if (key === 'kyReview') {
                return state.indexOf('_KYC_AUDIT') !== -1 && hasPagePermission(hechaFlag);
            }
            if (key === 'approve' || key === 'reject' || key === 'deptReview') {
                return false;
            }
            if (key === 'overApply' || key === 'reamount') {
                return owner && hasPagePermission(createFlag) && isPassedState(state);
            }
            return true;
        });
    }

        if (state in stateColorMap) {
            return {
                css: { color: stateColorMap[state] }
            };
        }

        return {
            css: { color: '#000000' }
        };
    }

    function updateProgressStepColor(state) {
        // 获取所有步骤元素
        const steps = document.querySelectorAll('.progress_inner__step');
        const progressBar = document.querySelector('.progress_inner__bar--progress');


        // 遍历所有步骤，重置样式
        steps.forEach(step => {
            step.classList.remove('active', 'completed', 'pending');
            step.querySelector('.status-text').classList.remove('active', 'completed');
        });

        // 重置进度条
        progressBar.style.width = '0';

        // 根据 state 设置相应的步骤颜色
        if (state === 99) {
            document.getElementById('step-1').classList.add('active');
            document.getElementById('step-1').querySelector('.status-text').classList.add('active');
            progressBar.style.width = '0';
        } else if ([6, 4].includes(state)) {
            document.getElementById('step-1').classList.add('completed');
            document.getElementById('step-1').querySelector('.status-text').classList.add('completed');
            document.getElementById('step-2').classList.add('completed');
            document.getElementById('step-2').querySelector('.status-text').classList.add('completed');
            document.getElementById('step-3').classList.add('completed');
            document.getElementById('step-3').querySelector('.status-text').classList.add('completed');
            progressBar.style.width = '100%';
        } else if ([1, 2,  7, 8, 11, 33].includes(state)) {
            document.getElementById('step-1').classList.add('completed');
            document.getElementById('step-1').querySelector('.status-text').classList.add('completed');

            // 审核中步骤高亮为 active
            document.getElementById('step-2').classList.add('active');
            document.getElementById('step-2').querySelector('.status-text').classList.add('active');
            progressBar.style.width = '45%';
        } else {
            // 默认情况下，所有步骤为灰色
            steps.forEach(step => {
                step.classList.add('pending');
                step.querySelector('.status-text').classList.add('pending');
            });
        }
    }

    /**
     * 重新计算科研分
     * @param {string} tableId - 表格ID
     */
    function recalculateScore(tableId) {
        var ids = $.table.selectColumns("id", false, tableId);
        
        if (!ids || ids.length === 0) {
            $.modal.alertWarning("请选择需要重新计算科研分的课题");
            return;
        }
        
        $.modal.confirm("确定要重新计算所选 " + ids.length + " 条课题的科研分吗？此操作将覆盖原有科研分数据。", function() {
            $.modal.loading("正在重新计算科研分，请稍候...");
            
            $.ajax({
                url: prefix + "/recalculateScore",
                type: "POST",
                data: { ids: ids.join(",") },
                success: function(result) {
                    $.modal.closeLoading();
                    if (result.code === 0) {
                        $.modal.msgSuccess(result.msg);
                        $.table.refresh();
                    } else {
                        $.modal.alertError(result.msg);
                    }
                },
                error: function() {
                    $.modal.closeLoading();
                    $.modal.alertError("重新计算科研分失败，请稍后重试");
                }
            });
        });
    }

    /**
     * 预览科研分计算结果
     * @param {number} id - 课题ID
     */
    function previewScore(id) {
        $.modal.loading("正在获取科研分预览...");
        
        $.ajax({
            url: prefix + "/previewScore/" + id,
            type: "GET",
            success: function(result) {
                $.modal.closeLoading();
                if (result.code === 0) {
                    var data = result.data;
                    var content = "<div style='padding: 15px;'>";
                    content += "<p><strong>课题名称：</strong>" + (data.topName || '-') + "</p>";
                    content += "<p><strong>项目金额：</strong>" + (data.amount || '-') + " 万元</p>";
                    content += "<p><strong>到账金额：</strong>" + (data.creditedAmount || '-') + " 万元</p>";
                    
                    if (data.error) {
                        content += "<p style='color: red;'><strong>错误：</strong>" + data.error + "</p>";
                    } else if (data.memberScores) {
                        content += "<hr>";
                        content += "<h5>科研分分配预览：</h5>";
                        content += "<table class='table table-bordered'>";
                        content += "<tr><th>排名</th><th>用户ID</th><th>预计得分</th></tr>";
                        data.memberScores.forEach(function(item) {
                            content += "<tr><td>" + item.ranking + "</td><td>" + item.userId + "</td><td>" + item.score + "</td></tr>";
                        });
                        content += "</table>";
                        content += "<p><strong>总分：</strong>" + data.totalScore + "</p>";
                    }
                    content += "</div>";
                    
                    $.modal.alert(content, "科研分预览");
                } else {
                    $.modal.alertError(result.msg);
                }
            },
            error: function() {
                $.modal.closeLoading();
                $.modal.alertError("获取科研分预览失败");
            }
        });
    }
