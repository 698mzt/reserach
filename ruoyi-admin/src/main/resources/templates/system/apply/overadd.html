<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('课题结项申请')" />
    <th:block th:include="include :: datetimepicker-css" />
    <th:block th:include="include :: bootstrap-fileinput-css"/>
    <th:block th:include="include :: select2-css" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-apply-add" th:object="${sciHorizontalApply}">
        <input type="hidden" id="reAmount" name="reAmount">
        <input type="hidden" id="accountData" name="accountData">
        <input type="hidden" id="reamountUrl" name="reamountUrl">
        <input type="hidden" id="applyId" name = "applyId"  >
        <input name="id" id="ktid" th:field="*{id}" type="hidden">
        <input name="amountType" id="amountType" type="hidden" value="2">
        <input type="hidden" name="state" value="HORIZONTAL_OVER_DRAFT">

        <h4 class="form-header h4">基本信息</h4>
        <div class="row">
            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">申请人：</label>
                    <div class="col-sm-8">
                        <input name="userId" readonly th:field="*{userName}" class="form-control" type="text" >
                    </div>
                </div>
            </div>
            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">课题编号：</label>
                    <div class="col-sm-8">
                        <input name="topNumber" th:field="*{topNumber}" class="form-control" type="text" maxlength="100">
                    </div>
                </div>
            </div>
            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">课题类型：</label>
                    <div class="col-sm-8">
                        <input readonly name="topType"  class="form-control" type="text" required th:value="${topType == 'technical_dev' ? '技术服务' : '技术开发（委托）'}">

                    </div>
                </div>
            </div>
            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">课题名称：</label>
                    <div class="col-sm-8">
                        <input readonly name="topName" th:field="*{topName}" class="form-control" type="text" required>
                    </div>
                </div>
            </div>
            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">项目金额：</label>
                    <div class="col-sm-8">
                        <div class="input-group ">
                            <input readonly name="amount" th:field="*{amount}" class="form-control" type="number" required>
                            <span class="input-group-addon">
                                <a href="#" title="上传到账金额"  data-toggle="modal" data-target="#myModal"><i class="fa fa-plus-circle" ></i>到账金额</a>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">立项日期：</label>
                    <div class="col-sm-8">
                        <div class="input-group date" >
                            <input readonly name="signingData" autocomplete="off" th:field="*{signingData}" th:value="${#dates.format(signingData, 'yyyy-MM-dd')}" class="form-control" placeholder="yyyy-MM-dd" type="text" required>
                            <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">结项日期：</label>
                    <div class="col-sm-8">
                        <div class="input-group date">
                            <input autocomplete="off" name="validityDate" class="form-control" placeholder="yyyy-MM-dd" type="text" required>
                            <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">主持人：</label>
                    <div class="col-sm-8">
                        <select name="firstPersonId" class="form-control m-b" disabled >
                            <option th:each="user : ${sysUsers}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${ #strings.toString(user.userId) == sciHorizontalApply.firstPersonId}" readonly></option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">成员1：</label>
                    <div class="col-sm-8">
                         <select name="secondPersonId" class="form-control m-b" disabled>
                            <option th:each="user : ${sysUsers}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${ #strings.toString(user.userId) == sciHorizontalApply.secondPersonId}" readonly></option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">成员2：</label>
                    <div class="col-sm-8">
                         <select name="thirdPersonId" class="form-control m-b" disabled>
                            <option th:each="user : ${sysUsers}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${ #strings.toString(user.userId) == sciHorizontalApply.thirdPersonId}" readonly ></option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">成员3：</label>
                    <div class="col-sm-8">
                         <select name="fourthPersonId" class="form-control m-b" disabled>
                            <option th:each="user : ${sysUsers}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${ #strings.toString(user.userId) == sciHorizontalApply.fourthPersonId}" readonly ></option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 其他成员：只读展示（第5位及以后） -->
            <div class="col-xs-12" th:if="${extraMembers != null}">
                <div class="form-group">
                    <label class="col-sm-2 control-label">其他成员：</label>
                    <div class="col-sm-10">
                        <div id="memberContainer" class="row">
                            <div class="col-xs-3 m-b-xs" th:each="mid : ${extraMembers}">
                                <select class="form-control m-b" disabled>
                                    <option th:each="user : ${sysUsers}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${ #strings.toString(user.userId) == mid }"></option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>



            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">结题报告：</label>
                    <div class="col-sm-8">
                        <input type="hidden" name="filingurl">
                        <div class="file-loading">
                            <input class="form-control file-uploada" id="filingurl" name="file" type="file">
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">结题备案表：</label>
                    <div class="col-sm-8">
                        <input type="hidden" name="agreeurl">
                        <div class="file-loading">
                            <input class="form-control file-uploadb" id="agreeurl" name="file" type="file">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
<div class="row">
    <div class="col-sm-offset-5 col-sm-10">
        <button type="button" class="btn btn-sm btn-primary" onclick="submitHandler()">    保 存</button>&nbsp;
        <button type="button" class="btn btn-sm btn-danger" onclick="closeItem()"> 关 闭 </button>
    </div>
</div>
<th:block th:include="include :: footer" />
<th:block th:include="include :: datetimepicker-js" />
<th:block th:include="include :: bootstrap-fileinput-js"/>
<th:block th:include="include :: datetimepicker-js" />
<th:block th:include="include :: select2-js" />

<script th:inline="javascript">
    var prefix = ctx + "system/apply"
    $("#form-apply-add").validate({
        focusCleanup: true
    });

    window.ktidValue = document.getElementById("ktid").value;
    $("#applyVertivalId").val(window.ktidValue);

    $("input[name='amount']").on('input', function() {
        var value = $(this).val();
        // 限制整数部分不超过9位
        if (value) {
            var numericValue = parseFloat(value);
            // 限制整数部分长度
            if (value.indexOf('.') !== -1) {
                var parts = value.split('.');
                if (parts[0].length > 9) {
                    $(this).val(parts[0].substring(0, 9) + (parts[1] ? '.' + parts[1] : ''));
                }
            } else {
                if (value.length > 9) {
                    $(this).val(value.substring(0, 9));
                }
            }
            // 限制小数点后只能输入四位
            if (value.indexOf('.') !== -1) {
                var parts = value.split('.');
                if (parts[1] && parts[1].length > 4) {
                    $(this).val(parts[0] + '.' + parts[1].substring(0, 4));
                }
            }
            // 限制最大值
            var valueStr = numericValue.toString();
            if (valueStr.length > 9){
                this.value = "";
                $.modal.alertError("输入金额有误差：总长度最大9位数，小数点后最大四位；例：9999.9999")
            }
        }
    });

    function submitHandler() {
        if ($.validate.form()){
            if($("input[name='filingurl']").val()=="")
                return $.modal.alertError("请上传文件");
            if($("input[name='agreeurl']").val()=="")
                return $.modal.alertError("请上传文件");

            // 校验项目金额不能为负数
            var projectAmount = $("input[name='amount']").val();
            if (parseFloat(projectAmount) <= 0) {
                return $.modal.alertError("请输入有效的项目金额");
            }
            // 校验项目金额小数点后最多4位
            if (!/^\d+(\.\d{1,4})?$/.test(projectAmount)) {
                return $.modal.alertError("项目金额小数点后最多4位");
            }
            $.operate.saveTab(prefix + "/overadd", $('#form-apply-add').serialize());
        }

    }

    $("input[name='validityDate']").datetimepicker({
        format: "yyyy-mm-dd",
        minView: "month",
        autoclose: true
    });


    $(".file-uploada").fileinput({
        uploadUrl: ctx + 'common/upload/hxkt',
        initialPreviewAsData: true,
        maxFileCount: 1,
        maxFileSize: 51200,
        autoReplace: true,
        allowedFileExtensions: ["pdf"],
        slugCallback: function(filename) {
            if ($("input[name='topName']").val()===""){
                $(".file-uploada").fileinput('clear');
                $.modal.alertError("请先输入课题名称");
                return false;
            }
            // 自定义文件名生成规则
            fileExtension = filename.split('.').pop();
            const year = new Date().getFullYear();
            const newName = year +"-"+ $("input[name='topName']").val() +"-"+ "结项合同"+ "." + fileExtension;
            return newName;
        },
    }).on('fileuploaded', function (event, data, previewId, index) {
        $("input[name='" + event.currentTarget.id + "']").val(data.response.url)
    }).on('fileremoved', function (event, id, index) {
        $("input[name='" + event.currentTarget.id + "']").val('')
    }).on('filebatchselected', function(event) {
        // 批量选择文件后立即上传
        $(this).fileinput('upload');
    }).on('fileselected', function(event) {
        // 单个文件选择后立即上传
        $(this).fileinput('upload');
    })
    $(".file-uploadb").fileinput({
        uploadUrl: ctx + 'common/upload/hxkt',
        initialPreviewAsData: true,
        maxFileCount: 1,
        maxFileSize: 51200,
        autoReplace: true,
        allowedFileExtensions: ["pdf"],
        slugCallback: function(filename) {
            if ($("input[name='topName']").val()===""){
                $(".file-uploadb").fileinput('clear');
                $.modal.alertError("请先输入课题名称");
                return false;
            }
            // 自定义文件名生成规则
            fileExtension = filename.split('.').pop();
            const year = new Date().getFullYear();
            const newName = year +"-"+ $("input[name='topName']").val() +"-"+ "结项备案表"+ "." + fileExtension;
            return newName;
        },
    }).on('fileuploaded', function (event, data, previewId, index) {
        $("input[name='" + event.currentTarget.id + "']").val(data.response.url)
    }).on('fileremoved', function (event, id, index) {
        $("input[name='" + event.currentTarget.id + "']").val('')
    }).on('filebatchselected', function(event) {
        // 批量选择文件后立即上传
        $(this).fileinput('upload');
    }).on('fileselected', function(event) {
        // 单个文件选择后立即上传
        $(this).fileinput('upload');
    })
</script>
</body>
<body>
<style>
    .modal.inmodal .modal-dialog {
        width: auto;  /* 宽度自适应 */
        max-width: 50%;  /* 最大宽度限制，避免过宽 */
    }
    .modal.inmodal .modal-content {
        height: 800px;
    }
    /* 使模态框的内容区域自适应高度 */
    .modal-body {
        height: 500px;  /* 最大高度，避免溢出屏幕 */
        overflow-y: auto;  /* 如果内容超出高度，显示滚动条 */
    }
    .form-group-spacing {
        margin-bottom: 10px; /* 你可以根据需要调整这个值 */
    }
</style>
<div class="modal inmodal" id="myModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content animated bounceInRight">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span class="sr-only">关闭</span>
                </button>
                <i class="fa fa-laptop modal-icon"></i>
                <h4 class="modal-title">提交到账金额</h4>
                <!--                <small class="font-bold">需要到账金额文件为佐证材料！</small>-->
            </div>
            <form class="form-horizontal m" id="form-apply-add1">
                <div class="modal-body">
                    <div class="col-xs-10">
                        <div class="form-group">
                            <label class="col-sm-4 control-label is-required">项目金额(万)：</label>
                            <div class="col-sm-8">
                                <input name="reAmount1" class="form-control" type="number" required step="0.0001" maxlength="9">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-xs-10">
                            <div class="form-group">
                                <label class="col-sm-4 control-label is-required">到账日期：</label>
                                <div class="col-sm-8">
                                    <div class="input-group date">
                                        <input name="accountData1" autocomplete="off"  class="form-control" placeholder="yyyy-MM-dd" type="text" required>
                                        <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group-spacing" ></div>

                    <div class="col-xs-10">
                        <div class="form-group">
                            <label class="col-sm-4 control-label is-required">到账文件：</label>
                            <div class="col-sm-8">
                                <input type="hidden" name="reamountUrl1">
                                <div class="file-loading">
                                    <input class="form-control amountfile-upload" id="reamountUrl1" name="file" type="file" >
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
            <div class="modal-footer">
                <button type="button" id="close" class="btn btn-white" data-dismiss="modal">关闭</button>
                <button type="button" class="btn btn-primary" onclick="submitAmount()">保存</button>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    $("input[name='reAmount1']").on('input', function() {
        var value = $(this).val();
        // 限制整数部分不超过9位
        if (value) {
            var numericValue = parseFloat(value);
            // 限制整数部分长度
            if (value.indexOf('.') !== -1) {
                var parts = value.split('.');
                if (parts[0].length > 9) {
                    $(this).val(parts[0].substring(0, 9) + (parts[1] ? '.' + parts[1] : ''));
                }
            } else {
                if (value.length > 9) {
                    $(this).val(value.substring(0, 9));
                }
            }
            // 限制小数点后只能输入四位
            if (value.indexOf('.') !== -1) {
                var parts = value.split('.');
                if (parts[1] && parts[1].length > 4) {
                    $(this).val(parts[0] + '.' + parts[1].substring(0, 4));
                }
            }
            // 限制最大值
            var valueStr = numericValue.toString();
            if (valueStr.length > 9){
                $.modal.alertError("输入金额有误差：总长度最大9位数，小数点后最大四位；例：9999.9999")
            }
        }
    });

    function submitAmount() {
        var reAmount1 = $("input[name='reAmount1']").val();
        var accountData1 = $("input[name='accountData1']").val();
        var reamountUrl1 = $("input[name='reamountUrl1']").val();
        var projectAmount = $("input[name='amount']").val(); // 获取项目金额


        // 校验到账金额不能为负数
        if (parseFloat(reAmount1) <= 0) {
            return $.modal.alertError("请输入正确的到账金额");
        }



        // 去除前后空格并转换为字符串
        var value = reAmount1.trim();

// 判断是否是有效数字
        if (isNaN(value)) {
            return $.modal.alertError("请输入有效的数字");
        }

// 全由0组成（包括整数和小数形式）
        if (/^0+(\.0+)?$/.test(value)) {
            return $.modal.alertError("到账金额不能为零");
        }

        if (accountData1 === "") {
            return $.modal.alertError("请添加到账时间");
        }

        if (reamountUrl1 === "") {
            return $.modal.alertError("请上传到账金额文件");
        }

        if (reAmount1 && accountData1 && reamountUrl1) {
            $("#reAmount").val(reAmount1);
            $("#accountData").val(accountData1);
            $("#reamountUrl").val(reamountUrl1);
            $("#close").click();
        } else {
            return $.modal.alertError("上传信息有误");
        }
    }

    $("input[name='accountData1']").datetimepicker({
        format: "yyyy-mm-dd",
        minView: "month",
        autoclose: true
    });

    $(".amountfile-upload").fileinput({
        uploadUrl: ctx + 'common/upload/hxkt',
        initialPreviewAsData: true,
        maxFileCount: 1,
        maxFileSize: 51200,
        autoReplace: true,
        allowedFileExtensions: ["pdf"],
        slugCallback: function(filename) {
            if ($("input[name='topName']").val()===""){
                $(".amountfile-upload").fileinput('clear');
                $.modal.alertError("请先输入课题名称");
                return false;
            }
            // 自定义文件名生成规则
            fileExtension = filename.split('.').pop();
            const year = new Date().getFullYear();
            const newName = year +"-"+ $("input[name='topName']").val() +"-"+ "金额佐证材料"+ "." + fileExtension;
            return newName;
        },
    }).on('fileuploaded', function (event, data, previewId, index) {
        $("input[name='" + event.currentTarget.id + "']").val(data.response.url)
    }).on('fileremoved', function (event, id, index) {
        $("input[name='" + event.currentTarget.id + "']").val('')
    }).on('filebatchselected', function(event) {
        // 批量选择文件后立即上传
        $(this).fileinput('upload');
    }).on('fileselected', function(event) {
        // 单个文件选择后立即上传
        $(this).fileinput('upload');
    })

</script>
</body>
</html>
