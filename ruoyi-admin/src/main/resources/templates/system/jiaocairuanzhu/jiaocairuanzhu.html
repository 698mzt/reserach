    .del-link-button {

    .progress_inner {
      height: 80px;
      width: 100%;
      position: relative;
    }

    .progress_inner__step {
      width: 33.33%;
      font-size: 12px;
      padding: 0 5px;
      transition: all 0.4s;
      float: left;
      text-align: center;
      position: relative;
    }

    .progress_inner__step label {
      padding-top: 30px;
      display: block;
      position: relative;
      cursor: pointer;
    }

    .progress_inner__step:before {
      content: "1";
      width: 24px;
      height: 24px;
      color: #2196F3;
      background: white;
      line-height: 22px;
      border: 2px solid #2196F3;
      font-size: 12px;
      top: 0;
      border-radius: 50%;
      transition: all 0.4s;
      position: absolute;
      left: 0;
      right: 0;
      margin: auto;
      font-weight: bold;
      z-index: 11;
    }

    .progress_inner__step:nth-of-type(2):before {
      content: "2";
      color: #9E9E9E;
      border-color: #9E9E9E;
    }

    .progress_inner__step:nth-of-type(3):before {
      content: "3";
      color: #9E9E9E;
      border-color: #9E9E9E;
    }

    .progress_inner__step.completed:before {
      content: "✓";
      color: #4CAF50;
      border-color: #4CAF50;
      line-height: 22px;
      font-size: 14px;
    }

    .progress_inner__step.active:before {
      color: #2196F3;
      border-color: #2196F3;
      background: white;
    }

    .progress_inner__step.pending:before {
      color: #9E9E9E;
      border-color: #9E9E9E;
      background: white;
    }

    .progress_inner__bar {
      height: 3px;
      left: 16.665%;

      top: 12px;
      z-index: -1;
      border-radius: 3px;

  // var leixingDatas = [[${@dict.getType('sys_jiaocairuanzhu_leibie')}]];
  var benxiaoshifoyongshuDatas = [[${@dict.getType('sys_yes_no')}]];
  var fenleiDatas = [[${@dict.getType('sys_jiaocairuanzhu_fenlei')}]];
  var datas = [[${@dict.getType('sys_jiaocairuanzhu_zt')}]];
  var paiMingDatas = [[${@dict.getType('sys_jiaocairuanzhu_fzr')}]];
  var proFlag = [[${@permission.hasPermi('system:jiaocairuanzhu:process')}]];
  var editInfo = [[${@permission.hasPermi('system:jiaocairuanzhu:info')}]];
  var hechaFlag = [[${@permission.hasPermi('system:jiaocairuanzhu:hecha')}]];
  var createFlag = [[${@permission.hasPermi('system:jiaocairuanzhu:add')}]];
  var chayueFlag = [[${@permission.hasPermi('system:jiaocairuanzhu:chayue')}]];
  var chexiaoFlag = [[${@permission.hasPermi('system:jiaocairuanzhu:chexiao')}]];

  var prefix = ctx + "system/jiaocairuanzhu";

  // 本地状态映射（兜底方案）
  var stateNameMap = {
      'TEXTBOOK_DRAFT': '草稿',
      'TEXTBOOK_JYS_AUDIT': '教研室审批中',
      'TEXTBOOK_KYC_AUDIT': '科研处审批中',
      'TEXTBOOK_PASSED': '通过',
      'TEXTBOOK_REJECTED': '驳回'
  };

  // 状态字典对象（从后端加载）
  var stateDict = {};

  // 根据状态编码获取颜色配置
  function getStateColors(stateCode) {
      if (!stateCode) {
          return { color: '#999', bgColor: '#f5f5f5' };
      }
      
      if (stateCode.indexOf('DRAFT') !== -1) {
          return { color: '#999', bgColor: '#f5f5f5' };
      } else if (stateCode.indexOf('JYS') !== -1) {
          return { color: '#ff9800', bgColor: '#fff3e0' };
      } else if (stateCode.indexOf('KYC') !== -1) {
          return { color: '#2196f3', bgColor: '#e3f2fd' };
      } else if (stateCode.indexOf('PASSED') !== -1) {
          return { color: '#4caf50', bgColor: '#e8f5e9' };
      } else if (stateCode.indexOf('REJECTED') !== -1) {
          return { color: '#f44336', bgColor: '#ffebee' };
      } else {
          return { color: '#999', bgColor: '#f5f5f5' };
      }
  }

  // 状态格式化函数
  function formatState(value, row, index) {
      var state = String(value);
      var stateInfo = stateDict[state];
      
      if (!stateInfo && stateNameMap[state]) {
          stateInfo = { label: stateNameMap[state] };
      }
      
      if (stateInfo) {
          var colors = getStateColors(state);
          return '<span style="color:' + colors.color + '; background-color:' + colors.bgColor + 
                 '; padding:4px 8px; border-radius:4px; font-weight:500;">' + stateInfo.label + '</span>';
      }
      return '<span style="color:#999; background-color:#f5f5f5; padding:4px 8px; border-radius:4px;">' + state + '</span>';
  }

  // 加载状态字典
  function loadStateDict() {
      $.ajax({
          url: prefix + "/getStateDict",
          type: "GET",
          async: false,
          success: function(result) {
              if (result.code === 0 && result.data) {
                  result.data.forEach(function(item) {
                      stateDict[item.code] = {
                          label: item.label
                      };
                  });
              }
          },
          error: function() {
              console.error("加载状态字典失败");
          }
      });
  }

  // 页面加载时执行
  loadStateDict();

  $(function () {
    // 设置默认年份
    if (!localStorage.getItem("year")) {
      var currentYear = new Date().getFullYear();
      localStorage.setItem("year", currentYear);
    }

    function initTable(options) {
      var tableId = options.id;
      options.url = getUrl();
      // 添加加载状态处理
    options.onLoadSuccess = function(data) {
      if (data && data.rows && data.rows.length === 0) {
        $.modal.msgSuccess("当前年份没有数据");
      }
    };
    
    options.onLoadError = function(status, jqXHR) {
      $.modal.msgError("数据加载失败，请稍后重试");
      console.error("表格数据加载失败:", status, jqXHR);
    };
    
    $.table.init(options);
    }

    function getUrl() {
      var year = localStorage.getItem("year");
      return prefix + "/list";
    }

    var options = {
      url: prefix + "/list",
      createUrl: prefix + "/add",
      updateUrl: prefix + "/edit/{id}",
      removeUrl: prefix + "/remove",
      detailUrl: prefix + "/detail/{id}",
      exportUrl: prefix + "/export",
      recallUrl: prefix + "/recall/{id}",
      rowStyle: rowStyle0,

          orderByColumn: params.sortName,
          isAsc: params.sortOrder,
          year: localStorage.getItem("year")
        };
        
        // 添加表单中的搜索字段
        $.each(formData, function(index, field) {
          queryParams[field.name] = field.value;
        });
        
        return queryParams;
      },
      columns: [
        {

        {
          field: 'number',

            return $.table.serialNumber(index);

        },

        },

  function updateProgressStepColor(state) {
    // 获取所有步骤元素
    const steps = document.querySelectorAll('.progress_inner__step');
    const progressBar = document.querySelector('.progress_inner__bar--progress');

    // 遍历所有步骤，重置样式
    steps.forEach(step => {
      step.classList.remove('active', 'completed', 'pending');
      step.querySelector('.status-text').classList.remove('active', 'completed');
    });

    // 根据 state 设置相应的步骤颜色
    if ([0, 3, 5, 7].includes(state)) {
      document.getElementById('step-1').classList.add('active');
      document.getElementById('step-1').querySelector('.status-text').classList.add('active');
      progressBar.style.width = '0';
    } else if (state === 6) {
      document.getElementById('step-1').classList.add('completed');
      document.getElementById('step-1').querySelector('.status-text').classList.add('completed');
      document.getElementById('step-2').classList.add('completed');
      document.getElementById('step-2').querySelector('.status-text').classList.add('completed');
      document.getElementById('step-3').classList.add('completed');
      document.getElementById('step-3').querySelector('.status-text').classList.add('completed');
      progressBar.style.width = '100%';
    } else if ([1, 2, 4].includes(state)) {
      document.getElementById('step-1').classList.add('completed');
      document.getElementById('step-1').querySelector('.status-text').classList.add('completed');
      document.getElementById('step-2').classList.add('completed');
      document.getElementById('step-2').querySelector('.status-text').classList.add('completed');
      progressBar.style.width = '50%';
    } else {
      // 默认情况下，所有步骤为灰色
      steps.forEach(step => {
        step.classList.add('pending');
        step.querySelector('.status-text').classList.add('pending');
      });
    }
  }

  function getCurrentTime() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
  }

  // 批量下载功能相关变量和函数
  var batchDownloadInProgress = false;

  /**
   * 批量下载功能
   * @param {string} module - 模块类型，如：'textbook' 等
   */
  function batchDownload(module) {
      // 1. 获取选中的数据ID列表
      var ids = $.table.selectColumns("id", false);
      
      // 2. 校验：未选择数据时提示
      if (!ids || ids.length === 0) {
          $.modal.alertWarning("未选择数据");
          return;
      }
      
      // 3. 防止重复提交
      if (batchDownloadInProgress) {
          $.modal.alertWarning("批量下载正在处理中，请稍候...");
          return;
      }
      
      batchDownloadInProgress = true;
      $.modal.loading("正在打包下载，请稍候...");
      
      // 4. 创建 XMLHttpRequest 发送请求
      var xhr = new XMLHttpRequest();
      xhr.open("GET", ctx + "common/batchDownload?ids=" 
          + encodeURIComponent(ids.join(",")) 
          + "&module=" + encodeURIComponent(module), true);
      
      // 5. 设置响应类型为 blob（二进制流）
      xhr.responseType = "blob";
      xhr.timeout = 10 * 60 * 1000; // 10分钟超时
      
      // 6. 请求成功回调
      xhr.onload = function () {
          var blob = xhr.response;
          var contentDisposition = xhr.getResponseHeader("Content-Disposition") || "";
          var contentType = xhr.getResponseHeader("Content-Type") || "";
          
          // 判断是否为文件下载响应
          var isDownloadResponse = contentDisposition.indexOf("attachment") !== -1
              || contentType.indexOf("application/zip") !== -1;
          
          if (xhr.status >= 200 && xhr.status < 300 && isDownloadResponse) {
              // 触发文件下载
              triggerBlobDownload(blob, parseDownloadFileName(contentDisposition));
              finishBatchDownload();
          } else {
              // 处理错误响应
              readBlobAsText(blob, function (text) {
                  $.modal.alertError(extractDownloadErrorMessage(text));
                  finishBatchDownload();
              });
          }
      };
      
      // 7. 错误处理
      xhr.onerror = function () {
          $.modal.alertError("批量下载失败，请检查网络或稍后重试");
          finishBatchDownload();
      };
      
      xhr.ontimeout = function () {
          $.modal.alertError("批量下载超时，请稍后重试");
          finishBatchDownload();
      };
      
      // 8. 发送请求
      xhr.send();
  }

  // 辅助函数：触发 Blob 文件下载
  function triggerBlobDownload(blob, fileName) {
      var resolvedFileName = fileName || "批量下载.zip";
      
      // IE浏览器兼容
      if (window.navigator.msSaveOrOpenBlob) {
          window.navigator.msSaveOrOpenBlob(blob, resolvedFileName);
          return;
      }
      
      // 标准浏览器
      var downloadUrl = window.URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.style.display = "none";
      link.href = downloadUrl;
      link.download = resolvedFileName;
      document.body.appendChild(link);
      link.click();
      
      // 清理
      setTimeout(function () {
          document.body.removeChild(link);
          window.URL.revokeObjectURL(downloadUrl);
      }, 100);
  }

  // 辅助函数：从 Content-Disposition 解析文件名
  function parseDownloadFileName(contentDisposition) {
      if (!contentDisposition) return "";
      
      // 尝试 UTF-8 编码的文件名
      var utf8Match = contentDisposition.match(/filename\*=UTF-8''([^;]+)/i);
      if (utf8Match && utf8Match[1]) {
          return decodeURIComponent(utf8Match[1]).replace(/["\"]/g, "");
      }
      
      // 尝试普通文件名
      var fileNameMatch = contentDisposition.match(/filename="?([^";]+)"?/i);
      return fileNameMatch && fileNameMatch[1] 
          ? decodeURIComponent(fileNameMatch[1]) 
          : "";
  }

  // 辅助函数：读取 Blob 为文本
  function readBlobAsText(blob, callback) {
      var reader = new FileReader();
      reader.onload = function (e) {
          callback(e.target.result);
      };
      reader.readAsText(blob);
  }

  // 辅助函数：提取下载错误信息
  function extractDownloadErrorMessage(text) {
      try {
          var json = JSON.parse(text);
          return json.message || json.msg || "批量下载失败";
      } catch (e) {
          return text || "批量下载失败";
      }
  }

  // 辅助函数：重置下载状态
  function finishBatchDownload() {
      batchDownloadInProgress = false;
      $.modal.closeLoading();
  }
