<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改教材软著')" />
    <th:block th:include="include :: datetimepicker-css" />
    <th:block th:include="include :: bootstrap-fileinput-css"/>
    <th:block th:include="include :: select2-css" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-jiaocairuanzhu-edit" th:object="${sciJiaocairuanzhu}">
        <input name="urlFlag" id="urlFlag" th:field="*{urlFlag}"  type="hidden">
        <input name="state" id="state" th:field="*{state}" type="hidden">
        <input name="id" id="ktid" th:field="*{id}" type="hidden">
        <!--        <input name="id" th:field="*{id}" type="hidden">-->
        <div class="form-group">
            <div class="col-sm-6">
                <label class="col-sm-4 control-label is-required">学院：</label>
                <div class="col-sm-8">
                    <input name="xueyuan" th:field="*{xueyuan}" class="form-control" type="text" required disabled="true">
                    <!--                    <select name="xueyuan" class="form-control" th:with="type=${@dict.getType('sys_dept')}" required disabled="true">-->
                    <!--                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{parentId}"></option>-->
                    <!--                    </select>-->
                </div>
            </div>
            <div class="col-sm-6">
                <label class="col-sm-4 control-label is-required">姓名：</label>
                <div class="col-sm-8">
                    <select name="userId" class="form-control" disabled="true">
                        <option th:each="user : ${sysUsers1}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${ user.userId == sciJiaocairuanzhu.userId}"></option>
                    </select>
                </div>
            </div>
        </div>


        <div class="form-group">
            <div class="col-sm-6">
                <label class="col-sm-4 control-label is-required">教材名称：</label>
                <div class="col-sm-8">
                    <input name="mingcheng" th:field="*{mingcheng}" class="form-control" type="text" required disabled="true">
                </div>
            </div>
            <div class="col-sm-6">
                <label class="col-sm-4 control-label is-required">ISBN：</label>
                <div class="col-sm-8">
                    <input name="isbn" th:field="*{isbn}" class="form-control" type="text" required disabled="true">
                </div>
            </div>
        </div>



        <div class="form-group">
            <div class="col-sm-6">
                <label class="col-sm-4 control-label is-required">出版时间：</label>
                <div class="col-sm-8">
                    <div class="input-group date">
                        <input name="chubanshijian" th:value="${#dates.format(sciJiaocairuanzhu.chubanshijian, 'yyyy-MM-dd')}" class="form-control" placeholder="yyyy-MM-dd" type="text" required disabled="true">
                        <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <label class="col-sm-4 control-label is-required">出版社：</label>
                <div class="col-sm-8">
                    <input name="chubanshe" th:field="*{chubanshe}" class="form-control" type="text" required disabled="true">
                </div>
            </div>
        </div>


        <div class="form-group">
            <div class="col-sm-6">
                <label class="col-sm-4 control-label">是否本校用书：</label>
                <div class="col-sm-8" th:with="type=${@dict.getType('sys_yes_no')}">
                    <label th:each="dict : ${type}" class="check-box">
                        <input name="benxiaoshifoyongshu" type="radio" th:value="${dict.dictValue}" th:text="${dict.dictLabel}" th:attr="checked=${sciJiaocairuanzhu.benxiaoshifoyongshu.contains(dict.dictValue)?true:false}" disabled="true">
                    </label>
                </div>
            </div>
            <div class="col-sm-6">
                <label class="col-sm-4 control-label is-required">分类：</label>
                <div class="col-sm-8">
                    <select name="fenlei" class="form-control" th:with="type=${@dict.getType('sys_jiaocairuanzhu_fenlei')}" required disabled="true">
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{fenlei}"></option>
                    </select>
                </div>
            </div>
        </div>

        <div class="form-group">
            <div class="col-sm-6">
                <label class="col-sm-4 control-label is-required">排名：</label>
                <div class="col-sm-8">
                    <select name="paiming" class="form-control" th:with="type=${@dict.getType('sys_jiaocairuanzhu_fzr')}" required disabled>
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{paiming}"></option>
                    </select>
                </div>
            </div>
            <div class="col-sm-6">
                <label class="col-sm-4 control-label is-required">项目金额(万)：</label>
                <div class="col-sm-8">
                    <input name="amount" th:field="*{amount}" class="form-control" type="number" required step="0.0001" maxlength="9" disabled="true">
                </div>
            </div>
        </div>

        <!-- 主持人 -->
        <div class="form-group">
            <div class="col-sm-6">
                <label class="col-sm-4 control-label is-required">主持人：</label>
                <div class="col-sm-8">
                    <input id="hostPerson" class="form-control" type="text" readonly>
                </div>
            </div>
            <div class="col-sm-6">
                <label class="col-sm-4 control-label">预期科研分：</label>
                <div class="col-sm-8">
                    <input id="hostScore" class="form-control" type="text" readonly>
                </div>
            </div>
        </div>

        <!-- 成员1 -->
        <div class="form-group">
            <div class="col-sm-6">
                <label class="col-sm-4 control-label">成员1：</label>
                <div class="col-sm-8">
                    <input id="member1" class="form-control" type="text" readonly>
                </div>
            </div>
            <div class="col-sm-6">
                <label class="col-sm-4 control-label">预期科研分：</label>
                <div class="col-sm-8">
                    <input id="member1Score" class="form-control" type="text" readonly>
                </div>
            </div>
        </div>

        <!-- 成员2 -->
        <div class="form-group">
            <div class="col-sm-6">
                <label class="col-sm-4 control-label">成员2：</label>
                <div class="col-sm-8">
                    <input id="member2" class="form-control" type="text" readonly>
                </div>
            </div>
            <div class="col-sm-6">
                <label class="col-sm-4 control-label">预期科研分：</label>
                <div class="col-sm-8">
                    <input id="member2Score" class="form-control" type="text" readonly>
                </div>
            </div>
        </div>

        <!-- 成员3 -->
        <div class="form-group">
            <div class="col-sm-6">
                <label class="col-sm-4 control-label">成员3：</label>
                <div class="col-sm-8">
                    <input id="member3" class="form-control" type="text" readonly>
                </div>
            </div>
            <div class="col-sm-6">
                <label class="col-sm-4 control-label">预期科研分：</label>
                <div class="col-sm-8">
                    <input id="member3Score" class="form-control" type="text" readonly>
                </div>
            </div>
        </div>

        <!-- 主编和副主编 -->
        <div class="form-group">
            <div class="col-sm-6">
                <label class="col-sm-4 control-label is-required">主编：</label>
                <div class="col-sm-8">
                    <input id="editorNames" class="form-control" type="text" readonly>
                    <input name="zhubian" th:field="*{zhubian}" type="hidden">
                </div>
            </div>
            <div class="col-sm-6">
                <label class="col-sm-4 control-label">副主编：</label>
                <div class="col-sm-8">
                    <input id="viceEditorNames" class="form-control" type="text" readonly>
                    <input name="fuzhubian" th:field="*{fuzhubian}" type="hidden">
                </div>
            </div>
        </div>

        <div class="form-group row">
            <div class="col-sm-6">
                <label class="col-sm-4 control-label is-required">教材文件：</label>
                <div class="col-sm-8">
                    <input th:field="*{wenjian}" hidden id="wenjian" type="text">
                    <!--                        <div style="display: inline-block;">-->
                    <!--                            <div id="wenjianFileName" style="display: inline; margin-right: 5px;"></div>-->
                    <!--                        </div>-->
                    <div>
                        <button onclick="chakan()" class="btn btn-sm btn-primary color">预览</button>
                        <button onclick="downloadFile('wenjian')" class="btn btn-sm btn-primary color">下载</button>
                    </div>
                </div>
            </div>
        </div>
        <h4 class="form-header h4 tdiv1" style="display:none;">批阅记录</h4>
        <div class="row tdiv1" style="display:none;">
            <div class="col-sm-12">
                <div class="form-group"  >
                    <label class="col-xs-2 control-label">批注：</label>
                    <div class="col-xs-10">
                        <textarea name="remark" id="remark" required maxlength="500" class="form-control" rows="3"></textarea>
                    </div>
                </div>

            </div>
        </div>
        <h4 class="form-header h4 tdiv2"  style="display:none;">批阅记录</h4>
        <div class="row tdiv2" style="display:none;">
            <div class="col-sm-12">

                <div class="form-group"  >
                    <table id='bootstrap-table'></table>
                </div>
            </div>
        </div>

</div>
<div class="row">
    <div class="col-sm-offset-5 col-sm-10" id="action-buttons-container">
    </div>
</div>
</form>
</div>
<th:block th:include="include :: footer" />
<th:block th:include="include :: datetimepicker-js" />
<th:block th:include="include :: bootstrap-fileinput-js"/>
<th:block th:include="include :: select2-js" />
<script th:src="@{/ruoyi/js/approval-edit-confirm.js}"></script>
<script th:src="@{/ruoyi/js/page-render.js}"></script>
<script th:inline="javascript"  type="text/javascript">
    var prefix = ctx + "system/jiaocairuanzhu";
    $("#form-jiaocairuanzhu-edit").validate({
        focusCleanup: true
    });

    $("input[name='chubanshijian']").datetimepicker({
        format: "yyyy-mm-dd",
        minView: "month",
        autoclose: true
    });

    function displayFileName(inputId, fileNameId) {
        const input = document.getElementById(inputId);
        const fileNameSpan = document.getElementById(fileNameId);
        if (input.value) {
            const fileName = input.value.split('/').pop(); // 获取文件名
            const parts = fileName.split('_'); // 按下划线分割
            const firstPart = parts[0]; // 下划线前的部分

            fileNameSpan.textContent = `${firstPart}`; // 组合并显示
        } else {
            fileNameSpan.textContent = '';
        }
    }

    function chakan(){
        var relativePath = $("#wenjian").val();
        if (!relativePath) {
            alert("没有可预览的文件！");
            return;
        }

        // 检查是否为MinIO文件（路径以/minio/开头）
        if (relativePath.startsWith('/minio/')) {
            // 对于MinIO文件，使用新的预览接口
            var contextPath = '/' + window.location.pathname.split('/')[1];
            var previewUrl = window.location.origin + contextPath + '/common/preview?fileName=' + encodeURIComponent(relativePath);
            window.open(previewUrl, '_blank');
        } else {
            // 对于本地文件，按原方式处理
            var contextPath = '/' + window.location.pathname.split('/')[1];
            var fullPath = window.location.origin + contextPath + relativePath;
            window.open(fullPath, '_blank');
        }
    }

    function downloadFile(type){
        var relativePath = $("#" + type).val();
        if (!relativePath) {
            alert("没有可下载的文件！");
            return;
        }

        var downloadUrl;
        // 检查是否为MinIO文件（路径以/minio/开头）
        if (relativePath.startsWith('/minio/')) {
            // 对于MinIO文件，使用通用下载接口
            var contextPath = '/' + window.location.pathname.split('/')[1];
            downloadUrl = window.location.origin + contextPath + '/common/download?fileName=' + encodeURIComponent(relativePath);
        } else {
            // 对于本地文件，按原方式处理
            var contextPath = '/' + window.location.pathname.split('/')[1];
            downloadUrl = window.location.origin + contextPath + relativePath;
        }

        if(downloadUrl){
            var a = document.createElement("a");
            a.href=downloadUrl;
            a.download="";
            a.style.display = "none";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }else{
            alert("网址无效");
        }
    }



    $(document).ready(function(){
        $.approvalEditConfirm.init({
            formSelector: "#form-jiaocairuanzhu-edit",
            isApprovalPage: function () {
                var urlFlag = $("#urlFlag").val();
                var state = $("#state").val();
                return urlFlag !== "chakan" && urlFlag !== "JCZZ" &&
                    (state === "TEXTBOOK_JYS_AUDIT" || state === "TEXTBOOK_KYC_AUDIT" || state === "1" || state === "4");
            },
            editableNames: [
                "mingcheng",
                "isbn",
                "chubanshijian",
                "chubanshe",
                "benxiaoshifoyongshu",
                "fenlei",
                "paiming",
                "amount"
            ],
            onApprove: function () {
                var data = $("#form-jiaocairuanzhu-edit").serializeArray();
                data.push({ name: "remark", value: $("#remark").val() });
                $.operate.saveTab(prefix + "/hxPass", $.param(data));
            }
        });
        PageRender.registerHandlers({
            'view': function(actionKey, data) {
                closeItem();
            },
            'viewProcess': function(actionKey, data) {
                viewProcess(data.id);
            },
            'approve': function(actionKey, data) {
                submitHandler();
            },
            'reject': function(actionKey, data) {
                submitHandlerBH();
            },
            'recall': function(actionKey, data) {
                submitHandlerBH();
            }
        });

        var kid = $("input[name='id']").val();
        if (kid) {
            $.ajax({
                url: prefix + "/getMembers/" + kid,
                type: "GET",
                success: function(data) {
                    if (data && data.code === 0 && data.data) {
                        var members = data.data;
                        for (var i = 0; i < members.length; i++) {
                            var member = members[i];
                            var memberName = member.memberName || member.userName || '';
                            if (String(member.memberId) === '-1') {
                                memberName = '其他';
                            }
                            var researchScore = member.researchScore || member.expectedScore || '';
                            
                            if (member.ranking === '1') {
                                $("#hostPerson").val(memberName);
                                $("#hostScore").val(researchScore);
                            } else if (member.ranking === '2') {
                                $("#member1").val(memberName);
                                $("#member1Score").val(researchScore);
                            } else if (member.ranking === '3') {
                                $("#member2").val(memberName);
                                $("#member2Score").val(researchScore);
                            } else if (member.ranking === '4') {
                                $("#member3").val(memberName);
                                $("#member3Score").val(researchScore);
                            }
                        }
                    }
                }
            });
        }
        
        var userIdToName = {};
        var sysUsers1 = /*[[${sysUsers1}]]*/ [];
        if (sysUsers1) {
            for (var i = 0; i < sysUsers1.length; i++) {
                userIdToName[sysUsers1[i].userId] = sysUsers1[i].userName;
            }
        }
        
        var savedEditor = $('input[name="zhubian"]').val();
        var savedViceEditor = $('input[name="fuzhubian"]').val();
        
        if (savedEditor) {
            var editorIds = savedEditor.split(',');
            var editorNames = [];
            for (var i = 0; i < editorIds.length; i++) {
                var editorName = userIdToName[editorIds[i]] || editorIds[i];
                if (editorName) {
                    editorNames.push(editorName);
                }
            }
            $("#editorNames").val(editorNames.join(', '));
        }
        
        if (savedViceEditor) {
            var viceEditorIds = savedViceEditor.split(',');
            var viceEditorNames = [];
            for (var i = 0; i < viceEditorIds.length; i++) {
                var viceEditorName = userIdToName[viceEditorIds[i]] || viceEditorIds[i];
                if (viceEditorName) {
                    viceEditorNames.push(viceEditorName);
                }
            }
            $("#viceEditorNames").val(viceEditorNames.join(', '));
        }

        var jcActions = /*[[${actionsJson}]]*/ null;
        if (typeof jcActions === 'string') {
            try {
                jcActions = JSON.parse(jcActions);
            } catch (e) {
                jcActions = [];
            }
        }
        if (!jcActions) {
            jcActions = [];
        }
        var urlFlag = $("#urlFlag").val();
        var state = $("#state").val();

        if (jcActions && jcActions.length > 0) {
            var filteredActions = jcActions.filter(function(action) {
                if (urlFlag === 'chakan' || urlFlag === 'JCZZ') {
                    return false;
                }
                if (urlFlag === 'pro' || urlFlag === 'kyc_approve') {
                    return action.actionKey === 'approve' || action.actionKey === 'reject';
                }
                if (urlFlag === 'hecha') {
                    if (state === 'TEXTBOOK_PASSED') {
                        return action.actionKey === 'recall';
                    }
                    return action.actionKey === 'approve' || action.actionKey === 'reject';
                }
                if (urlFlag === 'jys_recall' || urlFlag === 'kyc_recall' || urlFlag === 'proth') {
                    return action.actionKey === 'recall';
                }
                return true;
            });

            var $container = $('#action-buttons-container');
            if (filteredActions.length > 0) {
                PageRender.renderActions($container, filteredActions, {style: 'page'}, {
                    id: $("input[name='id']").val(),
                    state: state,
                    urlFlag: urlFlag
                });
            }
            $container.append('<button type="button" class="btn btn-sm btn-warning" onclick="closeItem()"> 关 闭 </button>');
        } else {
            var $container = $('#action-buttons-container');
            if (urlFlag === 'chakan' || urlFlag === 'JCZZ') {
                $container.html('<button type="button" class="btn btn-sm btn-warning" onclick="closeItem()"> 关 闭 </button>');
            } else if (['TEXTBOOK_JYS_AUDIT', 'TEXTBOOK_KYC_AUDIT'].includes(state)) {
                $container.html(
                    '<button type="button" class="btn btn-sm btn-success" onclick="submitHandler()"> 通 过</button> ' +
                    '<button type="button" class="btn btn-sm btn-danger" onclick="submitHandlerBH()"> 驳 回</button> ' +
                    '<button type="button" class="btn btn-sm btn-warning" onclick="closeItem()"> 关 闭 </button>'
                );
            } else if (state === 'TEXTBOOK_PASSED') {
                $container.html(
                    '<button type="button" class="btn btn-sm btn-warning" onclick="closeItem()"> 关 闭 </button>'
                );
            } else if (['kyc_recall', 'jys_recall', 'proth'].includes(urlFlag)) {
                $container.html(
                    '<button type="button" class="btn btn-sm btn-warning" onclick="submitHandlerBH()"> 撤 回</button> ' +
                    '<button type="button" class="btn btn-sm btn-warning" onclick="closeItem()"> 关 闭 </button>'
                );
            } else {
                $container.html('<button type="button" class="btn btn-sm btn-warning" onclick="closeItem()"> 关 闭 </button>');
            }
        }

        var options = {
            url: prefix + "/bhyy/"+kid,
            showSearch: false,
            showRefresh: false,
            showToggle: false,
            showColumns: false,
            pagination:false,
            columns: [
                {
                    field : 'createTime',
                    title : '批阅时间',
                    width: 200
                } ,
                {
                    field : 'uname',
                    title : '批阅人',
                    width: 100
                },
                {
                    field : 'concate',
                    title : '内容',
                    width: 500
                },
                {
                    field : 'state',
                    title : '审核状态',
                    width: 100,
                    formatter: function(value, row, index) {
                        if (!value) return value;
                        var s = String(value);
                        if (s.indexOf('新增') !== -1) return '新增';
                        if (s.indexOf('更新') !== -1) return '更新';
                        if (s.indexOf('提交') !== -1) return '提交';
                        if (s.indexOf('通过') !== -1) return '通过';
                        if (s.indexOf('驳回') !== -1) return '驳回';
                        if (s.indexOf('撤回') !== -1) return '撤回';
                        return s;
                    }
                } ]
        };

        $.table.init(options);

        $('#bootstrap-table').on('load-success.bs.table', function (e, name, args) {
            var rows = name && name.rows ? name.rows : [];
            var urlFlagVal = $("#urlFlag").val();
            var stateVal = $("#state").val();

            if (urlFlagVal === 'chakan' || urlFlagVal === 'JCZZ') {
                $(".tdiv2").show();
            } else if (['TEXTBOOK_JYS_AUDIT', 'TEXTBOOK_KYC_AUDIT'].includes(stateVal)) {
                if (rows.length > 0) {
                    $(".tdiv2").show();
                }
                $(".tdiv1").show();
            } else if (['kyc_recall', 'jys_recall', 'proth'].includes(urlFlagVal)) {
                $(".tdiv1").show();
                $(".tdiv2").show();
            } else if (stateVal == 0 || stateVal == 'TEXTBOOK_DRAFT') {
                $(".tdiv1").show();
            } else if ([2, 1, 4].includes(parseInt(stateVal))) {
                if (rows.length > 0) {
                    $(".tdiv2").show();
                }
                $(".tdiv1").show();
            }
        });
    });
</script>
<script th:inline="javascript">
    var prefix = ctx + "system/jiaocairuanzhu";
    $("#form-jiaocairuanzhu-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        $.approvalEditConfirm.submit("#form-jiaocairuanzhu-edit");
    }

    function submitHandlerBH() {
        var urlFlag = $("#urlFlag").val();
        var state = $("#state").val();
        var operationType = '';

        if (urlFlag === 'hecha' && state === 'TEXTBOOK_PASSED') {
            operationType = 'recall';
        } else if (['pro', 'kyc_approve', 'hecha'].includes(urlFlag)) {
            operationType = 'reject';
            if (!$('#remark').val().trim()) {
                $.modal.msgWarning("批注不能为空");
                return false;
            }
        } else if (['proth', 'jys_recall', 'kyc_recall'].includes(urlFlag)) {
            operationType = 'recall';
        }

        if ($.validate.form() && operationType) {
            var remark = $('#remark').val();

            if (operationType === 'reject') {
                $.modal.confirm("确定 驳回 吗", function() {
                    $.operate.saveTab(prefix + "/hxBh", {"id": $("input[name='id']").val(), "urlFlag": urlFlag, "remark": remark});
                });
            } else if (operationType === 'recall') {
                $.modal.confirm("确定 撤回 吗", function() {
                    $.operate.saveTab(prefix + "/recallsave", {"id": $("input[name='id']").val(), "state": $("#state").val(), "urlFlag": urlFlag, "remark": remark});
                });
            }
        }
    }
