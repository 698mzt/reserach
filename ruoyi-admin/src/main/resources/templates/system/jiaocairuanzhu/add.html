<div class="wrapper wrapper-content animated fadeInRight ibox-content" >
    <form class="form-horizontal m" id="form-jiaocairuanzhu-add"  enctype="multipart/form-data">

        <!--                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>-->

        <div class="form-group"  style="display: none;">
            <label class="col-sm-3 control-label is-required" >姓名：</label>
            <div class="col-sm-8">
                <select name="userId" class="form-control m-b" >
                    <!--                            <option th:each="user : ${sysUsers}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${user.flag}"></option>-->
                    <option th:each="user : ${sysUsers}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${user.flag}"></option>
                </select>
            </div>
        </div>



        <div class="form-group">
            <div class="col-sm-8">
                <input name="jifen" class="form-control" type="hidden" value="0">

            <div class="col-sm-6">
                <label class="col-sm-4 control-label is-required">教材名称：</label>
                <div class="col-sm-8">
                    <input name="mingcheng" class="form-control" type="text" required maxlength="100">
                </div>
            </div>
<!--            <div class="col-sm-6">-->

<!--                <div class="col-sm-8">-->
<!--                    <select name="leixing" class="form-control" th:with="type=${@dict.getType('sys_jiaocairuanzhu_leibie')}" required>-->
<!--                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>-->
<!--                    </select>-->
<!--                </div>-->
<!--            </div>-->


            <div class="col-sm-6">
                <label class="col-sm-4 control-label is-required">ISBN：</label>
                <div class="col-sm-8">
                    <input name="isbn"
                           class="form-control"
                           type="text"
                           required
                           inputmode="numeric"
                           pattern="\d{13}"

                           maxlength="13"
                           title="请输入13位数字ISBN"
                           oninput="this.value=this.value.replace(/[^0-9]/g,'')" >
                </div>
            </div>
        </div>

        <div class="form-group">
            <div class="col-sm-6">
                <label class="col-sm-4 control-label is-required">出版时间：</label>
                <div class="col-sm-8">
                    <div class="input-group date">
                        <input name="chubanshijian" class="form-control" placeholder="yyyy-MM-dd" type="text" required autocomplete="off">
                        <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <label class="col-sm-4 control-label is-required">出版社：</label>
                <div class="col-sm-8">
                    <input name="chubanshe" class="form-control" type="text" required maxlength="50">
                </div>
            </div>
        </div>

        <div class="form-group">
            <div class="col-sm-6">
                <label class="col-sm-4 control-label is-required">本校是否用书：</label>
                <div class="col-sm-8" th:with="type=${@dict.getType('sys_yes_no')}">
                    <label th:each="dict : ${type}" class="check-box">
                        <input name="benxiaoshifoyongshu" type="radio" th:value="${dict.dictValue}" th:text="${dict.dictLabel}" required>
                    </label>
                </div>
            </div>
            <div class="col-sm-6">
                <label class="col-sm-4 control-label is-required">分类：</label>
                <div class="col-sm-8">

                    <select name="fenlei" class="form-control" th:with="type=${@dict.getType('sys_jiaocairuanzhu_fenlei')}" required>
                        <option value="" selected>----请选择----</option>

                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                    </select>
                </div>
            </div>
        </div>
        <div class="form-group row">
            <div class="col-sm-6">
                <label class="col-sm-4 control-label is-required">排名：</label>
                <div class="col-sm-8">
                    <select name="paiming" class="form-control" th:with="type=${@dict.getType('sys_jiaocairuanzhu_fzr')}" required>
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 成员管理 -->
        <div class="form-group">
            <label class="col-sm-2 control-label">成员管理：</label>
            <div class="col-sm-10">
                <div class="panel panel-default">
                    <div class="panel-body">
                        <div class="row">
                            <div class="col-sm-4">
                                <select id="memberSelect" class="form-control">
                                    <option value="" selected>--选择成员--</option>
                                    <option th:each="user : ${sysUsers}" th:text="${user.userName}" th:value="${user.userId}"></option>
                                </select>
                            </div>
                            <div class="col-sm-2">
                                <input type="number" id="memberRanking" class="form-control" placeholder="排名" min="1">
                            </div>
                            <div class="col-sm-2">
                                <button type="button" class="btn btn-primary" onclick="addMember()">添加成员</button>
                            </div>
                            <div class="col-sm-4">
                                <div class="alert alert-info" role="alert">
                                    当前科研总分：<span id="totalScore">0</span>
                                </div>
                            </div>
                        </div>
                        
                        <table class="table table-bordered table-hover mt-3" id="membersTable">
                            <thead>
                                <tr>
                                    <th>序号</th>
                                    <th>成员姓名</th>
                                    <th>排名</th>
                                    <th>科研分数</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="membersTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 主编选择 -->
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">主编：</label>
            <div class="col-sm-8">
                <select name="zhubian" id="editorSelect" class="form-control" required>
                    <option value="" selected>--选择主编--</option>
                </select>
            </div>
        </div>
        
        <!-- 副主编选择 -->
        <div class="form-group">
            <label class="col-sm-3 control-label">副主编：</label>
            <div class="col-sm-8">
                <select name="fuzhubian" id="viceEditorSelect" class="form-control">
                    <option value="" selected>--选择副主编--</option>
                </select>
            </div>
        </div>
        
        <div class="form-group row">
            <div class="col-sm-6">
                <label class="col-sm-4 control-label is-required">教材文件：</label>
                <div class="col-sm-8">
                    <input type="hidden" name="wenjian">
                    <div class="file-loading">
                        <input class="form-control file-upload" id="wenjian" name="file" type="file">
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <!-- 可以在这里添加另一个输入框，如果没有则留空 -->
            </div>
        </div>
        
        <!-- 隐藏字段 -->
        <input type="hidden" name="members" id="membersInput">
        <input type="hidden" name="totalScore" id="totalScoreInput">

    </form>
</div>

<div class="row">
    <div class="col-sm-offset-5 col-sm-10">
        <button type="button" class="btn btn-sm btn-primary" onclick="submitHandler()"> </i>保 存</button>&nbsp;
        <button type="button" class="btn btn-sm btn-danger" onclick="closeItem()"> 关 闭 </button>
    </div>
</div>
<th:block th:include="include :: footer" />
<th:block th:include="include :: datetimepicker-js" />
<th:block th:include="include :: bootstrap-fileinput-js"/>
<script th:inline="javascript">
    var prefix = ctx + "system/jiaocairuanzhu"
    var members = [];
    var userIdToName = {};
    
    // 初始化用户ID到姓名的映射
    $(document).ready(function() {
        // 从选择框中获取所有用户信息
        $('#memberSelect option').each(function() {
            var userId = $(this).val();
            var userName = $(this).text();
            if (userId) {
                userIdToName[userId] = userName;
            }
        });
        
        // 添加主编和副主编的互斥选择监听
        $('#editorSelect').on('change', function() {
            updateViceEditorOptions();
        });
        
        $('#viceEditorSelect').on('change', function() {
            updateEditorOptions();
        });
    });
    
    $("#form-jiaocairuanzhu-add").validate({
        focusCleanup: true
    });

    // 添加成员
    function addMember() {
        var memberId = $('#memberSelect').val();
        var ranking = $('#memberRanking').val();
        
        if (!memberId || !ranking) {
            $.modal.alertWarning("请选择成员并输入排名");
            return;
        }
        
        // 检查是否已添加该成员
        for (var i = 0; i < members.length; i++) {
            if (members[i].memberId == memberId) {
                $.modal.alertWarning("该成员已添加");
                return;
            }
        }
        
        // 检查排名是否已存在
        for (var i = 0; i < members.length; i++) {
            if (members[i].ranking == ranking) {
                $.modal.alertWarning("该排名已存在");
                return;
            }
        }
        
        var memberName = userIdToName[memberId];
        var researchScore = calculateResearchScore(ranking);
        
        var member = {
            memberId: memberId,
            memberName: memberName,
            ranking: ranking,
            researchScore: researchScore
        };
        
        members.push(member);
        updateMembersTable();
        updateTotalScore();
        
        // 清空输入框和选择框
        $('#memberSelect').val('').trigger('change');
        $('#memberRanking').val('');
    }
    
    // 计算科研分数
    function calculateResearchScore(ranking) {
        // 根据排名计算科研分数，这里可以根据实际需求调整计算规则
        var score = 0;
        switch (ranking) {
            case '1':
                score = 10;
                break;
            case '2':
                score = 8;
                break;
            case '3':
                score = 6;
                break;
            case '4':
                score = 4;
                break;
            default:
                score = 2;
        }
        return score;
    }
    
    // 更新成员表格
    function updateMembersTable() {
        var tbody = $('#membersTableBody');
        tbody.empty();
        
        for (var i = 0; i < members.length; i++) {
            var member = members[i];
            var tr = $('<tr></tr>');
            tr.html(
                '<td>' + (i + 1) + '</td>' +
                '<td>' + member.memberName + '</td>' +
                '<td>' + member.ranking + '</td>' +
                '<td>' + member.researchScore + '</td>' +
                '<td><button type="button" class="btn btn-danger btn-xs" onclick="removeMember(' + i + ')">删除</button></td>'
            );
            tbody.append(tr);
        }
        
        // 更新主编选择列表
        updateEditorSelect();
    }
    
    // 更新主编和副主编选择列表
    function updateEditorSelect() {
        var editorSelect = $('#editorSelect');
        var viceEditorSelect = $('#viceEditorSelect');
        var currentEditor = editorSelect.val();
        var currentViceEditor = viceEditorSelect.val();
        
        // 清空现有选项，保留默认选项
        editorSelect.empty();
        editorSelect.append('<option value="" selected>--选择主编--</option>');
        
        viceEditorSelect.empty();
        viceEditorSelect.append('<option value="" selected>--选择副主编--</option>');
        
        // 添加已添加的成员作为选项
        for (var i = 0; i < members.length; i++) {
            var member = members[i];
            editorSelect.append('<option value="' + member.memberId + '">' + member.memberName + '</option>');
            viceEditorSelect.append('<option value="' + member.memberId + '">' + member.memberName + '</option>');
        }
        
        // 恢复之前的主编选择（如果该成员仍然存在）
        if (currentEditor) {
            var memberExists = false;
            for (var i = 0; i < members.length; i++) {
                if (members[i].memberId == currentEditor) {
                    memberExists = true;
                    break;
                }
            }
            if (memberExists) {
                editorSelect.val(currentEditor);
            }
        }
        
        // 恢复之前的副主编选择（如果该成员仍然存在）
        if (currentViceEditor) {
            var memberExists = false;
            for (var i = 0; i < members.length; i++) {
                if (members[i].memberId == currentViceEditor) {
                    memberExists = true;
                    break;
                }
            }
            if (memberExists) {
                viceEditorSelect.val(currentViceEditor);
            }
        }
        
        // 更新互斥选项
        updateViceEditorOptions();
        updateEditorOptions();
    }
    
    // 更新副主编选项，排除已选为主编的成员
    function updateViceEditorOptions() {
        var editor = $('#editorSelect').val();
        var viceEditorSelect = $('#viceEditorSelect');
        var currentViceEditor = viceEditorSelect.val();
        
        // 清空现有选项，保留默认选项
        viceEditorSelect.empty();
        viceEditorSelect.append('<option value="" selected>--选择副主编--</option>');
        
        // 添加已添加的成员作为选项，但排除已选为主编的成员
        for (var i = 0; i < members.length; i++) {
            var member = members[i];
            if (member.memberId != editor) {
                viceEditorSelect.append('<option value="' + member.memberId + '">' + member.memberName + '</option>');
            }
        }
        
        // 恢复之前的副主编选择（如果该成员仍然存在且未被选为副主编）
        if (currentViceEditor && currentViceEditor != editor) {
            var memberExists = false;
            for (var i = 0; i < members.length; i++) {
                if (members[i].memberId == currentViceEditor) {
                    memberExists = true;
                    break;
                }
            }
            if (memberExists) {
                viceEditorSelect.val(currentViceEditor);
            }
        }
    }
    
    // 更新主编选项，排除已选为副主编的成员
    function updateEditorOptions() {
        var viceEditor = $('#viceEditorSelect').val();
        var editorSelect = $('#editorSelect');
        var currentEditor = editorSelect.val();
        
        // 清空现有选项，保留默认选项
        editorSelect.empty();
        editorSelect.append('<option value="" selected>--选择主编--</option>');
        
        // 添加已添加的成员作为选项，但排除已选为副主编的成员
        for (var i = 0; i < members.length; i++) {
            var member = members[i];
            if (member.memberId != viceEditor) {
                editorSelect.append('<option value="' + member.memberId + '">' + member.memberName + '</option>');
            }
        }
        
        // 恢复之前的主编选择（如果该成员仍然存在且未被选为副主编）
        if (currentEditor && currentEditor != viceEditor) {
            var memberExists = false;
            for (var i = 0; i < members.length; i++) {
                if (members[i].memberId == currentEditor) {
                    memberExists = true;
                    break;
                }
            }
            if (memberExists) {
                editorSelect.val(currentEditor);
            }
        }
    }
    
    // 删除成员
    function removeMember(index) {
        members.splice(index, 1);
        updateMembersTable();
        updateTotalScore();
    }
    
    // 更新科研总分
    function updateTotalScore() {
        var totalScore = 0;
        for (var i = 0; i < members.length; i++) {
            totalScore += parseInt(members[i].researchScore);
        }
        $('#totalScore').text(totalScore);
        $('#totalScoreInput').val(totalScore);
    }

    function submitHandler() {
        if ($.validate.form()) {
            // 检查文件是否上传
            if ($("input[name='wenjian']").val() == "") {
                return $.modal.alertError("请上传教材文件");
            }
            
            // 检查是否添加了成员
            if (members.length === 0) {
                return $.modal.alertWarning("请至少添加一个成员");
            }
            
            // 获取主编和副主编的选择
            const editor = $("#editorSelect").val();
            const viceEditor = $("#viceEditorSelect").val();
            
            // 为成员设置角色
            for (var i = 0; i < members.length; i++) {
                var member = members[i];
                if (member.memberId == editor) {
                    member.role = "主编";
                } else if (member.memberId == viceEditor) {
                    member.role = "副主编";
                } else {
                    member.role = "成员";
                }
            }
            
            // 将成员信息转换为JSON字符串
            $('#membersInput').val(JSON.stringify(members));
            
            // 获取教材名称和排名
            const mingcheng = $("input[name='mingcheng']").val();
            const paiming = $("select[name='paiming']").val();

            // 发起异步请求验证是否存在相同记录
            $.ajax({
                url: prefix + "/checkDuplicate",
                type: "POST",
                data: { mingcheng: mingcheng, paiming: paiming },
                async: false,
                success: function (res) {
                    if (res.code !== 0) {
                        // 如果不是 code == 0，则提示错误并阻止提交
                        $.modal.alertWarning(res.msg);
                    } else {
                        // 否则正常提交
                        // 手动构建表单数据，确保所有字段都被包含
                        var formData = {
                            mingcheng: mingcheng,
                            paiming: paiming,
                            zhubian: editor,
                            fuzhubian: viceEditor,
                            members: JSON.stringify(members),
                            totalScore: $('#totalScoreInput').val(),
                            // 其他表单字段
                            userId: $('select[name="userId"]').val(),
                            isbn: $('input[name="isbn"]').val(),
                            chubanshijian: $('input[name="chubanshijian"]').val(),
                            chubanshe: $('input[name="chubanshe"]').val(),
                            benxiaoshifoyongshu: $('input[name="benxiaoshifoyongshu"]:checked').val(),
                            fenlei: $('select[name="fenlei"]').val(),
                            wenjian: $('input[name="wenjian"]').val()
                        };
                        
                        $.ajax({
                            url: prefix + "/add",
                            type: "POST",
                            data: formData,
                            success: function (res) {
                                if (res.code === 0) {
                                    $.modal.msgSuccess("保存成功");
                                    $.operate.closeTab();
                                } else {
                                    $.modal.alertError(res.msg);
                                }
                            },
                            error: function () {
                                $.modal.alertError("系统异常，请稍后再试");
                            }
                        });
                    }
                },
                error: function () {
                    $.modal.alertError("系统异常，请稍后再试");
                }
            });

        }
    }

    $("input[name='chubanshijian']").datetimepicker({
        format: "yyyy-mm-dd",
        minView: "month",
        autoclose: true
    });

    $(".file-upload").fileinput({
        uploadUrl: ctx + 'common/upload/jcrz',
        initialPreviewAsData: true,
        maxFileCount: 1,
        maxFileSize: 51200,
        autoReplace: true,
        allowedFileExtensions: ["pdf"],
        slugCallback: function(filename) {
            if ($("input[name='mingcheng']").val()===""){
                $(".amountfile-upload").fileinput('clear');
                $.modal.alertError("请先输入名称");
                return false;
            }
            // 自定义文件名生成规则
            fileExtension = filename.split('.').pop();
            const year = new Date().getFullYear();
            const newName = year +"-"+ $("input[name='mingcheng']").val() +"-"+ "教材软著"+ "." + fileExtension;
            return newName;
        },

    }).on('fileuploaded', function (event, data, previewId, index) {
        $("input[name='" + event.currentTarget.id + "']").val(data.response.url)
    }).on('fileremoved', function (event, id, index) {
        $("input[name='" + event.currentTarget.id + "']").val('')
    }).on('filebatchselected', function(event) {
        // 批量选择文件后立即上传
        $(this).fileinput('upload');
    }).on('fileselected', function(event) {
        // 单个文件选择后立即上传
        $(this).fileinput('upload');
    })
</script>
</body>
</html>
