<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('新增审批流程')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-process-add">
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">流程编码：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" name="processCode" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">流程名称：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" name="processName" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">关联业务表名：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" name="businessTable" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">状态字段名：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" name="statusField" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">排序：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="number" name="sort">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">状态：</label>
                <div class="col-sm-8">
                    <div class="radio-box">
                        <input type="radio" id="status0" name="status" value="0" checked>
                        <label for="status0">启用</label>
                    </div>
                    <div class="radio-box">
                        <input type="radio" id="status1" name="status" value="1">
                        <label for="status1">停用</label>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">备注：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script type="text/javascript">
        var prefix = ctx + "approval/process";

        $("#form-process-add").validate({
            onkeyup: false,
            rules: {
                processCode: {
                    required: true
                },
                processName: {
                    required: true
                },
                businessTable: {
                    required: true
                },
                statusField: {
                    required: true
                },
                sort: {
                    digits: true
                }
            },
            messages: {
                processCode: {
                    required: "请输入流程编码"
                },
                processName: {
                    required: "请输入流程名称"
                },
                businessTable: {
                    required: "请输入关联业务表名"
                },
                statusField: {
                    required: "请输入状态字段名"
                }
            },
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/add", $('#form-process-add').serialize());
            }
        }
    </script>
</body>
</html>
