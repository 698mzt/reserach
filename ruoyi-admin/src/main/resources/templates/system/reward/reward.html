<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('奖励列表')" />
    <style>
        .modal-right {
            position: fixed;
            right: 0;
            margin: 0;
            height: 100%;
            display: flex;
            align-items: stretch;
        }

        .modal-right .modal-content {
            height: 100%;
            width: 70%;
            margin-left: auto;
        }
        .modal-right .but{
            position: absolute;
            right: 2%;
            bottom: 1.3%;
            background: red;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .progress_inner {
            height: 80px;
            width: 100%;
            position: relative;
        }

        .progress_inner__step {
            width: 33.33%;
            font-size: 12px;
            padding: 0 5px;
            transition: all 0.4s;
            float: left;
            text-align: center;
            position: relative;
        }

        .progress_inner__step label {
            padding-top: 30px;
            display: block;
            position: relative;
            cursor: pointer;
        }

        .progress_inner__step:before {
            content: "1";
            width: 24px;
            height: 24px;
            color: #2196F3;
            background: white;
            line-height: 22px;
            border: 2px solid #2196F3;
            font-size: 12px;
            top: 0;
            border-radius: 50%;
            transition: all 0.4s;
            position: absolute;
            left: 0;
            right: 0;
            margin: auto;
            font-weight: bold;
            z-index: 11;
        }

        .progress_inner__step:nth-of-type(2):before {
            content: "2";
            color: #9E9E9E;
            border-color: #9E9E9E;
        }

        .progress_inner__step:nth-of-type(3):before {
            content: "3";
            color: #9E9E9E;
            border-color: #9E9E9E;
        }

        .progress_inner__step.completed:before {
            content: "✓";
            color: #4CAF50;
            border-color: #4CAF50;
            line-height: 22px;
            font-size: 14px;
        }

        .progress_inner__step.active:before {
            color: #2196F3;
            border-color: #2196F3;
            background: white;
        }

        .progress_inner__step.pending:before {
            color: #9E9E9E;
            border-color: #9E9E9E;
            background: white;
        }

        .progress_inner__bar {
            height: 3px;
            left: 16.665%;
            right: 16.665%;
            background: #E0E0E0;
            position: absolute;
            top: 12px;
            z-index: -1;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress_inner__bar--progress {
            height: 100%;
            background: #4CAF50;
            width: 0;
            transition: width 0.6s ease;
        }

        .status-text {
            color: #9E9E9E;
            font-weight: normal;
            transition: all 0.4s;
            font-size: 12px;
        }

        .status-text.active {
            color: #2196F3;
            font-weight: bold;
        }

        .status-text.completed {
            color: #4CAF50;
            font-weight: bold;
        }

        .buttons {
            margin-top: 20px;
            text-align: center;
        }

        button {
            background: #2196F3;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 3px;
            margin: 0 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 12px;
        }

        button:hover {
            background: #1976D2;
        }

        button:last-child {
            background: #9E9E9E;
        }

        button:last-child:hover {
            background: #757575;
        }

        /* 新增的流程记录样式 */
        .timeline-title {
            font-weight: bold;
            font-size: 14px;
            color: #333;
            text-align: left;
            margin: 0 0 25px 20px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            padding-bottom: 15px;
        }

        .timeline-title::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 0.5px;
            /*background: linear-gradient(to right, #e0e0e0, #a0a0a0, #e0e0e0);*/
            background: linear-gradient(to right,
            rgba(224,224,224,0.8),
            rgba(224,224,224,0.8),
            rgba(224,224,224,0.8)); /* 添加透明度使线条更柔和 */
            box-shadow: 0 0.5px 1px rgba(0,0,0,0.07);
        }

        .track-rcol {
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            /*width: 450px;*/
            /*!*border: 1px solid #eee;*!*/
            /*margin: 20px auto;*/
            /*background: transparent;*/
        }
        .track-list {
            margin: 20px;
            padding-left: 5px;
            position: relative;
        }
        .track-list ul {
            padding-left: 0;
        }
        .track-list li {
            position: relative;
            padding: 5px 0 10px 25px;
            line-height: 1.4;
            border-left: 2px solid #d9d9d9;
            color: #666;
            list-style: none;
            /*text-align: left;*/
            transition: all 0.4s ease; /* 添加过渡效果 */
        }
        .track-list li.first {
            color: #666;
            padding-top: 0;
            /*border-left-color: #fff;*/
        }
        .track-list li .node-icon {
            position: absolute;
            left: -7px;
            top: 18px;
            width: 8px; /* 调圆点*/
            height: 8px;
            background: #C0C0C0;
            border-radius: 50%;
            transition: all 0.4s ease; /* 添加过渡效果 */
            border: 2px solid #E0E0E0;
            box-sizing: content-box;
        }
        .track-list li.first .node-icon {
            background: #C0C0C0; /* 天蓝色 */
            width: 8px;
            height: 8px;
            left: -8px;
        }
        .track-list li .time {
            display: block;
            margin-bottom: 3px;
            font-size: 11px;
            color: #888;
            transition: all 0.4s ease; /* 添加过渡效果 */
        }
        .track-list li .txt {
            display: block;
            font-size: 12px;
            transition: all 0.4s ease; /* 添加过渡效果 */
        }

        /* 悬停效果 */
        .track-list li:hover {
            color: #333;
        }
        .track-list li:hover .node-icon {
            transform: scale(1.3);
            background: #ed8088;
        }
        .track-list li:hover .time {
            color: #666;
        }

        /* 新增审核状态样式 */
        .approve-status {
            margin-top: 10px;
            text-align: center;
        }
        .approve-status label {
            margin: 0 10px;
            cursor: pointer;
        }
        .approve-status input {
            margin-right: 5px;
        }
    </style>
</head>

    <script>
        function downloadFiles(id) {
            window.location.href = ctx + 'common/HXdownloadZip?id='+id;
        }

        function rowStyle0(row, index) {
            // 定义状态值与颜色的映射关系
            const stateColorMap = {
                6: '#67c23a', // 完结 绿色
                3: '#e6a344', 5: '#e6a344', 7: '#e6a344',11: '#e6a344', // 被驳回，草稿 黄色
                1: '#2c99ff', 2: '#2c99ff', 4: '#2c99ff', // 审核中 蓝色
            };

            // 统一将 row.state 转换为字符串进行查找
            const state = String(row.state);

            // 根据状态值查找对应的颜色
            if (state in stateColorMap) {
                return {
                    css: { color: stateColorMap[state] }
                };
            }

            // 默认样式（可自定义）
            return {
                css: { color: '#000000' } // 默认黑色
            };
        }

        function showhistory(id,state) {
            updateProgressStepColor(state)
            //查询配乐记录
            $.ajax({
                url: prefix + '/bhyy/'+id,
                type: 'POST',
                data: {
                    kid: id
                },
                success: function (response) {
                    const eventList = document.getElementById('event-list');
                    eventList.innerHTML = '';
                    response.rows.sort((a, b) => new Date(b.createTime) - new Date(a.createTime));
                    response.rows.forEach(function (row) {
                        const li = document.createElement('li');
                        li.innerHTML = `
                                   <div class="event-item">
                            <div class="event-content">
                                <i class="node-icon"></i>
                                <span class="time" id="current-time">${row.createTime}</span>
                                <span class="txt">[${row.state}] - ${row.uname}</span>
                            </div>
                        </div>
                    `;
                        eventList.appendChild(li);
                    });
                },
                error: function () {
                    alert('Failed to fetch event history.');
                }
            });
        }

        function updateProgressStepColor(state) {
            // 获取所有步骤元素
            const steps = document.querySelectorAll('.progress_inner__step');
            const progressBar = document.querySelector('.progress_inner__bar--progress');

            // 遍历所有步骤，重置样式
            steps.forEach(step => {
                step.classList.remove('active', 'completed', 'pending');
                step.querySelector('.status-text').classList.remove('active', 'completed');
            });

            // 根据 state 设置相应的步骤颜色
            if (state === 11) {
                document.getElementById('step-1').classList.add('active');
                document.getElementById('step-1').querySelector('.status-text').classList.add('active');
                progressBar.style.width = '0';
            } else if (state === 6) {
                document.getElementById('step-1').classList.add('completed');
                document.getElementById('step-1').querySelector('.status-text').classList.add('completed');
                document.getElementById('step-2').classList.add('completed');
                document.getElementById('step-2').querySelector('.status-text').classList.add('completed');
                document.getElementById('step-3').classList.add('completed');
                document.getElementById('step-3').querySelector('.status-text').classList.add('completed');
                progressBar.style.width = '100%';
            } else if ([1, 2, 3, 4, 5].includes(state)) {
                document.getElementById('step-1').classList.add('completed');
                document.getElementById('step-1').querySelector('.status-text').classList.add('completed');
                document.getElementById('step-2').classList.add('completed');
                document.getElementById('step-2').querySelector('.status-text').classList.add('completed');
                progressBar.style.width = '50%';
            } else {
                // 默认情况下，所有步骤为灰色
                steps.forEach(step => {
                    step.classList.add('pending');
                    step.querySelector('.status-text').classList.add('pending');
                });
            }
        }



        document.addEventListener('DOMContentLoaded', function () {
            // 初始化显示当前时间
            document.getElementById('current-time').textContent = getCurrentTime();
        });
    </script>
