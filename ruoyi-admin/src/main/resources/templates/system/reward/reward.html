<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('奖励列表')" />
    <style>
        /* 保持原有样式不变 */
        .track-list {
            margin: 20px;
            padding-left: 5px;
            position: relative;
        }

        /* 确保页面可以正常滚动 */
        body {
            overflow: auto !important;
        }

        .container-div {
            min-height: 80vh;
        }

        .select-table {
            overflow: auto;
        }

        /* 确保表格不会超出容器 */
        #bootstrap-table {
            width: 100% !important;
        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
        /* 流程记录模态框样式 */
        .modal-dialog.modal-right {
            width: 50%;
            max-width: 600px;
        }

        .modal-right {
            position: fixed;
            right: 0;
            margin: 0;
            height: 100%;
            display: flex;
            align-items: stretch;
        }

        .modal-right .modal-content {
            height: 100%;
            width: 100%;
        }
        .modal-right .but{
            position: absolute;
            right: 2%;
            bottom: 1.3%;
            background: red;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .progress_inner {
            height: 80px;
            width: 100%;
            position: relative;
        }

        .progress_inner__step {
            width: 33.33%;
            font-size: 12px;
            padding: 0 5px;
            transition: all 0.4s;
            float: left;
            text-align: center;
            position: relative;
        }

        .progress_inner__step label {
            padding-top: 30px;
            display: block;
            position: relative;
            cursor: pointer;
        }

        .progress_inner__step:before {
            content: "1";
            width: 24px;
            height: 24px;
            color: #2196F3;
            background: white;
            line-height: 22px;
            border: 2px solid #2196F3;
            font-size: 12px;
            top: 0;
            border-radius: 50%;
            transition: all 0.4s;
            position: absolute;
            left: 0;
            right: 0;
            margin: auto;
            font-weight: bold;
            z-index: 11;
        }

        .progress_inner__step:nth-of-type(2):before {
            content: "2";
            color: #9E9E9E;
            border-color: #9E9E9E;
        }

        .progress_inner__step:nth-of-type(3):before {
            content: "3";
            color: #9E9E9E;
            border-color: #9E9E9E;
        }

        .progress_inner__step.completed:before {
            content: "✓";
            color: #4CAF50;
            border-color: #4CAF50;
            line-height: 22px;
            font-size: 14px;
        }

        .progress_inner__step.active:before {
            color: #2196F3;
            border-color: #2196F3;
            background: white;
        }

        .progress_inner__step.pending:before {
            color: #9E9E9E;
            border-color: #9E9E9E;
            background: white;
        }

        .progress_inner__bar {
            height: 3px;
            left: 16.665%;
            right: 16.665%;
            background: #E0E0E0;
            position: absolute;
            top: 12px;
            z-index: -1;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress_inner__bar--progress {
            height: 100%;
            background: #4CAF50;
            width: 0;
            transition: width 0.6s ease;
        }

        /* 分段高亮连接线 */
        .progress_inner__bar .segment {
            position: absolute;
            height: 100%;
            width: 50%;
            background: transparent;
            transition: background 0.4s ease;
        }

        .progress_inner__bar .segment.first {
            left: 0;
        }

        .progress_inner__bar .segment.second {
            right: 0;
        }

        .progress_inner__bar .segment.highlight {
            background: #4CAF50;
            box-shadow: 0 0 8px rgba(10, 225, 19, 0.7);
        }

        .status-text {
            color: #9E9E9E;
            font-weight: normal;
            transition: all 0.4s;
            font-size: 12px;
        }

        .status-text.active {
            color: #2196F3;
            font-weight: bold;
        }

        .status-text.completed {
            color: #4CAF50;
            font-weight: bold;
        }

        /* 新增的流程记录样式 */
        .timeline-title {
            font-weight: bold;
            font-size: 14px;
            color: #333;
            text-align: left;
            margin: 0 0 25px 20px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            padding-bottom: 15px;
        }

        .timeline-title::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 0.5px;
            background: linear-gradient(to right,
            rgba(224,224,224,0.8),
            rgba(224,224,224,0.8),
            rgba(224,224,224,0.8));
            box-shadow: 0 0.5px 1px rgba(0,0,0,0.07);
        }

        .track-rcol {
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
        }
        .track-list {
            margin: 20px;
            padding-left: 5px;
            position: relative;
        }
        .track-list ul {
            padding-left: 0;
        }
        .track-list li {
            position: relative;
            padding: 5px 0 10px 25px;
            line-height: 1.4;
            border-left: 2px solid #d9d9d9;
            color: #666;
            list-style: none;
            transition: all 0.4s ease;
        }
        .track-list li.first {
            color: #666;
            padding-top: 0;
        }
        .track-list li .node-icon {
            position: absolute;
            left: -7px;
            top: 18px;
            width: 8px;
            height: 8px;
            background: #C0C0C0;
            border-radius: 50%;
            transition: all 0.4s ease;
            border: 2px solid #E0E0E0;
            box-sizing: content-box;
        }
        .track-list li.first .node-icon {
            background: #C0C0C0;
            width: 8px;
            height: 8px;
            left: -8px;
        }
        .track-list li .time {
            display: block;
            margin-bottom: 3px;
            font-size: 11px;
            color: #888;
            transition: all 0.4s ease;
        }
        .track-list li .txt {
            display: block;
            font-size: 12px;
            transition: all 0.4s ease;
        }

        /* 悬停效果 */
        .track-list li:hover {
            color: #333;
        }
        .track-list li:hover .node-icon {
            transform: scale(1.3);
            background: #ed8088;
        }
        .track-list li:hover .time {
            color: #666;
        }
    </style>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <!-- 搜索表单 - 所有角色都能看到 -->
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="select-list">
                    <ul>
                        <!-- 科研处：学院查询 -->
                        <li th:if="${@permission.isAnyRoles('sci_tesearch,admin')}">
                            <label>学院：</label>
                            <input type="text" name="yname" placeholder="请输入学院名称"/>
                        </li>
                        <!-- 学院、科研处：专业查询 -->
                        <li shiro:hasAnyPermissions="system:reward:hecha,system:reward:chayue">
                            <label>专业：</label>
                            <input type="text" name="dname" placeholder="请输入专业名称"/>
                        </li>
                        <!-- 教研室、学院、科研处：主持人查询 -->
                        <li shiro:hasAnyPermissions="system:reward:process,system:reward:hecha,system:reward:chayue">
                            <label>主持人：</label>
                            <input type="text" name="userName" placeholder="请输入主持人姓名"/>
                        </li>
                        <!-- 所有角色：课题名称查询 -->
                        <li>
                            <label>课题名称：</label>
                            <input type="text" name="rewardName" placeholder="请输入课题名称"/>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div id="toolbar" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <div class="btn-group-sm" role="group" style="display: inline-flex; gap: 8px;">
                <a class="btn btn-success" onclick="$.operate.addTab()" shiro:hasPermission="system:reward:add">
                    <i class="fa fa-plus"></i> 添加
                </a>
                <!-- 批量下载按钮 -->
                <a class="btn btn-primary" onclick="batchDownload('reward')">
                    <i class="fa fa-download"></i> 批量下载
                </a>
            </div>
            <div style="display: flex; align-items: center; gap: 15px; padding: 6px 36px; border-radius: 4px;">
                <th:block th:replace="include :: status-circles"/>
            </div>
        </div>

        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>

<!-- 流程记录模态框 -->
<div class="wrapper wrapper-content fadeInRight" style="position: absolute; left: -9999px;">
    <div class="row">
        <div class="col-sm-4">
            <div class="ibox ">
                <div class="ibox-content">
                    <div class="modal inmodal" id="myModal1111" tabindex="-1" role="dialog" aria-hidden="true">
                        <div class="modal-dialog modal-right" >
                            <div class="modal-content animated bounceInRight">
                                <div class="modal-header">
                                    <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span class="sr-only">关闭</span></button>
                                </div>
                                <div class="modal-body">
                                    <!-- 流程记录标题 -->
                                    <div class="timeline-title">流程记录</div>

                                    <!-- 流程进度条 -->
                                    <div>
                                        <div class='progress_inner'>
                                            <div class='progress_inner__step active' id='step-1'>
                                                <label for='step-1'><span class="status-text active">待提交</span></label>
                                            </div>
                                            <div class='progress_inner__step pending' id='step-2'>
                                                <label for='step-2'><span class="status-text">待审核</span></label>
                                            </div>
                                            <div class='progress_inner__step pending' id='step-3'>
                                                <label for='step-3'><span class="status-text">已完成</span></label>
                                            </div>
                                            <div class='progress_inner__bar' style="z-index: 10">
                                                <div class='progress_inner__bar--progress' id='progress-bar'></div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- 流程记录内容 -->
                                    <div class="track-rcol">
                                        <div class="track-list">
                                            <ul id="event-list">
                                                <li class="first">
                                                    <i class="node-icon"></i>
                                                    <span class="time" id="current-time"></span>
                                                    <span class="txt" id="current"></span>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-white but" data-dismiss="modal">关闭</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:include="include :: footer" />
<script th:src="@{/ruoyi/js/page-render.js}"></script>
<script th:inline="javascript">
    var editFlag = [[${@permission.hasPermi('system:reward:edit')}]];
    var removeFlag = [[${@permission.hasPermi('system:reward:remove')}]];
    var proFlag = [[${@permission.hasPermi('system:reward:process')}]];
    var editInfo = [[${@permission.hasPermi('system:reward:info')}]];
    var hechaFlag = [[${@permission.hasPermi('system:reward:hecha')}]];
    var topTypeDatas = [[${@dict.getType('sci_top_type')}]];
    var datas = [[${@dict.getType('sys_reward_sg')}]];
    var chayueFlag = [[${@permission.hasPermi('system:reward:chayue')}]];
    var paimingDatas = [[${@dict.getType('sys_reward_paiming')}]];
    var fenleiDatas = [[${@dict.getType('sys_reward_fenlei')}]];
    var dengjiDatas = [[${@dict.getType('sys_reward_dengji')}]];

    // 角色权限标识
    var isAdmin = [[${@permission.hasPermi('system:reward:admin')}]] != 'hidden';
    var isKyc = [[${@permission.hasPermi('system:reward:kyc')}]] != 'hidden';
    var isXueyuan = [[${@permission.hasPermi('system:reward:xueyuan')}]] != 'hidden';
    var isJys = [[${@permission.hasPermi('system:reward:jys')}]] != 'hidden';

    var prefix = ctx + "system/reward";

    $(function() {
        var options = {
            url: prefix + "/list",  // 统一使用 /list 接口
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            exportUrl: prefix + "/export",
            detailUrl: prefix + "/detail/{id}",
            recallUrl: prefix + "/recall/{id}",
            pushUrl: prefix + "/push/{id}",
            addUrl: prefix + "/add",
            modalName: "奖励",
            rowStyle: rowStyle0,
            // 【关键修复】添加 queryParams 函数，确保搜索参数正确传递
            queryParams: function(params) {
                var formData = $('#formId').serializeArray();
                var queryParams = {
                    pageNum: params.pageNumber,
                    pageSize: params.pageSize,
                    orderByColumn: params.sortName,
                    isAsc: params.sortOrder
                };
                
                // 添加表单中的搜索字段
                $.each(formData, function(index, field) {
                    queryParams[field.name] = field.value;
                });
                
                return queryParams;
            },
            columns: [
                { checkbox: true },
                {
                    field: 'number',
                    title: '序号',
                    width: 5,
                    align: 'center',
                    switchable: false,
                    formatter: function(value, row, index) {
                        var pageSize = $('#bootstrap-table').bootstrapTable('getOptions').pageSize;
                        var pageNumber = $('#bootstrap-table').bootstrapTable('getOptions').pageNumber;
                        return pageSize * (pageNumber - 1) + index + 1;
                    }
                },
                {
                    field: 'id',
                    title: 'id',
                    visible: false
                },
                {
                    field: 'yname',
                    align: 'center',
                    title: '学院'
                },
                {
                    field: 'dname',
                    align: 'center',
                    title: '专业'
                },
                {
                    field: 'userName',
                    align: 'center',
                    title: '申请人'
                },
                {
                    field: 'rewardName',
                    align: 'center',
                    title: '荣誉名称'
                },
                {
                    field: 'rewardTime',
                    align: 'center',
                    title: '获得时间'
                },
                {
                    field: 'rewardFenlei',
                    align: 'center',
                    title: '分类',
                    formatter: function(value, row, index) {
                        return $.table.selectDictLabel(fenleiDatas, value);
                    }
                },
                
            
                {
                    field: 'rewardPaiming',
                    align: 'center',
                    title: '个人排名',
                    formatter: function(value, row, index) {
                        return value || '';
                    }
                },
                {
                    field: 'jifen',
                    align: 'center',
                    title: '积分'
                },
                {
                    field: 'expectedJifen',
                    align: 'center',
                    title: '预计积分'
                },
                {
                    field: 'approvalStage',
                    title: '审批阶段',
                    formatter: function (value, row, index) {
                        if (row.statusMeta) {
                            return PageRender.renderStatusToString(row.statusMeta);
                        }
                        return '<span class="label label-default">未知</span>';
                    }
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function(value, row, index) {
                        return PageRender.renderActionsToString(row.actions);
                    }
                }
            ]
        };

        // 【关键修复】直接使用包含 queryParams 的 options 初始化表格
        $.table.init(options);

        // 注册动作处理器
        PageRender.registerHandlers({
            view: function(row) {
                $.operate.detailTab(row.id + '/chakan');
            },
            edit: function(row) {
                $.operate.editTab(row.id);
            },
            submit: function(row) {
                $.operate.push(row.id);
            },
            delete: function(row) {
                $.operate.remove(row.id);
            },
            approve: function(row) {
                $.operate.detailTab(row.id + '/pro');
            },
            reject: function(row) {
                $.operate.detailTab(row.id + '/pro');
            },
            recall: function(row) {
                $.operate.recallTab(row.id);
            },
            viewProcess: function(row) {
                viewProcess(row.id + ',' + row.state);
            }
        });

        // 监听年份变化事件
        window.addEventListener("storage", function(event) {
            if (event.key === "year") {
                $('#bootstrap-table').bootstrapTable('destroy');
                $.table.init(options);
            }
        });
    });

    // 保持其他函数不变
    function downloadFiles(id) {
        window.location.href = ctx + 'common/HXdownloadZip?id=' + id;
    }

    function rowStyle0(row, index) {
        const stateColorMap = {
            'REWARD_PASSED': '#67c23a',
            'REWARD_REJECTED': '#e6a344',
            'REWARD_DRAFT': '#e6a344',
            'REWARD_JYS_AUDIT': '#2c99ff',
            'REWARD_KYC_AUDIT': '#2c99ff',
        };
        const state = String(row.state);
        if (state in stateColorMap) {
            return { css: { color: stateColorMap[state] } };
        }
        return { css: { color: '#000000' } };
    }



    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('current-time').textContent = new Date().toLocaleString();
    });

    function viewProcess(kidd) {
        const kid = kidd.split(",")[0];   //id
        const state = kidd.split(",")[1]; //状态
        $('#myModal1111').modal('show');
        function updateEventData(rows) {
            $("#event-list").empty();
            rows.forEach(function (item, index) {
                const newLi = `
                <li class="time">
                    <i class="node-icon"></i>
                    <span class="time">${item.createTime}</span>
                    <span class="txt">[${item.state}]:${item.uname}</span>
                </li>
            `;
                $("#event-list").append(newLi);
            });
        }

        function updateProgressState(state) {
            // 获取所有步骤元素
            const steps = document.querySelectorAll('.progress_inner__step');
            const progressBar = document.querySelector('.progress_inner__bar');

            // 清除所有步骤的状态
            steps.forEach((step, index) => {
                step.classList.remove('active', 'completed');
                step.classList.add('pending');

                // 更新文本状态
                const statusText = step.querySelector('.status-text');
                if (statusText) {
                    statusText.classList.remove('active');
                }
            });

            // 创建分段元素（如果尚未创建）
            if (progressBar && !progressBar.querySelector('.segment')) {
                const firstSegment = document.createElement('div');
                firstSegment.className = 'segment first';
                const secondSegment = document.createElement('div');
                secondSegment.className = 'segment second';
                progressBar.appendChild(firstSegment);
                progressBar.appendChild(secondSegment);
            }

            // 移除所有分段高亮
            const segments = progressBar ? progressBar.querySelectorAll('.segment') : [];
            segments.forEach(segment => {
                segment.classList.remove('highlight');
            });

            switch (state) { // 根据 state 更新状态
                case "REWARD_DRAFT":
                case "REWARD_REJECTED":
                    // 当前步骤为 step-1
                    highlightStep(0); // 高亮第一个步骤
                    break;
                case "REWARD_JYS_AUDIT":
                case "REWARD_KYC_AUDIT":
                    // 当前步骤为 step-2，step-1 完成
                    markCompleted(0); // step-1 完成
                    highlightStep(1); // 高亮第二个步骤

                    // 高亮第一段连接线
                    if (segments[0]) {
                        segments[0].classList.add('highlight');
                    }
                    break;
                case "REWARD_PASSED":
                    // 所有步骤完成
                    markCompleted(0); // step-1 完成
                    markCompleted(1); // step-2 完成
                    highlightStep(2); // 高亮第三个步骤
                    markCompleted(2); // step-3 完成
                    // 高亮所有连接线
                    segments.forEach(segment => {
                        segment.classList.add('highlight');
                    });
                    break;
                default:
                    // 未知状态
            }
        }
        function highlightStep(index) { // 高亮指定步骤
            const step = document.querySelectorAll('.progress_inner__step')[index];
            if (step) {
                step.classList.add('active');
                step.classList.remove('pending');

                // 高亮文本
                const statusText = step.querySelector('.status-text');
                if (statusText) {
                    statusText.classList.add('active');
                }
            }
        }
        // 标记指定步骤为已完成(获取索引)
        function markCompleted(index) {
            const step = document.querySelectorAll('.progress_inner__step')[index];
            if (step) {
                step.classList.add('completed');
                step.classList.remove('pending', 'active');
            }
        }

        // 使用 $.ajax 发起请求
        $.ajax({
            url: prefix + '/bhyy/' + kid,
            method: 'POST',
            dataType: 'json',
            success: function (data) {
                // 检查返回的数据是否有效
                if (data && Array.isArray(data.rows)) {
                    // 更新页面上的数据
                    updateEventData(data.rows);
                    updateProgressState(state);
                } else {
                    // 清空列表
                    updateEventData([]);
                }
            },
            error: function (xhr, status, error) {
                // 清空列表
                updateEventData([]);
            }
        });
    }

    //javascript
/**
 * 批量下载功能
 * @param {string} module - 模块类型，如：'intraSch', 'vertical', 'horizontal' 等
 */
var batchDownloadInProgress = false;
function batchDownload(module) {
    // 1. 获取选中的数据ID列表
    var ids = $.table.selectColumns("id", false);

    // 2. 校验：未选择数据时提示
    if (!ids || ids.length === 0) {
        $.modal.alertWarning("未选择数据");
        return;
    }

    // 3. 防止重复提交
    if (batchDownloadInProgress) {
        $.modal.alertWarning("批量下载正在处理中，请稍候...");
        return;
    }

    batchDownloadInProgress = true;
    $.modal.loading("正在打包下载，请稍候...");

    // 4. 创建 XMLHttpRequest 发送请求
    var xhr = new XMLHttpRequest();
    xhr.open("GET", ctx + "common/batchDownload?ids="
        + encodeURIComponent(ids.join(","))
        + "&module=" + encodeURIComponent(module), true);

    // 5. 设置响应类型为 blob（二进制流）
    xhr.responseType = "blob";
    xhr.timeout = 10 * 60 * 1000; // 10分钟超时

    // 6. 请求成功回调
    xhr.onload = function () {
        var blob = xhr.response;
        var contentDisposition = xhr.getResponseHeader("Content-Disposition") || "";
        var contentType = xhr.getResponseHeader("Content-Type") || "";

        // 判断是否为文件下载响应
        var isDownloadResponse = contentDisposition.indexOf("attachment") !== -1
            || contentType.indexOf("application/zip") !== -1;

        if (xhr.status >= 200 && xhr.status < 300 && isDownloadResponse) {
            // 触发文件下载
            triggerBlobDownload(blob, parseDownloadFileName(contentDisposition));
            finishBatchDownload();
        } else {
            // 处理错误响应
            readBlobAsText(blob, function (text) {
                $.modal.alertError(extractDownloadErrorMessage(text));
                finishBatchDownload();
            });
        }
    };

    // 7. 错误处理
    xhr.onerror = function () {
        $.modal.alertError("批量下载失败，请检查网络或稍后重试");
        finishBatchDownload();
    };

    xhr.ontimeout = function () {
        $.modal.alertError("批量下载超时，请稍后重试");
        finishBatchDownload();
    };

    // 8. 发送请求
    xhr.send();
}

// 辅助函数：触发 Blob 文件下载
function triggerBlobDownload(blob, fileName) {
    var resolvedFileName = fileName || "批量下载.zip";

    // IE浏览器兼容
    if (window.navigator.msSaveOrOpenBlob) {
        window.navigator.msSaveOrOpenBlob(blob, resolvedFileName);
        return;
    }

    // 标准浏览器
    var downloadUrl = window.URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.style.display = "none";
    link.href = downloadUrl;
    link.download = resolvedFileName;
    document.body.appendChild(link);
    link.click();

    // 清理
    setTimeout(function () {
        document.body.removeChild(link);
        window.URL.revokeObjectURL(downloadUrl);
    }, 100);
}

// 辅助函数：从 Content-Disposition 解析文件名
function parseDownloadFileName(contentDisposition) {
    if (!contentDisposition) return "";

    // 尝试 UTF-8 编码的文件名
    var utf8Match = contentDisposition.match(/filename\*=UTF-8''([^;]+)/i);
    if (utf8Match && utf8Match[1]) {
        return decodeURIComponent(utf8Match[1]).replace(/["]/g, "");
    }

    // 尝试普通文件名
    var fileNameMatch = contentDisposition.match(/filename="?([^";]+)"?/i);
    return fileNameMatch && fileNameMatch[1]
        ? decodeURIComponent(fileNameMatch[1])
        : "";
}

// 辅助函数：重置下载状态
function finishBatchDownload() {
    batchDownloadInProgress = false;
    $.modal.closeLoading();
}
</script>
