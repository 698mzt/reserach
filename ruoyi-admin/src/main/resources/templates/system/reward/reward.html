     <script>

         function rowStyle0(row, index) {
             // 定义状态值与颜色的映射关系
             const stateColorMap = {
                 6: '#67c23a', // 完结 绿色
                 3: '#e6a344', 5: '#e6a344', 7: '#e6a344',11: '#e6a344', // 被驳回，草稿 黄色
                 1: '#2c99ff', 2: '#2c99ff', 4: '#2c99ff', // 审核中 蓝色
             };

             // 统一将 row.state 转换为字符串进行查找
             const state = String(row.state);

             // 根据状态值查找对应的颜色
             if (state in stateColorMap) {
                 return {
                     css: { color: stateColorMap[state] }
                 };
             }

             // 默认样式（可自定义）
             return {
                 css: { color: '#000000' } // 默认黑色
             };
         }
