<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('新增奖励')" />
    <th:block th:include="include :: datetimepicker-css" />
    <th:block th:include="include :: bootstrap-fileinput-css"/>
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-reward-add">
            <div class="row">
                <div class="col-xs-6">
                    <div class="form-group">
                        <label class="col-sm-4 control-label is-required">申请人：</label>
                        <div class="col-sm-8">
                            <div th:each="user : ${sysUsers}" th:if="${user.flag}">
                                <input  class="form-control" type="text" th:value="${user.userName}" readonly>
                                <input name="userId" class="form-control" type="hidden" th:value="${user.userId}">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">荣誉名称：</label>
                    <div class="col-sm-8">
                        <input name="rewardName" class="form-control" type="text" required maxlength="50">
                    </div>
                </div>
                </div>

                <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">颁发单位：</label>
                    <div class="col-sm-8">
                        <input name="rewardDanwei" class="form-control" type="text" required maxlength="50">
                    </div>
                </div>
                </div>

                <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">奖励类型：</label>
                    <div class="col-sm-8">
                        <input name="rewardLeixing" class="form-control" type="text" required maxlength="50">
                    </div>
                </div>
                </div>



                <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">颁发时间：</label>
                    <div class="col-sm-8">
                        <div class="input-group date">
                            <input autocomplete="off" name="rewardTime" class="form-control" placeholder="yyyy-MM-dd" type="text" required>
                            <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                        </div>
                    </div>
                </div>
                </div>

                <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">分类：</label>
                    <div class="col-sm-8">
                        <select name="rewardFenlei" class="form-control"  type="text" th:with="type=${@dict.getType('sys_reward_fenlei')}" required >
                            <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                        </select>
                    </div>
                </div>
                </div>

                <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">排名：</label>
                    <div class="col-sm-8">
                        <select name="rewardPaiming"  class="form-control" type="text" th:with="type=${@dict.getType('sys_reward_paiming')}" required >
                            <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                        </select>
                    </div>
                </div>
                    </div>

                <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required" for="rewardJibie">级别：</label>
                    <div class="col-sm-8">
                        <select id="rewardJibie" name="rewardJibie" class="form-control" required>
                            <option value="校级">校级</option>
                            <option value="省级">省级</option>
                        </select>
                    </div>
                </div>
                </div>

                <div class="col-xs-6">
                    <div class="form-group">
                        <label class="col-sm-4 control-label is-required">证书文件：</label>
                        <div class="col-sm-8">
                            <input type="hidden" name="rewardWenjian">
                            <div class="file-loading">
                                <input class="form-control file-upload" id="rewardWenjian" name="file" type="file">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-xs-6">
                <div class="form-group">
                   <label class="col-sm-4 control-label is-required">等级：</label>
                    <div class="col-sm-8">
                        <select id="rewarDengji"  name="rewardDengji" class="form-control" type="text" th:with="type=${@dict.getType('sys_reward_dengji')}" required>
                            <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                        </select>
                    </div>
                </div>
                </div>



            </div>
        </form>
    </div>
    <div class="row">
        <div class="col-sm-offset-5 col-sm-10">
            <button type="button" class="btn btn-sm btn-primary" onclick="submitHandler()"><i class="fa fa-check"></i>保 存</button>&nbsp;
            <button type="button" class="btn btn-sm btn-danger" onclick="closeItem()"><i class="fa fa-reply-all"></i>关 闭 </button>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: datetimepicker-js" />
    <th:block th:include="include :: bootstrap-fileinput-js"/>
    <script type="text/javascript">
        var prefix = ctx + "system/reward"
        $("#form-reward-add").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($("input[name='rewardWenjian']").val() === "") {
                $.modal.alertError("请添加证书文件");
                return false;
            }
            if ($.validate.form()) {
                $.operate.saveTab(prefix + "/add", $('#form-reward-add').serialize());
            }
        }

        $("input[name='rewardTime']").datetimepicker({
            format: "yyyy-mm-dd",
            minView: "month",
            autoclose: true
        });

        $(".file-upload").fileinput({
            uploadUrl: ctx + 'common/upload/jl',
            initialPreviewAsData: true,
            maxFileCount: 1,
            autoReplace: true,
            allowedFileExtensions: ["pdf"],
            slugCallback: function(filename) {
                if ($("input[name='rewardName']").val()===""){
                    $(".file-uploadb").fileinput('clear');
                    $.modal.alertError("请先输入荣誉名称");
                    return false;
                }
                // 自定义文件名生成规则
                fileExtension = filename.split('.').pop();
                const year = new Date().getFullYear();
                const newName = year +"-"+ $("input[name='rewardName']").val() +"-"+ "证书文件"+ "." + fileExtension;
                return newName;
            },
        }).on('fileuploaded', function (event, data, previewId, index) {
            $("input[name='" + event.currentTarget.id + "']").val(data.response.url)
        }).on('fileremoved', function (event, id, index) {
            $("input[name='" + event.currentTarget.id + "']").val('')
        })
    </script>
</body>
</html>
