<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('新增奖励')" />
    <th:block th:include="include :: datetimepicker-css" />
    <th:block th:include="include :: bootstrap-fileinput-css"/>
    <th:block th:include="include :: select2-css" />
</head>

<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-reward-add">
        <div class="row">
            <!-- 申请人（当前登录用户） -->
            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">申请人：</label>
                    <div class="col-sm-8">
                        <div th:each="user : ${sysUsers}" th:if="${user.flag}">
                            <input class="form-control" type="text" th:value="${user.userName}" readonly>
                            <input name="userId" type="hidden" th:value="${user.userId}">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 第一负责人 -->
            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">第一负责人：</label>
                    <div class="col-sm-8">
                        <select id="firstPersonSelect" name="firstPersonId" class="form-control m-b" required>
                            <option value="">---请选择--</option>
                            <option th:each="user : ${sysUsers}" th:text="${user.userName}" th:value="${user.userId}"
                                    th:if="${user.userId} != 1 and ${user.flag != true}"></option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 成员1（第二负责人） -->
            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">成员1：</label>
                    <div class="col-sm-8">
                        <select id="member1Select" name="secondPersonId" class="form-control m-b" required>
                            <option value="">---请选择--</option>
                            <option th:each="user : ${sysUsers}" th:text="${user.userName}" th:value="${user.userId}"
                                    th:if="${user.userId} != 1 and ${user.flag != true}"></option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 成员2（第三负责人） -->
            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">成员2：</label>
                    <div class="col-sm-8">
                        <select id="member2Select" name="thirdPersonId" class="form-control m-b" required>
                            <option value="">---请选择--</option>
                            <option th:each="user : ${sysUsers}" th:text="${user.userName}" th:value="${user.userId}"
                                    th:if="${user.userId} != 1 and ${user.flag != true}"></option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 成员3（第四负责人） -->
            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">成员3：</label>
                    <div class="col-sm-8">
                        <select id="member3Select" name="fourthPersonId" class="form-control m-b" required>
                            <option value="">--请选择--</option>
                            <option th:each="user : ${sysUsers}" th:text="${user.userName}" th:value="${user.userId}"
                                    th:if="${user.userId} != 1 and ${user.flag != true}"></option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 动态添加更多成员 -->
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-2 control-label">更多成员：</label>
                    <div class="col-sm-10">
                        <div id="memberContainer" class="row"></div>
                        <button type="button" id="addMemberBtn" class="btn btn-white btn-sm" title="新增成员">
                            <i class="fa fa-plus-circle"></i> 增加成员
                        </button>
                        <input type="hidden" name="extraMemberIds" id="extraMemberIds">
                    </div>
                </div>
            </div>

            <!-- 其他字段... -->
            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">荣誉名称：</label>
                    <div class="col-sm-8">
                        <input name="rewardName" class="form-control" type="text" required maxlength="500">
                    </div>
                </div>
            </div>

            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">颁发单位：</label>
                    <div class="col-sm-8">
                        <input name="rewardDanwei" class="form-control" type="text" required maxlength="500">
                    </div>
                </div>
            </div>

            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">颁发时间：</label>
                    <div class="col-sm-8">
                        <div class="input-group date">
                            <input autocomplete="off" name="rewardTime" class="form-control" placeholder="yyyy-MM-dd" type="text" required>
                            <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">分类：</label>
                    <div class="col-sm-8">
                        <select name="rewardFenlei" class="form-control" th:with="type=${@dict.getType('sys_reward_fenlei')}" required >
                            <option value="" selected>----请选择----</option>
                            <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">排名：</label>
                    <div class="col-sm-8">
                        <select name="rewardPaiming" class="form-control" th:with="type=${@dict.getType('sys_reward_paiming')}" required >
                            <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required" for="rewardJibie">级别：</label>
                    <div class="col-sm-8">
                        <select id="rewardJibie" name="rewardJibie" class="form-control" required>
                            <option value="校级">校级</option>
                            <option value="省级">省级</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">证书文件：</label>
                    <div class="col-sm-8">
                        <input type="hidden" name="rewardWenjian">
                        <div class="file-loading">
                            <input class="form-control file-upload" id="rewardWenjian" name="file" type="file">
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">等级：</label>
                    <div class="col-sm-8">
                        <select id="rewarDengji" name="rewardDengji" class="form-control" th:with="type=${@dict.getType('sys_reward_dengji')}" required>
                            <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                        </select>
                    </div>
                </div>
            </div>

        </div>
    </form>
</div>
<div class="row">
    <div class="col-sm-offset-5 col-sm-10">
        <button type="button" class="btn btn-sm btn-primary" onclick="submitHandler()">  </i>保 存</button>&nbsp;
        <button type="button" class="btn btn-sm btn-danger" onclick="closeItem()"> 关 闭 </button>
    </div>
</div>
<th:block th:include="include :: footer" />
<th:block th:include="include :: datetimepicker-js" />
<th:block th:include="include :: bootstrap-fileinput-js"/>
<th:block th:include="include :: select2-js" />
<script type="text/javascript">
    var prefix = ctx + "system/reward";

    $(function(){
        // 保存原始选项
        $('#member1Select, #member2Select, #member3Select').each(function() {
            var originalOptions = $(this).html();
            $(this).data('original-options', originalOptions);
        });

        // 初始化Select2
        $('select[name="secondPersonId"], select[name="thirdPersonId"], select[name="fourthPersonId"]').select2({
            width: '100%',
            placeholder: '输入检索成员',
            allowClear: true
        });

        // 添加成员按钮事件
        $('#addMemberBtn').on('click', function(){
            appendMemberSelect();
        });

        // 删除成员事件
        $(document).on('click', '.remove-member', function(){
            $(this).closest('.member-item').remove();
            updateMemberLists();
        });

        // 初始化联动
        updateMemberLists();
    });

    // 添加成员下拉框
    function appendMemberSelect() {
        var memberCount = $('.member-item').length + 4; // 从第4位开始计数
        var memberId = 'dynamicMember' + memberCount;

        var $tpl = $('<div class="col-xs-6 member-item m-b-xs">\
                <div class="input-group">\
                    <label class="input-group-addon" style="min-width: 90px;">成员' + memberCount + '：</label>\
                    <select id="' + memberId + '" name="members" class="form-control member-select" onchange="updateMemberLists()">\
                        <option value="">---请选择--</option>\
                    </select>\
                    <span class="input-group-btn">\
                        <button class="btn btn-danger btn-sm remove-member" type="button" title="移除"><i class="fa fa-minus"></i></button>\
                    </span>\
                </div>\
            </div>');

        var $select = $tpl.find('select.member-select');
        var originalOptions = $('#member1Select').data('original-options');
        $select.append(originalOptions);

        $('#memberContainer').append($tpl);

        // 初始化Select2
        $select.select2({
            width: '100%',
            placeholder: '输入检索成员',
            allowClear: true
        });

        updateMemberLists();
    }

    // 更新成员下拉框
    function updateMemberLists() {
        var selectedIds = new Set();

        // 获取固定成员的值
        var firstValue = $('#firstPersonSelect').val();
        var member1Value = $('#member1Select').val();
        var member2Value = $('#member2Select').val();
        var member3Value = $('#member3Select').val();

        if (firstValue) selectedIds.add(firstValue);
        if (member1Value) selectedIds.add(member1Value);
        if (member2Value) selectedIds.add(member2Value);
        if (member3Value) selectedIds.add(member3Value);

        // 获取动态成员的值
        $('.member-select').each(function() {
            var value = $(this).val();
            if (value) selectedIds.add(value);
        });

        // 更新所有下拉框
        updateSelectOptions('#firstPersonSelect', firstValue, selectedIds);
        updateSelectOptions('#member1Select', member1Value, selectedIds);
        updateSelectOptions('#member2Select', member2Value, selectedIds);
        updateSelectOptions('#member3Select', member3Value, selectedIds);

        $('.member-select').each(function() {
            updateSelectOptions('#' + $(this).attr('id'), $(this).val(), selectedIds);
        });

        // 更新隐藏字段
        updateExtraMemberIds();
    }

    // 更新单个下拉框选项
    function updateSelectOptions(selectId, currentValue, selectedIds) {
        var $select = $(selectId);
        var originalOptions = $('#member1Select').data('original-options');

        $select.find('option:not(:first)').remove();

        var tempDiv = $('<div>' + originalOptions + '</div>');
        tempDiv.find('option').each(function() {
            var value = $(this).val();
            if (value && (!selectedIds.has(value) || value === currentValue)) {
                $select.append($(this).clone());
            }
        });

        if (currentValue) {
            $select.val(currentValue);
        }
    }

    // 更新额外成员ID列表
    function updateExtraMemberIds() {
        var extraIds = [];
        $('.member-select').each(function() {
            var val = $(this).val();
            if (val) extraIds.push(val);
        });
        $("#extraMemberIds").val(extraIds.join(","));
    }

    $("#form-reward-add").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($("input[name='rewardWenjian']").val() === "") {
            $.modal.alertError("请添加证书文件");
            return false;
        }
        if ($.validate.form()) {
            $.operate.saveTab(prefix + "/add", $('#form-reward-add').serialize());
        }
    }

    $("input[name='rewardTime']").datetimepicker({
        format: "yyyy-mm-dd",
        minView: "month",
        autoclose: true
    });

    $(".file-upload").fileinput({
        uploadUrl: ctx + 'common/upload/jl',
        initialPreviewAsData: true,
        maxFileCount: 1,
        maxFileSize: 51200,
        autoReplace: true,
        allowedFileExtensions: ["pdf"],
        slugCallback: function(filename) {
            if ($("input[name='rewardName']").val() === "") {
                $(".file-uploadb").fileinput('clear');
                $.modal.alertError("请先输入荣誉名称");
                return false;
            }
            fileExtension = filename.split('.').pop();
            const year = new Date().getFullYear();
            const newName = year + "-" + $("input[name='rewardName']").val() + "-" + "证书文件" + "." + fileExtension;
            return newName;
        },
    }).on('fileuploaded', function (event, data, previewId, index) {
        $("input[name='" + event.currentTarget.id + "']").val(data.response.url)
    }).on('fileremoved', function (event, id, index) {
        $("input[name='" + event.currentTarget.id + "']").val('')
    }).on('filebatchselected', function(event) {
        $(this).fileinput('upload');
    }).on('fileselected', function(event) {
        $(this).fileinput('upload');
    });
</script>
</body>
</html>
