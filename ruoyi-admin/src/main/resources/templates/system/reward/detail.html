<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('查看奖励')" />
    <th:block th:include="include :: datetimepicker-css" />
    <th:block th:include="include :: bootstrap-fileinput-css"/>
    <!-- 防止页面缓存 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-reward-edit" th:object="${sysReward}">
        <!--批阅或核查的标识-->
        <input name="urlFlag" id="urlFlag" th:field="*{urlFlag}" type="hidden">
        <input name="id" id="ktid" th:field="*{id}" type="hidden">
        <input id="state" th:field="*{state}" type="hidden">
        <div class="row">

            <div class="col-xs-6">
                <label class="col-sm-4 control-label is-required">申请人：</label>
                <div class="col-sm-8">
                    <select name="userId" class="form-control m-b" disabled="true">
                        <option th:each="user : ${sysUsers1}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${ user.userId == sysReward.userId}"></option>
                    </select>
                </div>
            </div>

            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">荣誉名称：</label>
                    <div class="col-sm-8">
                        <input name="rewardName" th:field="*{rewardName}" class="form-control" type="text" maxlength="500" readonly>
                    </div>
                </div>
            </div>

            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">颁发单位：</label>
                    <div class="col-sm-8">
                        <input name="rewardDanwei" th:field="*{rewardDanwei}" class="form-control" type="text" maxlength="500" readonly>
                    </div>
                </div>
            </div>


            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">颁发时间：</label>
                    <div class="col-sm-8">
                        <div class="input-group date">
                            <input name="rewardTime" th:field="*{rewardTime}" class="form-control" placeholder="yyyy-MM-dd" type="text" readonly>
                            <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">分类：</label>
                    <div class="col-sm-8">
                        <select name="rewardFenlei" class="form-control" th:field="*{rewardFenlei}" th:with="type=${@dict.getType('sys_reward_fenlei')}" disabled="disabled">
                            <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">排名：</label>
                    <div class="col-sm-8">
                        <select name="rewardPaiming" th:field="*{rewardPaiming}" class="form-control" th:with="type=${@dict.getType('sys_reward_paiming')}" disabled="disabled">
                            <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">等级：</label>
                    <div class="col-sm-8">
                        <select id="rewarDengji" name="rewardDengji" th:field="*{rewardDengji}" class="form-control" th:with="type=${@dict.getType('sys_reward_dengji')}" disabled="disabled">
                            <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

<!--            <div class="col-xs-6">-->
<!--                <div class="form-group">-->
<!--                    <label class="col-sm-4 control-label is-required" for="rewardJibie">级别：</label>-->
<!--                    <div class="col-sm-8">-->
<!--                        <select id="rewardJibie" th:field="*{rewardJibie}" class="form-control" required>-->
<!--                            <option value="校级">校级</option>-->
<!--                            <option value="省级">省级</option>-->
<!--                        </select>-->
<!--                    </div>-->
<!--                </div>-->
<!--            </div>-->
        <div class="col-xs-12">
        <div class="col-xs-6">
            <div class="form-group">
                <label class="col-sm-4 control-label is-required">主持人：</label>
                <div class="col-sm-8">
                    <!--                        <input name="firstPersonId" th:field="*{firstPersonId}" class="form-control" type="text" required>-->
                    <select name="firstPersonId" class="form-control m-b" disabled>
                        <option value="">无</option>
                        <option th:each="user : ${sysUsers1}" th:text="${user.userName}" th:value="${user.userId}"
                                th:selected="${sysReward.firstPersonId != null && #strings.toString(user.userId) == sysReward.firstPersonId}"></option>
                    </select>
                </div>
            </div>
        </div>
            <div class="col-sm-6">
                <label class="col-sm-4 control-label">预期科研分：</label>
                <div class="col-sm-8">
                    <input id="expectedScore1" class="form-control" type="text" readonly placeholder="">
                </div>
            </div>
        </div>

        <div class="col-xs-12">
          <div class="col-xs-6">
            <div class="form-group">
                <label class="col-sm-4 control-label is-required">成员1：</label>
                <div class="col-sm-8">
                    <!--                        <input name="secondPersonTask" th:field="*{secondPersonTask}" class="form-control" type="text" required>-->
                    <select name="secondPersonId" class="form-control m-b" disabled>
                        <option value="">无</option>
                        <option th:each="user : ${sysUsers1}" th:text="${user.userName}" th:value="${user.userId}"
                                th:selected="${sysReward.secondPersonId != null && #strings.toString(user.userId) == sysReward.secondPersonId}"></option>
                    </select>
                </div>
            </div>
            </div>
            <div class="col-sm-6">
                <label class="col-sm-4 control-label">预期科研分：</label>
                <div class="col-sm-8">
                    <input id="expectedScore2" class="form-control" type="text" readonly placeholder="">
                </div>
            </div>
          </div>

        <div class="col-xs-12">
        <div class="col-xs-6">
            <div class="form-group">
                <label class="col-sm-4 control-label is-required">成员2：</label>
                <div class="col-sm-8">
                    <!--                        <input name="thirdPersonId" th:field="*{thirdPersonId}" class="form-control" type="text" required>-->
                    <select name="thirdPersonId" class="form-control m-b" disabled>
                        <option value="">无</option>
                        <option th:each="user : ${sysUsers1}" th:text="${user.userName}" th:value="${user.userId}"
                                th:selected="${sysReward.thirdPersonId != null && #strings.toString(user.userId) == sysReward.thirdPersonId}"></option>
                    </select>
                </div>
            </div>
        </div>
            <div class="col-sm-6">
                <label class="col-sm-4 control-label">预期科研分：</label>
                <div class="col-sm-8">
                    <input id="expectedScore3" class="form-control" type="text" readonly placeholder="">
                </div>
            </div>
        </div>

        <div class="col-xs-12">
        <div class="col-xs-6">
            <div class="form-group">
                <label class="col-sm-4 control-label is-required">成员3：</label>
                <div class="col-sm-8">
                    <select name="fourthPersonId" class="form-control m-b" disabled>
                        <option value="">无</option>
                        <option th:each="user : ${sysUsers1}" th:text="${user.userName}" th:value="${user.userId}"
                                th:selected="${sysReward.fourthPersonId != null && #strings.toString(user.userId) == sysReward.fourthPersonId}"></option>
                    </select>
                </div>
            </div>
        </div>
            <div class="col-sm-6">
                <label class="col-sm-4 control-label">预期科研分：</label>
                <div class="col-sm-8">
                    <input id="expectedScore4" class="form-control" type="text" readonly placeholder="">
                </div>
            </div>
        </div>
        <!-- 其他成员（第5位及以后）：只读展示 -->
        <div class="col-xs-12">
            <div class="form-group">
                <label class="col-sm-2 control-label">其他成员：</label>
                <div class="col-sm-10">
                    <!-- 有成员时显示 -->
                    <div id="memberContainer" class="row" th:if="${extraMembers != null && !extraMembers.isEmpty()}">
                        <div class="col-xs-3 m-b-xs" th:each="mid : ${extraMembers}">
                            <select  name="extraMemberIds"	 class="form-control m-b" disabled>
                                <option value="">无</option>
                                <option th:each="user : ${sysUsers1}" th:text="${user.userName}" th:value="${user.userId}"
                                        th:selected="${mid != null && #strings.toString(user.userId) == mid}"></option>
                            </select>
                        </div>
                    </div>
                    <!-- 无成员时显示"无" -->
                    <span th:if="${extraMembers == null || extraMembers.isEmpty()}" class="form-control-static">无</span>
                </div>
            </div>
        </div>

        <div class="form-group row">
            <div class="col-sm-6">
                <label class="col-sm-4 control-label is-required">证书文件：</label>
                <div class="col-sm-8">
                    <input th:field="*{rewardWenjian}" hidden id="rewardWenjian" type="text">
                    <div>
                        <button onclick="chakan()" class="btn btn-sm btn-primary color">预览</button>
                        <button onclick="downloadFile('rewardWenjian')" class="btn btn-sm btn-primary color">下载</button>
                    </div>
                </div>
            </div>
        </div>

        <h4 class="form-header h4 tdiv1" style="display:none; margin-top: 20px;">批阅记录</h4>
        <div class="row tdiv1" style="display:none; margin-top: 10px;">
            <div class="col-sm-12">
                <div class="form-group">
                    <label class="col-xs-2 control-label">批注：</label>
                    <div class="col-xs-10">
                        <textarea name="remark" id="remark" maxlength="500" class="form-control" rows="3"></textarea>
                    </div>
                </div>
            </div>
        </div>
        <h4 class="form-header h4 tdiv2" style="display:none; margin-top: 20px;">批阅记录</h4>
        <div class="row tdiv2" style="display:none; margin-top: 10px;">
            <div class="col-sm-12">
                <div class="form-group">
                    <table id="bootstrap-table"></table>
                </div>
            </div>
        </div>

    </form>
</div>
</div>
<div class="row">
    <div class="col-sm-offset-5 col-sm-10">
        <button type="button" id="btn1" class="btn btn-sm btn-primary" onclick="submitHandler()">  通 过</button>&nbsp;
        <button type="button" id="btn2" class="btn btn-sm btn-danger" onclick="submitHandlerBH()"> 驳 回</button>
        <button type="button" id="btn4" class="btn btn-sm btn-danger" onclick="submitHandlerRecall()"> 撤 回</button>
        <button type="button" id="btn3" class="btn btn-sm btn-warning" onclick="closeItem()"> 关 闭 </button>
    </div>
</div>
<th:block th:include="include :: footer" />
<th:block th:include="include :: datetimepicker-js" />
<th:block th:include="include :: bootstrap-fileinput-js"/>
<script th:src="@{/ruoyi/js/approval-edit-confirm.js}"></script>
<script type="text/javascript">
    $(function(){
        $.approvalEditConfirm.init({
            formSelector: "#form-reward-edit",
            isApprovalPage: function () {
                var urlFlag = $("#urlFlag").val();
                var state = $("#state").val();
                return urlFlag !== "chakan" && urlFlag !== "chayue" &&
                    (state === "REWARD_JYS_AUDIT" || state === "REWARD_KYC_AUDIT");
            },
            editableNames: [
                "rewardName",
                "rewardDanwei",
                "rewardTime",
                "rewardFenlei",
                "rewardPaiming",
                "rewardDengji",
                "firstPersonId",
                "secondPersonId",
                "thirdPersonId",
                "fourthPersonId",
                "extraMemberIds"
            ],
            onApprove: function () {
                var url = prefix + "/approve/" + encodeURIComponent($("#ktid").val());
                var data = $("#form-reward-edit").serializeArray().filter(function (item) {
                    return item.name !== "extraMemberIds";
                });
                var extraMemberIds = [];
                $("select[name='extraMemberIds']:enabled").each(function () {
                    var value = $(this).val();
                    if (value) {
                        extraMemberIds.push(value);
                    }
                });
                data.push({ name: "extraMemberIds", value: extraMemberIds.join(",") });
                data.push({ name: "comment", value: $("#remark").val() });
                data.push({ name: "operationType", value: "approve" });
                $.operate.saveTab(url, $.param(data));
            }
        });
        var kid = $("#ktid").val();
        var options = {
            url: prefix + "/bhyy/"+kid,
            showSearch: false,
            showRefresh: false,
            showToggle: false,
            showColumns: false,
            pagination:false,

            columns: [

                {
                    field : 'createTime',
                    title : '批阅时间',
                    width: 200

                } ,
                {
                    field : 'uname',
                    title : '批阅人',
                    width: 100
                },
                {
                    field : 'concate',
                    title : '内容',
                    width: 500
                },
                {
                    field : 'state',
                    title : '审核状态',
                    width: 100
                }
            ]
        };
        $.table.init(options);

        $('#bootstrap-table').on('load-success.bs.table', function (e, data) {
            const rows = data && data.rows ? data.rows : [];
            const state = $("#state").val();
            const urlFlag = $("#urlFlag").val();

            $("#btn3").show();
            if (urlFlag === 'chakan') {
                $("#btn1").hide();
                $("#btn2").hide();
                $(".tdiv2").show();
                $("#btn4").hide();
            } else {
                if (state === 'REWARD_JYS_AUDIT' || state === 'REWARD_KYC_AUDIT') {
                    if (rows.length > 0) {
                        $(".tdiv2").show();
                    }
                    $(".tdiv1").show();
                    $("#btn1").show();
                    $("#btn2").show();
                    $("#btn4").hide();
                }
            }

            if (state === 'REWARD_PASSED' || state === 'REWARD_REJECTED') {
                $("#btn1").hide();
                $("#btn2").hide();
                $("#btn4").hide();
            }

            if (['chayue'].includes(urlFlag) && state === 'REWARD_PASSED') {
                $(".tdiv1").show();
                $(".tdiv2").show();
                $("#btn1").hide();
                $("#btn2").hide();
                $("#btn4").show();
            }
        });

        // 加载积分配置，显示预计科研分
        loadScoreConfigs();
    });
</script>
<script th:inline="javascript">
    var prefix = ctx + "system/reward";
    var scoreConfigs = []; // 存储当前分类+等级下的所有积分配置
    $("#form-reward-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        $.approvalEditConfirm.submit("#form-reward-edit");
    }

    function submitHandlerBH() {
        var urlFlag = $("#urlFlag").val();
        var remark = $('#remark').val();  // 直接获取textarea的值
        
        // 批阅的驳回不能不写批注
        if (['pro', 'chayue'].includes(urlFlag)) {
            // 如果urlFlag是这些值之一，则remark字段必填
            if (!remark.trim()) {
                $.modal.confirm("批注不能为空");
                return false;
            }
        }
        
        // 驳回操作
        var url = prefix + "/hxBh";
        $.modal.confirm("确定 驳回 吗" ,function() {
            $.operate.saveTab(url, {"id": $("#ktid").val(), "remark": remark, "urlFlag": urlFlag});
        });
    }

    function submitHandlerRecall() {
        var urlFlag = $("#urlFlag").val();
        var remark = $('#remark').val();  // 直接获取textarea的值
        var state = $("#state").val();
        
        // 撤回操作
        var url = prefix + "/recallsave";
        $.modal.confirm("确定 撤回 吗" ,function() {
            $.operate.saveTab(url, {"id": $("#ktid").val(), "state": state, "remark": remark, "urlFlag": urlFlag});
        });
    }
    function chakan(){
        var relativePath = $("#rewardWenjian").val();
        if (!relativePath) {
            alert("没有可预览的文件！");
            return;
        }

        if (relativePath.startsWith('/minio/')) {
            var contextPath = '/' + window.location.pathname.split('/')[1];
            var previewUrl = window.location.origin + contextPath + '/common/preview?fileName=' + encodeURIComponent(relativePath);
            window.open(previewUrl, '_blank');
        } else {
            var contextPath = '/' + window.location.pathname.split('/')[1];
            var fullPath = window.location.origin + contextPath + relativePath;
            window.open(fullPath, '_blank');
        }
    }

    $("input[name='rewardTime']").datetimepicker({
        format: "yyyy-mm-dd",
        minView: "month",
        autoclose: true
    });

    function downloadFile(type){
        var relativePath = $("#" + type).val();
        if (!relativePath) {
            alert("没有可下载的文件！");
            return;
        }

        var downloadUrl;
        if (relativePath.startsWith('/minio/')) {
            var contextPath = '/' + window.location.pathname.split('/')[1];
            downloadUrl = window.location.origin + contextPath + '/common/download?fileName=' + encodeURIComponent(relativePath);
        } else {
            var contextPath = '/' + window.location.pathname.split('/')[1];
            downloadUrl = window.location.origin + contextPath + relativePath;
        }

        if(downloadUrl){
            var a = document.createElement("a");
            a.href=downloadUrl;
            a.download="";
            a.style.display = "none";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }else{
            alert("网址无效");
        }
    }


    // 加载积分配置
    function loadScoreConfigs() {
        var fenlei = $('select[name="rewardFenlei"]').val();
        var dengji = $('select[name="rewardDengji"]').val();

        if (fenlei && dengji) {
            $.ajax({
                url: ctx + 'system/rewardcfg/getScoreConfigs',
                type: 'GET',
                data: { fenLei: fenlei, dengJi: dengji },
                success: function(result) {
                    if (result.code === 0) {
                        scoreConfigs = result.data;
                        assignScoresToMembers(); // 分配分数
                    }
                }
            });
        }
    }

    // 分配分数给所有成员
    function assignScoresToMembers() {
        // 1. 主持人（第1名）
        if (scoreConfigs.length > 0) {
            $('#expectedScore1').val(scoreConfigs[0].totalScore);
        } else {
            $('#expectedScore1').val('');
        }

        // 2. 成员1（第2名）
        if (scoreConfigs.length > 1) {
            $('#expectedScore2').val(scoreConfigs[1].totalScore);
        } else {
            $('#expectedScore2').val('');
        }

        // 3. 成员2（第3名）
        if (scoreConfigs.length > 2) {
            $('#expectedScore3').val(scoreConfigs[2].totalScore);
        } else {
            $('#expectedScore3').val('');
        }

        // 4. 成员3（第4名）
        if (scoreConfigs.length > 3) {
            $('#expectedScore4').val(scoreConfigs[3].totalScore);
        } else {
            $('#expectedScore4').val('');
        }
    }
</script>
</body>
</html>
