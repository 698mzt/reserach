</script>
<script th:inline="javascript">
    var prefix = ctx + "system/reward";
    var scoreConfigs = []; // 存储当前分类+等级下的所有积分配置
    $("#form-reward-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.saveTab(prefix + "/edit", $('#form-reward-edit').serialize());
            loadScoreConfigs(); // 加载积分配置
        }
    }
    function chakan(){
        var c = $("#rewardWenjian").val();
        $.modal.openTab("查看证书文件" ,c );
    }

    $("input[name='rewardTime']").datetimepicker({
        format: "yyyy-mm-dd",
        minView: "month",
        autoclose: true
    });

    function downloadFile(type){
        var contextPath = '/' + window.location.pathname.split('/')[1];
        var c = window.location.origin + contextPath + $("#"+type).val();
        if(c){
            var a = document.createElement("a");
            a.href=c;
            a.download="";
            a.style.display = "none";
            document.body.appendChild(a);
            a.click();
            document.Element.removeChild(a);
        }else{
            alert("网址无效");
        }

    }

    $(".file-upload").each(function (i) {
        var val = $("input[name='" + this.id + "']").val()
        var initialPreview = [];
        var initialPreviewConfig = [];

        if (val && val.trim() !== '') {
            initialPreview = [val];
            initialPreviewConfig = [{
                type: "pdf",
                caption: val.split('/').pop(),
                url: ctx + "common/delete",
                key: val
            }];
        }

        $(this).fileinput({
            'uploadUrl': ctx + 'common/upload/jl',
            initialPreviewAsData: true,
            initialPreview: initialPreview,
            initialPreviewConfig: initialPreviewConfig,
            maxFileCount: 1,
            maxFileSize: 51200,
            autoReplace: true,
            overwriteInitial: true,
            allowedFileExtensions: ["pdf", "jpg", "jpeg", "png", "doc", "docx"],
            slugCallback: function(filename) {
                if ($("input[name='topName']").val()===""){
                    $(".file-uploadb").fileinput('clear');
                    $.modal.alertError("请先输入课题名称");
                    return false;
                }
                // 自定义文件名生成规则
                fileExtension = filename.split('.').pop();
                const year = new Date().getFullYear();
                const newName = year +"-"+ $("input[name='rewardName']").val() +"-"+ "证书文件"+ "." + fileExtension;
                return newName;
            },
            showUpload: false,  // 隐藏上传按钮
        }).on('fileuploaded', function (event, data, previewId, index) {
            if (data.response && data.response.url) {
                $("input[name='" + event.currentTarget.id + "']").val(data.response.url);
            }
        }).on('fileremoved', function (event, id, index) {
            $("input[name='" + event.currentTarget.id + "']").val('');
        }).on('fileclear', function (event) {
            $("input[name='" + event.currentTarget.id + "']").val('');
        }).on('filebatchselected', function(event) {
            // 批量选择文件后立即上传
            $(this).fileinput('upload');
        }).on('fileselected', function(event) {
            // 单个文件选择后立即上传
            $(this).fileinput('upload');
        });
        $(this).fileinput('_initFileActions');
    });
    // 加载积分配置
    function loadScoreConfigs() {
        var fenlei = $('select[name="rewardFenlei"]').val();
        var dengji = $('select[name="rewardDengji"]').val();

        if (fenlei && dengji) {
            $.ajax({
                url: ctx + 'system/rewardcfg/getScoreConfigs',
                type: 'GET',
                data: { fenLei: fenlei, dengJi: dengji },
                success: function(result) {
                    if (result.code === 0) {
                        scoreConfigs = result.data;
                        assignScoresToMembers(); // 分配分数
                    }
                }
            });
        }
    }

    // 分配分数给所有成员
    function assignScoresToMembers() {
        // 1. 主持人（第1名）
        if (scoreConfigs.length > 0) {
            $('#expectedScore1').val(scoreConfigs[0].totalScore);
        } else {
            $('#expectedScore1').val('');
        }

        // 2. 成员1（第2名）
        if (scoreConfigs.length > 1) {
            $('#expectedScore2').val(scoreConfigs[1].totalScore);
        } else {
            $('#expectedScore2').val('');
        }

        // 3. 成员2（第3名）
        if (scoreConfigs.length > 2) {
            $('#expectedScore3').val(scoreConfigs[2].totalScore);
        } else {
            $('#expectedScore3').val('');
        }

        // 4. 成员3（第4名）
        if (scoreConfigs.length > 3) {
            $('#expectedScore4').val(scoreConfigs[3].totalScore);
        } else {
            $('#expectedScore4').val('');
        }
    }
</script>
