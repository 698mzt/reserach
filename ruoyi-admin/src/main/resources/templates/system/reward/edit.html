    <script th:inline="javascript">
        var prefix = ctx + "system/reward";

        /**
         * 【页面加载完成后执行】初始化成员联动功能
         */
        $(function(){
            // 【步骤1】保存成员1-3的原始选项（包含所有用户），用于后续过滤
            $('#member1Select, #member2Select, #member3Select').each(function() {
                var originalOptions = $(this).html();
                $(this).data('original-options', originalOptions);
            });

            // 【步骤2】加载已有动态成员（从后端 extraMembers 数据）
            initExtraMembers();

            // 【步骤3】执行一次联动，过滤已被选中的成员
            updateMemberLists();

            // 【步骤4】绑定"增加成员"按钮点击事件
            $('#addMemberBtn').on('click', function(){
                appendMemberSelect();
            });

            // 【步骤5】事件委托：绑定动态生成的删除按钮点击事件
            $(document).on('click', '.remove-member', function(){
                $(this).closest('.member-item').remove();  // 删除整行
                updateMemberLists();  // 更新联动（释放被占用的选项）
            });
        });

        /**
         * 【初始化动态成员】从后端 extraMembers 加载第5位及以后的成员
         */
        function initExtraMembers() {
            // 通过 Thymeleaf 内联语法获取后端数据
            var extraMembers = /*[[${extraMembers}]]*/ [];

            if (extraMembers && extraMembers.length > 0) {
                for (var i = 0; i < extraMembers.length; i++) {
                    // 成员编号从5开始（前面有主持人、成员1-3）
                    appendMemberSelectWithValue(extraMembers[i], i + 5);
                }
            }
        }

        /**
         * 【核心函数】更新所有成员下拉框，排除已选的人，避免重复选择
         */
        function updateMemberLists() {
            var selectedIds = new Set();  // 使用Set存储已选ID，自动去重

            // 【1】收集固定成员的选中值
            var firstValue = $('input[name="firstPersonId"]').val();   // 主持人
            var member1Value = $('#member1Select').val();              // 成员1
            var member2Value = $('#member2Select').val();              // 成员2
            var member3Value = $('#member3Select').val();              // 成员3

            // 添加到已选集合（排除空值）
            if (firstValue) selectedIds.add(firstValue);
            if (member1Value) selectedIds.add(member1Value);
            if (member2Value) selectedIds.add(member2Value);
            if (member3Value) selectedIds.add(member3Value);

            // 【2】收集动态成员（更多成员）的选中值
            $('.member-select').each(function() {
                var value = $(this).val();
                if (value) selectedIds.add(value);
            });

            // 【3】更新固定成员下拉框
            updateSelectOptions('#member1Select', member1Value, selectedIds);
            updateSelectOptions('#member2Select', member2Value, selectedIds);
            updateSelectOptions('#member3Select', member3Value, selectedIds);

            // 【4】更新所有动态成员下拉框
            $('.member-select').each(function() {
                rebuildSelectOptions($(this), $(this).val(), selectedIds);
            });
        }

        /**
         * 【辅助函数】更新指定下拉框的选项
         * @param selectId - jQuery选择器，如 '#member1Select'
         * @param currentValue - 当前选中的值（必须保留）
         * @param selectedIds - 已选成员ID集合（需要排除的）
         */
        function updateSelectOptions(selectId, currentValue, selectedIds) {
            var $select = $(selectId);
            var originalOptions = $('#member1Select').data('original-options');

            if (!originalOptions) return;

            // 清空现有选项（保留第一个"无"选项）
            $select.find('option:not(:first)').remove();

            // 从原始选项中重建，过滤已选的但保留当前值
            var tempDiv = $('<div>').html(originalOptions);
            tempDiv.find('option').each(function() {
                var value = $(this).val();
                var text = $(this).text();

                // 保留条件：有值 且 （未被选中 或 是当前选中的值）
                if (value && (!selectedIds.has(value) || value === currentValue)) {
                    $select.append($('<option></option>').val(value).text(text));
                }
            });

            // 恢复当前选中的值
            if (currentValue) {
                $select.val(currentValue);
            }
        }

        /**
         * 【辅助函数】重建下拉框选项（用于动态成员）
         */
        function rebuildSelectOptions($select, currentValue, selectedIds) {
            var originalOptions = $('#member1Select').data('original-options');
            if (!originalOptions) return;

            $select.find('option:not(:first)').remove();

            var tempDiv = $('<div>').html(originalOptions);
            tempDiv.find('option').each(function() {
                var value = $(this).val();
                var text = $(this).text();
                if (value && (!selectedIds.has(value) || value === currentValue)) {
                    $select.append($('<option></option>').val(value).text(text));
                }
            });

            if (currentValue) {
                $select.val(currentValue);
            }
        }

        /**
         * 【添加新成员】点击"增加成员"按钮调用
         * 创建第5位及以后的成员选择框
         */
        function appendMemberSelect() {
            // 计算新成员编号
            var existingCount = $('.member-item').length;
            var memberNumber = existingCount + 5;  // 成员5、成员6...
            var memberId = 'dynamicMember' + memberNumber;

            // 构建HTML
            var html = '<div class="col-xs-6 member-item m-b-xs">' +
                '<div class="input-group">' +
                '<label class="input-group-addon" style="min-width: 90px;">成员' + memberNumber + '：</label>' +
                '<select id="' + memberId + '" name="extraMemberIds" class="form-control member-select" onchange="updateMemberLists()">' +
                '<option value="">---请选择--</option>' +
                '</select>' +
                '<span class="input-group-btn">' +
                '<button class="btn btn-danger btn-sm remove-member" type="button" title="移除"><i class="fa fa-minus"></i></button>' +
                '</span>' +
                '</div>' +
                '</div>';

            var $tpl = $(html);
            var $select = $tpl.find('select.member-select');

            // 填充所有选项
            var originalOptions = $('#member1Select').data('original-options');
            if (originalOptions) {
                var tempDiv = $('<div>').html(originalOptions);
                tempDiv.find('option').each(function() {
                    var value = $(this).val();
                    var text = $(this).text();
                    if (value) {
                        $select.append($('<option></option>').val(value).text(text));
                    }
                });
            }

            // 添加到页面
            $('#memberContainer').append($tpl);

            // 更新联动（过滤已被占用的选项）
            updateMemberLists();
        }

        /**
         * 【带值添加成员】用于初始化时加载已有数据
         */
        function appendMemberSelectWithValue(selectedValue, memberNumber) {
            var memberId = 'dynamicMember' + memberNumber;

            var html = '<div class="col-xs-6 member-item m-b-xs">' +
                '<div class="input-group">' +
                '<label class="input-group-addon" style="min-width: 90px;">成员' + memberNumber + '：</label>' +
                '<select id="' + memberId + '" name="extraMemberIds" class="form-control member-select" onchange="updateMemberLists()">' +
                '<option value="">---请选择--</option>' +
                '</select>' +
                '<span class="input-group-btn">' +
                '<button class="btn btn-danger btn-sm remove-member" type="button" title="移除"><i class="fa fa-minus"></i></button>' +
                '</span>' +
                '</div>' +
                '</div>';

            var $tpl = $(html);
            var $select = $tpl.find('select.member-select');

            // 填充所有选项
            var originalOptions = $('#member1Select').data('original-options');
            if (originalOptions) {
                var tempDiv = $('<div>').html(originalOptions);
                tempDiv.find('option').each(function() {
                    var value = $(this).val();
                    var text = $(this).text();
                    if (value) {
                        $select.append($('<option></option>').val(value).text(text));
                    }
                });
            }

            // 设置选中值
            if (selectedValue) {
                $select.val(selectedValue);
            }

            $('#memberContainer').append($tpl);
        }

        $("#form-reward-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.saveTab(prefix + "/edit", $('#form-reward-edit').serialize());
            }
        }
        function chakan(){
            var c = $("#rewardWenjian").val();
            $.modal.openTab("查看证书文件" ,c );
        }

        $("input[name='rewardTime']").datetimepicker({
            format: "yyyy-mm-dd",
            minView: "month",
            autoclose: true
        });

        function downloadFile(type){
            var contextPath = '/' + window.location.pathname.split('/')[1];
        var c = window.location.origin + contextPath + $("#"+type).val();
            if(c){
                var a = document.createElement("a");
                a.href=c;
                a.download="";
                a.style.display = "none";
                document.body.appendChild(a);
                a.click();
                document.Element.removeChild(a);
            }else{
                alert("网址无效");
            }

        }

        $(".file-upload").each(function (i) {
            var val = $("input[name='" + this.id + "']").val()
            var initialPreview = [];
            var initialPreviewConfig = [];
            
            if (val && val.trim() !== '') {
                initialPreview = [val];
                initialPreviewConfig = [{
                    type: "pdf",
                    caption: val.split('/').pop(),
                    url: ctx + "common/delete",
                    key: val
                }];
            }
            
                        $(this).fileinput({
                'uploadUrl': ctx + 'common/upload/jl',
                initialPreviewAsData: true,
                initialPreview: initialPreview,
                initialPreviewConfig: initialPreviewConfig,
                maxFileCount: 1,
        maxFileSize: 51200,
                autoReplace: true,
                overwriteInitial: true,
                allowedFileExtensions: ["pdf", "jpg", "jpeg", "png", "doc", "docx"],
                slugCallback: function(filename) {
                    if ($("input[name='topName']").val()===""){
                        $(".file-uploadb").fileinput('clear');
                        $.modal.alertError("请先输入课题名称");
                        return false;
                    }
                    // 自定义文件名生成规则
                    fileExtension = filename.split('.').pop();
                    const year = new Date().getFullYear();
                    const newName = year +"-"+ $("input[name='rewardName']").val() +"-"+ "证书文件"+ "." + fileExtension;
                    return newName;
                },
                showUpload: false,  // 隐藏上传按钮
            }).on('fileuploaded', function (event, data, previewId, index) {
                if (data.response && data.response.url) {
                    $("input[name='" + event.currentTarget.id + "']").val(data.response.url);
                }
            }).on('fileremoved', function (event, id, index) {
                $("input[name='" + event.currentTarget.id + "']").val('');
            }).on('fileclear', function (event) {
                $("input[name='" + event.currentTarget.id + "']").val('');
            }).on('filebatchselected', function(event) {
                // 批量选择文件后立即上传
                $(this).fileinput('upload');
            }).on('fileselected', function(event) {
                // 单个文件选择后立即上传
                $(this).fileinput('upload');
            });
            $(this).fileinput('_initFileActions');
        });
    </script>
