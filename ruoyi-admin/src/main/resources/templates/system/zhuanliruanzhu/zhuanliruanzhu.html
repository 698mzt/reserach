    <script type="text/javascript">
        function getCurrentTime() {
            var now = new Date();
            var year = now.getFullYear();
            var month = String(now.getMonth() + 1).padStart(2, '0');
            var day = String(now.getDate()).padStart(2, '0');
            var hours = String(now.getHours()).padStart(2, '0');
            var minutes = String(now.getMinutes()).padStart(2, '0');
            var seconds = String(now.getSeconds()).padStart(2, '0');
            return year + '-' + month + '-' + day + ' ' + hours + ':' + minutes + ':' + seconds;
        }
    </script>

        .modal-right {

        .progress_inner {
            height: 80px;
            width: 100%;
            position: relative;
        }

        .progress_inner__step {
            width: 33.33%;
            font-size: 12px;
            padding: 0 5px;
            transition: all 0.4s;
            float: left;
            text-align: center;
            position: relative;
        }

        .progress_inner__step label {
            padding-top: 30px;
            display: block;
            position: relative;
            cursor: pointer;
        }

        .progress_inner__step:before {
            content: "1";
            width: 24px;
            height: 24px;
            color: #2196F3;
            background: white;
            line-height: 22px;
            border: 2px solid #2196F3;
            font-size: 12px;
            top: 0;
            border-radius: 50%;
            transition: all 0.4s;
            position: absolute;
            left: 0;
            right: 0;
            margin: auto;
            font-weight: bold;
            z-index: 11;
        }

        .progress_inner__step:nth-of-type(2):before {
            content: "2";
            color: #9E9E9E;
            border-color: #9E9E9E;
        }

        .progress_inner__step:nth-of-type(3):before {
            content: "3";
            color: #9E9E9E;
            border-color: #9E9E9E;
        }

        .progress_inner__step.completed:before {
            content: "✓";
            color: #4CAF50;
            border-color: #4CAF50;
            line-height: 22px;
            font-size: 14px;
        }

        .progress_inner__step.active:before {
            color: #2196F3;
            border-color: #2196F3;
            background: white;
        }

        .progress_inner__step.pending:before {
            color: #9E9E9E;
            border-color: #9E9E9E;
            background: white;
        }

        .progress_inner__bar {
            height: 3px;
            left: 16.665%;
            right: 16.665%;
            background: #E0E0E0;
            position: absolute;
            top: 12px;
            z-index: -1;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress_inner__bar--progress {
            height: 100%;
            background: #4CAF50;
            width: 0;
            transition: width 0.6s ease;
        }

        /* 分段高亮连接线 */
        .progress_inner__bar .segment {
            position: absolute;
            height: 100%;
            width: 50%;
            background: transparent;
            transition: background 0.4s ease;
        }

        .progress_inner__bar .segment.first {
            left: 0;
        }

        .progress_inner__bar .segment.second {
            right: 0;
        }

        .progress_inner__bar .segment.highlight {
            background: #4CAF50;

<script th:inline="javascript">
    var editFlag = [[${@permission.hasPermi('system:zhuanliruanzhu:edit')}]];
    var removeFlag = [[${@permission.hasPermi('system:zhuanliruanzhu:remove')}]];
    var xueyuanDatas = [[${@dict.getType('sys_xueyuan')}]];
    var leixingDatas = [[${@dict.getType('sys_zhuanli_leibie')}]];
    var shifouyingyonDatas = [[${@dict.getType('sys_yes_no')}]];
    var hangyelianheDatas = [[${@dict.getType('sys_yes_no')}]];
    var fenleiDatas = [[${@dict.getType('sys_zhuanli_fenlei')}]];
    var datas = [[${@dict.getType('sys_zhuanli_zd')}]];
    var paiMingDatas = [[${@dict.getType('sys_zhuanliruanzhu_fzr')}]];
    var proFlag = [[${@permission.hasPermi('system:zhuanliruanzhu:process')}]];
    var editInfo = [[${@permission.hasPermi('system:zhuanliruanzhu:info')}]];
    var hechaFlag = [[${@permission.hasPermi('system:zhuanliruanzhu:hecha')}]];
    var createFlag = [[${@permission.hasPermi('system:zhuanliruanzhu:add')}]];
    var chayueFlag = [[${@permission.hasPermi('system:zhuanliruanzhu:chayue')}]];
    var chexiaoFlag = [[${@permission.hasPermi('system:zhuanliruanzhu:chexiao')}]];
    var kyrevokeFlag = [[${@permission.hasPermi('system:zhuanliruanzhu:kyrevoke')}]];

    var role = [[${role}]];
    var isTeacher = [[${isTeacher}]];
    var isResearch = role === 'research' || proFlag !== 'hidden';
    var isDeptTeacher = role === 'dept_teacher' || hechaFlag !== 'hidden';
    var isSciTesearch = role === 'sci_tesearch' || chayueFlag !== 'hidden' || kyrevokeFlag !== 'hidden';
    var isAdmin = role === 'admin';
    var isCollegeAdmin = role === 'dept_teacher';

    var prefix = ctx + "system/zhuanliruanzhu";

    $(function() {
        // 注册PageRender动作处理器
        PageRender.registerHandlers({
            'view': function(actionKey, data) {
                $.operate.detailTab(data.id + '/chakan');
            },
            'viewProcess': function(actionKey, data) {
                showhistory(data.id, data.state);
            },
            'edit': function(actionKey, data) {
                $.operate.editTab(data.id);
            },
            'remove': function(actionKey, data) {
                $.operate.remove(data.id);
            },
            'submit': function(actionKey, data) {
                submitDirectly(data.id);
            },
            'review': function(actionKey, data) {
                $.operate.detailTab(data.id + '/review');
            },
            'approve': function(actionKey, data) {
                var urlFlag = data.state === 'PATENT_JYS_AUDIT' ? 'pro' : 'chayue';
                $.operate.detailTab(data.id + '/' + urlFlag);
            },
            'reject': function(actionKey, data) {
                var urlFlag = data.state === 'PATENT_JYS_AUDIT' ? 'pro' : 'chayue';
                $.operate.detailTab(data.id + '/' + urlFlag);
            },
            'kyReview': function(actionKey, data) {
                $.operate.detailTab(data.id + '/chayue');
            },
            'recall': function(actionKey, data) {
                recallDirectly(data.id);
            }
        });

        // 绑定PageRender按钮点击事件
        $(document).off('click.prAction').on('click.prAction', 'button[data-action-key], a[data-action-key]', function(e) {
            e.preventDefault();
            var $btn = $(this);
            var actionKey = $btn.data('action-key');
            var confirmMsg = $btn.data('confirm');
            // 从最近的tr中获取行数据
            var $tr = $btn.closest('tr');
            var rowIndex = $tr.data('index');
            var row = null;
            if (rowIndex !== undefined) {
                row = $('#bootstrap-table').bootstrapTable('getData')[rowIndex];
            }
            // 如果从表格获取失败，尝试从缓存获取
            if (!row && $tr.data('rowData')) {
                row = $tr.data('rowData');
            }

            if (!row) {
                $.modal.alertError('无法获取行数据');
                return;
            }

            if (confirmMsg) {
                $.modal.confirm(confirmMsg, function() {
                    PageRender.dispatchAction(actionKey, row);
                });
            } else {
                PageRender.dispatchAction(actionKey, row);
            }
        });

        function initTable(options) {
            var tableId = options.id;
            options.url = getUrl(tableId);
            $.table.init(options);
        }

        function getUrl(tableId) {
            var year = localStorage.getItem("year");
            if (year && year !== '全部') {
                return prefix + "/list/?year=" + year;
            }
            return prefix + "/list/";
        }

        var options = {
            id: "bootstrap-table",
            toolbar: "toolbar",
            formId: "formId",
            url: prefix + "/list",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            detailUrl: prefix + "/detail/{id}",
            exportUrl: prefix + "/export",
            recallUrl: prefix + "/recall/{id}",
            rowStyle: rowStyle0,
            modalName: "专利软著",
            columns: [{
                checkbox: true,
                align: "center"
            }, {
                    field: 'number',
                    title: '序号',
                    width: 5,
                    align: 'center',
                    switchable: false,
                    formatter: function(value, row, index) {
                        return $.table.serialNumber(index);
                    }
                },
                {
                    field: 'id',
                    title: 'id',
                    visible: false
                },
                {
                    field: 'xueyuan',
                    title: '学院'
                },
                {
                    field: 'jiaoyanshi',
                    title: '专业'
                },
                {
                    field: 'xingming',
                    title: '姓名'
                },
                {
                    field: 'mingcheng',
                    title: '名称'
                },
                // {
                //     field: 'leixing',
                //     title: '类型',
                //     formatter: function(value, row, index) {
                //         return $.table.selectDictLabel(leixingDatas, value);
                //     }
                // },
                {
                    field: 'huopishijain',
                    title: '获批时间'
                },
                {
                    field: 'fenlei',
                    title: '分类',
                    formatter: function(value, row, index) {
                        return $.table.selectDictLabel(fenleiDatas, value);
                    }
                },
                /*[# th:if="${isTeacher}"]*/
                {
                    field: 'paiming',
                    title: '个人排名',
                    formatter: function(value, row, index) {
                        // 个人排名展示为 1/2/3/4/5（槽位/成员顺序），不走字典label
                        return value === null || value === undefined ? '' : value;
                    }
                },
                {
                    field: 'expectedJifen',
                    title: '预计积分',
                    formatter: function (value, row, index) {
                        // 预计积分始终显示，不随finalJifen变化
                        return value === null || value === undefined || value === '' ? '0' : value;

                                return action.actionKey === 'review' || action.actionKey === 'kyReview';

                                }
                                if (isResearch && a.actionKey === 'recall') {
                                    return isKycAudit;
                                }
                                if (isSciTesearch && a.actionKey === 'recall') {
                                    if (hasReviewAction) {
                                        return false;
                                    }
                                    return isPassed;
                                }
                                return a.actionKey !== 'approve' && a.actionKey !== 'reject';
                            });
                            
                            if (isResearch && isKycAudit) {
                                var hasRecallAction = listActions.some(function(a) {
                                    return a.actionKey === 'recall';
                                });
                                if (!hasRecallAction) {
                                    listActions.push({
                                        actionKey: 'recall',

                            }
                            
                            if (isSciTesearch && isPassed && !hasReviewAction) {
                                var hasRecallAction = listActions.some(function(a) {
                                    return a.actionKey === 'recall';
                                });
                                if (!hasRecallAction) {
                                    listActions.push({
                                        actionKey: 'recall',
                                        actionText: '撤回',
                                        colorType: 'warning',
                                        sortOrder: 50,
                                        confirmMsg: '确定要撤回该记录吗？'
                                    });
                                }
                            }
                            
                            listActions.forEach(function(action) {
                                if (action.actionKey === 'view' || action.actionKey === 'viewProcess') {
                                    secondRowActions.push(action);
                                } else {
                                    firstRowActions.push(action);
                                }
                            });
                        } else {
                            var state = String(row.state);
                            var isRejected = state === 'PATENT_REJECTED' || ['3', '5', '7'].indexOf(state) !== -1;
                            var isDraft = state === 'PATENT_DRAFT' || state === '0';
                            
                            if (editFlag !== 'hidden' && (isRejected || isDraft)) {
                                firstRowActions.push({actionKey: 'edit', actionText: '编辑', colorType: 'primary', sortOrder: 10});
                            }
                            if (removeFlag !== 'hidden' && isDraft) {
                                firstRowActions.push({actionKey: 'remove', actionText: '删除', colorType: 'danger', sortOrder: 20, confirmMsg: '确定要删除该记录吗？'});
                            }
                            if (editFlag !== 'hidden' && isDraft) {
                                firstRowActions.push({actionKey: 'submit', actionText: '提交', colorType: 'success', sortOrder: 5, confirmMsg: '确定要提交该记录吗？'});
                            }

                                secondRowActions.push({actionKey: 'view', actionText: '查看', colorType: 'info', sortOrder: 100});
                                secondRowActions.push({actionKey: 'viewProcess', actionText: '查看流程', colorType: 'info', sortOrder: 101});
                            }
                        }
                        
                        var firstRowHtml = firstRowActions.length > 0 ? PageRender.renderActionsToString(firstRowActions, {style: 'table', separator: '&nbsp;&nbsp;&nbsp;'}) : '';
                        var secondRowHtml = secondRowActions.length > 0 ? PageRender.renderActionsToString(secondRowActions, {style: 'table', separator: '&nbsp;&nbsp;&nbsp;'}) : '';
                        
                        if (firstRowHtml && secondRowHtml) {
                            return '<div style="margin-bottom: 5px;">' + firstRowHtml + '</div>' + secondRowHtml;
                        } else if (firstRowHtml) {
                            return firstRowHtml;
                        } else if (secondRowHtml) {
                            return secondRowHtml;
                        }
                        return '';
                    }
                }
            ]
        };

        window.location.href = ctx + 'common/HXdownloadZip?id=' + id;
    }
//批量下载
    var batchDownloadInProgress = false;

    function parseDownloadFileName(contentDisposition) {
        if (!contentDisposition) {
            return "";
        }

        var utf8Match = contentDisposition.match(/filename\*=UTF-8''([^;]+)/i);
        if (utf8Match && utf8Match[1]) {
            return decodeURIComponent(utf8Match[1]).replace(/["]/g, "");
        }

        var fileNameMatch = contentDisposition.match(/filename="?([^";]+)"?/i);
        return fileNameMatch && fileNameMatch[1] ? decodeURIComponent(fileNameMatch[1]) : "";
    }

    function readBlobAsText(blob, callback) {
        if (!blob) {
            callback("");
            return;
        }

        var reader = new FileReader();
        reader.onload = function () {
            callback(reader.result || "");
        };
        reader.onerror = function () {
            callback("");
        };
        reader.readAsText(blob, "utf-8");
    }

    function extractDownloadErrorMessage(text) {
        if (!text) {
            return "批量下载失败，请稍后重试";
        }

        try {
            var result = JSON.parse(text);
            if (result && result.msg) {
                return result.msg;
            }
        } catch (e) {
        }

        return text.replace(/<[^>]+>/g, "").trim() || "批量下载失败，请稍后重试";
    }

    function triggerBlobDownload(blob, fileName) {
        var resolvedFileName = fileName || "专利软著_批量下载.zip";
        if (window.navigator.msSaveOrOpenBlob) {
            window.navigator.msSaveOrOpenBlob(blob, resolvedFileName);
            return;
        }

        var downloadUrl = window.URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.style.display = "none";
        link.href = downloadUrl;
        link.download = resolvedFileName;
        document.body.appendChild(link);
        link.click();
        setTimeout(function () {
            document.body.removeChild(link);
            window.URL.revokeObjectURL(downloadUrl);
        }, 100);
    }

    function finishBatchDownload() {
        batchDownloadInProgress = false;
        $.modal.closeLoading();
    }

    function batchDownload(module) {
        var ids = $.table.selectColumns("id", false);
        if (!ids || ids.length === 0) {
            $.modal.alertWarning("未选择数据");
            return;
        }
        if (batchDownloadInProgress) {
            $.modal.alertWarning("批量下载正在处理中，请稍候...");
            return;
        }

        batchDownloadInProgress = true;
        $.modal.loading("正在打包下载，请稍候...");

        var xhr = new XMLHttpRequest();
        xhr.open("GET", ctx + "common/batchDownload?ids=" + encodeURIComponent(ids.join(",")) + "&module=" + encodeURIComponent(module), true);
        xhr.responseType = "blob";
        xhr.timeout = 10 * 60 * 1000;

        xhr.onload = function () {
            var blob = xhr.response;
            var contentDisposition = xhr.getResponseHeader("Content-Disposition") || "";
            var contentType = xhr.getResponseHeader("Content-Type") || "";
            var isDownloadResponse = contentDisposition.indexOf("attachment") !== -1
                || contentType.indexOf("application/zip") !== -1
                || contentType.indexOf("application/octet-stream") !== -1;

            if (xhr.status >= 200 && xhr.status < 300 && isDownloadResponse) {
                triggerBlobDownload(blob, parseDownloadFileName(contentDisposition));
                finishBatchDownload();
                return;
            }

            readBlobAsText(blob, function (text) {
                $.modal.alertError(extractDownloadErrorMessage(text));
                finishBatchDownload();
            });
        };

        xhr.onerror = function () {
            $.modal.alertError("批量下载失败，请检查网络或稍后重试");
            finishBatchDownload();
        };

        xhr.ontimeout = function () {
            $.modal.alertError("批量下载超时，请稍后重试");
            finishBatchDownload();
        };

        xhr.send();
    }

    function showhistory(id, state) {
        $('#lcjl_Moda').modal('show');
        
        // 查询审批记录
        $.ajax({
            url: prefix + '/bhyy/' + id,
            type: 'POST',
            data: {
                kid: id
            },
            success: function (response) {
                // 更新事件列表
                updateEventData(response.rows);
                // 更新进度条状态
                updateProgressState(state);

            }

    function updateEventData(rows) {
        const eventList = document.getElementById('event-list');
        eventList.innerHTML = '';
        
        if (rows && rows.length > 0) {
            rows.forEach(function (row, index) {
                const li = document.createElement('li');
                if (index === 0) {
                    li.classList.add('first');
                }
                li.innerHTML = `
                    <i class="node-icon"></i>
                    <span class="time" id="current-time">${row.createTime}</span>
                    <span class="txt">[${row.state}] - ${row.uname}</span>
                `;
                eventList.appendChild(li);
            });
        } else {
            const li = document.createElement('li');
            li.classList.add('first');
            li.innerHTML = `
                <i class="node-icon"></i>
                <span class="time" id="current-time">等待操作...</span>
                <span class="txt">[新增] - 哈尔滨信息工程学院</span>
            `;
            eventList.appendChild(li);
        }
    }

    function updateProgressState(state) {
        const steps = document.querySelectorAll('.progress_inner__step');
        const progressBar = document.querySelector('.progress_inner__bar');
        
        // 重置所有步骤
        steps.forEach((step, index) => {
            step.classList.remove('active', 'completed');
            step.classList.add('pending');
            const statusText = step.querySelector('.status-text');
            if (statusText) {
                statusText.classList.remove('active', 'completed');
            }
        });
        
        // 创建分段元素（如果尚未创建）
        if (progressBar && !progressBar.querySelector('.segment')) {
            const firstSegment = document.createElement('div');
            firstSegment.className = 'segment first';
            const secondSegment = document.createElement('div');
            secondSegment.className = 'segment second';
            progressBar.appendChild(firstSegment);
            progressBar.appendChild(secondSegment);
        }
        
        // 移除所有分段高亮
        const segments = progressBar ? progressBar.querySelectorAll('.segment') : [];
        segments.forEach(segment => {
            segment.classList.remove('highlight');
        });

        // 根据状态更新进度条
        if (typeof state === 'string' && state.startsWith('PATENT_')) {
            // 使用新的状态码格式
            if (state === 'PATENT_DRAFT' || state === 'PATENT_REJECTED') {
                highlightStep(0);
            } else if (state === 'PATENT_JYS_AUDIT' || state === 'PATENT_KYC_AUDIT') {
                markCompleted(0);
                highlightStep(1);
                if (segments[0]) {
                    segments[0].classList.add('highlight');
                }
            } else if (state === 'PATENT_PASSED') {
                markCompleted(0);
                markCompleted(1);
                highlightStep(2);
                markCompleted(2);
                segments.forEach(segment => {
                    segment.classList.add('highlight');
                });
            }
        } else {
            // 兼容旧的数字状态码
            if ([0, 3, 5, 7].includes(state)) {
                highlightStep(0);
            } else if (state === 6) {
                markCompleted(0);
                markCompleted(1);
                highlightStep(2);
                markCompleted(2);
                segments.forEach(segment => {
                    segment.classList.add('highlight');
                });
            } else if ([1, 2, 4].includes(state)) {
                markCompleted(0);
                highlightStep(1);
                if (segments[0]) {
                    segments[0].classList.add('highlight');
                }
            } else {
                steps.forEach(step => {
                    step.classList.add('pending');
                });
            }
        }
    }

    function highlightStep(index) {
        const step = document.querySelectorAll('.progress_inner__step')[index];
        if (step) {
            step.classList.add('active');
            step.classList.remove('pending');
            const statusText = step.querySelector('.status-text');
            if (statusText) {
                statusText.classList.add('active');
            }
        }
    }

    function markCompleted(index) {
        const step = document.querySelectorAll('.progress_inner__step')[index];
        if (step) {
            step.classList.add('completed');
            step.classList.remove('pending', 'active');
            const statusText = step.querySelector('.status-text');
            if (statusText) {
                statusText.classList.add('completed');
            }
        }
    }
