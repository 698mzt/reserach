<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改专利软著')" />

</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">

    <div th:if="${errorMsg}" class="alert alert-danger" style="margin: 10px 0;">

    <form class="form-horizontal m" id="form-zhuanliruanzhu-edit" th:object="${sciZhuanliruanzhu}">

        <input name="state" id="state" th:field="*{state}" type="hidden">

        <div class="form-group row">

<!--            <div class="col-sm-6">-->

<!--                <div class="col-sm-8">-->

<!--                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{leixing}"></option>-->
<!--                    </select>-->
<!--                </div>-->
<!--            </div>-->
            <div class="col-sm-6">
                <label class="col-sm-4 control-label is-required">分类：</label>
                <div class="col-sm-8">
                    <select name="fenlei" class="form-control" th:with="type=${@dict.getType('sys_zhuanli_fenlei')}" required disabled="true">
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{fenlei}"></option>
                    </select>
                </div>
            </div>
        </div>
        <div class="form-group row">
            <div class="col-sm-6">
                <label class="col-sm-4 control-label is-required">授权号：</label>
                <div class="col-sm-8">
                    <input name="shoquanhao" th:field="*{shoquanhao}" class="form-control" type="text" required disabled="true">
                </div>
            </div>
            <div class="col-sm-6">
                <label class="col-sm-4 control-label is-required">获批时间：</label>
                <div class="col-sm-8">
                    <div class="input-group date">
                        <input name="huopishijain" th:value="${#dates.format(sciZhuanliruanzhu.huopishijain, 'yyyy-MM-dd')}" class="form-control" placeholder="yyyy-MM-dd" type="text" required disabled="true">
                        <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 添加成员显示部分 -->
        <div class="form-group row">
            <div class="col-sm-6">
                <label class="col-sm-4 control-label">成员1：</label>
                <div class="col-sm-8">
                    <select name="secondPersonId" class="form-control" disabled="true">
                        <option value="">无</option>
                        <option th:each="user : ${sysUsers1}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${ #strings.toString(user.userId) == sciZhuanliruanzhu.secondPersonId}"></option>
                    </select>
                </div>
            </div>
            <div class="col-sm-6">
                <label class="col-sm-4 control-label">成员2：</label>
                <div class="col-sm-8">
                    <select name="thirdPersonId" class="form-control" disabled="true">
                        <option value="">无</option>
                        <option th:each="user : ${sysUsers1}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${ #strings.toString(user.userId) == sciZhuanliruanzhu.thirdPersonId}"></option>
                    </select>
                </div>
            </div>
        </div>

        <div class="form-group row">
            <div class="col-sm-6">
                <label class="col-sm-4 control-label">成员3：</label>
                <div class="col-sm-8">
                    <select name="fourthPersonId" class="form-control" disabled="true">
                        <option value="">无</option>
                        <option th:each="user : ${sysUsers1}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${ #strings.toString(user.userId) == sciZhuanliruanzhu.fourthPersonId}"></option>
                    </select>
                </div>
            </div>
            <div class="col-sm-6">
                <label class="col-sm-4 control-label">更多成员：</label>
                <div class="col-sm-8">
                    <div id="moreMembersDisplay" class="form-control" style="background-color: #f5f5f5; border: 1px solid #ccc; min-height: 34px; padding: 6px 12px;">暂无</div>
                </div>
            </div>
        </div>

        <div class="form-group row">
            <div class="col-sm-6">
                <label class="col-sm-4 control-label">是否应用：</label>
                <div class="col-sm-8" th:with="type=${@dict.getType('sys_yes_no')}">
                    <label th:each="dict : ${type}" class="check-box">
                        <input name="shifouyingyon" type="checkbox" th:value="${dict.dictValue}" th:text="${dict.dictLabel}" th:attr="checked=${sciZhuanliruanzhu.shifouyingyon.contains(dict.dictValue)?true:false}" disabled="true">
                    </label>
                </div>
            </div>
            <div class="col-sm-6">
                <label class="col-sm-4 control-label">是否行业联合：</label>
                <div class="col-sm-8" th:with="type=${@dict.getType('sys_yes_no')}">
                    <label th:each="dict : ${type}" class="check-box">
                        <input name="hangyelianhe" type="checkbox" th:value="${dict.dictValue}" th:text="${dict.dictLabel}" th:attr="checked=${sciZhuanliruanzhu.hangyelianhe.contains(dict.dictValue)?true:false}" disabled="true">
                    </label>

        <div class="form-group row">
<!--            <div class="col-sm-6">-->
<!--                <label class="col-sm-4 control-label is-required">分类：</label>-->
<!--                <div class="col-sm-8">-->
<!--                    <select name="fenlei" class="form-control" th:with="type=${@dict.getType('sys_zhuanli_fenlei')}" required disabled="true">-->
<!--                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{fenlei}"></option>-->
<!--                    </select>-->
<!--                </div>-->
<!--            </div>-->
        <div class="col-sm-6">
            <label class="col-sm-4 control-label is-required">个人排名：</label>
            <div class="col-sm-8">
                <select name="paiming" class="form-control" th:with="type=${@dict.getType('sys_zhuanliruanzhu_fzr')}" required disabled="true" th:field="*{paiming}">
                    <option th:each="dict : ${type}" th:text="${dict.dictValue}" th:value="${dict.dictValue}"></option>
                </select>

            </div>
        </div>
        <div class="row">
            <div class="col-sm-6">
                <label class="col-sm-4 control-label is-required">专利文件：</label>
                <div class="col-sm-8">
                    <input th:field="*{wenjian}" hidden id="wenjian" type="text">
<!--                    <div style="display: inline-block;">-->
<!--                        <div id="wenjianFileName" style="display: inline; margin-right: 5px;"></div>-->
<!--                    </div>-->
                    <div>
                        <button onclick="chakan()" class="btn btn-sm btn-primary color">预览</button>
                        <button onclick="downloadFile('wenjian')" class="btn btn-sm btn-primary color">下载</button>
                    </div>
                </div>
            </div>
        </div>






        <h4 class="form-header h4 tdiv1" style="display:none; margin-top: 20px;">批阅记录</h4>
        <div class="row tdiv1" style="display:none; margin-top: 10px;">
            <div class="col-sm-12">
                <div class="form-group">
                    <label class="col-xs-2 control-label">批注：</label>
                    <div class="col-xs-10">
                        <textarea name="remark" id="remark" maxlength="500" class="form-control" rows="3"></textarea>
                    </div>
                </div>
            </div>
        </div>
        <h4 class="form-header h4 tdiv2" style="display:none; margin-top: 20px;">批阅记录</h4>
        <div class="row tdiv2" style="display:none; margin-top: 10px;">
            <div class="col-sm-12">
                <div class="form-group">
                    <table id='bootstrap-table'></table>
                </div>
            </div>
        </div>

</div>

<div class="row">
    <div class="col-sm-offset-5 col-sm-10">
        <button type="button" class="btn btn-sm btn-success" id="btn1" style="display:none;" onclick="submitHandler()"> 通 过</button>
        <button type="button" class="btn btn-sm btn-danger" id="btn2" style="display:none;" onclick="submitHandlerBH()"> <span id="rejectBtnText">驳 回</span></button>
        <button type="button" class="btn btn-sm btn-warning" id="btn3" style="display:none;" onclick="closeItem()"> 关 闭 </button>
    </div>
</div>

<th:block th:include="include :: footer" />
<th:block th:include="include :: datetimepicker-js" />
<th:block th:include="include :: bootstrap-fileinput-js"/>
<th:block th:include="include :: select2-js" />
<script th:src="@{/ruoyi/js/page-render.js}"></script>
<script th:inline="javascript"  type="text/javascript">
    var prefix = ctx + "system/zhuanliruanzhu";
    
    // 获取当前用户角色信息
    var userRole = '';
    var userRoles = [[${sysUser.roles}]];  // 从后端获取的角色列表
    
    // 优先检查管理员角色，确保超级管理员显示所有字段
    if (userRoles) {
        for (var i = 0; i < userRoles.length; i++) {
            var roleKey = userRoles[i].roleKey;
            if (roleKey === 'admin') {
                userRole = 'admin';  // 超级管理员
                break;
            }
        }
    }
    
    // 如果不是管理员，继续判断其他角色
    if (!userRole && userRoles) {
        for (var i = 0; i < userRoles.length; i++) {
            var roleKey = userRoles[i].roleKey;
            if (roleKey === 'sci_tesearch') {
                userRole = 'sci_tesearch';  // 科研处
                break;
            } else if (roleKey === 'research') {
                userRole = 'research';  // 教研室
                break;
            } else if (['dept_teacher', 'discuss_college', 'dzgc_college', 'yssj_college', 
                       'student_college', 'marxism_college', 'general'].indexOf(roleKey) !== -1) {
                userRole = 'dept_teacher';  // 学院
                break;
            }
        }
    }
    
    // 默认角色为教师
    if (!userRole) {
        userRole = 'teacher'; // 默认为教师角色
    }
    $("#form-zhuanliruanzhu-edit").validate({
        focusCleanup: true
    });

    // function submitHandler() {
    //     if ($.validate.form()) {
    //         $.operate.save(prefix + "/edit", $('#form-zhuanliruanzhu-edit').serialize());
    //     }
    // }

    $("input[name='huopishijain']").datetimepicker({
        format: "yyyy-mm-dd",
        minView: "month",
        autoclose: true
    });

    function displayFileName(inputId, fileNameId) {
        const input = document.getElementById(inputId);
        const fileNameSpan = document.getElementById(fileNameId);
        if (input.value) {
            const fileName = input.value.split('/').pop(); // 获取最后一个'/'后的文件名
            fileNameSpan.textContent = fileName; // 直接显示完整文件名
        } else {
            fileNameSpan.textContent = '无效文件';
        }
    }

    function chakan(){
        var relativePath = $("#wenjian").val();
        if (!relativePath) {
            alert("没有可预览的文件！");
            return;
        }
        
        // 检查是否为MinIO文件（路径以/minio/开头）
        if (relativePath.startsWith('/minio/')) {
            // 对于MinIO文件，使用新的预览接口
            var contextPath = '/' + window.location.pathname.split('/')[1];
            var previewUrl = window.location.origin + contextPath + '/common/preview?fileName=' + encodeURIComponent(relativePath);
            window.open(previewUrl, '_blank');
        } else {
            // 对于本地文件，按原方式处理
            var contextPath = '/' + window.location.pathname.split('/')[1];
            var fullPath = window.location.origin + contextPath + relativePath;
            window.open(fullPath, '_blank');
        }
    }

    function downloadFile(type){
        var relativePath = $("#" + type).val();
        if (!relativePath) {
            alert("没有可下载的文件！");
            return;
        }
        
        var downloadUrl;
        // 检查是否为MinIO文件（路径以/minio/开头）
        if (relativePath.startsWith('/minio/')) {
            // 对于MinIO文件，使用通用下载接口
            var contextPath = '/' + window.location.pathname.split('/')[1];
            downloadUrl = window.location.origin + contextPath + '/common/download?fileName=' + encodeURIComponent(relativePath);
        } else {
            // 对于本地文件，按原方式处理
            var contextPath = '/' + window.location.pathname.split('/')[1];
            downloadUrl = window.location.origin + contextPath + relativePath;
        }
        
        if(downloadUrl){
            var a = document.createElement("a");
            a.href=downloadUrl;
            a.download="";
            a.style.display = "none";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }else{
            alert("网址无效");
        }
    }



    $(function() {
        // 注册PageRender动作处理器
        PageRender.registerHandlers({
            'view': function(actionKey, data) {
                closeItem();
            },
            'viewProcess': function(actionKey, data) {
                viewProcess(data.id);
            },
            'approve': function(actionKey, data) {
                submitHandler();
            },
            'reject': function(actionKey, data) {
                submitHandlerBH();
            },
            'recall': function(actionKey, data) {
                submitHandlerBH();
            }
        });

        var kid = $("#ktid").val();
        var options = {
            url: prefix + "/bhyy/" + kid,
            showSearch: false,
            showRefresh: false,
            showToggle: false,
            showColumns: false,
            pagination: false,
            columns: [
                {
                    field: 'createTime',
                    title: '批阅时间',
                    width: 200
                },
                {
                    field: 'uname',
                    title: '批阅人',
                    width: 100
                },
                {
                    field: 'concate',
                    title: '批阅内容',
                    width: 500
                },
                {
                    field: 'stateText',
                    title: '审核状态',
                    width: 100
                }]
        };
        $.table.init(options);

        $('#bootstrap-table').on('load-success.bs.table', function (e, name, args) {
            var rows = name && name.rows ? name.rows : [];
            var a = $("#state").val();
            var b = $("#urlFlag").val();

            if (b == 'ZLRZ') {
                $(".tdiv2").show();
                $("#btn3").show();
            } else if (b == "info") {
                if (rows.length > 0) {
                    $(".tdiv2").show();
                }
                $("#btn3").show();
            } else {
                if (a == 'PATENT_JYS_AUDIT' || a == 'PATENT_KYC_AUDIT' || a == 'PATENT_DRAFT') {
                    if (rows.length > 0) {
                        $(".tdiv2").show();
                    }
                    $(".tdiv1").show();
                    $("#btn2").show();
                    if (b != "tuihui" && b != "xytuihui") {
                        $("#btn1").show();
                    }
                }
                if (a == 'PATENT_PASSED' || a == 'PATENT_REJECTED') {
                    if (rows.length > 0) {
                        $(".tdiv2").show();
                    }
                    // 只有科研处或管理员角色才能看到撤回按钮
                    if (a == 'PATENT_PASSED' && b == "zgqxtuihui" && (userRole === 'sci_tesearch' || userRole === 'admin')) {
                        $(".tdiv1").show();
                        $("#btn2").show();
                    }
                }
                $("#btn3").show();
            }
        });
    });

    function submitHandler() {
        var urlFlag = $("#urlFlag").val();
        var remark = $('#remark').val();
        $.operate.saveTab(prefix + "/hxPass", {"id": $("#ktid").val(), "urlFlag": urlFlag, "remark": remark});
    }

    function submitHandlerBH() {
        var isWithdraw = $("#rejectBtnText").text().trim() === "撤 回";

        if (isWithdraw) {
            $('textarea[name="remark"]').removeAttr('required');
        } else {
            $('textarea[name="remark"]').attr('required', 'required');
        }

        var urlFlag = $("#urlFlag").val();
        var remark = $('#remark').val();
        
        if (!isWithdraw && !remark.trim()) {
            $.modal.msgWarning("批注不能为空");
            return;
        }

        var confirmMsg = isWithdraw ? "确定撤回吗" : "确定驳回吗";
        var submitUrl = isWithdraw ? prefix + "/recallsave" : prefix + "/hxBh";
        
        $.modal.confirm(confirmMsg, function() {
            $.operate.saveTab(submitUrl, {'id': $("#ktid").val(), 'urlFlag': urlFlag, 'remark': remark});
        });
    }

    $(document).ready(function() {
        var state = $("#state").val();
        var urlFlag = $("#urlFlag").val();
        
        var isRecallScene = (urlFlag === 'tuihui' || urlFlag === 'xytuihui' || urlFlag === 'zgqxtuihui' || urlFlag === 'recall');
        
        // 只有科研处或管理员角色才能显示撤回按钮
        var canShowRecall = userRole === 'sci_tesearch' || userRole === 'admin';
        
        if (canShowRecall && (isRecallScene || (state === 'PATENT_PASSED' && urlFlag))) {
            $("#rejectBtnText").text("撤 回");
        } else {
            $("#rejectBtnText").text("驳 回");
        }

        if ($('.alert-danger').length > 0) {
            $('input, select, textarea, button').not('#action-buttons-container button').prop('disabled', true);
        }
        // 解析并显示更多成员
        var membersJson = /*[[${sciZhuanliruanzhu.members}]]*/ '';
        if (membersJson && membersJson !== '' && membersJson !== 'null') {
            try {
                var members = JSON.parse(membersJson);
                var memberNames = [];
                var allUsers = /*[[${sysUsers1}]]*/ [];

                members.forEach(function(memberId) {
                    var user = allUsers.find(function(u) {
                        return u.userId.toString() === memberId;
                    });
                    if (user) {
                        memberNames.push(user.userName);
                    }
                });

                if (memberNames.length > 0) {
                    $('#moreMembersDisplay').text(memberNames.join('、'));
                }
            } catch (e) {
                console.log('解析更多成员失败:', e);
            }
        }
    });

</script>
</body>
</html>
