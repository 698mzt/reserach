<!DOCTYPE html>
<!--<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">-->
<html lang="zh" xmlns:th="http://www.thymeleaf.org"
      xmlns:shiro="https://github.com/theborakompanioni/thymeleaf-extras-shiro"
      xmlns:padding="http://www.w3.org/1999/xhtml">

<head>
    <th:block th:include="include :: header('成果转化列表')"/>
    <th:block th:include="include :: datetimepicker-css"/>

</head>
<style>
    @media (min-width: 768px) {
        .col-sm-3 {
            width: 38% !important;
        }
    }

    .input-daterange {
        float: left;
    }

    /* 优化筛选框样式，确保间距一致 */
    .select-list ul {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        padding: 0;
        margin: 0;
    }
    
    .select-list li {
        list-style: none;
        margin: 0;
        display: flex;
        align-items: center;
        flex: 0 0 calc(25% - 12px);
        min-width: 200px;
    }
    
    /* 第一行项目 - 占满整行 */
    .select-list li.first-row {
        flex: 0 0 100%;
    }
    
    /* 第一行中的子项 */
    .first-row-wrapper {
        display: flex;
        gap: 15px;
        width: 100%;
    }
    
    .first-row-item {
        flex: 0 0 calc(25% - 12px);
    }
    
    /* 第二行项目 */
    .select-list li.second-row.date-range-item,
    .select-list li.second-row.college-major-item {
        flex: 0 0 calc(50% - 8px);
    }
    
    .select-list li.button-item {
        flex: 0 0 100%;
        justify-content: flex-start;
        margin-top: 10px;
        gap: 15px;
    }
    
    .select-list li label {
        width: 80px;
        margin: 0 10px 0 0;
        text-align: right;
        line-height: 30px;
        white-space: nowrap;
    }
    
    /* 特殊处理日期范围选择标签 */
    .select-list li.date-range-item label.font-noraml {
        width: auto;
        margin: 0 10px 0 0;
        text-align: left;
    }
    
    .select-list li input.form-control,
    .select-list li select.form-control {
        flex: 1;
        width: 200px;
        height: 30px;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding-left: 5px;
    }
    
    /* 学院专业选择框样式优化 */
    .college-major-item {
        flex: 0 0 calc(50% - 8px) !important;
    }
    
    .college-major-item #element2 {
        display: flex;
        align-items: center;
        width: 100%;
    }
    
    .college-major-item #element2 label {
        width: 80px;
        margin: 0 10px 0 0;
        text-align: right;
        line-height: 30px;
    }
    
    .college-major-item #element2 .row {
        flex: 1;
        display: flex;
        gap: 15px;
        margin: 0;
    }
    
    .college-major-item #element2 .col-sm-3 {
        flex: 1;
        padding: 0;
        max-width: 200px;
    }
    
    .college-major-item #element2 .col-sm-3 select.form-control {
        width: 100%;
        height: 30px;
        border: 1px solid #ddd;
        border-radius: 4px;
    }
    
    .select-list .input-daterange {
        display: flex;
        align-items: center;
        gap: 5px;
    }
    
    .select-list .input-daterange .form-control {
        width: 120px;
        flex: none;
    }
    
    .select-list .input-daterange .input-group-addon {
        width: auto;
        padding: 5px 10px;
        background-color: #f5f5f5;
        border: 1px solid #ddd;
        border-left: 0;
        border-right: 0;
        line-height: 20px;
    }
    
    /* 日期范围选择样式调整 */
    .select-list > ul > li.date-range-item {
        display: flex;
        align-items: center;
    }
    
    .select-list > ul > li.date-range-item label.font-noraml {
        margin: 0 10px 0 0;
        line-height: 30px;
        width: auto;
        text-align: left;
    }

    .track-rcol {
        width: 100%;
        max-width: 500px;
        margin: 20px auto;
        /*width: 450px;*/
        /*!*border: 1px solid #eee;*!*/
        /*margin: 20px auto;*/
        /*background: transparent;*/
        max-height: 400px;
        overflow-y: auto;
    }

    .btn-group-sm > .btn, .btn-sm {
        padding: 9px 10px;
        font-size: 12px;
        line-height: 1.5;
        border-radius: 3px;
    }

    .link-button {
        background: none;
        border: none;
        color: #2c99ff;
        cursor: pointer;
        font-size: inherit;
    }

    .del-link-button {
        background: none;
        border: none;
        color: #ff0000;
        cursor: pointer;
        font-size: inherit;
    }


    .modal-right {
        position: fixed;
        right: 0;
        margin: 0;
        height: 100%;
        display: flex;
        align-items: stretch;
    }

    .modal-right .modal-content {
        height: 100%;
        width: 70%;
        margin-left: auto;
    }

    .modal-right .but {
        position: absolute;
        right: 2%;
        bottom: 1.3%;
        background: red;
        color: white;
        border: none;
        border-radius: 4px;
    }

    .progress_inner {
        height: 80px;
        width: 100%;
        position: relative;
    }

    .progress_inner__step {
        width: 33.33%;
        font-size: 12px;
        padding: 0 5px;
        transition: all 0.4s;
        float: left;
        text-align: center;
        position: relative;
    }

    .progress_inner__step label {
        padding-top: 30px;
        display: block;
        position: relative;
        cursor: label;
    }

    .progress_inner__step:before {
        content: "1";
        width: 24px;
        height: 24px;
        color: #2196F3;
        background: white;
        line-height: 22px;
        border: 2px solid #2196F3;
        font-size: 12px;
        top: 0;
        border-radius: 50%;
        transition: all 0.4s;
        position: absolute;
        left: 0;
        right: 0;
        margin: auto;
        font-weight: bold;
        z-index: 11;
    }

    .progress_inner__step:nth-of-type(2):before {
        content: "2";
        color: #9E9E9E;
        border-color: #9E9E9E;
    }

    .progress_inner__step:nth-of-type(3):before {
        content: "3";
        color: #9E9E9E;
        border-color: #9E9E9E;
    }

    .progress_inner__step.completed:before {
        content: "✓";
        color: #4CAF50;
        border-color: #4CAF50;
        line-height: 22px;
        font-size: 14px;
    }

    .progress_inner__step.active:before {
        color: #2196F3;
        border-color: #2196F3;
        background: white;
    }

    .progress_inner__step.pending:before {
        color: #9E9E9E;
        border-color: #9E9E9E;
        background: white;
    }

    .progress_inner__bar {
        height: 3px;
        left: 16.665%;
        right: 16.665%;
        background: #E0E0E0;
        position: absolute;
        top: 12px;
        z-index: -1;
        border-radius: 3px;
        overflow: hidden;
    }

    .progress_inner__bar--progress {
        height: 100%;
        background: #4CAF50;
        width: 0;
        transition: width 0.6s ease;
    }


    .status-text {
        color: #9E9E9E;
        font-weight: normal;
        transition: all 0.4s;
        font-size: 12px;
    }

    .status-text.active {
        color: #2196F3;
        font-weight: bold;
    }

    .status-text.completed {
        color: #4CAF50;
        font-weight: bold;
    }

    .buttons {
        margin-top: 20px;
        text-align: center;
    }

    button {
        background: #2196F3;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 3px;
        margin: 0 8px;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.3s;
        font-size: 12px;
    }

    button:hover {
        background: #1976D2;
    }

    button:last-child {
        background: #9E9E9E;
    }

    button:last-child:hover {
        background: #757575;
    }

    /* 新增的流程记录样式 */
    .timeline-title {
        font-weight: bold;
        font-size: 14px;
        color: #333;
        text-align: left;
        margin: 0 0 25px 20px;
        max-width: 500px;
        margin-left: auto;
        margin-right: auto;
        position: relative;
        padding-bottom: 15px;
    }

    .timeline-title::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 0.5px;
        /*background: linear-gradient(to right, #e0e0e0, #a0a0a0, #e0e0e0);*/
        background: linear-gradient(to right,
        rgba(224, 224, 224, 0.8),
        rgba(224, 224, 224, 0.8),
        rgba(224, 224, 224, 0.8)); /* 添加透明度使线条更柔和 */
        box-shadow: 0 0.5px 1px rgba(0, 0, 0, 0.07);
    }

    .track-rcol {
        width: 100%;
        max-width: 500px;
        margin: 20px auto;
        /*width: 450px;*/
        /*!*border: 1px solid #eee;*!*/
        /*margin: 20px auto;*/
        /*background: transparent;*/
    }

    .track-list {
        margin: 20px;
        padding-left: 5px;
        position: relative;
    }

    .track-list ul {
        padding-left: 0;
    }

    .track-list li {
        position: relative;
        padding: 5px 0 10px 25px;
        line-height: 1.4;
        border-left: 2px solid #d9d9d9;
        color: #666;
        list-style: none;
        /*text-align: left;*/
        transition: all 0.4s ease; /* 添加过渡效果 */
    }

    .track-list li.first {
        color: #666;
        padding-top: 0;
        /*border-left-color: #fff;*/
    }

    .track-list li .node-icon {
        position: absolute;
        left: -6px;
        top: 18px;
        width: 8px; /* 调圆点*/
        height: 8px;
        background: #C0C0C0;
        border-radius: 50%;
        transition: all 0.4s ease; /* 添加过渡效果 */
        border: 2px solid #E0E0E0;
        box-sizing: content-box;
    }

    .track-list li.first .node-icon {
        background: #C0C0C0; /* 天蓝色 */
        width: 8px;
        height: 8px;
        left: -8px;
    }

    .track-list li .time {
        display: block;
        margin-bottom: 3px;
        font-size: 11px;
        color: #888;
        transition: all 0.4s ease; /* 添加过渡效果 */
    }

    .track-list li .txt {
        display: block;
        font-size: 12px;
        transition: all 0.4s ease; /* 添加过渡效果 */
    }

    /* 悬停效果 */
    .track-list li:hover {
        color: #333;
    }

    .track-list li:hover .node-icon {
        transform: scale(1.3);
        background: #ed8088;
    }

    .track-list li:hover .time {
        color: #666;
    }

    /* 新增审核状态样式 */
    .approve-status {
        margin-top: 10px;
        text-align: center;
    }

    .approve-status label {
        margin: 0 10px;
        cursor: pointer;
    }

    .approve-status input {
        margin-right: 5px;
    }
    
    /* 响应式调整 */
    @media (max-width: 1200px) {
        .first-row-item {
            flex: 0 0 calc(33.333% - 10px);
        }
        
        .select-list li.second-row.date-range-item,
        .select-list li.second-row.college-major-item {
            flex: 0 0 calc(50% - 8px);
        }
    }
    
    @media (max-width: 992px) {
        .first-row-item {
            flex: 0 0 calc(50% - 8px);
        }
        
        .select-list li.second-row.date-range-item,
        .select-list li.second-row.college-major-item {
            flex: 0 0 calc(50% - 8px);
        }
    }
    
    @media (max-width: 768px) {
        .select-list li,
        .first-row-item,
        .select-list li.second-row.date-range-item,
        .select-list li.second-row.college-major-item {
            flex: 0 0 100%;
        }
        
        .select-list li.button-item {
            flex-direction: column;
            align-items: stretch;
        }
        
        .select-list li.button-item .btn {
            margin: 5px 0;
        }
        
        .first-row-wrapper {
            flex-direction: column;
        }
    }

</style>

    $(function() {

            var remark = $("select[name='remark']").val(); // 项目类别
            var state = $("select[name='state']").val(); // 项目类别
            var startTime = $("#datetimepicker-startTime").val(); // 开始时间
            var endTime = $("#datetimepicker-endTime").val(); // 结束时间
            var college = $(".first").val(); // 学院
            var major = $(".second").val(); // 专业
            var jobTitle = $("select[name='job_title']").val(); // 职称
            var topicName = $("#topicName").val(); // 课题名称

            // 构造查询参数对象
            var params = {
                remark: remark,
                state: state,
                startTime: startTime,
                endTime: endTime,
                college: college,
                major: major,
                jobTitle: jobTitle,
                topicName: topicName
            };
            console.log("搜索参数:", params)
            // 设置搜索状态为true
            hasSearched = true;
            
            // 根据项目类别获取对应的表格列配置
            var selectedRemark = remark || 'default';
            var columns = tableColumnsConfig[selectedRemark] || tableColumnsConfig['default'];
            
            // 更新表格配置，显示表头并设置列
            $('#bootstrap-table0').bootstrapTable('refreshOptions', {
                showHeader: true,
                columns: columns,
                queryParams: function(p) {
                    return $.extend(p, params);
                }
            });
            //$('#bootstrap-table0').bootstrapTable('refresh');
        });
        
        // 绑定重置按钮点击事件
        $('#resetBtn').on('click', function() {
            // 重置搜索状态
            hasSearched = false;
            // 清空表单
            $('#formId0')[0].reset();
            // 清空表格数据，隐藏表头
            $('#bootstrap-table0').bootstrapTable('refreshOptions', {
                showHeader: false,
                columns: [],

                    return {

                        startTime: '',
                        endTime: '',
                        college: '',
                        major: '',
                        jobTitle: '',
                        topicName: '',

                    };
                }
            });

        });

    var startDate = laydate.render({
        elem: '#laydate-startTime',
        max: $('#laydate-endTime').val(),
        theme: 'molv',
        trigger: 'click',
        done: function (value, date) {
            // 结束时间大于开始时间
            if (value !== '') {
                endDate.config.min.year = date.year;
                endDate.config.min.month = date.month - 1;
                endDate.config.min.date = date.date;
            } else {
                endDate.config.min.year = '';
                endDate.config.min.month = '';
                endDate.config.min.date = '';
            }
        }
    });
    var endDate = laydate.render({
        elem: '#laydate-endTime',
        min: $('#laydate-startTime').val(),
        theme: 'molv',
        trigger: 'click',
        done: function (value, date) {
            // 开始时间小于结束时间
            if (value !== '') {
                startDate.config.max.year = date.year;
                startDate.config.max.month = date.month - 1;
                startDate.config.max.date = date.date;
            } else {
                startDate.config.max.year = '';
                startDate.config.max.month = '';
                startDate.config.max.date = '';
            }
        }
    });

    function loadReviewRecords(Id, state) {
        updateProgress(state); // 更新进度条

        //批阅记录
        $.ajax({
            url: prefix + "/bhyy/" + Id, // 替换为实际的API路径
            method: 'POST',
            data: {kid: Id},
            success: function (response) {
                const eventList = document.getElementById('event-list');
                eventList.innerHTML = '';

                response.rows.forEach(function (row) {
                    const li = document.createElement('li');
                    li.innerHTML = '<i class="node-icon"></i>' +
                        '<span class="time">' + row.createTime + '</span>' +
                        '<span class="txt">' + row.state + '</span>';
                    eventList.insertBefore(li, eventList.firstChild);
                });
            },
            error: function () {
                alert('无法获取批阅记录');
            }
        });
    }
