<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改开题')" />
    <th:block th:include="include :: datetimepicker-css" />
    <th:block th:include="include :: bootstrap-fileinput-css"/>
    <th:block th:include="include :: select2-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-apply-edit" th:object="${sciHorizontalApplyVertical}">

            <input name="id" id="ktid" th:field="*{id}" type="hidden">
            <input name="id" id="state" th:field="*{state}" type="hidden">

            <h4 class="form-header h4">基本信息</h4>
            <div class="row">
            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">申请人：</label>
                    <div class="col-sm-8">
<!--                        <input name="userId" th:field="*{userId}" class="form-control" type="text" required>-->
                        <select name="userId" class="form-control m-b" disabled>
                            <option th:each="user : ${sysUsers1}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${ user.userId == sciHorizontalApplyVertical.userId}"></option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">课题类型：</label>
                    <div class="col-sm-8">
                        <select name="topType" class="form-control" th:with="type=${@dict.getType('sci_top_type')}" required>
                            <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{topType}"></option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">课题名称：</label>
                    <div class="col-sm-8">
                        <input name="topName" th:field="*{topName}" class="form-control" type="text" required>
                    </div>
                </div>
            </div>
            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">课题编号：</label>
                    <div class="col-sm-8">
                        <input   th:field="*{topNumber}" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">项目金额(万)：</label>
                    <div class="col-sm-8">
                        <input name="amount" th:field="*{amount}" class="form-control" type="number" required>
                    </div>
                </div>
            </div>



            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">结项日期：</label>
                    <div class="col-sm-8">
                        <div class="input-group date">
                           <input name="validityData" autocomplete="off" th:field="*{validityData}" th:value="${#dates.format(validityData, 'yyyy-MM-dd')}" class="form-control" placeholder="yyyy-MM-dd" type="text" required>
                            <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">主持人：</label>
                    <div class="col-sm-8">
                        <select name="firstPersonId" class="form-control m-b" disabled>
                            <option th:each="user : ${sysUsers1}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${ #strings.toString(user.userId) == sciHorizontalApplyVertical.firstPersonId}"></option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">成员1：</label>
                    <div class="col-sm-8">
                        <select name="secondPersonId" class="form-control m-b" >
                            <option th:each="user : ${sysUsers1}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${ #strings.toString(user.userId) == sciHorizontalApplyVertical.secondPersonId}" ></option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">成员2：</label>
                    <div class="col-sm-8">
                        <select name="thirdPersonId" class="form-control m-b" >
                            <option th:each="user : ${sysUsers1}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${ #strings.toString(user.userId) == sciHorizontalApplyVertical.thirdPersonId}"  ></option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="col-xs-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">成员3：</label>
                    <div class="col-sm-8">
                        <select name="fourthPersonId" class="form-control m-b" >
                            <option th:each="user : ${sysUsers1}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${ #strings.toString(user.userId) == sciHorizontalApplyVertical.fourthPersonId}"  ></option>
                        </select>
                    </div>
                </div>
            </div>
            <!-- 第5位及以后：可动态添加 -->
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-2 control-label">更多成员：</label>
                    <div class="col-sm-10">
                        <div id="memberContainer" class="row" th:data-extra-members="${extraMembers}"></div>
                        <button type="button" id="addMemberBtn" class="btn btn-white btn-sm" title="新增成员">
                            <i class="fa fa-plus"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="col-xs-4">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">开题文件：</label>
                    <div class="col-sm-8">
                        <input type="hidden" name="openfile" th:field="*{openfile}">
                        <div class="file-loading">
                            <input class="form-control file-upload1" id="openfile" name="file" type="file">
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xs-4">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">中期文件：</label>
                    <div class="col-sm-8">
                        <input type="hidden" name="midfile" th:field="*{midfile}">
                        <div class="file-loading">
                            <input class="form-control file-upload2" id="midfile" name="file" type="file">
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xs-4">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">结项文件：</label>
                    <div class="col-sm-8">
                        <input type="hidden" name="overfile" th:field="*{overfile}">
                        <div class="file-loading">
                            <input class="form-control file-upload3" id="overfile" name="file" type="file">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </form>
    </div>
    <div class="row">
        <div class="col-sm-offset-5 col-sm-10">
            <button type="button" class="btn btn-sm btn-primary" onclick="submitHandler()"><i class="fa fa-check"></i>保 存</button>&nbsp;
            <button type="button" class="btn btn-sm btn-danger" onclick="closeItem()"><i class="fa fa-reply-all"></i>关 闭 </button>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: datetimepicker-js" />
    <th:block th:include="include :: bootstrap-fileinput-js"/>
    <th:block th:include="include :: select2-js" />
    <script type="text/javascript">
        // 动态新增成员下拉（第5位起）与编辑页预渲染
        $(function(){
            function appendMemberSelect(selectedVal) {
                var optionsHtml = $('select[name="secondPersonId"]').html();
                var $tpl = $('<div class="col-xs-3 m-b-xs member-item">\
                    <div class="input-group">\
                        <select name="members" class="form-control m-b member-select"></select>\
                        <span class="input-group-btn">\
                            <button class="btn btn-danger btn-sm remove-member" type="button" title="移除"><i class="fa fa-minus"></i></button>\
                        </span>\
                    </div>\
                </div>');
                var $select = $tpl.find('select.member-select');
                $select.html(optionsHtml);
                $('#memberContainer').append($tpl);
                // 初始化 Select2，支持输入检索
                $select.select2({
                    width: '100%',
                    placeholder: '输入检索成员',
                    allowClear: true
                });
                if (selectedVal) {
                    $select.val(String(selectedVal)).trigger('change');
                }
            }

            // 预渲染已有的第5位及以后成员
            var extraMembers = $('#memberContainer').data('extra-members');
            if (Array.isArray(extraMembers)) {
                extraMembers.forEach(function(mid){ appendMemberSelect(mid); });
            } else if (extraMembers) {
                try {
                    var arr = JSON.parse(extraMembers);
                    if (Array.isArray(arr)) arr.forEach(function(mid){ appendMemberSelect(mid); });
                } catch(e) {}
            }

            $('#addMemberBtn').on('click', function(){
                appendMemberSelect(null);
            });

            // 初始化已存在的 .member-select（若后续页面中存在）
            $('.member-select').each(function(){
                $(this).select2({
                    width: '100%',
                    placeholder: '输入检索成员',
                    allowClear: true
                });
            });

            $(document).on('click', '.remove-member', function(){
                $(this).closest('.member-item').remove();
            });
        });
        $(function(){
            <!-- laydate示例 -->
            layui.use('laydate', function(){
                var laydate = layui.laydate;
                laydate.render({
                    elem: '#laydate-demo-4',
                    range: true
                });
                var startDate = laydate.render({
                    elem: '#laydate-startTime',
                    max: $('#laydate-endTime').val(),
                    theme: 'molv',
                    trigger: 'click',
                    done: function(value, date) {
                        // 结束时间大于开始时间
                        if (value !== '') {
                            endDate.config.min.year = date.year;
                            endDate.config.min.month = date.month - 1;
                            endDate.config.min.date = date.date;
                        } else {
                            endDate.config.min.year = '';
                            endDate.config.min.month = '';
                            endDate.config.min.date = '';
                        }
                    }
                });
                var endDate = laydate.render({
                    elem: '#laydate-endTime',
                    min: $('#laydate-startTime').val(),
                    theme: 'molv',
                    trigger: 'click',
                    done: function(value, date) {
                        // 开始时间小于结束时间
                        if (value !== '') {
                            startDate.config.max.year = date.year;
                            startDate.config.max.month = date.month - 1;
                            startDate.config.max.date = date.date;
                        } else {
                            startDate.config.max.year = '';
                            startDate.config.max.month = '';
                            startDate.config.max.date = '';
                        }
                    }
                });
            });
        });
    </script>
    <script th:inline="javascript">
        var prefix = ctx + "system/apply_vertical";
        $("#form-apply-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                var openfile = $("input[name='openfile']").val();
                var midfile = $("input[name='midfile']").val();
                var overfile = $("input[name='overfile']").val();
                if ($.validate.form()) {
                    if (openfile == "" || midfile == "" || overfile == "") {
                        $.modal.alertWarning("请上传文件");
                        return;
                }
            }
                $.operate.saveTab(prefix + "/overedit", $('#form-apply-edit').serialize());
            }
        }

        $("input[name='validityData']").datetimepicker({
            format: "yyyy-mm-dd",
            minView: "month",
            autoclose: true
        });



        $(".file-upload1").each(function (i) {
            var val = $("input[name='" + this.id + "']").val()
            var initialPreview = [];
            var initialPreviewConfig = [];
            
            if (val && val.trim() !== '') {
                initialPreview = [val];
                initialPreviewConfig = [{
                    type: "pdf",
                    caption: val.split('/').pop(),
                    url: ctx + "common/delete",
                    key: val
                }];
            }
            
            $(this).fileinput({
                uploadUrl: ctx + 'common/upload/zxkt',
                initialPreviewAsData: true,
                initialPreview: initialPreview,
                initialPreviewConfig: initialPreviewConfig,
                maxFileCount: 1,
                autoReplace: true,
                allowedFileExtensions: ["pdf"],
                overwriteInitial: true,
                slugCallback: function(filename) {
                    var fileExtension = filename.split('.').pop();
                    const year = new Date().getFullYear();
                    const topName = $("input[name='topName']").val() || "未命名";
                    const newName = year +"-"+ topName +"-"+ "开题文件"+ "." + fileExtension;
                    return newName;
                },
            }).on('fileuploaded', function (event, data, previewId, index) {
                if (data.response && data.response.url) {
                    $("input[name='" + event.currentTarget.id + "']").val(data.response.url);
                }
            }).on('fileremoved', function (event, id, index) {
                $("input[name='" + event.currentTarget.id + "']").val('');
            }).on('fileclear', function (event) {
                $("input[name='" + event.currentTarget.id + "']").val('');
            });
        });
        $(".file-upload2").each(function (i) {
            var val = $("input[name='" + this.id + "']").val()
            var initialPreview = [];
            var initialPreviewConfig = [];
            
            if (val && val.trim() !== '') {
                initialPreview = [val];
                initialPreviewConfig = [{
                    type: "pdf",
                    caption: val.split('/').pop(),
                    url: ctx + "common/delete",
                    key: val
                }];
            }
            
            $(this).fileinput({
                uploadUrl: ctx + 'common/upload/zxkt',
                initialPreviewAsData: true,
                initialPreview: initialPreview,
                initialPreviewConfig: initialPreviewConfig,
                maxFileCount: 1,
                autoReplace: true,
                allowedFileExtensions: ["pdf"],
                overwriteInitial: true,
                slugCallback: function(filename) {
                    var fileExtension = filename.split('.').pop();
                    const year = new Date().getFullYear();
                    const topName = $("input[name='topName']").val() || "未命名";
                    const newName = year +"-"+ topName +"-"+ "中期文件"+ "." + fileExtension;
                    return newName;
                },
            }).on('fileuploaded', function (event, data, previewId, index) {
                if (data.response && data.response.url) {
                    $("input[name='" + event.currentTarget.id + "']").val(data.response.url);
                }
            }).on('fileremoved', function (event, id, index) {
                $("input[name='" + event.currentTarget.id + "']").val('');
            }).on('fileclear', function (event) {
                $("input[name='" + event.currentTarget.id + "']").val('');
            });
        });
        $(".file-upload3").each(function (i) {
            var val = $("input[name='" + this.id + "']").val()
            var initialPreview = [];
            var initialPreviewConfig = [];
            
            if (val && val.trim() !== '') {
                initialPreview = [val];
                initialPreviewConfig = [{
                    type: "pdf",
                    caption: val.split('/').pop(),
                    url: ctx + "common/delete",
                    key: val
                }];
            }
            
            $(this).fileinput({
                uploadUrl: ctx + 'common/upload/zxkt',
                initialPreviewAsData: true,
                initialPreview: initialPreview,
                initialPreviewConfig: initialPreviewConfig,
                maxFileCount: 1,
                autoReplace: true,
                allowedFileExtensions: ["pdf"],
                overwriteInitial: true,
                slugCallback: function(filename) {
                    var fileExtension = filename.split('.').pop();
                    const year = new Date().getFullYear();
                    const topName = $("input[name='topName']").val() || "未命名";
                    const newName = year +"-"+ topName +"-"+ "结项文件"+ "." + fileExtension;
                    return newName;
                },
            }).on('fileuploaded', function (event, data, previewId, index) {
                if (data.response && data.response.url) {
                    $("input[name='" + event.currentTarget.id + "']").val(data.response.url);
                }
            }).on('fileremoved', function (event, id, index) {
                $("input[name='" + event.currentTarget.id + "']").val('');
            }).on('fileclear', function (event) {
                $("input[name='" + event.currentTarget.id + "']").val('');
            });
        });
    </script>
</body>
</html>
