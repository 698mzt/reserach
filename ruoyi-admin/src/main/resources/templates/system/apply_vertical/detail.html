<th:block th:include="include :: footer" />

<style>
/* 仅限制第二个权重下拉三行高度 */
#score-weight-wrapper .select2-results__options { max-height: 90px; overflow-y: auto; }
</style>
<script type="text/javascript">
    function displayFileName(inputId, fileNameId) {
        const input = document.getElementById(inputId);
        const fileNameSpan = document.getElementById(fileNameId);
        if (input.value) {
            const fileName = input.value.split('/').pop(); // 获取最后一个'/'后的文件名
            fileNameSpan.textContent = fileName; // 直接显示完整文件名
        } else {
            fileNameSpan.textContent = '无效文件';
        }
    }

    function getSelectValue(selectId){
        var select = document.getElementById(selectId);
        if (select){
            return select.value;
        }
        return null;
    }

    function chakan() {
        var relativePath = $("#filing").val();
        if (!relativePath) {
            alert("没有可预览的文件！");
            return;
        }
        
        // 检查是否为MinIO文件（路径以/minio/开头）
        if (relativePath.startsWith('/minio/')) {
            // 对于MinIO文件，使用新的预览接口
            var contextPath = '/' + window.location.pathname.split('/')[1];
            var previewUrl = window.location.origin + contextPath + '/common/preview?fileName=' + encodeURIComponent(relativePath);
            window.open(previewUrl, '_blank');
        } else {
            // 对于本地文件，按原方式处理
            var contextPath = '/' + window.location.pathname.split('/')[1];
            var fullPath = window.location.origin + contextPath + relativePath;
            window.open(fullPath, '_blank');
        }
    }

    $(function(){
        // 初始化第二个下拉的 Select2，使其有下拉面板并应用限高样式
        $('#weight').select2({
            width: '100%',
            dropdownParent: $('#score-weight-wrapper')
        });
    });

    function downloadFile(type){
        var relativePath = $("#" + type).val();
        if (!relativePath) {
            alert("没有可下载的文件！");
            return;
        }
        
        var downloadUrl;
        // 检查是否为MinIO文件（路径以/minio/开头）
        if (relativePath.startsWith('/minio/')) {
            // 对于MinIO文件，使用通用下载接口
            var contextPath = '/' + window.location.pathname.split('/')[1];
            downloadUrl = window.location.origin + contextPath + '/common/download?fileName=' + encodeURIComponent(relativePath);
        } else {
            // 对于本地文件，按原方式处理
            var contextPath = '/' + window.location.pathname.split('/')[1];
            downloadUrl = window.location.origin + contextPath + relativePath;
        }
        
        if(downloadUrl){
            var a = document.createElement("a");
            a.href=downloadUrl;
            a.download="";
            a.style.display = "none";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }else{
            alert("网址无效");
        }
    }
    // 计算预期积分
    function calculateExpectedScore() {
        const topType = $("select[name='topType']").val();
        var subjectSource = $("select[name='subjectSource']").val();
        if (!subjectSource) {
            subjectSource = $('#subjectSourceOriginal').val();
        }
        const amount = $("input[name='amount']").val();

        // 如果必填字段未填写，不计算积分
        if (!topType || !amount) {
            $("#expectedScore1").val("");
            $("#expectedScore2").val("");
            $("#expectedScore3").val("");
            $("#expectedScore4").val("");
            return;
        }

        // 发送AJAX请求计算积分
        $.ajax({
            url: prefix + "/calculateScore",
            type: "POST",
            data: {
                topType: topType,
                subjectSource: subjectSource,
                amount: parseFloat(amount)
            },
            dataType: "json",
            success: function(result) {
                console.log("AJAX Success - Result:", result);
                if (result && result.code === 0 && result.data !== undefined) {
                    // 主持人（排名第一）
                    $("#expectedScore1").val(result.data[0]);
                    // 成员1（排名第二）
                    $("#expectedScore2").val(result.data[1]);
                    // 成员2（排名第三）
                    $("#expectedScore3").val(result.data[2]);
                    // 成员3（排名第四）
                    $("#expectedScore4").val(result.data[3]);
                } else {
                    console.error("Invalid result format:", result);
                    $("#expectedScore1").val(0);
                    $("#expectedScore2").val(0);
                    $("#expectedScore3").val(0);
                    $("#expectedScore4").val(0);
                }
            },
            error: function(xhr, status, error) {
                console.error("AJAX Error:", status, error);
                $("#expectedScore1").val(0);
                $("#expectedScore2").val(0);
                $("#expectedScore3").val(0);
                $("#expectedScore4").val(0);
            }
        });
    }

    $(function(){
        var kid = $("#ktid").val();
        var options = {
            url: prefix + "/abhyy/"+kid,
            showSearch: false,
            showRefresh: false,
            showToggle: false,
            showColumns: false,
            pagination:false,
            sortName: "createTime",
            sortOrder: "desc",
            columns: [

                {
                    field : 'createTime',
                    title : '批阅时间',
                    width: 200

                } ,
                {
                    field : 'uname',
                    title : '批阅人',
                    width: 100
                },
                {
                    field : 'concate',
                    title : '内容',
                    width: 500
                },
                {
                    field : 'state',
                    title : '审核状态',
                    width: 100
                } ]
        };

        $.table.init(options);

        $('#bootstrap-table').on('load-success.bs.table', function (e, name, args) {
            console.log('Event Name:', name.rows);

            var a =$("#state").val();
            if ($("#urlFlag").val() == 'chakan'){
                $("#btn3").show();
                $(".tdiv2").show()
            }else {
                if(a == 'VERTICAL_APPLY_JYS_AUDIT' || a == 'VERTICAL_APPLY_XY_AUDIT' || a == 'VERTICAL_APPLY_KYC_AUDIT' || a == 'VERTICAL_OVER_JYS_AUDIT' || a == 'VERTICAL_OVER_XY_AUDIT' || a == 'VERTICAL_OVER_KYC_AUDIT'){
                    if(name.rows.length > 0){
                        $(".tdiv2").show();
                    }
                    $(".tdiv1").show();
                    $("#btn1").show();
                    $("#btn2").show();
                    $("#btn3").show();
                }
            }


        });

        // 页面加载时计算预期科研分
        calculateExpectedScore();

        <!-- laydate示例 -->
        layui.use('laydate', function(){
            var laydate = layui.laydate;
            laydate.render({
                elem: '#laydate-demo-4',
                range: true
            });
            var startDate = laydate.render({
                elem: '#laydate-startTime',
                max: $('#laydate-endTime').val(),
                theme: 'molv',
                trigger: 'click',
                done: function(value, date) {
                    // 结束时间大于开始时间
                    if (value !== '') {
                        endDate.config.min.year = date.year;
                        endDate.config.min.month = date.month - 1;
                        endDate.config.min.date = date.date;
                    } else {
                        endDate.config.min.year = '';
                        endDate.config.min.month = '';
                        endDate.config.min.date = '';
                    }
                }
            });
            var endDate = laydate.render({
                elem: '#laydate-endTime',
                min: $('#laydate-startTime').val(),
                theme: 'molv',
                trigger: 'click',
                done: function(value, date) {
                    // 开始时间小于结束时间
                    if (value !== '') {
                        startDate.config.max.year = date.year;
                        startDate.config.max.month = date.month - 1;
                        startDate.config.max.date = date.date;
                    } else {
                        startDate.config.max.year = '';
                        startDate.config.max.month = '';
                        startDate.config.max.date = '';
                    }
                }
            });
        });
    });
</script>
<script th:inline="javascript">
    var prefix = ctx + "system/apply_vertical";
    $("#form-apply-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
          //获取 URLflag
        var a = $("#urlFlag").val();
        var type = getSelectValue("topType")
        var weight = getSelectValue("weight") || '1';
        var subjectSource = $("input[name='subjectSource']").val();
        var expectedScore1 = $("#expectedScore1").val();
        var expectedScore2 = $("#expectedScore2").val();
        var expectedScore3 = $("#expectedScore3").val();
        var expectedScore4 = $("#expectedScore4").val();
            $.operate.saveTab(prefix + "/applyPass", {"id":$("#ktid").val(),"urlFlag":a,"type":type,"weight": weight,"subjectSource": subjectSource,"expectedScore1": expectedScore1,"expectedScore2": expectedScore2,"expectedScore3": expectedScore3,"expectedScore4": expectedScore4});
    }
    function submitHandlerBH() {
        var a = $("#urlFlag").val();
        if ($.validate.form()) {
            $.modal.confirm("确定 驳回 吗" ,function() {
                $.operate.saveTab(prefix + "/applyBh", $('#form-apply-edit').serialize());
            });
         }
    }




    $(".file-upload").each(function (i) {
        var val = $("input[name='" + this.id + "']").val()
        $(this).fileinput({
            uploadUrl: ctx + 'common/upload/zxkt',
            initialPreviewAsData: true,
            initialPreview: [val],
            maxFileCount: 1,
        maxFileSize: 51200,
            autoReplace: true
        }).on('fileuploaded', function (event, data, previewId, index) {
            $("input[name='" + event.currentTarget.id + "']").val(data.response.url)
        }).on('fileremoved', function (event, id, index) {
            $("input[name='" + event.currentTarget.id + "']").val('')
        })
        $(this).fileinput('_initFileActions');
    });
    // 页面加载时显示文件名
    // window.onload = function() {
    //     displayFileName('filing', 'filingFileName');
    // };

    // 课题来源：选择"其他"（value=52）时显示自定义输入框
    $(document).ready(function() {
        $('#subjectSourceSelect').on('change', function() {
            if ($(this).val() === '52') {
                $('#subjectSourceSelect').hide();
                $('#subjectSourceCustom').show().focus();
            } else {
                $('#subjectSourceCustom').hide().val('');
                $('#subjectSourceSelect').show();
            }
        });

        // 回显：延迟执行确保 Thymeleaf 渲染完成
        setTimeout(function() {
            var originalSubjectSource = $('#subjectSourceOriginal').val();
            if (originalSubjectSource) {
                var isDictValue = false;
                $('#subjectSourceSelect option').each(function() {
                    if ($(this).val() === originalSubjectSource) {
                        isDictValue = true;
                        return false;
                    }
                });
                if (isDictValue) {
                    // 标准字典值，设置选中
                    $('#subjectSourceSelect').val(originalSubjectSource);
                } else {
                    // 自定义值：选中"其他"（value=52），触发 change 显示输入框，再填入原值
                    $('#subjectSourceSelect').val('52').change();
                    $('#subjectSourceCustom').val(originalSubjectSource);
                }
            }
        }, 200);
    });

    // 为相关字段添加change事件监听器
    $("select[name='topType'], select[name='subjectSource'], input[name='amount']").on("change", calculateExpectedScore);
    
    // 页面加载时计算初始积分
    calculateExpectedScore();
</script>
