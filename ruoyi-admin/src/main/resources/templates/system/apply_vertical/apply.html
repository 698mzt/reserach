    var downloadFlag = [[${@permission.hasPermi('system:apply_vertical:download')}]];

    var datas = [[${@dict.getType('sci_vertical_tasks')}]];


    var prefix = ctx + "system/apply_vertical";

    // 动态生成URL
    function getUrl(tableId) {
        var year = localStorage.getItem("year");
        return prefix+"/list/"+tableId+"?year="+year;
    }



    $(function() {

        function initTable(options) {
            // 获取当前表格的ID
            var tableId = options.id;
            // 根据表格ID生成URL
            options.url = getUrl(tableId);
            // 使用生成的选项初始化表格
            $.table.init(options);
        }

        // 完结

            id: "bootstrap-table0",
            toolbar:"toolbar0",
            url:getUrl($('table').attr('id')),

            removeUrl: prefix + "/remove",
            exportUrl: prefix + "/export",
            modalName: "纵向课题完结",
            sortOrder: "asc",
            columns: [{
                field: 'number',
                title: '序号',
                width:5 ,
                align:'center',
                switchable:false,
                formatter:function(value,row,index){
                    //return index+1; //序号正序排序从1开始

                    //通过表的#id 可以得到每页多少条
                    var pageSize=$('#bootstrap-table').bootstrapTable('getOptions').pageSize;
                    //通过表的#id 可以得到当前第几页
                    var pageNumber=$('#bootstrap-table').bootstrapTable('getOptions').pageNumber;
                    //返回每条的序号： 每页条数 * （当前页 - 1 ）+ 序号
                    // return pageSize * (pageNumber - 1) + index + 1;
                    return $.table.serialNumber(index);
                }

                    field: 'id',
                    title: '',
                    visible: false

                    field: 'yname',

                {
                    field: 'dname',
                    align: 'center',
                    title: '专业'
                },

                    field: 'userName',
                    align: 'center',
                    title: '申请人'

                    field: 'topName',

                    field: 'state',
                    title: '申请状态',
                    align: 'center',
                    formatter: function(value, row, index) {
                        return $.table.selectDictLabel(datas, value);
                    }

                    title: '操作',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        if(row.state ==  4444){
                            actions.push('<a  class="btn btn-success btn-xs ' + downloadFlag + '" href="javascript:void(0)" onclick="downloadFiles(\'' +row.id+'\')"><i class="fa fa-edit"></i>下载文件</a> ');
                            actions.push('<a  class="btn btn-success btn-xs ' + editInfo + '" href="javascript:void(0)" onclick="$.operate.overdetailTab(\'' + row.id +'/chakan'+ '\')"><i class="fa fa-edit"></i>查看</a> ');
                        }
                        return actions.join('');

                    return $.table.serialNumber(index);

                        var actions = [];

                        if(row.state == 1 ){

                        }else
