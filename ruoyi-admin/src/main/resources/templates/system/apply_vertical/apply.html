<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('纵向课题列表')" />
    <style>
        .track-list {
            margin: 20px;
            padding-left: 5px;
            position: relative;
        }

        .track-list ul {
            padding-left: 0;
            list-style: none;
            max-height: 700px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background-color: #f9f9f9;
            padding: 10px;
        }

        .track-list li {
            position: relative;
            padding: 5px 0 10px 25px;
            line-height: 1.4;
            border-left: 2px solid #d9d9d9;
            color: #666;
            transition: all 0.4s ease;
        }

        .modal-right {
            position: fixed;
            right: 0;
            margin: 0;
            height: 100%;
            display: flex;
            align-items: stretch;
        }

        .modal-right .modal-content {
            height: 100%;
            width: 70%;
            margin-left: auto;
        }
        .modal-right .but{
            position: absolute;
            right: 2%;
            bottom: 1.3%;
            background: red;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .progress_inner {
            height: 80px;
            width: 100%;
            position: relative;
        }

        .progress_inner__step {
            width: 33.33%;
            font-size: 12px;
            padding: 0 5px;
            transition: all 0.4s;
            float: left;
            text-align: center;
            position: relative;
        }

        .progress_inner__step label {
            padding-top: 30px;
            display: block;
            position: relative;
            cursor: pointer;
        }

        .progress_inner__step:before {
            content: "1";
            width: 24px;
            height: 24px;
            color: #2196F3;
            background: white;
            line-height: 22px;
            border: 2px solid #2196F3;
            font-size: 12px;
            top: 0;
            border-radius: 50%;
            transition: all 0.4s;
            position: absolute;
            left: 0;
            right: 0;
            margin: auto;
            font-weight: bold;
            z-index: 11;
        }

        .progress_inner__step:nth-of-type(2):before {
            content: "2";
            color: #9E9E9E;
            border-color: #9E9E9E;
        }

        .progress_inner__step:nth-of-type(3):before {
            content: "3";
            color: #9E9E9E;
            border-color: #9E9E9E;
        }

        .progress_inner__step.completed:before {
            content: "✓";
            color: #4CAF50;
            border-color: #4CAF50;
            line-height: 22px;
            font-size: 14px;
        }

        .progress_inner__step.active:before {
            color: #2196F3;
            border-color: #2196F3;
            background: white;
        }

        .progress_inner__step.pending:before {
            color: #9E9E9E;
            border-color: #9E9E9E;
            background: white;
        }

        .progress_inner__bar {
            height: 3px;
            left: 16.665%;
            right: 16.665%;
            background: #E0E0E0;
            position: absolute;
            top: 12px;
            z-index: -1;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress_inner__bar--progress {
            height: 100%;
            background: #4CAF50;
            width: 0;
            transition: width 0.6s ease;
        }

        .status-text {
            color: #9E9E9E;
            font-weight: normal;
            transition: all 0.4s;
            font-size: 12px;
        }

        .status-text.active {
            color: #2196F3;
            font-weight: bold;
        }

        .status-text.completed {
            color: #4CAF50;
            font-weight: bold;
        }

        .buttons {
            margin-top: 20px;
            text-align: center;
        }

        button {
            background: #2196F3;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 3px;
            margin: 0 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 12px;
        }

        button:hover {
            background: #1976D2;
        }

        button:last-child {
            background: #9E9E9E;
        }

        button:last-child:hover {
            background: #757575;
        }

        /* 新增的流程记录样式 */
        .timeline-title {
            font-weight: bold;
            font-size: 14px;
            color: #333;
            text-align: left;
            margin: 0 0 25px 20px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            padding-bottom: 15px;
        }

        .timeline-title::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 0.5px;
            /*background: linear-gradient(to right, #e0e0e0, #a0a0a0, #e0e0e0);*/
            background: linear-gradient(to right,
            rgba(224,224,224,0.8),
            rgba(224,224,224,0.8),
            rgba(224,224,224,0.8)); /* 添加透明度使线条更柔和 */
            box-shadow: 0 0.5px 1px rgba(0,0,0,0.07);
        }

        .track-rcol {
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            /*width: 450px;*/
            /*!*border: 1px solid #eee;*!*/
            /*margin: 20px auto;*/
            /*background: transparent;*/
        }
        .track-list {
            margin: 20px;
            padding-left: 5px;
            position: relative;
        }
        .track-list ul {
            padding-left: 0;
        }
        .track-list li {
            position: relative;
            padding: 5px 0 10px 25px;
            line-height: 1.4;
            border-left: 2px solid #d9d9d9;
            color: #666;
            list-style: none;
            /*text-align: left;*/
            transition: all 0.4s ease; /* 添加过渡效果 */
        }
        .track-list li.first {
            color: #666;
            padding-top: 0;
            /*border-left-color: #fff;*/
        }
        .track-list li .node-icon {
            position: absolute;
            left: -7px;
            top: 18px;
            width: 8px; /* 调圆点*/
            height: 8px;
            background: #C0C0C0;
            border-radius: 50%;
            transition: all 0.4s ease; /* 添加过渡效果 */
            border: 2px solid #E0E0E0;
            box-sizing: content-box;
        }
        .track-list li.first .node-icon {
            background: #C0C0C0; /* 天蓝色 */
            width: 8px;
            height: 8px;
            left: -8px;
        }
        .track-list li .time {
            display: block;
            margin-bottom: 3px;
            font-size: 11px;
            color: #888;
            transition: all 0.4s ease; /* 添加过渡效果 */
        }
        .track-list li .txt {
            display: block;
            font-size: 12px;
            transition: all 0.4s ease; /* 添加过渡效果 */
        }

        /* 悬停效果 */
        .track-list li:hover {
            color: #333;
        }
        .track-list li:hover .node-icon {
            transform: scale(1.3);
            background: #ed8088;
        }
        .track-list li:hover .time {
            color: #666;
        }

        /* 新增审核状态样式 */
        .approve-status {
            margin-top: 10px;
            text-align: center;
        }
        .approve-status label {
            margin: 0 10px;
            cursor: pointer;
        }
        .approve-status input {
            margin-right: 5px;
        }
    </style>
</head>

<script th:inline="javascript">

<!--权限检查-->
    var JYSFlag = [[${@permission.hasPermi('system:apply_vertical:JYS')}]];
    var DeptFlag = [[${@permission.hasPermi('system:apply_vertical:Dept')}]];
    var editFlag = [[${@permission.hasPermi('system:apply_vertical:edit')}]];
    var removeFlag = [[${@permission.hasPermi('system:apply_vertical:remove')}]];
    var editInfo = [[${@permission.hasPermi('system:apply_vertical:info')}]];
    var KYCFlag = [[${@permission.hasPermi('system:apply_vertical:KYC')}]];
    var createFlag = [[${@permission.hasPermi('system:apply_vertical:add')}]];
    var downloadFlag = [[${@permission.hasPermi('system:apply_vertical:download')}]];
    // 数据字典获取
    var topTypeDatas = [[${@dict.getType('sci_vertical_type')}]];
    var datas = [[${@dict.getType('sci_vertical_tasks')}]];
    var datas1 = [[${@dict.getType('sci_crosswise_tasks')}]];
    var subjectSourceDatas = [[${@dict.getType('sci_subject_source')}]];


    var prefix = ctx + "system/apply_vertical";

    // 动态生成URL
    function getUrl(tableId) {
        var year = localStorage.getItem("year");
        return prefix+"/list/"+tableId+"?year="+year;
    }



    $(function() {

        function initTable(options) {
            // 获取当前表格的ID
            var tableId = options.id;
            // 根据表格ID生成URL
            options.url = getUrl(tableId);
            options.pagination = true;       // 启用分页
            options.pageSize = 10;           // 每页显示条数
            options.pageList = [10, 25, 50, 100]; // 可选每页数量
            options.sidePagination = 'server'; // 后端分页（推荐）
            // 使用生成的选项初始化表格
            $.table.init(options);
        }
        // tab-0
        // 完结
        var options0 = {
            id: "bootstrap-table0",
            toolbar:"toolbar0",
            url:getUrl($('table').attr('id')),
            createUrl: prefix + "/add",
            detailUrl: prefix + "/overView/{id}",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            exportUrl: prefix + "/export",
            recallUrl: prefix + "/recall/{id}",
            modalName: "纵向课题完结",
            sortOrder: "asc",
            rowStyle: rowStyle0,
            columns: [{
                checkbox: true,
                visible: true
            },
            {
                field: 'number',
                title: '序号',
                width:5 ,
                align:'center',
                switchable:false,
                formatter:function(value,row,index){
                    //return index+1; //序号正序排序从1开始

                    //通过表的#id 可以得到每页多少条
                    var pageSize=$('#bootstrap-table').bootstrapTable('getOptions').pageSize;
                    //通过表的#id 可以得到当前第几页
                    var pageNumber=$('#bootstrap-table').bootstrapTable('getOptions').pageNumber;
                    //返回每条的序号： 每页条数 * （当前页 - 1 ）+ 序号
                    // return pageSize * (pageNumber - 1) + index + 1;
                    return $.table.serialNumber(index);
                }
            },
                {
                    field: 'id',
                    title: 'id',
                    visible: false
                },
                {
                    field: 'yname',
                    align: 'center',
                    title: '学院'
                },
                {
                    field: 'dname',
                    align: 'center',
                    title: '专业'
                },
                {
                    field: 'userName',
                    align: 'center',
                    title: '申请人'
                },
                {
                    field: 'topName',
                    align: 'center',
                    title: '课题名称'
                },
                {
                    field: 'signingData',
                    align: 'center',
                    title: '立项日期'
                },
                {
                    field: 'validityData',
                    align: 'center',
                    title: '结项日期'
                },
                {
                    field: 'subjectSource',
                    align: 'center',
                    title: '课题来源',
                    formatter: function(value, row, index) {
                        return $.table.selectDictLabel(subjectSourceDatas, value);
                    }
                },
                {
                    align: 'center',
                    title: '个人排名',
                    formatter: function(value, row, index) {
                        var ranking = [];
                        if(row.firstPersonId == row.uid){
                            ranking.push("1");
                        }else
                        if(row.secondPersonId == row.uid){
                            ranking.push("2");
                        }else
                        if(row.thirdPersonId == row.uid){
                            ranking.push("3");
                        }else
                        if(row.fourthPersonId == row.uid){
                            ranking.push("4");
                        }else{
                            ranking.push("无");
                        }
                        return ranking.join('');
                    }
                },
                {
                    field: 'expectedScore',
                    align: 'center',
                    title: '预期科研分',
                    formatter: function(value, row, index) {
                        if(row.expectedScore == null || row.expectedScore == ''){
                            return '0';
                        }
                        return row.expectedScore;
                    }
                },
                {
                    field: 'score',
                    align: 'center',
                    title: '已获积分',
                    formatter: function(value, row, index) {
                        if(row.score == null){
                            row.score = 0;
                        }
                        return row.score;
                    }
                },
                {
                    field: 'state',
                    title: '状态',
                    align: 'center',
                    formatter: function(value, row, index) {
                        // 优先使用 PageRender 返回的状态元数据
                        if (row.statusMeta) {
                            return PageRender.renderStatusToString(row.statusMeta);
                        }
                        return row.stateName || value;
                    }
                }  ,
                {
                    title: '操作',
                    align: 'center',

<script>
    // 批量下载
    function batchDownload(tableId) {
        // 获取选中的行
        var selections = $('#' + tableId).bootstrapTable('getSelections');

        if (selections.length === 0) {
            $.modal.alertWarning("请至少选择一条记录");
            return;
        }

        // 提取所有选中的ID
        var ids = [];
        for (var i = 0; i < selections.length; i++) {
            ids.push(selections[i].id);
        }

        // 拼接ID并下载
        var idString = ids.join(',');
        window.location.href = ctx + 'common/batchDownload?ids=' + idString + '&module=vertical';
    }

    function rowStyle0(row, index) {
        // 定义状态值与颜色的映射关系
        const stateColorMap = {
            'VERTICAL_APPLY_PASSED': '#67c23a', 'VERTICAL_OVER_PASSED': '#67c23a', // 完结 绿色
            'VERTICAL_APPLY_REJECTED': '#e6a344', 'VERTICAL_OVER_REJECTED': '#e6a344', 'VERTICAL_APPLY_DRAFT': '#e6a344', 'VERTICAL_OVER_DRAFT': '#e6a344', // 被驳回，草稿 黄色
            'VERTICAL_APPLY_JYS_AUDIT': '#2c99ff', 'VERTICAL_APPLY_XY_AUDIT': '#2c99ff', 'VERTICAL_APPLY_KYC_AUDIT': '#2c99ff', 
            'VERTICAL_OVER_JYS_AUDIT': '#2c99ff', 'VERTICAL_OVER_XY_AUDIT': '#2c99ff', 'VERTICAL_OVER_KYC_AUDIT': '#2c99ff' // 审核中 蓝色
        };

        // 统一将 row.state 转换为字符串进行查找
        const state = String(row.state);

        // 根据状态值查找对应的颜色
        if (state in stateColorMap) {
            return {
                css: { color: stateColorMap[state] }
            };
        }

        // 默认样式（可自定义）
        return {
            css: { color: '#000000' } // 默认黑色
        };
    }

    function showhistory(id,state) {
        updateProgressStepColor(state)
        //查询批阅记录
        $.ajax({
            url: prefix + '/abhyy/'+id,
            type: 'POST',
            data: {
                kid: id
            },
            success: function (response) {
                const eventList = document.getElementById('event-list');
                eventList.innerHTML = '';
                response.rows.sort((a, b) => new Date(b.createTime) - new Date(a.createTime));
                response.rows.forEach(function (row) {
                    const li = document.createElement('li');
                    li.innerHTML = `

                        <div class="event-item">
                            <div class="event-content">
                                <i class="node-icon"></i>
                                <span class="time" id="current-time">${row.createTime}</span>
                                <span class="txt">[${row.state}] - ${row.uname}</span>
                            </div>
                        </div>
                    `;
                    eventList.appendChild(li);
                });
                // 打开模态框
                $('#lcjl_Moda').modal('show');
            },
            error: function () {
                alert('Failed to fetch event history.');
            }
        });
    }

    function updateProgressStepColor(state) {
        // 获取所有步骤元素
        const steps = document.querySelectorAll('.progress_inner__step');
        const progressBar = document.querySelector('.progress_inner__bar--progress');

        // 遍历所有步骤，重置样式
        steps.forEach(step => {
            step.classList.remove('active', 'completed', 'pending');
            step.querySelector('.status-text').classList.remove('active', 'completed');
        });

        // 重置进度条
        progressBar.style.width = '0';

        // 根据 state 设置相应的步骤颜色
        if (state === 'VERTICAL_APPLY_DRAFT' || state === 'VERTICAL_OVER_DRAFT') { // 待提交状态
            document.getElementById('step-1').classList.add('active');
            document.getElementById('step-1').querySelector('.status-text').classList.add('active');
            progressBar.style.width = '0';
        } else if (state === 'VERTICAL_APPLY_PASSED' || state === 'VERTICAL_OVER_PASSED') { // 已完成状态
            document.getElementById('step-1').classList.add('completed');
            document.getElementById('step-1').querySelector('.status-text').classList.add('completed');
            document.getElementById('step-2').classList.add('completed');
            document.getElementById('step-2').querySelector('.status-text').classList.add('completed');
            document.getElementById('step-3').classList.add('completed');
            document.getElementById('step-3').querySelector('.status-text').classList.add('completed');
            progressBar.style.width = '100%';
        } else if (['VERTICAL_APPLY_JYS_AUDIT', 'VERTICAL_APPLY_XY_AUDIT', 'VERTICAL_APPLY_KYC_AUDIT', 
                    'VERTICAL_OVER_JYS_AUDIT', 'VERTICAL_OVER_XY_AUDIT', 'VERTICAL_OVER_KYC_AUDIT', 
                    'VERTICAL_APPLY_REJECTED', 'VERTICAL_OVER_REJECTED'].includes(state)) { // 审核中状态
            // 待提交步骤高亮为 completed
            document.getElementById('step-1').classList.add('completed');
            document.getElementById('step-1').querySelector('.status-text').classList.add('completed');

            // 审核中步骤高亮为 active
            document.getElementById('step-2').classList.add('active');
            document.getElementById('step-2').querySelector('.status-text').classList.add('active');

            // 进度条宽度设置为 45%
            progressBar.style.width = '45%';
        } else { // 默认情况下，所有步骤为灰色
            steps.forEach(step => {
                step.classList.add('pending');
                step.querySelector('.status-text').classList.add('pending');
            });
        }
    }


    // 定义getCurrentTime函数
    function getCurrentTime() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
    }

    document.addEventListener('DOMContentLoaded', function () {
        // 初始化显示当前时间
        const currentTimeElement = document.getElementById('current-time');
        if (currentTimeElement) {
            currentTimeElement.textContent = getCurrentTime();
        }
    });
