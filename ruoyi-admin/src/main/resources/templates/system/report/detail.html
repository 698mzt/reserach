<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('讲座报告批阅')" />
    <th:block th:include="include :: datetimepicker-css" />
    <style>
        .form-group{
            flex: 0 0 50%;
            box-sizing: border-box;
        }
        .card{
            display: flex;
            flex-wrap: wrap;
        }
    </style>
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-report-edit" th:object="${sciLectureReport}" th:attr="onsubmit='return false;'">
            <!--批阅或核查的标识-->
            <input name="urlFlag" id="urlFlag" th:field="*{urlFlag}" type="hidden">
            <!--状态-->
            <input id="state" th:field="*{state}" type="hidden">
            <!--被批阅的表单或报告的id-->
            <input name="id" id="report_id" th:field="*{id}" type="hidden">
            <h4 class="form-header h4">基本信息</h4>
            <div class="card">

                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">申请人：</label>
                    <div class="col-sm-8">
                        <!--                    <input name="teacherName" class="form-control" type="text" required>-->
                        <select class="form-control m-b" disabled>
                            <option th:each="user : ${sysUsers}" th:text="${user.userName}" th:value="${user.userId}" th:selected="${user.userId == sciLectureReport.userId}"></option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-3 control-label">讲座主题：</label>
                    <div class="col-sm-8">
                        <input name="reportTheme" th:field="*{reportTheme}" class="form-control" type="text" required readonly maxlength="150">
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">讲座题目：</label>
                    <div class="col-sm-8">
                        <input name="reportSubject" th:field="*{reportSubject}" class="form-control" type="text" required readonly maxlength="150">
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">主办单位：</label>
                    <div class="col-sm-8">
                        <input name="hostUnit" th:field="*{hostUnit}" class="form-control" type="text" required readonly maxlength="50">
                    </div>
                </div>


                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">讲座时间：</label>
                    <div class="col-sm-8">
                        <div class="input-group date">
                            <input name="reportTime" autocomplete="off" th:field="*{reportTime}" class="form-control" placeholder="yyyy-MM-dd HH:mm" type="text" required readonly>
                            <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">讲座地点：</label>
                    <div class="col-sm-8">
                        <input name="reportPlace" th:field="*{reportPlace}" class="form-control" type="text" required readonly maxlength="50">
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-3 control-label">预期参与人数：</label>
                    <div class="col-sm-8">
                        <input name="reportNumber" th:field="*{reportNumber}" class="form-control" type="text" readonly maxlength="5">
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-3 control-label">预期报告时长：</label>
                    <div class="col-sm-8">
                        <input name="reportDuration" th:field="*{reportDuration}" class="form-control" type="text" readonly maxlength="10">
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-3 control-label">分类：</label>
                    <div class="col-sm-8">
                        <select name="reportClassify" class="form-control m-b" required disabled>
                            <option value="">请选择</option>
                            <option th:each="reportIntegral : ${reportIntegralList}" th:text="${reportIntegral.classification}" th:value="${reportIntegral.id}" th:selected="${#strings.toString(reportIntegral.id) == sciLectureReport.reportClassify}"></option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">资料：</label>
                    <div class="col-sm-8">
                        <input type="hidden" id="reportUrl" th:field="*{reportUrl}">
<!--                        <div style="display: inline-block;">-->
<!--                            <div id="reportUrlName" style="display: inline; margin-right: 5px;"></div>-->
<!--                        </div>-->
<!--                        <div class="file-loading">-->
<!--                            <input class="form-control file-upload" id="reportUrl" name="file" type="file">-->
<!--                        </div>-->

                        <div>
                            <button onclick="ziliao()"  class="btn btn-sm btn-primary color">预览</button>
                            <button onclick="downloadFile('reportUrl')" class="btn btn-sm btn-primary color">下载</button>
                        </div>

                    </div>
                </div>
            </div>

            <h4 class="form-header h4 tdiv1" style="display:none;">批阅记录</h4>
            <div class="row tdiv1" style="display:none;">
                <div class="col-sm-12">
                    <div class="form-group"  >
                        <label class="col-xs-2 control-label">批注：</label>
                        <div class="col-xs-10">
                            <textarea name="remark" maxlength="500" class="form-control" rows="3"></textarea>
                        </div>
                    </div>

                </div>
            </div>
            <h4 class="form-header h4 tdiv2"  style="display:none;">批阅记录</h4>
            <div class="row tdiv2" style="display:none;">
                <div class="col-sm-12">

                    <div class="form-group"  >
                        <table id='bootstrap-table'></table>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="row">
        <div class="col-sm-offset-5 col-sm-10">
            <button type="button" style="display:none;" id="btn1" class="btn btn-sm btn-primary" onclick="submitHandler()">  通 过</button>&nbsp;
            <button type="button" style="display:none;" id="btn2" class="btn btn-sm btn-danger" onclick="submitHandlerBH()">  </i><span id="rejectBtnText">驳 回</span></button>&nbsp;
            <button type="button" style="display:none;" id="btn3" class="btn btn-sm btn-warning" onclick="closeItem()"> 关 闭 </button>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: datetimepicker-js" />
    <script th:src="@{/ruoyi/js/approval-edit-confirm.js}"></script>
    <script th:inline="javascript">

        var prefix = ctx + "system/report";
        // $("#form-report-edit").validate({
        //     focusCleanup: true
        // });



        $(function(){
            $.approvalEditConfirm.init({
                formSelector: "#form-report-edit",
                isApprovalPage: function () {
                    var urlFlag = $("#urlFlag").val();
                    var state = $("#state").val();
                    return (["info", "JZBG", "tuihui", "xytuihui", "zgqxtuihui", "recall", "jys_recall", "kyc_recall"].indexOf(urlFlag) === -1 &&
                        (state === "LECTURE_JYS_AUDIT" || state === "LECTURE_KYC_AUDIT" || state === "LECTURE_DRAFT"));
                },
                editableNames: [
                    "reportTheme",
                    "reportSubject",
                    "hostUnit",
                    "reportTime",
                    "reportPlace",
                    "reportNumber",
                    "reportDuration",
                    "reportClassify"
                ],
                onApprove: function () {
                    $.operate.saveTab(prefix + "/criticism", $("#form-report-edit").serialize());
                }
            });
            var rid = $("#report_id").val();
            // alert("审批的讲座报告id："+rid)
            console.log("当前审批的讲座报告id为："+rid)
            var options = {
                url: prefix + "/opinion/"+rid,
                showSearch: false,
                showRefresh: false,
                showToggle: false,
                showColumns: false,
                pagination:false,
                columns: [

                    {
                        field : 'createTime',
                        title : '批阅时间',
                        width: 200

                    } ,
                    {
                        field : 'uname',
                        title : '批阅人',
                        width: 100
                    },
                    {
                        field : 'concate',
                        title : '内容',
                        width: 500
                    },
                    {
                        field : 'state',
                        title : '审核状态',
                        width: 100
                    } ]
            };
            $.table.init(options);

            $('#bootstrap-table').on('load-success.bs.table', function (e, name, args) {
                //console.log('Event Name:', name.rows);

                var a =$("#state").val();
                var b =$("#urlFlag").val();
                console.log("当前urlFlag为："+b);
                if (b == 'JZBG'){
                    console.log("当前状态为："+a)
                    $(".tdiv2").show();
                    $("#btn3").show();

                }else if (b == "info") {
                    // 查看模式：只显示查看内容，不显示批阅记录和按钮
                    if(name.rows.length > 0){
                        $(".tdiv2").show();
                    }
                    $("#btn3").show();
                }else{
                    // 当状态是"LECTURE_JYS_AUDIT"、"LECTURE_KYC_AUDIT"、"LECTURE_DRAFT"时，显示批阅记录和退回记录以及功能按钮
                    if(a == 'LECTURE_JYS_AUDIT' || a == 'LECTURE_KYC_AUDIT' || a == 'LECTURE_DRAFT'){
                        if(name.rows.length > 0){
                            $(".tdiv2").show();
                        }
                        $(".tdiv1").show();
                        $("#btn2").show();
                        if (b != "tuihui" && b != "xytuihui"){
                            $("#btn1").show();
                        }
                    }
                    // 当状态是"LECTURE_PASSED"、"LECTURE_REJECTED"时，显示退回记录
                    if(a == 'LECTURE_PASSED' || a == 'LECTURE_REJECTED'){
                        if(name.rows.length > 0){
                            $(".tdiv2").show();
                        }
                        if (a == 'LECTURE_PASSED' && b == "zgqxtuihui"){
                            $(".tdiv1").show();
                            $("#btn2").show();
                        }
                    }
                    $("#btn3").show();

                }

            });
        })

        $(document).ready(function() {
            var state = $("#state").val();
            var urlFlag = $("#urlFlag").val();
            
            // 判断是否为撤回场景
            // 1. urlFlag为撤回相关（tuihui, xytuihui, zgqxtuihui, recall, jys_recall, kyc_recall）
            // 2. 驳回状态下的撤回（jys_recall表示教研室驳回撤回，kyc_recall表示科研处驳回撤回）
            var isRecallScene = (urlFlag === 'tuihui' || urlFlag === 'xytuihui' || urlFlag === 'zgqxtuihui' || 
                               urlFlag === 'recall' || urlFlag === 'jys_recall' || urlFlag === 'kyc_recall');
            
            // 驳回状态下的撤回场景
            var isRejectedRecall = (state === 'LECTURE_REJECTED' && (urlFlag === 'jys_recall' || urlFlag === 'kyc_recall'));
            
            if (isRecallScene || isRejectedRecall || (state === 'LECTURE_PASSED' && urlFlag)) {
                $("#rejectBtnText").text("撤 回");
            } else {
                $("#rejectBtnText").text("驳 回");
            }
            
            // 根据urlFlag控制撤回理由区域显示
            if (['jys_recall', 'kyc_recall', 'tuihui', 'xytuihui', 'zgqxtuihui', 'recall'].includes(urlFlag)) {
                $(".tdiv1").show();
                $(".tdiv2").show();
            }
        });

        $("input[name='reportTime']").datetimepicker({
            format: "yyyy-mm-dd hh:ii",
            minView: "hour",
            autoclose: true
        });
        // 批阅通过保存方法
        function submitHandler() {
            $.approvalEditConfirm.submit("#form-report-edit");
        }
        // 讲座报告驳回/撤回保存方法
        function submitHandlerBH() {
            var urlFlag = $("#urlFlag").val();
            var state = $("#state").val();
            
            // 判断操作类型：撤回 or 驳回（根据URL参数）
            var operationType = 'reject'; // 默认驳回
            var isWithdraw = false;
            
            // 撤回场景：通过URL参数判断
            if (['tuihui', 'xytuihui', 'zgqxtuihui', 'recall', 'jys_recall', 'kyc_recall'].includes(urlFlag)) {
                operationType = 'recall';
                isWithdraw = true;
            }
            
            // 撤回：取消必填；驳回：启用必填
            if (isWithdraw) {
                $('textarea[name="remark"]').removeAttr('required');
            } else {
                $('textarea[name="remark"]').attr('required', 'required');
            }

            if ($.validate.form()) {
                var url = prefix + "/reject";
                if (operationType === 'recall') {
                    // 撤回操作
                    $.modal.confirm("确定 撤回 吗?", function() {
                        $.operate.saveTab(url, $('#form-report-edit').serialize());
                    });
                } else {
                    // 驳回操作
                    $.operate.saveTab(url, $('#form-report-edit').serialize());
                }
            }
        }
        function ziliao(){
            var relativePath = $("#reportUrl").val();
            if (!relativePath) {
                alert("没有可预览的文件！");
                return;
            }
            
            // 检查是否为MinIO文件（路径以/minio/开头）
            if (relativePath.startsWith('/minio/')) {
                // 对于MinIO文件，使用新的预览接口
                var contextPath = '/' + window.location.pathname.split('/')[1];
                var previewUrl = window.location.origin + contextPath + '/common/preview?fileName=' + encodeURIComponent(relativePath);
                window.open(previewUrl, '_blank');
            } else {
                // 对于本地文件，按原方式处理
                var contextPath = '/' + window.location.pathname.split('/')[1];
                var fullPath = window.location.origin + contextPath + relativePath;
                window.open(fullPath, '_blank');
            }
        }

        function downloadFile(type){
            var relativePath = $("#" + type).val();
            if (!relativePath) {
                alert("没有可下载的文件！");
                return;
            }
            
            var downloadUrl;
            // 检查是否为MinIO文件（路径以/minio/开头）
            if (relativePath.startsWith('/minio/')) {
                // 对于MinIO文件，使用通用下载接口
                var contextPath = '/' + window.location.pathname.split('/')[1];
                downloadUrl = window.location.origin + contextPath + '/common/download?fileName=' + encodeURIComponent(relativePath);
            } else {
                // 对于本地文件，按原方式处理
                var contextPath = '/' + window.location.pathname.split('/')[1];
                downloadUrl = window.location.origin + contextPath + relativePath;
            }
            
            if(downloadUrl){
                var a = document.createElement("a");
                a.href=downloadUrl;
                a.download="";
                a.style.display = "none";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }else{
                alert("网址无效");
            }
        }
        function displayFileName(inputId, fileNameId) {
            const input = document.getElementById(inputId);
            const fileNameSpan = document.getElementById(fileNameId);
            if (input.value) {
                const fileName = input.value.split('/').pop(); // 获取最后一个'/'后的文件名
                fileNameSpan.textContent = fileName; // 直接显示完整文件名
            } else {
                fileNameSpan.textContent = '无效文件';
            }
        }
        // 页面加载时显示文件名
        // window.onload = function() {
        //     displayFileName('reportUrl', 'reportUrlName');
        // }

    </script>
</body>
</html>
