<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('讲座报告列表')"/>
    <style>
        .modal-right {
            position: fixed;
            right: 0;
            margin: 0;
            height: 100%;
            display: flex;
            align-items: stretch;
        }

        .modal-right .modal-content {
            height: 100%;
            width: 70%;
            margin-left: auto;
        }
        .modal-right .but{
            position: absolute;
            right: 2%;
            bottom: 1.3%;
            background: red;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .progress_inner {
            height: 10%;
            width: 100%;
            position: relative;
        }

        .progress_inner__step {
            width: 33.33%;
            font-size: 12px;
            padding: 0 5px;
            transition: all 0.4s;
            float: left;
            text-align: center;
            position: relative;
        }

        .progress_inner__step label {
            padding-top: 30px;
            display: block;
            position: relative;
            cursor: pointer;
        }

        .progress_inner__step:before {
            content: "1";
            width: 24px;
            height: 24px;
            color: #2196F3;
            background: white;
            line-height: 22px;
            border: 2px solid #2196F3;
            font-size: 12px;
            top: 0;
            border-radius: 50%;
            transition: all 0.4s;
            position: absolute;
            left: 0;
            right: 0;
            margin: auto;
            font-weight: bold;
            z-index: 11;
        }

        .progress_inner__step:nth-of-type(2):before {
            content: "2";
            color: #9E9E9E;
            border-color: #9E9E9E;
        }

        .progress_inner__step:nth-of-type(3):before {
            content: "3";
            color: #9E9E9E;
            border-color: #9E9E9E;
        }

        .progress_inner__step.completed:before {
            content: "✓";
            color: #4CAF50;
            border-color: #4CAF50;
            line-height: 22px;
            font-size: 14px;
        }

        .progress_inner__step.active:before {
            color: #2196F3;
            border-color: #2196F3;
            background: white;
        }

        .progress_inner__step.pending:before {
            color: #9E9E9E;
            border-color: #9E9E9E;
            background: white;
        }

        .progress_inner__bar {
            height: 3px;
            left: 16.665%;
            right: 16.665%;
            background: #E0E0E0;
            position: absolute;
            top: 12px;
            z-index: -1;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress_inner__bar--progress {
            height: 100%;
            background: #4CAF50;
            width: 0;
            transition: width 0.6s ease;
        }

        /* 分段高亮连接线 */
        .progress_inner__bar .segment {
            position: absolute;
            height: 100%;
            width: 50%;
            background: transparent;
            transition: background 0.4s ease;
        }

        .progress_inner__bar .segment.first {
            left: 0;
        }

        .progress_inner__bar .segment.second {
            right: 0;
        }

        .progress_inner__bar .segment.highlight {
            background: #4CAF50;
            box-shadow: 0 0 8px rgba(10, 225, 19, 0.7);
        }

        .status-text {
            color: #9E9E9E;
            font-weight: normal;
            transition: all 0.4s;
            font-size: 12px;
        }

        .status-text.active {
            color: #2196F3;
            font-weight: bold;
        }

        .status-text.completed {
            color: #4CAF50;
            font-weight: bold;
        }

        .buttons {
            margin-top: 20px;
            text-align: center;
        }

        button {
            background: #2196F3;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 3px;
            margin: 0 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 12px;
        }

        button:hover {
            background: #1976D2;
        }

        button:last-child {
            background: #9E9E9E;
        }

        button:last-child:hover {
            background: #757575;
        }

        /* 新增的流程记录样式 */
        .timeline-title {
            font-weight: bold;
            font-size: 14px;
            color: #333;
            text-align: left;
            margin: 0 0 25px 20px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            padding-bottom: 15px;
        }

        .timeline-title::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 0.5px;
            background: linear-gradient(to right,
            rgba(224,224,224,0.8),
            rgba(224,224,224,0.8),
            rgba(224,224,224,0.8));
            box-shadow: 0 0.5px 1px rgba(0,0,0,0.07);
        }


        .track-rcol {
            height: 90%;
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .track-list {
            margin: 20px;
            padding-left: 5px;
            position: relative;
        }
        .track-list ul {
            padding-left: 0;
            list-style: none;
            max-height: 50vh;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background-color: #f9f9f9;
            padding: 10px;
        }
        .track-list li {
            position: relative;
            padding: 5px 0 10px 25px;
            line-height: 1.4;
            border-left: 2px solid #d9d9d9;
            color: #666;
            list-style: none;
            /*text-align: left;*/
            transition: all 0.4s ease; /* 添加过渡效果 */
        }
        .track-list li.first {
            color: #666;
            padding-top: 0;
            /*border-left-color: #fff;*/
        }
        .track-list li .node-icon {
            position: absolute;
            left: -7px;
            top: 18px;
            width: 8px; /* 调圆点*/
            height: 8px;
            background: #C0C0C0;
            border-radius: 50%;
            transition: all 0.4s ease; /* 添加过渡效果 */
            border: 2px solid #E0E0E0;
            box-sizing: content-box;
        }
        .track-list li.first .node-icon {
            background: #C0C0C0; /* 天蓝色 */
            width: 8px;
            height: 8px;
            left: -8px;
        }
        .track-list li .time {
            display: block;
            margin-bottom: 3px;
            font-size: 11px;
            color: #888;
            transition: all 0.4s ease; /* 添加过渡效果 */
        }
        .track-list li .txt {
            display: block;
            font-size: 12px;
            transition: all 0.4s ease; /* 添加过渡效果 */
        }

        /* 悬停效果 */
        .track-list li:hover {
            color: #333;
        }
        .track-list li:hover .node-icon {
            transform: scale(1.3);
            background: #ed8088;
        }
        .track-list li:hover .time {
            color: #666;
        }

        /* 新增审核状态样式 */
        .approve-status {
            margin-top: 10px;
            text-align: center;
        }
        .approve-status label {
            margin: 0 10px;
            cursor: pointer;
        }
        .approve-status input {
            margin-right: 5px;
        }
    </style>
</head>

<script th:src="@{/ruoyi/js/page-render.js}"></script>
<script th:inline="javascript">
    var prefix = ctx + "system/report";
    
    // 注册动作处理器
    $(function() {
        PageRender.registerHandlers({
            view: function(actionKey, row) {
                $.operate.detailTab(row.id + '/info');
            },
            viewProcess: function(actionKey, row) {
                var state = row.state;
                if (row.statusMeta && row.statusMeta.statusCode) {
                    state = row.statusMeta.statusCode;
                }
                controlProgressBar(row.id, state);
                $('#lcjl_Moda').modal('show');
            },
            edit: function(actionKey, row) {
                if (row.state == 'LECTURE_DRAFT') {
                    $.operate.editTab(row.id + '/xiugai');
                } else if (row.state == 'LECTURE_REJECTED') {
                    $.operate.editTab(row.id + '/gengxin');
                } else {
                    $.operate.editTab(row.id + '/xiugai');
                }
            },
            remove: function(actionKey, row) {
                $.operate.remove(row.id);
            },
            submit: function(actionKey, row) {
                $.operate.tijiao(row.id);
            },
            approve: function(actionKey, row) {
                $.operate.detailTab(row.id + '/pro');
            },
            reject: function(actionKey, row) {
                $.operate.detailTab(row.id + '/pro');
            },
            recall: function(actionKey, row) {
                // 点击撤回按钮直接执行撤回，不跳转到详情页
                $.operate.save(prefix + "/recallsave", { id: row.id, remark: "" });
            },
            review: function(actionKey, row) {
                $.operate.detailTab(row.id + '/pro');
            },
            kyReview: function(actionKey, row) {
                $.operate.detailTab(row.id + '/check');
            },
            deptReview: function(actionKey, row) {
                $.operate.detailTab(row.id + '/xyprocess');
            }

        });
    });

    var editFlag = [[${@permission.hasPermi('system:report:edit')}]];
    var removeFlag = [[${@permission.hasPermi('system:report:remove')}]];
    var socialTitleDatas = [[${@dict.getType('social_title')}]];
    var schoolTitleDatas = [[${@dict.getType('tea_zhicheng')}]];
    var prefix = ctx + "system/report";
    var datas = [[${@dict.getType('sci_report_status')}]];
    var proFlag = [[${@permission.hasPermi('system:report:process')}]];  // 批阅
    var infoFlag = [[${@permission.hasPermi('system:report:info')}]];  // 查看
    var checkFlag = [[${@permission.hasPermi('system:report:check')}]];  // 核查
    var xyproFlag = [[${@permission.hasPermi('system:report:xyprocess')}]];  // 学院批阅
    var tuihuiFlag = [[${@permission.hasPermi('system:report:tuihui')}]];  // 退回  == 》 教研室负责人的特权
    var chexiaoFlag = [[${@permission.hasPermi('system:report:chexiao')}]];  // 撤销 == 》 学院负责人的特权
    var zgqxtuihuiFlag = [[${@permission.hasPermi('system:report:zgqxtuihui')}]];  // 驳回  == 》 科研室负责人的特权
    var submitFlag = [[${@permission.hasPermi('system:report:submit')}]];  // 提交
    
    // 获取当前用户角色信息
    var userRole = '';
    var userRoles = [[${user.roles}]];  // 从后端获取的角色列表
    
    // 优先检查管理员角色，确保超级管理员显示所有字段
    if (userRoles) {
        for (var i = 0; i < userRoles.length; i++) {
            var roleKey = userRoles[i].roleKey;
            if (roleKey === 'admin') {
                userRole = 'admin';  // 超级管理员
                break;
            }
        }
    }
    
    // 如果不是管理员，继续判断其他角色
    if (!userRole && userRoles) {
        for (var i = 0; i < userRoles.length; i++) {
            var roleKey = userRoles[i].roleKey;
            if (roleKey === 'sci_tesearch') {
                userRole = 'sci_tesearch';  // 科研处
                break;
            } else if (roleKey === 'research') {
                userRole = 'research';  // 教研室
                break;
            } else if (['dept_teacher', 'discuss_college', 'dzgc_college', 'yssj_college', 
                       'student_college', 'marxism_college', 'general'].indexOf(roleKey) !== -1) {
                userRole = 'dept_teacher';  // 学院
                break;
            }
        }
    }
    
    // 默认角色为教师
    if (!userRole) {
        userRole = 'teacher'; // 默认为教师角色
    }

    function getUrl(tableId) {
        var year = localStorage.getItem("year");
        return prefix + "/list/" +tableId+ "?year=" + year;
    }

    $(function () {
        // 根据角色动态渲染搜索区域
        function initSearchFields() {
            // 角色 - 查询字段映射规则
            // 教师角色：仅允许通过"课题名称"检索
            // 教研室角色：允许通过"第一作者"+"课题名称"检索
            // 学院角色：允许通过"专业"+"第一作者"+"课题名称"检索
            // 科研处角色：允许通过"学院"+"专业"+"第一作者"+"课题名称"全维度检索
            // 管理员角色：显示所有字段
            
            // 先检查Shiro权限，然后再根据角色显示字段
            if (userRole === 'teacher') {
                // 教师：只显示课题名称，其他隐藏
                $('.host-name-field').hide();
                $('.major-field').hide();
                $('.college-field').hide();
            } else if (userRole === 'research') {
                // 教研室：显示第一作者 + 课题名称
                $('.host-name-field').show();
                $('.major-field').hide();
                $('.college-field').hide();
            } else if (userRole === 'dept_teacher') {
                // 学院：显示专业 + 第一作者 + 课题名称
                $('.host-name-field').show();
                $('.major-field').show();
                $('.college-field').hide();
            } else if (userRole === 'sci_tesearch') {
                // 科研处：显示所有字段
                $('.host-name-field').show();
                $('.major-field').show();
                $('.college-field').show();
            } else if (userRole === 'admin') {
                // 管理员：显示所有字段
                $('.host-name-field').show();
                $('.major-field').show();
                $('.college-field').show();
            } else {
                // 默认：只显示课题名称
                $('.host-name-field').hide();
                $('.major-field').hide();
                $('.college-field').hide();
            }
        }

        // 定义状态与颜色的映射关系
        function rowStyle0(row, index) {
            var stateColorMap = {
                'LECTURE_PASSED': '#67c23a',
                'LECTURE_REJECTED': '#e6a23c',
                'LECTURE_DRAFT': '#e6a23c',
                'LECTURE_JYS_AUDIT': '#2c99ff',
                'LECTURE_KYC_AUDIT': '#2c99ff'
            };
            
            var state = String(row.state);
            
            if (state in stateColorMap) {
                return {
                    css: { color: stateColorMap[state] }
                };
            }
            
            return {
                css: { color: '#000000' }
            };
        }
        
        function initTable(options) {
            // 获取当前表格的ID
            var tableId = options.id;
            // 根据表格ID生成URL
            // options.url = getUrl();
            options.url = getUrl(tableId);
            // 使用生成的选项初始化表格
            $.table.init(options);
        }


        // tab-1  项目申请
        var options1 = {
            id: "bootstrap-table1",
            url: getUrl($('table').attr('id')),
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            detailUrl: prefix + "/detail/{id}",
            removeUrl: prefix + "/remove",
            tijiaoUrl: prefix + "/tijiao",
            exportUrl: prefix + "/export",
            overUrl: prefix + "/over/{id}",
            modalName: "讲座报告",
            maintainSelected: true,
            rowStyle: rowStyle0,
            columns: [
                {
                    checkbox: true
                },
                {
                    field: 'number',
                    title: '序号',
                    width:5 ,
                    align:'center',
                    switchable:false,
                    formatter:function(value,row,index){
                        //使用若依框架提供的serialNumber方法来生成序号
                        return $.table.serialNumber(index, 'bootstrap-table1');
                    }

                },
                {
                    field: 'id',
                    align: 'center',
                    title: 'id',
                    visible: false
                },
                {
                    field: 'xueyuan',
                    align: 'center',
                    title: '学院'
                },
                {
                    field: 'keyanshi',
                    align: 'center',
                    title: '专业'
                },
                {
                    field: 'teacherName',
                    align: 'center',
                    title: '申请人'
                },

                {
                    field: 'reportTheme',
                    align: 'center',

                    title: '操作',
                    align: 'center',
                    width: '200px',
                    formatter: function(value, row, index) {
                        if (row.actions && row.actions.length > 0) {
                            // 列表页过滤掉"通过"和"驳回"按钮，这些只在详情页显示
                            var listActions = row.actions.filter(function(a) {
                                return a.actionKey !== 'approve' && a.actionKey !== 'reject';
                            });
                            
                            if (listActions.length > 0) {
                                // 分离查看和查看流程按钮到第二行
                                var firstRow = [];
                                var secondRow = [];
                                for (var i = 0; i < listActions.length; i++) {
                                    var action = listActions[i];
                                    if (action.actionKey === 'view' || action.actionKey === 'viewProcess') {
                                        secondRow.push(action);
                                    } else {
                                        firstRow.push(action);
                                    }
                                }
                                
                                var result = '';
                                if (firstRow.length > 0) {
                                    result += PageRender.renderActionsToString(firstRow);
                                }
                                // 查看和查看流程按钮始终在第二行显示
                                if (secondRow.length > 0) {
                                    if (firstRow.length > 0) {
                                        result += '<br/><div style="margin-top: 8px;"></div>';
                                    }
                                    result += PageRender.renderActionsToString(secondRow);
                                }
                                return result;
                            }
                        }
                        return '';
                    }
                }
            ]

        window.addEventListener("storage", function (event) {

                $('#bootstrap-table1').bootstrapTable('destroy');
                initTable(options1)
                // 重新初始化搜索区域
                initSearchFields();
            }
        })
        
        // 表格加载完成后绑定按钮事件
        $('#bootstrap-table1').on('load-success.bs.table', function() {
            bindActionEvents();
        });
    });
    
    /**
     * 绑定操作按钮事件
     */
    function bindActionEvents() {
        $('#bootstrap-table1').off('click.action').on('click.action', 'a[data-action-key]', function(e) {
            e.preventDefault();
            var $btn = $(this);
            var actionKey = $btn.data('action-key');
            var confirmMsg = $btn.data('confirm');
            var rowIndex = $btn.closest('tr').data('index');
            var row = $('#bootstrap-table1').bootstrapTable('getData')[rowIndex];
            
            if (confirmMsg) {
                $.modal.confirm(confirmMsg, function() {
                    PageRender.dispatchAction(actionKey, row);
                });
            } else {
                PageRender.dispatchAction(actionKey, row);
            }
        });
    }

    function controlProgressBar(dataId, status) {
        const eventList = document.getElementById('event-list');
        autoProgressBar(status);
        // 1. 先显示加载状态
        eventList.innerHTML = `
        <li class="first">
            <i class="node-icon"></i>
            <span class="time">加载中...</span>
            <span class="txt">正在获取数据</span>
        </li>
    `;

        // 2. 发送Ajax请求获取批阅记录
        $.ajax({
            url: prefix + '/opinion/' + dataId,
            type: 'GET',
            dataType: 'json',
            success: function(data) {
                console.log('获取到的数据:', data);

                // 清空现有内容
                eventList.innerHTML = '';

                // 处理数据
                if (data.rows && data.rows.length > 0) {
                    data.rows.forEach(record => {
                        const li = document.createElement('li');
                        li.className = 'first'; // 保持与原始结构一致
                        li.innerHTML = `
                        <i class="node-icon"></i>
                        <span class="time">${record.createTime || '无时间信息'}</span>
                        <span class="txt">[${record.state || '无状态'}] - ${record.uname || '匿名用户'}</span>
                    `;
                        eventList.appendChild(li);
                    });
                } else {
                    // 无数据时显示占位内容
                    eventList.innerHTML = `
                    <li class="first">
                        <i class="node-icon"></i>
                        <span class="time">${new Date().toLocaleString()}</span>
                        <span class="txt">[系统] - 暂无记录</span>
                    </li>
                `;
                }
            },
            error: function(xhr, status, error) {
                console.error('获取批阅记录失败:', error);
                eventList.innerHTML = `
                <li class="first error">
                    <i class="node-icon"></i>
                    <span class="time">${new Date().toLocaleString()}</span>
                    <span class="txt">[系统] - 获取记录失败: ${error}</span>
                </li>
            `;
            }
        });
    }

    function autoProgressBar(state) {
        const steps = document.querySelectorAll('.progress_inner__step');
        const progressBarContainer = document.querySelector('.progress_inner__bar');
        const progressBar = document.querySelector('.progress_inner__bar--progress');

        // 重置所有步骤
        steps.forEach((step, index) => {
            step.classList.remove('active', 'completed');
            step.classList.add('pending');
            const statusText = step.querySelector('.status-text');
            if (statusText) {
                statusText.classList.remove('active', 'completed');
            }
        });

        // 创建分段元素（如果尚未创建）
        if (progressBarContainer && !progressBarContainer.querySelector('.segment')) {
            const firstSegment = document.createElement('div');
            firstSegment.className = 'segment first';
            const secondSegment = document.createElement('div');
            secondSegment.className = 'segment second';
            progressBarContainer.appendChild(firstSegment);
            progressBarContainer.appendChild(secondSegment);
        }

        // 移除所有分段高亮
        const segments = progressBarContainer ? progressBarContainer.querySelectorAll('.segment') : [];
        segments.forEach(segment => {
            segment.classList.remove('highlight');
        });

        // 根据状态更新进度条
        if (typeof state === 'string' && state.startsWith('LECTURE_')) {
            if (state === 'LECTURE_DRAFT' || state === 'LECTURE_REJECTED') {
                highlightStep(0);
            } else if (state === 'LECTURE_JYS_AUDIT' || state === 'LECTURE_KYC_AUDIT') {
                markCompleted(0);
                highlightStep(1);
                if (segments[0]) {
                    segments[0].classList.add('highlight');
                }
            } else if (state === 'LECTURE_PASSED') {
                markCompleted(0);
                markCompleted(1);
                highlightStep(2);
                markCompleted(2);
                segments.forEach(segment => {
                    segment.classList.add('highlight');
                });
            }
        } else {
            steps.forEach(step => {
                step.classList.add('pending');
            });
        }
    }

    function highlightStep(index) {
        const step = document.querySelectorAll('.progress_inner__step')[index];
        if (step) {
            step.classList.add('active');
            step.classList.remove('pending');
            const statusText = step.querySelector('.status-text');
            if (statusText) {
                statusText.classList.add('active');
            }
        }
    }

    function markCompleted(index) {
        const step = document.querySelectorAll('.progress_inner__step')[index];
        if (step) {
            step.classList.add('completed');
            step.classList.remove('pending', 'active');
            const statusText = step.querySelector('.status-text');
            if (statusText) {
                statusText.classList.add('completed');
            }
        }
    }

    // 批量下载 - 使用讲座报告专门的批量下载方法
    function batchDownload(tableId) {
        // 获取选中的行
        var selections = $('#' + tableId).bootstrapTable('getSelections');

        if (selections.length === 0) {
            $.modal.alertWarning("请至少选择一条记录");
            return;
        }

        // 提取所有选中的ID
        var ids = [];
        for (var i = 0; i < selections.length; i++) {
            ids.push(selections[i].id);
        }

        // 拼接ID并调用讲座报告的批量下载接口
        var idString = ids.join(',');
        window.location.href = ctx + 'common/batchDownload?ids=' + idString + '&module=report';
        
        // 清除选中状态
        $('#' + tableId).bootstrapTable('uncheckAll');
    }
