<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('任务管理')" />
</head>
<body class="gray-bg">
    <div class="container-div">
		<div class="row">
			<div class="col-sm-12 select-table table-striped">
				<table id="bootstrap-table"></table>
			</div>
		</div>
	</div>

	<th:block th:include="include :: footer" />
	<script th:inline="javascript">
		var prefix = ctx + "activity/task";

		$(function() {
			var options = {
				url: prefix + "/todoList",
				modalName: "任务",
				columns: [
					{field: 'selectItem', radio: true},
					{title: '任务ID', field: 'id', visible: false, align: 'center', valign: 'middle', width: '80px'},
					{title: '任务名称', field: 'name', align: 'center', valign: 'middle', width: '180px'},
					{title: '流程实例ID', field: 'processInstanceId', visible: false, align: 'center', valign: 'middle', width: '80px'},
					{title: '流程名称', field: 'processName', align: 'center', valign: 'middle', width: '180px'},
					{title: '创建时间', field: 'createTime', align: 'center', valign: 'middle', width: '180px', formatter: function(value, row, index) {
						return $.common.dateFormat(value, "yyyy-MM-dd HH:mm:ss");
					}},
					{title: '操作', field: 'operate', width: '200px', align: 'center', valign: 'middle', formatter: function(value, row, index) {
						var actions = [];
						actions.push('<a class="btn btn-success btn-xs" href="javascript:void(0)" onclick="completeTask(\'' + row.id + '\')"><i class="fa fa-check"></i>完成</a> ');
						actions.push('<a class="btn btn-info btn-xs" href="javascript:void(0)" onclick="transferTask(\'' + row.id + '\')"><i class="fa fa-share"></i>转办</a> ');
						actions.push('<a class="btn btn-warning btn-xs" href="javascript:void(0)" onclick="delegateTask(\'' + row.id + '\')"><i class="fa fa-hand-o-right"></i>委派</a>');
						return actions.join('');
					}}
				]
			};
			$.table.init(options);
		});

		function completeTask(taskId) {
			$.modal.confirm("确定要完成该任务吗？", function() {
				$.ajax({
					type: "POST",
					url: prefix + "/complete/" + taskId,
					success: function(result) {
						if (result.code == 0) {
							$.modal.msgSuccess("任务完成成功");
							$.table.refresh();
						} else {
							$.modal.msgError(result.msg);
						}
					}
				});
			});
		}

		function transferTask(taskId) {
			$.modal.prompt("请输入转办人ID", function(value) {
				$.ajax({
					type: "POST",
					url: prefix + "/transfer/" + taskId + "?userId=" + value,
					success: function(result) {
						if (result.code == 0) {
							$.modal.msgSuccess("任务转办成功");
							$.table.refresh();
						} else {
							$.modal.msgError(result.msg);
						}
					}
				});
			});
		}

		function delegateTask(taskId) {
			$.modal.prompt("请输入委派人ID", function(value) {
				$.ajax({
					type: "POST",
					url: prefix + "/delegate/" + taskId + "?userId=" + value,
					success: function(result) {
						if (result.code == 0) {
							$.modal.msgSuccess("任务委派成功");
							$.table.refresh();
						} else {
							$.modal.msgError(result.msg);
						}
					}
				});
			});
		}
	</script>
</body>
</html>
