<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('流程定义')" />
</head>
<body class="gray-bg">
    <div class="container-div">
		<div class="row">
			<div class="col-sm-12 search-collapse">
				<form id="processDefinition-form">
					<div class="select-list">
						<ul>
							<li>
								流程名称：<input type="text" name="name"/>
							</li>
							<li>
								流程版本：<input type="text" name="version"/>
							</li>
							<li>
								<a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
								<a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
							</li>
						</ul>
					</div>
				</form>
			</div>
			
			<div class="btn-group-sm" id="toolbar" role="group">
				<a class="btn btn-info" onclick="viewDiagram()" shiro:hasPermission="activity:processDefinition:view">
					<i class="fa fa-eye"></i> 查看流程图
				</a>
				<a class="btn btn-primary" onclick="suspendProcess()" shiro:hasPermission="activity:processDefinition:suspend">
					<i class="fa fa-pause"></i> 挂起
				</a>
				<a class="btn btn-success" onclick="activateProcess()" shiro:hasPermission="activity:processDefinition:activate">
					<i class="fa fa-play"></i> 激活
				</a>
			</div>
			
			<div class="col-sm-12 select-table table-striped">
				<table id="bootstrap-table"></table>
			</div>
		</div>
	</div>

	<th:block th:include="include :: footer" />
	<script th:inline="javascript">
		var prefix = ctx + "activity/processDefinition";

		$(function() {
			var options = {
				url: prefix + "/list",
				modalName: "流程定义",
				columns: [
					{field: 'selectItem', radio: true},
					{title: '流程定义ID', field: 'id', visible: false, align: 'center', valign: 'middle', width: '80px'},
					{title: '流程名称', field: 'name', align: 'center', valign: 'middle', width: '180px'},
					{title: '流程版本', field: 'version', align: 'center', valign: 'middle', width: '80px'},
					{title: '部署ID', field: 'deploymentId', visible: false, align: 'center', valign: 'middle', width: '80px'},
					{title: '状态', field: 'suspended', align: 'center', valign: 'middle', width: '80px', formatter: function(value, row, index) {
						return value ? '<span class="label label-warning">已挂起</span>' : '<span class="label label-success">激活</span>';
					}},
					{title: '操作', field: 'operate', width: '150px', align: 'center', valign: 'middle', formatter: function(value, row, index) {
						var actions = [];
						actions.push('<a class="btn btn-info btn-xs" href="javascript:void(0)" onclick="viewDiagram(\'' + row.id + '\')"><i class="fa fa-eye"></i>查看流程图</a> ');
						if (row.suspended) {
							actions.push('<a class="btn btn-success btn-xs" href="javascript:void(0)" onclick="activateProcess(\'' + row.id + '\')"><i class="fa fa-play"></i>激活</a>');
						} else {
							actions.push('<a class="btn btn-primary btn-xs" href="javascript:void(0)" onclick="suspendProcess(\'' + row.id + '\')"><i class="fa fa-pause"></i>挂起</a>');
						}
						return actions.join('');
					}}
				]
			};
			$.table.init(options);
		});

		function viewDiagram(id) {
			// 查看流程图的逻辑
			$.modal.open("流程图", prefix + "/diagram/" + id);
		}

		function suspendProcess(id) {
			// 挂起流程的逻辑
			$.operate.confirm("确定要挂起该流程吗？", function() {
				$.ajax({
					type: "POST",
					url: prefix + "/suspend/" + id,
					success: function(result) {
						$.operate.successCallback(result);
					}
				});
			});
		}

		function activateProcess(id) {
			// 激活流程的逻辑
			$.operate.confirm("确定要激活该流程吗？", function() {
				$.ajax({
					type: "POST",
					url: prefix + "/activate/" + id,
					success: function(result) {
						$.operate.successCallback(result);
					}
				});
			});
		}
	</script>
</body>
</html>
