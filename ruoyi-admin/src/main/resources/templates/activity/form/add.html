<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:include="include :: header('新增表单')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-form-add">
			<div class="form-group">	
				<label class="col-sm-3 control-label is-required">表单名称：</label>
				<div class="col-sm-8">
					<input id="formName" name="formName" class="form-control" type="text" required>
				</div>
			</div>
			<div class="form-group">	
				<label class="col-sm-3 control-label is-required">表单标识：</label>
				<div class="col-sm-8">
					<input id="formKey" name="formKey" class="form-control" type="text" required>
				</div>
			</div>
			<div class="form-group">	
				<label class="col-sm-3 control-label">表单标题：</label>
				<div class="col-sm-8">
					<input id="formTitle" name="formTitle" class="form-control" type="text">
				</div>
			</div>
			<div class="form-group">	
				<label class="col-sm-3 control-label">关联流程定义键：</label>
				<div class="col-sm-8">
					<input id="processDefinitionKey" name="processDefinitionKey" class="form-control" type="text">
				</div>
			</div>
			<div class="form-group">	
				<label class="col-sm-3 control-label">表单分类：</label>
				<div class="col-sm-8">
					<input id="category" name="category" class="form-control" type="text">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">状态：</label>
				<div class="col-sm-8">
					<div class="radio-box">
						<label class="radio-box">
							<input type="radio" name="status" value="0" checked> 正常
						</label>
						<label class="radio-box">
							<input type="radio" name="status" value="1"> 停用
						</label>
					</div>
				</div>
			</div>
			<div class="form-group">	
				<label class="col-sm-3 control-label">备注：</label>
				<div class="col-sm-8">
					<textarea id="remark" name="remark" class="form-control"></textarea>
				</div>
			</div>
		</form>
    </div>
    <th:block th:include="include :: footer" />
    <script type="text/javascript">
		var prefix = ctx + "activity/form";
		
		$("#form-form-add").validate({
			focusCleanup: true
		});
		
		function submitHandler() {
			if ($.validate.form()) {
				$.operate.save(prefix + "/add", $('#form-form-add').serialize());
			}
		}
	</script>
</body>
</html>
