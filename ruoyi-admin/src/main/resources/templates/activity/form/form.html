<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('表单管理')" />
</head>
<body class="gray-bg">
    <div class="container-div">
		<div class="row">
			<div class="col-sm-12 search-collapse">
				<form id="form-form">
					<div class="select-list">
						<ul>
							<li>
								表单名称：<input type="text" name="formName"/>
							</li>
							<li>
								表单状态：<select name="status">
									<option value="">所有</option>
									<option value="0">正常</option>
									<option value="1">停用</option>
								</select>
							</li>
							<li>
								<a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
								<a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
							</li>
						</ul>
					</div>
				</form>
			</div>
			
			<div class="btn-group-sm" id="toolbar" role="group">
				<a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="activity:form:add">
					<i class="fa fa-plus"></i> 新增
				</a>
				<a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="activity:form:edit">
					<i class="fa fa-edit"></i> 修改
				</a>
				<a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="activity:form:remove">
					<i class="fa fa-remove"></i> 删除
				</a>
			</div>
			
			<div class="col-sm-12 select-table table-striped">
				<table id="bootstrap-table"></table>
			</div>
		</div>
	</div>

	<th:block th:include="include :: footer" />
	<script th:inline="javascript">
		var prefix = ctx + "activity/form";

		$(function() {
			var options = {
				url: prefix + "/list",
				createUrl: prefix + "/add",
				updateUrl: prefix + "/edit/{id}",
				removeUrl: prefix + "/remove",
				modalName: "表单",
				columns: [
					{checkbox: true},
					{title: '表单ID', field: 'formId', visible: false, align: 'center', valign: 'middle'},
					{title: '表单名称', field: 'formName', align: 'center', valign: 'middle'},
					{title: '表单标识', field: 'formKey', align: 'center', valign: 'middle'},
					{title: '表单标题', field: 'formTitle', align: 'center', valign: 'middle'},
					{title: '创建时间', field: 'createTime', align: 'center', valign: 'middle', formatter: function(value, row, index) {
						return $.common.dateFormat(value, "yyyy-MM-dd HH:mm:ss");
					}},
					{title: '状态', field: 'status', align: 'center', valign: 'middle', formatter: function(value, row, index) {
						return value === '0' ? '<span class="label label-success">正常</span>' : '<span class="label label-warning">停用</span>';
					}},
					{title: '操作', field: 'operate', width: '150px', align: 'center', valign: 'middle', formatter: function(value, row, index) {
						var actions = [];
						actions.push('<a class="btn btn-primary btn-xs" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.formId + '\')"><i class="fa fa-edit"></i>修改</a> ');
						actions.push('<a class="btn btn-danger btn-xs" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.formId + '\')"><i class="fa fa-remove"></i>删除</a>');
						return actions.join('');
					}}
				]
			};
			$.table.init(options);
		});
	</script>
</body>
</html>
